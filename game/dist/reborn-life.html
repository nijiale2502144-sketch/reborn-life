,"hometown-2"]},"fail":{"text":"一个小孩，坐在窗台上，静静地看着你。你把东西放了回去。","fx":["hometown+1","wil_exp+1"]}},{"label":"回去睡觉","text":"","fx":[]}],"pool":"opportunity","weight":8,"cond":"season==summer","scene":"alley"},{"id":"t_s_market","kind":"random","title":"秋天的集市","text":"秋天的集市，从城门口一直摆到了下城。香料、皮货、鱼干，各种味道混在一起。\n人多，口袋多，鼠街的手，也多了起来。","options":[{"label":"在人群里“采点秋”","check":{"attr":"agi","diff":11},"ok":{"text":"你像一尾鱼，在人群里穿来穿去。一个上午，你的口袋，沉了一圈。","fx":["gold+60","agi_exp+3","count:heat+6"]},"fail":{"text":"一个壮汉，一把抓住了你的手腕。你求了半天，才被放走。","fx":["hp-5","count:heat+8","gold-10"]}},{"label":"帮摊贩吆喝，赚点小钱","text":"你嗓子都喊哑了，赚到了半天的工钱，和几根烤得焦脆的鱼干。","fx":["gold+22","cha_exp+3","hometown+1"]},{"label":"只是逛逛，听听传闻","text":"你在集市上走了一圈，带回了几条有用的消息。","fx":["count:intel+1","cha_exp+1"]}],"pool":"opportunity","weight":8,"cond":"season==autumn","scene":"street"},{"id":"t_stranger","kind":"random","title":"问路的外乡人","text":"一个风尘仆仆的外乡人，在巷口拦住你：“请问，去王城的税务署，怎么走？”\n他的口音很重，手里，拎着一只鼓鼓囊囊的皮包。","options":[{"label":"老老实实指路","text":"他连声道谢，往你手里，塞了几枚铜币。","fx":["gold+8","hometown+1"]},{"label":"故意指一条绕远的路，顺便跟上他","check":{"attr":"agi","diff":11},"ok":{"text":"你一路尾随，趁着他在摊前问价，轻轻割开了皮包的一角。里面，是一叠账单，和一小袋金币。","fx":["gold+55","count:heat+6","agi_exp+2"]},"fail":{"text":"他忽然停下，回过头，认真地看了你一眼：“小子，路，不是这么指的。”你尴尬地走开了。","fx":["count:heat+3"]}},{"label":"装作不懂，走开","text":"","fx":[]}],"pool":"opportunity","weight":8,"cond":"age>=16","scene":"street"},{"id":"t_refugees","kind":"random","title":"涌进下城的难民","text":"一队衣衫褴褛的人，从北门涌了进来，在鼠街的墙根下，搭起了窝棚。孩子们饿得没有哭声。\n本来就拥挤的下城，一下子，更挤了。","options":[{"label":"把身上的干粮，分给他们","text":"几个孩子，抱着干粮跑开了。他们的母亲，朝你鞠了一躬。","fx":["gold-8","hometown+4","wil_exp+1"],"cond":"gold>=8"},{"label":"组织几个邻居，一起烧锅粥","text":"一口大锅，架在巷子中央，热气腾腾。整整一个晚上，排队的人，没有断过。","fx":["gold-20","hometown+6","cha_exp+3","rep:shadow+1"],"cond":"gold>=20"},{"label":"趁乱，在人群里下手","text":"","fx":["gold+40","count:heat+6","hometown-4"],"avoid":true}],"pool":"world","weight":7,"cond":"age>=17","scene":"alley"}],"content/thief/events_story.json":[{"id":"t_18w","kind":"special","title":"寒夜的煤炉","text":"十八岁的第一场雪，下得又急又密。孤儿院的煤，只够烧到后半夜。\n莉拉在门口等你，头发上结着霜：“我知道你手里有一点钱。不多，也够今晚的炉子。”","options":[{"label":"把身上所有的钱，都塞给她","text":"莉拉愣了一下，没有推辞，只是用冻红的手，把你的手指握了很久。\n这一夜，孤儿院的炉火，烧到了天亮。","fx":["gold-40","rel:lila+2","hometown+4","wil_exp+2"],"cond":"gold>=40","reason":"身上没有足够的钱"},{"label":"去煤铺“借”几筐煤","check":{"attr":"agi","diff":12},"ok":{"text":"你从煤铺的后墙翻了进去，摸黑装了三筐煤，又把门栓原样插了回去。天亮前，煤已经堆在了孤儿院的灶边。","fx":["rel:lila+2","hometown+3","agi_exp+3","count:heat+6"]},"fail":{"text":"煤铺的伙计提着灯出来，你只扛走了一筐，还被追了两条街。","fx":["hp-5","count:heat+8","rel:lila+1"]}},{"label":"帮她把孩子们挤到一间屋里，互相取暖","text":"你们把能找到的被子和旧衣服都堆了上去。那一夜，十几个孩子挤在一起，没有人哭。","fx":["rel:lila+2","hometown+2","wil_exp+3"]}],"when":{"age":18,"season":"winter"},"priority":50,"portrait":"lila","scene":"alley_snow"},{"id":"t_21s","kind":"special","title":"影子公会的年度比试","text":"春天，影子公会在最老的那座仓库里，办了一年一度的“比手”。\n没有奖品，只有名声：谁偷得最快，谁开得最干净，谁能在三十息里，从一间挂满铃铛的屋子里走出来，一声不响。\n灰鼠靠在柱子上，没说话，朝你抬了抬下巴。","options":[{"label":"报名，三项都比","check":{"attr":"agi","diff":15},"ok":{"text":"铃铛屋里，你整个人像贴在影子上，每一步都落在最安静的那块地板上。三十息过去，满屋铃铛，没有一个响。\n人群里响起了一阵低低的口哨声。","fx":["rep:shadow+8","agi_exp+5","exp+40","flag+:guild_contest"]},"fail":{"text":"你在第二十七息，碰了一下最后一根细线。满屋铃铛，同时响了。\n有人哄笑，有人别过了脸。","fx":["rep:shadow+1","agi_exp+2","hp-3"]}},{"label":"只比一项最拿手的","check":{"attr":"agi","diff":13},"ok":{"text":"你选了开锁。三道锁，一道比一道难，你用了最短的时间。裁判在本子上，写下了你的名字。","fx":["rep:shadow+4","agi_exp+3","exp+20"]},"fail":{"text":"第三道锁卡住了。你把钩子收起来，悄悄退了场。","fx":["rep:shadow+0","agi_exp+1"]}},{"label":"不比，只在旁边看","text":"你站在人群的最后一排，把每个高手的手法，都默默记在了心里。","fx":["int_exp+3","agi_exp+2"]}],"when":{"age":21,"season":"spring"},"priority":45,"portrait":"rat","scene":"warehouse","cond":"flag:guild_member"},{"id":"t_24a","kind":"special","title":"夜宴上的试探","text":"面具先生派人送来一件黑色的礼服，和一张烫金的请柬：“王都的一场夜宴。你负责拿走一枚戒指。别问为什么。”\n夜宴很美，美得让人忘记自己是谁。\n你在人群里，看见了一个熟悉的背影，是卡斯，没有穿制服。","options":[{"label":"按面具的吩咐，拿走那枚戒指","check":{"attr":"agi","diff":16},"ok":{"text":"戒指到手的那一刻，你的指尖几乎没有一丝波动。你把它交给了面具先生，他看了很久，才点点头：“很好。”","fx":["rep:shadow+6","gold+150","agi_exp+4","count:heat+8","flag+:ring_stolen"]},"fail":{"text":"你的手刚碰到戒指，那位夫人的手，也同时伸了过来。你被迫转身，穿过整个舞池，从窗口跳了出去。","fx":["hp-10","count:heat+14","rep:shadow-2"]}},{"label":"找卡斯，装作偶遇","check":{"attr":"cha","diff":14},"ok":{"text":"卡斯端着酒杯，淡淡地说：“真巧。我也不想在这里认识你。”她把一枚金币，放进你的口袋里，“今晚，我什么也没看见。”","fx":["rel:cass+2","cha_exp+4","count:heat-6"]},"fail":{"text":"卡斯盯着你的礼服：“这身衣服，不是你的。”她没有拆穿，但你知道，她记住了。","fx":["rel:cass-1","count:heat+6"]}},{"label":"趁机观察面具先生的人","check":{"attr":"int","diff":14},"ok":{"text":"你注意到，今晚来接应的那几个人，走路的姿势，一模一样，像是从同一个地方训练出来的。","fx":["count:mask_clue+1","count:intel+1","int_exp+3"]},"fail":{"text":"你什么也没看出来，只觉得整晚，都有一双眼睛，在盯着你。","fx":["int_exp+1"]}}],"when":{"age":24,"season":"autumn"},"priority":48,"portrait":"mask","scene":"manor_autumn","cond":"flag:guild_member"},{"id":"t_27s","kind":"special","title":"出发前的夜晚","text":"月蚀之夜，还有半年。\n莉拉在旧仓库里，把所有人的名字，写在了一张纸上，又划掉了一遍。“万一，”她说，“我们中间，有一个人回不来……”\n没有人说话。窗外，路灯依旧坏着。","options":[{"label":"把话说开：愿意走的留下，不愿意的现在就走","text":"没有人动。灯光里，每个人的影子，都落在同一块地板上。","fx":["rel:lila+2","cha_exp+3","wil_exp+3","hometown+2"]},{"label":"给每个人分一份预付的钱（100 金币）","text":"大家都不好意思地收下了。有人默默地，把钱转交给了孤儿院。","fx":["gold-100","hometown+4","rel:lila+1","cha_exp+2"],"cond":"gold>=100","reason":"金币不足"},{"label":"一个人去灰鼠的坟前，坐了一夜","text":"你没有说话，只是把一壶酒，洒在了石头上。风吹过去，像是谁在笑。","fx":["wil_exp+4","rel:rat+1"],"cond":"flag:rat_dead"}],"when":{"age":27,"season":"spring"},"priority":48,"portrait":"lila","scene":"alley"}],"content/thief/quests.json":[{"id":"main_key","type":"main","name":"月蚀之夜","start":"age>=16","score":100,"onFail":["flag+:main_failed","log:月蚀之夜的准备没能赶上。那扇门，你只能凭运气去闯了。"],"stages":[{"desc":"第一章·入门：找到灰鼠，通过影子公会的「三手试炼」，成为正式成员（行动：参加三手试炼）","done":"flag:guild_member","score":20,"deadlineAge":20,"checks":[{"label":"认识灰鼠","cond":"flag:met_rat"},{"label":"敏捷 ≥ 13（试炼要求）","cond":"attr.agi>=13","cur":"attr.agi"}],"story":{"title":"第一章 完 · 三手试炼","portrait":"rat","text":"灰鼠靠在公会大厅的柱子上，难得没有叼那根草茎。\n“从今天起，你就不是孤儿了。”他说，“是影子。”\n你想笑，却发现鼻子有点酸。\n——第二章：立足"}},{"desc":"第二章·立足：影子公会声望 ≥ 40，并找到灰鼠留下的半把钥匙","done":"flag:half_key&&rep.shadow>=40","score":20,"deadlineAge":24,"fx":["rank:3"],"checks":[{"label":"影子公会声望 ≥ 40","cond":"rep.shadow>=40","cur":"rep.shadow"},{"label":"找到半把钥匙","cond":"flag:half_key"}],"story":{"title":"第二章 完 · 半把钥匙","portrait":"thief","text":"你把那截发黑的钥匙，放在掌心里翻了翻。\n灰鼠说过：钥匙只有一半是钥匙，另一半是秘密。\n你把它挂在颈间，贴着心口。\n——第三章：图纸与内线"}},{"desc":"第三章·图纸与内线：情报 ≥ 6，同伙 ≥ 3，拿到魔晶库图纸（行动：窃取魔晶库图纸 / 黑市购买）","done":"count.intel>=6&&count.crew>=3&&flag:vault_plan","score":20,"deadlineAge":27,"fx":["rank:4"],"checks":[{"label":"情报 ≥ 6","cond":"count.intel>=6","cur":"count.intel"},{"label":"同伙 ≥ 3","cond":"count.crew>=3","cur":"count.crew"},{"label":"拿到魔晶库图纸","cond":"flag:vault_plan"}],"story":{"title":"第三章 完 · 万事俱备","portrait":"lila","text":"图纸摊在桌上，每个人的手指都按在自己负责的那一格里。\n莉拉用最小的声音说：“如果我们死了呢？”\n你说：“那就死在屋顶上，比死在水沟里强。”\n——终章：月蚀之夜"}},{"desc":"第四章·月蚀之夜：27 岁的秋天，闯入王城魔晶库","done":"flag:heist_done","score":20}],"doneStory":{"title":"终章 · 月蚀","text":"月亮被吞没的那一刻，整座王都都安静了。\n你站在魔晶库的深处，手里是一颗从没人见过的水晶，它在你掌心里，像一颗正在跳动的心。\n而属于你的故事，才刚刚被写成。"}},{"id":"orphan_light","type":"side","name":"孤儿院的灯","start":"flag:met_lila&&age>=17","deadlineAge":24,"score":25,"intro":{"portrait":"lila","title":"孤儿院的灯","text":"莉拉把你拉到孤儿院的后门，指着窗口那盏忽明忽暗的油灯：“嬷嬷说，入冬以前，再凑不够煤钱，孩子们就得睡在冷屋里。”\n你摸了摸钱袋，没吭声。"},"onFail":["flag+:orphan_cold","hometown-8","log:冬天，孤儿院的灯熄了。你路过的时候，没敢抬头。"],"reward":["hometown+10","rel:lila+2","flag+:orphan_safe","log:孤儿院的灯一直亮到了春天。"],"stages":[{"desc":"为孤儿院凑够煤钱和粮食（行动：接济孤儿院，共 4 次）","done":"count.donate>=4","checks":[{"label":"接济孤儿院 ≥ 4 次","cond":"count.donate>=4","cur":"count.donate"}]},{"desc":"红手帮想把孤儿院的地契抢走，守住它","done":"flag:orphan_defended","fx":[],"checks":[{"label":"在事件中守住孤儿院","cond":"flag:orphan_defended"}]}],"snag":{"p":0.25,"text":"冬天来得太早，孤儿院的煤，在你凑够钱之前就烧完了。"}},{"id":"red_hand_war","type":"side","name":"红手帮的挑衅","start":"flag:red_hand_threat","deadlineAge":26,"score":30,"intro":{"portrait":"cass","title":"断指的邀请","text":"红手帮在鼠街的墙上画了一只红手印。印子很新，还没干。\n你知道这是什么意思：从今天起，这条街，要交保护费了。"},"onFail":["flag+:red_hand_ruled","hometown-6","log:红手帮占了鼠街。这条街的人，开始绕着你走。"],"reward":["rep:shadow+8","hometown+6","gold+120","log:鼠街重新属于鼠街人。"],"stages":[{"desc":"夜探红手帮仓库区，把他们的货清空（行动：夜探红手帮仓库区，通关）","done":"flag:warehouse_cleared","checks":[{"label":"通关红手帮仓库区","cond":"flag:warehouse_cleared"}]},{"desc":"挑战红手帮老大「断指」（行动：挑战红手帮老大）","done":"flag:red_hand_broken"}],"snag":{"p":0.25,"text":"红手帮换了一批新人，仓库一夜搬空，断指也不知躲到了哪里。"}},{"id":"cass_hunt","type":"side","name":"捕快队长的执念","start":"flag:met_cass","deadlineAge":27,"score":25,"intro":{"portrait":"cass","title":"她不会放过你","text":"卡斯在你住的巷口留下了一枚烧焦的铜扣，那是你上次逃跑时落下的。\n她没有来抓你。她只是让你知道：她知道。"},"onFail":["flag+:cass_foe","log:卡斯把你的画像贴满了下城。"],"reward":["flag+:cass_trust","rel:cass+2","log:卡斯在巡逻报告里写：「鼠街无此人。」"],"stages":[{"desc":"让卡斯看到你不是她想象的那种人（卡斯好感 ≥ 5。可以协助她办案、把红手帮的罪证交给她，或在茶摊遇上她）","done":"rel.cass>=5","checks":[{"label":"卡斯好感 ≥ 5","cond":"rel.cass>=5","cur":"rel.cass"},{"label":"已把红手帮的罪证交给卡斯","cond":"flag:cass_gift_red"}]}],"snag":{"p":0.4,"text":"卡斯被调去了城西的另一桩案子，你们之间的事，没了下文。"}},{"id":"lila_brother","type":"side","name":"莉拉的哥哥","start":"rel.lila>=4&&age>=19","deadlineAge":26,"score":25,"intro":{"portrait":"lila","title":"莉拉的哥哥","text":"莉拉今天没笑。她说：“我哥哥被关在王城监牢里，已经三年了。”\n她停了很久，才低声问：“你能不能……”\n你已经知道她要说什么。"},"onFail":["flag+:brother_lost","rel:lila-2","log:莉拉再没有提过她哥哥的名字。"],"reward":["count:crew+1","rel:lila+2","flag+:lila_crew","log:莉拉的哥哥出狱了，成了你的同伙，也成了她唯一的亲人。"],"stages":[{"desc":"打探监牢的布防（情报 ≥ 3）","done":"count.intel>=3","checks":[{"label":"情报 ≥ 3","cond":"count.intel>=3","cur":"count.intel"}]},{"desc":"潜入王城监牢，救出莉拉的哥哥（行动：营救莉拉的哥哥）","done":"flag:brother_free"}],"snag":{"p":0.4,"text":"王城监牢突然换了一批守卫，莉拉的哥哥被转去了别处，再没了消息。"}},{"id":"gu_list","type":"side","name":"老鬼的货单","start":"flag:gu_invited","deadlineAge":25,"score":20,"intro":{"portrait":"gu","title":"老鬼的货单","text":"老鬼把一张泛黄的纸推到你面前：“三件货，取回来，我给你一样好东西。”\n纸上没有名字，只有地址。"},"onFail":["log:老鬼把那张货单烧了，什么也没说。"],"reward":["flag+:vault_plan","item:black_pearl","log:老鬼拍了拍你的肩，递过一卷图纸和一颗黑珍珠：“别告诉别人我给的。”"],"stages":[{"desc":"替老鬼取回三件货（行动：替老鬼取货，共 3 件。老鬼在 18 岁的秋天会主动找你）","done":"count.goods>=3","checks":[{"label":"取回货物 ≥ 3","cond":"count.goods>=3","cur":"count.goods"}]}],"snag":{"p":0.45,"text":"老鬼的黑市被巡逻队端了，他一夜之间消失得无影无踪。"}},{"id":"mask_truth","type":"hidden","name":"面具之下","start":["count.intel>=4&&age>=22","memory:m_t_betrayal&&count.intel>=2&&age>=19"],"deadlineAge":27,"score":40,"reward":["flag+:mask_unmasked","log:你知道面具下是谁了。这个知识很沉。"],"stages":[{"desc":"面具先生的身份，不该是谜（线索 ≥ 3）","done":"count.mask_clue>=3","checks":[{"label":"收集到的线索","cond":"count.mask_clue>=3","cur":"count.mask_clue"}],"story":{"title":"面具之下","portrait":"mask","text":"三条线索，终于串在了一起：税务署的旧账、赌场的流水、王城里某个人腰间的那枚家徽。\n面具先生，不是鼠街的人。他是从王城里下来的。\n而他要的，从来不是魔晶库里的东西，而是别的什么。"}}]}],"content/thief/script.json":{"name":"暗巷里的钥匙","subtitle":"街头孤儿 → 影子之王","unlockCost":450,"desc":"王都下城鼠街的孤儿，16 岁。会偷、会跑，没有姓氏。二十年一次的「月蚀之夜」会在你 27 岁的秋天到来，王城魔晶库的门，那一夜会松开一道缝。","intro":"王都下城，鼠街。你十六岁，没有姓氏，一双灵巧的手，和一个活下去的理由。月蚀之夜在你二十七岁的秋天。","introPages":[{"title":"鼠街","scene":"alley","text":"王都的繁华只到城墙内侧第二条街。再往下，是下城；再往下，是鼠街。\n这里的路灯总是坏的，水沟总是堵的，但从来不缺人。缺的是名字。\n没有人知道你的姓，大家叫你“小手”，因为你的手总比别人快一点。"},{"title":"十六岁","scene":"alley","portrait":"thief","text":"今天，你满十六岁了。\n你靠偷面包、顺手摸一两个钱袋活到现在，运气好，没被抓过几次。你知道这样下去只有两个结局：被巡逻队抓走，或者在某个冬夜里冻死在水沟边。\n你不想要这两个。"},{"title":"月蚀之夜","scene":"rooftop","text":"鼠街的老人们讲过一个传说：每隔二十年，月亮会被整个吞掉一夜。那一夜，王城地下的魔晶库，守卫的结界会松开一道缝。\n下一次，是你二十七岁的秋天。\n没人说得清那道缝后面有什么。但从来不缺想进去看看的人。"},{"title":"玩法提示","scene":"alley","text":"这个剧本里，你不靠体魄，靠手快、靠脑子、靠人脉。每个“来钱快”的行动都会提高「通缉度」。通缉度高了，巡逻队会盯上你；被抓三次，人生就结束了。\n用「避风头」和「贿赂巡逻队」降温，平时也要靠正经的活计养活自己。\n敏捷高的人，战斗里也不吃亏。\n不是所有的钱都值得偷。想清楚，你想成为什么样的人。"}],"start":{"age":16,"attrs":{"str":9,"agi":14,"int":10,"wil":9,"cha":11,"luk":12},"gold":60,"hometown":30,"rep":{"shadow":0,"kingdom":0,"guild":0},"rel":{"rat":0,"lila":1},"gear":["thief_knife","patched_vest","lockpicks"],"counters":{"heat":5,"arrests":0},"flags":{}},"labels":{"hometown":"街区人望","rep":{"shadow":"影子公会声望","kingdom":"王国声望","guild":"公会声望"},"status":{},"route":{}},"help":{"hometown":"街区人望：鼠街和下城的街坊对你的看法。≥ 60 时每回合体力上限 +1（有人替你放风、藏身）；≤ 15 时体力上限 -1。接济孤儿、不祸害邻居会涨，每年会自然下降一点。人望高时，每年的通缉度也会多降一些。","gold":"金币：买装备、贿赂、打点关系都要钱。每回合要交一笔最低的生活费，交不起，街区人望会下降。","rank":"等阶：街头扒手 → 影子学徒 → 正式成员 → 老手 → 影子 → 影子之王。完成主线章节晋升，也计入转生点。"},"display":[{"key":"heat","label":"通缉度","top":true,"help":"通缉度：巡逻队对你的关注。偷窃、入室、夜袭都会提高它。≥ 25 会招来搜查，≥ 50 会被悬赏，≥ 80 随时可能被抓；被抓三次，人生就结束了。每年自然下降 10 点；「避风头」降 18，「贿赂巡逻队」降 25。"},{"key":"intel","label":"情报","help":"情报：关于王城魔晶库、守卫轮换和暗门的线索。来源有打探消息、酒馆、线人和一些事件。月蚀之夜的准备需要至少 6 条。"},{"key":"crew","label":"同伙","help":"同伙：愿意跟你干一票的人。有 3 个以上同伙时战力 +3，月蚀之夜也有更多选项。每年要付一点分红。"},{"key":"arrests","label":"前科","help":"前科：被抓的次数。满 3 次，你会在牢里度过余生。"}],"livingCost":10,"livingMsg":"这一季你没钱吃饭，靠后巷里别人的剩饭撑了过去","ranks":["街头扒手","影子学徒","正式成员","老手","影子","影子之王"],"npcs":{"rat":{"name":"灰鼠"},"lila":{"name":"莉拉"},"cass":{"name":"捕快队长卡斯"},"gu":{"name":"老鬼"},"mask":{"name":"面具先生"}},"staminaMods":[{"cond":"hometown>=60","add":1,"label":"街区人望 ≥ 60：街坊替你放风"},{"cond":"hometown\u003c=15","add":-1,"label":"街区人望 ≤ 15：没人肯收留你"},{"cond":"count.heat>=60","add":-1,"label":"通缉度 ≥ 60：不敢出门"}],"powerBonus":[{"cond":"attr.agi>=12","add":3,"label":"身手（敏捷 ≥ 12）"},{"cond":"attr.agi>=16","add":4,"label":"身手（敏捷 ≥ 16）"},{"cond":"attr.agi>=20","add":4,"label":"身手（敏捷 ≥ 20）"},{"cond":"attr.agi>=24","add":5,"label":"身手（敏捷 ≥ 24）"},{"cond":"count.crew>=3","add":3,"label":"同伙 ≥ 3：有人接应"},{"cond":"status:blessed","add":3,"label":"祝福状态"}],"clearCond":"flag:heist_done","aspirations":[{"id":"member","name":"登堂入室","desc":"成为影子公会的正式成员","cond":"rank>=3","score":30},{"id":"rich","name":"盆满钵满","desc":"结束时持有 1500 金币","cond":"gold>=1500","score":30},{"id":"ghost","name":"来无影去无踪","desc":"完成月蚀之夜，且通缉度 ≤ 30","cond":"flag:heist_done&&count.heat\u003c=30","score":30}],"scenes":{"spring":"alley","summer":"alley","autumn":"rooftop","winter":"alley_snow"},"yearEnd":[{"cond":"true","text":"风声渐渐过去，巡逻队的注意力转向了别的案子。","fx":["count:heat-10","hometown-3"]},{"cond":"hometown>=60","text":"街坊们替你挡了几次盘问，风声又淡了些。","fx":["count:heat-8"]},{"cond":"flag:cass_trust","text":"卡斯在巡逻报告里把你的名字划掉了一次。","fx":["count:heat-10"]},{"cond":"count.crew>=1","text":"同伙们等着分红，你把一点钱分了下去。","fx":["gold-20"]},{"cond":"fate>=2","text":"风声比往年紧，巡逻队的搜查迟迟没有松懈。","fx":["count:heat+3"]},{"cond":"count.crew>=3","text":"人多了，年底的分红也厚了一些。","fx":["gold-30"]},{"cond":"age==16","text":"十六岁这一年，你第一次没有挨饿过冬。","fx":[]},{"cond":"age==17","text":"十七岁。你开始分得清：哪些人该躲，哪些人可以靠。","fx":[]},{"cond":"age==18","text":"十八岁。巷口的孩子们开始叫你“手哥”。","fx":[]},{"cond":"age==19","text":"十九岁这一年，你第一次在别人的屋顶上看见了整座王都的灯。","fx":[]},{"cond":"age==20","text":"二十岁。你的手法越来越干净，名字却越来越不敢被人提起。","fx":[]},{"cond":"age==22","text":"二十二岁。老人们说，月亮已经一年一年地在变暗了。","fx":[]},{"cond":"age==24","text":"二十四岁。离月蚀之夜只剩三年。","fx":[]},{"cond":"age==26","text":"二十六岁。你开始在睡前，把王城的地图默画一遍。","fx":[]}],"autoLearn":[{"skill":"backstab","cond":"count.knife>=2","story":{"title":"背刺","portrait":"rat","text":"灰鼠把你按在墙上，匕首抵住你的肋骨：“你知道人最松懈的地方在哪吗？”\n“……背后。”\n“不对。是他以为你已经走了的时候。”\n他松开手，让你自己试了一次。那一下，几乎没有声音。"},"checks":[{"label":"向灰鼠学艺 ≥ 2 次","cond":"count.knife>=2","cur":"count.knife"}]},{"skill":"smoke_bomb","cond":["flag:tricks_smoke","count.knife>=4"],"story":{"title":"烟雾弹","portrait":"rat","text":"配方不复杂：硫粉、松脂、一点点灰。难的是在被人围住的那一秒，仍然记得把它扔出去。\n烟升起来的时候，你已经在三条街外了。"},"checks":[{"label":"在黑市买到配方，或向灰鼠学艺 ≥ 4 次","cond":["flag:tricks_smoke","count.knife>=4"]}]},{"skill":"shadow_step","cond":"flag:guild_member&&attr.agi>=18","story":{"title":"影步","portrait":"thief","text":"那一晚，你从公会大厅的天花板上落下，没有人听见脚步。\n不是轻，是“不在”。你忽然明白了灰鼠说过的那句话：好的贼，不是躲在影子里，而是自己就是影子。"},"checks":[{"label":"成为影子公会的正式成员","cond":"flag:guild_member"},{"label":"敏捷 ≥ 18","cond":"attr.agi>=18","cur":"attr.agi"}]}],"endings":[{"id":"caught","name":"三进宫","kind":"fail","mult":0.6,"cond":["flag:jailed_end","flag:heist_caught"],"text":"牢房的石墙是冷的，冷得像鼠街的冬天。\n你听见隔壁有人在哼一支老调子，调子你认得，是灰鼠教过你的。\n很多年以后，有个孩子在鼠街的墙根下问起你的名字。有人说：“那是个手很快的人。”\n“后来呢？”\n“后来，手没有那么快了。”","hint":"被抓三次，或是闯进魔晶库，却没能出来。"},{"id":"shadow_king","name":"影子之王","kind":"true","mult":1.5,"cond":"flag:heist_done&&flag:mask_defeated","text":"面具落在地上，发出一声很轻的响。\n你站在王都最高的屋顶上，看着下面一盏一盏被点亮的灯。鼠街的灯，下城的灯，王城的灯，原来都在同一片夜里。\n后来，鼠街不再有人冻死在水沟边。公会换了规矩，换了头领，也换了名字。人们不再叫你“小手”，他们叫你：影子。\n没有人见过你的脸。但每个孩子都知道，有一个人，会在夜里替他们守着灯。","hint":"拿下水晶，并让面具先生付出代价。"},{"id":"righteous","name":"义贼传说","kind":"true","mult":1.5,"cond":"flag:heist_done&&flag:returned_crystal","text":"你把月蚀水晶放回了原来的地方，转身的时候，卡斯在门口等你。\n“我该抓你。”她说。\n“我知道。”\n她看了很久，把手铐放回了腰间：“……今晚我什么也没看见。”\n后来，王都的吟游诗人们唱起了一首歌，歌里有个盗贼，偷走了所有人的恐惧，又把光还给了所有人。\n歌里没有名字，但鼠街的孩子们都知道，那是谁。","hint":"拿下水晶，却把它交给了该交的人。"},{"id":"mask_puppet","name":"戴面具的人","kind":"normal","mult":1,"cond":"flag:heist_done&&flag:gave_crystal","text":"你把水晶交给了他。\n面具先生笑了，是那种终于等到继承人的笑。\n“从今天起，鼠街是你的了。”他说。\n后来你戴上了那张没有五官的面具。镜子里的人，没有名字，也没有脸。\n你有了权力，有了钱，有了整个下城。只是在每一个夜里，你都会想起灰鼠那句话：贼最怕的，不是被抓，而是变成别人。","hint":"拿下水晶，把它交给了等在巷尾的人。"},{"id":"ghost","name":"来无影去无踪","kind":"normal","mult":1,"cond":"flag:heist_done&&flag:ghosted","text":"天亮之前，你已经在城外的路上。\n身后的王都还在为月蚀之夜的失窃吵成一团，守卫们抓了又放，放了又抓，没人想到那个站在人群边上看热闹的年轻人，口袋里装着什么。\n你没有回头。\n鼠街有人说你死了，有人说你去了海那边，也有人说，每逢月蚀，屋顶上会有一道很轻的影子。","hint":"拿下水晶，不留一丝痕迹地消失。"},{"id":"retired","name":"金盆洗手","kind":"normal","mult":1,"cond":"flag:retired","text":"你用攒下来的钱，在下城的街角开了一间小铺子，卖锁，也修锁。\n没人知道这家铺子的主人曾经能在半炷香里打开王都任何一把锁。\n孩子们喜欢趴在柜台上看你磨钥匙。有人问你：“大叔，你以前是做什么的？”\n你笑了笑：“以前啊，做过一点不大光彩的小生意。”","hint":"在最后一票之前收手。"},{"id":"dead_alley","name":"暗巷尽头","kind":"fail","mult":0.6,"cond":"flag:dead","text":"你倒在鼠街的一条窄巷里。\n血从指缝里一点点往外漏，夜很冷，月亮很远。你想，其实这一生，也不算太坏：至少你偷过不少好东西。\n最后一件，是一个冬天的黎明。\n第二天，巷口多了一束干花，没人知道是谁放的。","hint":"死在鼠街的暗巷里。"},{"id":"endless","name":"鼠街之歌","kind":"fail","mult":0.6,"cond":"true","text":"月蚀之夜过去了，你没有走进那扇门。\n日子还在一天天地过，你还是那个手很快的人，在街角，在人群里，在每一个差一点被抓住的瞬间。\n有时候你会想，如果那一夜你去了呢？\n但鼠街不会回答。它只会在夜里，继续亮起那几盏总是坏的路灯。","hint":"没有走进那扇门。"}],"fateRules":["灾厄类随机事件出现的权重 +20%，支线任务的期限提前 1 年，敌人战力 +0.6%。","敌人战力共 +1.2%，落败时受到的伤害 +3%，通缉度每年少降 3 点。","月蚀之夜提前 1 年到来；被抓的代价更重（罚金 +50%）。","敌人战力共 +1.8%，落败时受到的伤害共 +8%，月蚀之夜的检定更难。","敌人战力共 +2.4%，主线任务的期限提前 1 年，濒死判定的难度 +2。"]},"content/voyager/actions.json":[{"id":"work_docks","name":"码头做工","cost":2,"group":"daily","hint":"金币·体魄","desc":"扛包、系缆、刷船底，港口永远缺人手。","fx":["gold+24","str_exp+3","hometown+1","exp+6"],"texts":["你和一群光着膀子的汉子，把一麻袋一麻袋的货搬上跳板。","工头一边结账，一边嘟囔：“小子，你的手比去年更像样了。”"]},{"id":"study_charts","name":"研读海图","cost":2,"group":"daily","tag":"study","hint":"智力·航海","desc":"港口的图书室里有一整面墙的旧海图。","fx":["int_exp+5","wil_exp+1","count:charts+1","exp+8"],"texts":["你把一张发黄的海图摊在桌上，用手指一寸一寸地顺着航线摸过去。","图上有人用红笔批注：“此处有暗流，勿近。”字迹潦草，却很用力。"]},{"id":"learn_haide","name":"向老船长学艺","cost":2,"group":"daily","cond":"flag:met_haide&&!flag:haide_gone","hint":"意志·老船长好感","desc":"海德的课堂在码头上，也在每一次风浪里。","fx":["wil_exp+3","agi_exp+2","rel:haide+1","count:sail+1","exp+10"],"texts":["海德把舵交给你：“握稳，别怕浪。浪怕的是不怕它的人。”","他一边抽烟斗，一边指着天边的云：“看见没？那是明天的雨。”"]},{"id":"fish_trip","name":"出海捕鱼","cost":2,"group":"daily","tag":"adventure","cond":["flag:met_haide","count.ship>=1"],"hint":"金币·敏捷","desc":"跟着渔船出海，换一点新鲜的收成。冬天风浪大。","check":{"attr":"agi","diff":10,"seasonDiff":{"winter":2}},"ok":{"text":"网收上来的时候，银色的鱼群在甲板上扑腾，海鸥围着船叫了一路。","fx":["gold+34","agi_exp+3","count:voyages+1","exp+8"]},"fail":{"text":"起网的时候，一个浪头打了过来，你摔在甲板上，鱼网也散了。","fx":["hp-5","agi_exp+1"]}},{"id":"hire_sailor","name":"招募水手","cost":2,"group":"social","cond":"count.ship>=1&&count.crew\u003c6&&gold>=50","hint":"水手·魅力","desc":"在酒馆、码头边，找一个愿意跟你出海的人。","check":{"attr":"cha","diff":11},"ok":{"text":"你请他喝了一杯麦酒，他把手里的缆绳往肩上一甩：“算我一个。”","fx":["count:crew+1","cha_exp+3","gold-50","rep:harbor+1"]},"fail":{"text":"对方上下打量你一番，笑着摇了摇头：“等你有条像样的船再来吧。”","fx":["cha_exp+1","gold-10"]}},{"id":"repair_ship","name":"修缮船只","cost":1,"group":"daily","cond":"flag:ship_damaged&&gold>=40","hint":"金币","desc":"风暴留下的伤，不修好，船不敢再出海。","fx":["gold-40","flag-:ship_damaged","str_exp+1"],"texts":["你和船匠一起，把破开的船板一块块钉回去，海水的盐味混着桐油味。"]},{"id":"trade_coast","name":"近海跑商","cost":2,"group":"daily","cond":"count.ship>=1&&!flag:ship_damaged","hint":"金币·智力·航次","desc":"沿着海岸线，把货从一个港口运到另一个。冬天风浪大。","check":{"attr":"int","diff":11,"seasonDiff":{"winter":2}},"ok":{"text":"货顺顺利利地卸在了对岸的码头。收货人数了数，爽快地结了账。","fx":["gold+62","int_exp+2","cha_exp+1","count:voyages+1","exp+8"]},"fail":{"text":"途中的风浪把一部分货打湿了。收货人皱着眉，压了价。","fx":["gold-10","hp-4","int_exp+1","count:voyages+1",{"if":"season==winter","then":["flag+:ship_damaged"]}]}},{"id":"trade_far","name":"远洋跑商","cost":3,"group":"daily","cond":"count.ship>=2&&!flag:ship_damaged","hint":"金币·智力·航次","desc":"穿过两个海域，运一船南方的香料和北方的皮货。冬天风浪更大。","check":{"attr":"int","diff":13,"seasonDiff":{"winter":3}},"ok":{"text":"十七天的航程，三场风，一次差点触礁。货安全上岸的时候，所有水手都在码头上喊了起来。","fx":["gold+165","int_exp+3","wil_exp+2","count:voyages+1","exp+16"]},"fail":{"text":"一场风暴把你们逼进了一个陌生的港口，修船、补给，什么都花了钱。","fx":["gold-30","hp-8","wil_exp+2","count:voyages+1","flag+:ship_damaged"]}},{"id":"trade_luxury","name":"奢侈品航线","cost":4,"group":"daily","cond":"count.ship>=3&&!flag:ship_damaged&&rep.guild>=10","hint":"金币·魅力·航次","desc":"丝绸、香料、魔晶，每一箱都值一座房子。需要商会的信任。","check":{"attr":"cha","diff":14,"seasonDiff":{"winter":3}},"ok":{"text":"你在最贵的港口，用最体面的笑，换走了最贵的货。对方客气地送你上了船。","fx":["gold+330","cha_exp+4","int_exp+2","count:voyages+1","exp+24","rep:guild+2"]},"fail":{"text":"买家挑剔地翻了一遍货，把价压到了成本线。","fx":["gold-20","cha_exp+1","count:voyages+1","hp-6"]}},{"id":"buy_ship_1","name":"购置舢板（250 金币）","cost":2,"group":"daily","cond":"count.ship==0&&gold>=250&&age>=17","hint":"船","desc":"一条能出海的小舢板，只够沿着海岸走。","fx":["gold-250","count:ship+1","item:ship_shield","log:你把一条旧舢板刷了漆，在船头写上了自己的名字。","goto:v_ship_1"]},{"id":"buy_ship_2","name":"购置单桅帆船（800 金币）","cost":2,"group":"daily","cond":"count.ship==1&&gold>=800&&flag:captain_license","hint":"船","desc":"一条真正的帆船，能跑远洋，也能装载更多的人。","fx":["gold-800","count:ship+1","log:单桅帆船的帆升起来的那一刻，你觉得整个港口都在看你。","goto:v_ship_2"]},{"id":"buy_ship_3","name":"购置三桅商船（2000 金币）","cost":2,"group":"daily","cond":"count.ship==2&&gold>=2000&&flag:captain_license&&rep.guild>=20","hint":"船","desc":"三桅的大船，吃水深，货舱大。需要商会声望 ≥ 20。","fx":["gold-2000","count:ship+1","log:三桅的大船，驶入港口的时候，连海鸥都安静了。","goto:v_ship_3"]},{"id":"buy_ship_4","name":"改造魔导战帆船（5000 金币）","cost":3,"group":"daily","cond":"count.ship==3&&gold>=5000&&rep.guild>=40&&flag:vel_navigator","hint":"船","desc":"在船底刻上魔法符文，装上能破浪的魔导炮。需要商会声望 ≥ 40，以及一位领航员。","fx":["gold-5000","count:ship+1","log:当符文在船底一圈圈亮起来的时候，水手们都不敢出声。","goto:v_ship_4"]},{"id":"go_market","name":"去港口集市","cost":1,"group":"daily","cond":"age>=17","hint":"装备·药品·海图","desc":"码头旁的集市，什么都有。","fx":["goto:ev_sea_market"]},{"id":"go_tavern","name":"去「海鸥」酒馆","cost":1,"group":"social","cond":"age>=17","hint":"传闻·赌局·歌声","desc":"港口最热闹的地方。","fx":["goto:ev_sea_tavern"]},{"id":"dg_reef","name":"驶入雾礁海域","cost":3,"group":"adventure","tag":"adventure","cond":"count.ship>=1","hint":"战斗·宝箱","desc":"推荐等级 3–6，共 4 层。雾里藏着海盗小艇。","fx":[],"dungeon":"reef","dungeonName":"雾礁海域"},{"id":"dg_wreck","name":"探索沉船墓场","cost":4,"group":"adventure","tag":"adventure","cond":"count.ship>=2&&level>=6","hint":"战斗·宝箱","desc":"推荐等级 6–10，共 5 层。溺水的水手并不安息。","fx":[],"dungeon":"wreck","dungeonName":"沉船墓场"},{"id":"dg_kraken","name":"挑战海妖巢穴","cost":5,"group":"adventure","tag":"adventure","cond":"count.ship>=2&&level>=10","hint":"战斗·宝箱","desc":"推荐等级 10–14，共 6 层。","fx":[],"dungeon":"kraken_den","dungeonName":"海妖巢穴"},{"id":"dg_abyss","name":"闯入深渊之门","cost":6,"group":"adventure","tag":"adventure","cond":"count.ship>=3&&level>=15","hint":"战斗·宝箱","desc":"推荐等级 15–20，共 7 层。深渊里有什么在看你。","fx":[],"dungeon":"abyss_gate","dungeonName":"深渊之门"},{"id":"take_exam","name":"参加船长考试","cost":3,"group":"quest","cond":"quest.main_star==active&&qstage.main_star==0&&count.voyages>=3&&age>=18&&!flag:exam_try3","hint":"船长执照","desc":"海事官的考题：航线、天气、船规、应急。智力检定，最多三次机会。","check":{"attr":"int","diff":13,"memDiff":{"id":"m_v_haide","diff":-2}},"ok":{"text":"海事官合上你的答卷，盖了一枚蓝色的章：“潮湾港，又多了一位船长。”","fx":["flag+:captain_license","int_exp+4","exp+40","rep:harbor+5"]},"fail":{"text":"你把一道关于暗流的题答反了方向。海事官摇摇头：“半年后再来。”","fx":["int_exp+2",{"if":"flag:exam_try2","then":["flag+:exam_try3"],"else":[{"if":"flag:exam_try1","then":["flag+:exam_try2"],"else":["flag+:exam_try1"]}]}]}},{"id":"redeem_chart","name":"赎回抵押的海图","cost":1,"group":"quest","cond":"flag:chart_pawned&&gold>=300&&!flag:fragment_1","hint":"星图残片","desc":"海德的那半张海图，被抵押在了港口当铺。","fx":["gold-300","flag+:fragment_1","flag-:chart_pawned","log:当铺老板把海图递给你，也递给你一句话：“这东西，别丢了。”"]},{"id":"meet_scarlett","name":"前往红鲨的锚地","cost":3,"group":"quest","tag":"adventure","cond":"quest.scarlett_deal==active&&!flag:scarlett_resolved","hint":"红鲨斯嘉丽","desc":"她在远海的一座小岛上等你。","fx":["goto:ev_scarlett_meet"]},{"id":"listen_song","name":"在新月夜听人鱼的歌","cost":2,"group":"quest","cond":"quest.nerea_song==active&&qstage.nerea_song==1&&!flag:nerea_song&&!flag:song_try3","hint":"奈蕾雅","desc":"新月之夜，在礁石边静静地听。意志检定，最多三次机会。","check":{"attr":"wil","diff":13,"memDiff":{"id":"m_v_song","diff":-2}},"ok":{"text":"歌声像水一样漫过你的脚踝，你没有睡着，也没有醒着。等你回过神，奈蕾雅正笑着看你。","fx":["flag+:nerea_song","flag+:nerea_friend","wil_exp+4","exp+30"]},"fail":{"text":"你太想听懂歌词，反而什么也没听到。天亮的时候，礁石上空空如也。","fx":["wil_exp+2",{"if":"flag:song_try2","then":["flag+:song_try3"],"else":[{"if":"flag:song_try1","then":["flag+:song_try2"],"else":["flag+:song_try1"]}]}]}},{"id":"star_survey","name":"观测星位","cost":3,"group":"quest","tag":"adventure","cond":"quest.vel_chart==active&&count.stars\u003c3","hint":"领航员薇尔","desc":"夜里在甲板上，对着星空用六分仪量角。智力检定，冬天很难。","check":{"attr":"int","diff":13,"seasonDiff":{"winter":2},"memDiff":{"id":"m_v_chart","diff":-2}},"ok":{"text":"你把六分仪举到眼前，数着星辰的夹角。薇尔在旁边记着数字，笔尖沙沙响。“……对上了。”","fx":["count:stars+1","int_exp+3","exp+16"]},"fail":{"text":"云层突然合拢，什么也看不到。薇尔叹了口气：“明晚再来。”","fx":["int_exp+1","hp-2"]}},{"id":"deliver_cargo","name":"递送商会的货","cost":3,"group":"quest","tag":"adventure","cond":"quest.merchant_contract==active&&count.cargo\u003c3&&count.ship>=2&&!flag:ship_damaged","hint":"商会的委托","desc":"商会指定的货，指定的港口，指定的日子。","check":{"attr":"int","diff":12,"seasonDiff":{"winter":2}},"ok":{"text":"货按时到了。商会的接货人签了字，把你的名字，登记在了一本厚厚的册子上。","fx":["count:cargo+1","rep:guild+4","gold+40","exp+20"]},"fail":{"text":"货晚到了一天，接货人皱了皱眉。你默默地把赔偿金付了。","fx":["gold-25","rep:guild-1","hp-3"]}},{"id":"help_bram","name":"替布拉姆赎回父亲的船（200 金币）","cost":1,"group":"quest","cond":"quest.bram_crew==active&&gold>=200&&!flag:bram_boat","hint":"布拉姆","desc":"他的父亲留下的小船，被商会抵押了。","fx":["gold-200","flag+:bram_boat","rel:bram+3","log:布拉姆接过船契，手在发抖。他没说谢谢，只是用力地拍了拍你的肩。"]}],"content/voyager/events.json":[{"id":"v_meet_haide","kind":"special","title":"断桅的旧船","text":"码头尽头停着一条断了半截桅杆的旧船。船上的老人叼着烟斗，正对着一堆缆绳发愁。\n“小子，”他头也不抬，“会打水手结吗？”\n你看了一眼，说：“会一点。”\n老人这才抬头，眯着眼睛看你。他就是海德老船长。","options":[{"label":"帮他把缆绳理好","text":"你一圈一圈地理，海德没说话，只是在你理完的时候，从口袋里摸出一枚被磨得发亮的铜币。\n“明天早上，别迟到。”","fx":["flag+:met_haide","rel:haide+3","agi_exp+2","hometown+2"]},{"label":"说自己只会一点，请他教教","check":{"attr":"cha","diff":10},"ok":{"text":"海德哈哈一笑，把烟斗往旁边一搁：“有意思，上来吧。”","fx":["flag+:met_haide","rel:haide+3","cha_exp+2"]},"fail":{"text":"海德摆摆手：“嘴上会的，我见得多了。”但他还是让你留下来打杂。","fx":["flag+:met_haide","rel:haide+1","cha_exp+1"]},"fx":[]},{"label":"不敢上去，说声打扰了转身走","text":"你走出老远，才听见身后传来一声笑：“胆子这么小，出不了海。”\n你回头，海德已经转过身去了。","fx":["flag+:met_haide","rel:haide+1"]}],"when":{"age":16,"season":"spring"},"priority":70,"portrait":"haide","scene":"harbor"},{"id":"v_first_storm","kind":"special","title":"第一场风暴","text":"海德带你出海的第一个秋天，天边的云在一刻钟里就黑了下来。\n“收帆！”他吼。浪头像一堵墙，扑过来的时候，整条船像一片树叶。\n你的手在发抖，嗓子里有什么东西卡着。","options":[{"label":"抓牢舵，死也不松手","check":{"attr":"wil","diff":11},"ok":{"text":"你咬紧牙，硬生生把船头顶住了浪。风暴过去的时候，海德靠在桅杆上，喘着气笑：“你小子……行。”","fx":["flag+:storm_survived","wil_exp+5","rel:haide+2","count:voyages+1","exp+20"]},"fail":{"text":"一个浪头把你从舵边掀翻，海德骂着娘接过了舵。你趴在甲板上，吐得天昏地暗。","fx":["hp-10","wil_exp+2","rel:haide+1","count:voyages+1"]},"fx":[]},{"label":"照海德说的收帆","text":"你和他配合着，把帆一面一面地收了下来。船安静了一些。","fx":["agi_exp+3","rel:haide+1","count:voyages+1","flag+:storm_survived"]},{"label":"缩在舱里，等风暴过去","text":"风暴过去之后，海德把你从舱里拎出来：“记住，船上没有观众。”","fx":["rel:haide-1","count:voyages+1"]}],"when":{"age":16,"season":"autumn"},"priority":65,"portrait":"haide","scene":"sea"},{"id":"v_meet_bram","kind":"special","title":"码头上的布拉姆","text":"一个红头发的年轻人，在码头上和你一起抢活儿。两个人同时伸手去抓一捆货，又同时松开。\n“你先。”他说。\n“你先。”你说。\n两个人都笑了。他叫布拉姆，是个跟你一样，什么都缺，却什么都敢干的家伙。","options":[{"label":"请他喝一杯麦酒","text":"他一口干了：“交个朋友。以后你有船，我给你当大副。”","fx":["flag+:met_bram","rel:bram+3","cha_exp+2","gold-5"]},{"label":"和他比谁扛得更多","check":{"attr":"str","diff":11},"ok":{"text":"你们比到最后，一个人扛了三袋，另一个人扛了两袋半。他哈哈大笑：“服了，你赢了。”","fx":["flag+:met_bram","rel:bram+2","str_exp+3"]},"fail":{"text":"你扛到第二袋就踉跄了。他拍拍你的肩：“不急，多吃点。”","fx":["flag+:met_bram","rel:bram+2","str_exp+1"]},"fx":[]},{"label":"点点头，各干各的","text":"他看了你一眼，耸耸肩，转身去了另一个码头。","fx":["flag+:met_bram","rel:bram+1"]}],"when":{"age":17,"season":"spring"},"priority":65,"portrait":"bram","scene":"harbor"},{"id":"v_meet_vel","kind":"special","title":"带着六分仪的陌生人","text":"一个外乡人，带着一只被海水泡得发白的皮箱，在码头上拦住了你。\n“你认识海德老船长吗？”她问，“我是领航员薇尔，听说他手里，有一张没画完的星图。”\n她的眼神认真，认真得像在看一页没写完的字。","options":[{"label":"带她去找海德","text":"海德看见她，沉默了很久，最后只说：“……坐吧。”这一夜，你在门外守着，听里面说了很久的话。","fx":["flag+:met_vel","rel:haide+1","int_exp+2"]},{"label":"先问她为什么要找那张图","check":{"attr":"int","diff":12},"ok":{"text":"薇尔把一张手绘的星表摊开：“我的老师，也在找同样的东西。”你们彼此看了很久。","fx":["flag+:met_vel","int_exp+3"]},"fail":{"text":"她笑了笑，没有回答，只是把皮箱抱得更紧了。","fx":["flag+:met_vel"]},"fx":[]},{"label":"说不认识，请她另找别人","text":"薇尔点点头，没有勉强。第二天，你在码头上又看见了她，坐在最远的一个缆桩上。","fx":["flag+:met_vel"]}],"when":{"age":18,"season":"autumn"},"priority":60,"portrait":"vel","scene":"harbor_dusk"},{"id":"v_scarlett_first","kind":"special","title":"红帆","text":"一片红色的帆，从海平线上冒了出来。\n红鲨斯嘉丽的船，围着你的船转了一圈。她站在船头，披着血红的披风，朝你抛来一个酒瓶。\n“小子，”她笑，“听说你在找星图？”","options":[{"label":"接住酒瓶，也敬她一杯","text":"你一口干了。烈酒烧得喉咙发疼。斯嘉丽哈哈大笑：“有胆子！下次，我请你吃饭。”","fx":["flag+:met_scarlett","rep:sea+3","cha_exp+3","quest:start:scarlett_deal"]},{"label":"下令戒备，不理她","check":{"attr":"cha","diff":12},"ok":{"text":"她看着你的船员，看了一会儿，吹了声口哨：“有意思。”她的船转了个方向，走了。","fx":["flag+:met_scarlett","rep:sea+1","quest:start:scarlett_deal"]},"fail":{"text":"她的人把弓箭瞄了过来，你的水手们都屏住了呼吸。她笑了笑，才让人收了弓。","fx":["flag+:met_scarlett","hp-3","quest:start:scarlett_deal"]},"fx":[]},{"label":"把酒瓶扔回去：“我不喝海盗的酒。”","text":"你的话音刚落，海盗们就冲了上来。","fx":[{"type":"combat","enemy":"pirate_raider","win":["flag+:met_scarlett","rep:sea+3","exp+30","quest:start:scarlett_deal","log:海盗们被你的船打退了，斯嘉丽在远处鼓了鼓掌。"],"lose":["flag+:met_scarlett","hp-12","gold-40","quest:start:scarlett_deal","log:海盗们劫走了一半货，斯嘉丽把一枚鲨鱼牙留在了你的甲板上。"]}]}],"when":{"age":20,"season":"summer"},"priority":60,"portrait":"scarlett","scene":"sea"},{"id":"v_haide_farewell","kind":"special","title":"老船长的告别","text":"冬天最冷的那个早晨，海德把你叫到了码头尽头。\n老人比去年瘦了很多，披着一件旧大衣，手里攥着一卷被海水浸得发黄的图。\n“我跑不动了，”他说，“这条船，这张图，我想留给一个不会把它们卖掉的人。”","options":[{"label":"接过海图和钥匙","text":"你的手有点抖。老人笑了，笑得像个孩子：“去吧。海那边，比图上画的大。”","fx":["flag+:haide_gone","flag+:fragment_1","count:ship+1","item:ship_shield","rel:haide+2","hometown+3","rank:2"],"cond":"rel.haide>=5","reason":"海德还没有那么信任你（好感 ≥ 5）"},{"label":"收下旧船，海图却被他当掉了","text":"海德叹了口气：“海图押在了当铺。有钱的时候，你去赎吧。”","fx":["flag+:haide_gone","count:ship+1","item:ship_shield","flag+:chart_pawned","rel:haide+1"]},{"label":"不收，说你自己会走出路","text":"海德看了你很久，把那卷图放回了大衣里。“……也好。”他说，“愿海给你多一点运气。”","fx":["flag+:haide_gone","flag+:chart_pawned","rel:haide-1","wil_exp+3"]}],"when":{"age":21,"season":"winter"},"priority":75,"portrait":"haide","scene":"harbor_storm"},{"id":"v_nerea","kind":"special","title":"渔网里的歌声","text":"拖网上来的时候，所有的水手都愣住了。\n网里是一个有着蓝色长发的少女，鱼尾上缠着绳，眼神里没有恐惧，只有一种很疲倦的、很古老的神色。\n水手们交头接耳：“人鱼……卖给魔法师，能换一座房子。”","options":[{"label":"割开网，放她走","text":"她入水前回头，看了你一眼：“……我记住你了。”","fx":["flag+:met_nerea","rep:sea+3","rep:harbor-2","wil_exp+3","quest:start:nerea_song"]},{"label":"把她带去港口，请牧师治伤","check":{"attr":"cha","diff":12},"ok":{"text":"港口的牧师沉默了一会儿，给她包扎了伤口。三天后，你把她送回了海里。她留下了一枚珍珠。","fx":["flag+:met_nerea","rep:harbor+3","gold+50","quest:start:nerea_song"]},"fail":{"text":"消息传开，港口的人围了过来，有人伸手去抢。混乱里，她挣开了。","fx":["flag+:met_nerea","rep:harbor-3","hp-5","quest:start:nerea_song"]},"fx":[]},{"label":"把她卖了","text":"你拿到了一大袋金币。夜里，你听见海面下，有人在唱一首很悲伤的歌。","fx":["gold+400","flag+:sold_nerea","rep:sea-8"],"avoid":true}],"when":{"age":22,"season":"summer"},"priority":60,"portrait":"nerea","scene":"sea"},{"id":"v_merchant_offer","kind":"special","title":"商会会长的邀约","text":"一张烫金的请柬，送到了你的甲板上。\n商会会长在顶楼的办公室里等你。窗外，是整个潮湾港的船桅，像一片光秃秃的森林。\n“年轻人，”他说，“潮湾港需要新的船长。”","options":[{"label":"听听他的条件","text":"他递来一份厚厚的合同。你没有马上签，只是接了过来。","fx":["flag+:merchant_offer","rep:guild+5","quest:start:merchant_contract"]},{"label":"客气地拒绝，说你想自己闯","check":{"attr":"cha","diff":13},"ok":{"text":"会长笑了：“好，有骨气。记住，商会的门，永远为你开着。”","fx":["rep:guild+3","cha_exp+3"]},"fail":{"text":"他的笑容淡了一点：“年轻人，海上的风，可不是靠骨气就能挡住的。”","fx":["rep:guild-2"]}},{"label":"趁机多要一些预付金","check":{"attr":"cha","diff":14},"ok":{"text":"会长皱了皱眉，但还是让秘书取来了一小袋金币。","fx":["gold+120","flag+:merchant_offer","rep:guild+2","quest:start:merchant_contract"]},"fail":{"text":"会长一挥手：“出去吧，下次谈。”","fx":["rep:guild-3"]}}],"when":{"age":23,"season":"spring"},"priority":55,"portrait":"merchant","scene":"harbor"},{"id":"v_last_call","kind":"special","title":"靠岸的诱惑","text":"你的船已经很久没有回过港口了，舱里装满了货，也装满了疲倦。\n潮湾港那家最老的酒馆，要转让了。\n“找个地方停下来吧，”布拉姆说，“你已经走得够远了。”","options":[{"label":"用积蓄把酒馆买下来，余生靠岸","text":"你把船停在了最老的那个泊位，在酒馆的门口，挂上了第一盏灯。","fx":["flag+:retired_sea","end:auto"],"cond":"gold>=1000&&hometown>=30","reason":"需要金币 ≥ 1000，港口人望 ≥ 30","avoid":true},{"label":"再走一程，把这趟走完","text":"布拉姆叹了口气，拍了拍你的肩，没再劝。","fx":["wil_exp+1"]},{"label":"不，我要去潮汐之门","text":"布拉姆沉默了一会儿：“……那就一起去。”","fx":["wil_exp+2","rel:bram+1"]}],"when":{"age":25,"season":"spring"},"priority":50,"portrait":"bram","scene":"harbor_dusk"},{"id":"v_tide_warn","kind":"special","title":"月与潮","text":"秋天的第一场大潮，比往年早了很多。\n港口的老人们蹲在码头边，望着海面，谁也没有说话。\n薇尔把六分仪架在你的甲板上，数着星辰之间的夹角：“还有一年。”","options":[{"label":"清点准备：船、水手、星图","text":"你把能用的东西一件一件地摆开，用手指点了点。\n心里有数了。","fx":["int_exp+2","wil_exp+2"]},{"label":"一个人去灯塔顶上，看一夜的海","text":"风很大，月亮很亮。你想起了海德，想起了第一次出海的那个下午。","fx":["wil_exp+4"]},{"label":"找斯嘉丽，探探她的口风","check":{"attr":"cha","diff":13},"ok":{"text":"她把酒杯往桌上一磕：“潮汐之门那天，我也去。你要是赢了，我服；输了，我替你收尸。”","fx":["rep:sea+2","cha_exp+3"]},"fail":{"text":"她笑着摇头：“想套我的话？还嫩点。”","fx":["cha_exp+1"]},"cond":"flag:met_scarlett","reason":"还没认识斯嘉丽"}],"when":{"age":26,"season":"autumn"},"priority":50,"portrait":"vel","scene":"harbor_dusk"},{"id":"v_tide_gate","kind":"special","title":"潮汐之门","text":"月亮和潮水，在同一夜里，把海推到了一个从没有人到过的高度。\n你站在船头。远处，海平线像一道被撕开的口子，里面有光。\n布拉姆站在你的身后，薇尔把最后一张星图铺在舵台上。每个人都在看你。\n你知道，这一次，不会再有“原来的你”。","options":[{"label":"启航，驶向潮汐之门","text":"缆绳被一根一根解开。船离港的那一刻，整个潮湾港的灯，同时亮了一下。","fx":["goto:ev_gate_1"],"cond":"flag:fragment_1&&flag:fragment_2&&flag:fragment_3&&count.ship>=3","reason":"需要三块星图残片，以及一艘三桅商船"},{"label":"凭着残缺的星图，硬闯一次","text":"没有完整的星图，没有足够大的船。你只有一股不肯回头的劲儿。","fx":["goto:ev_gate_1"],"cond":"count.ship>=1","reason":"至少需要一条船"},{"label":"留在港口","text":"你看着船队离港，又缓缓消失在海平线上。身后，海潮涨了又落。","fx":["flag+:gate_lost","end:auto"]}],"when":{"age":28,"season":"autumn"},"priority":200,"finale":true,"portrait":"sailor","scene":"sea"},{"id":"ev_sea_market","kind":"chain","title":"港口集市","text":"码头旁的集市，一年四季都挤满了人。卖鱼的、卖绳的、卖海图的，吆喝声此起彼伏。\n一个卖药的老太太朝你招手：“年轻人，出海前，带点药。”","options":[{"label":"买一瓶伤药（30 金币）","text":"苦得你直皱眉，伤口却很快不疼了。","fx":["gold-30","heal:0.6"],"cond":"gold>=30","reason":"金币不足"},{"label":"买一瓶魔力药剂（40 金币）","text":"带着咸味的蓝色药剂，一口下去，胸口的空虚被慢慢填满。","fx":["gold-40","mpheal:0.8"],"cond":"gold>=40","reason":"金币不足"},{"label":"买一本旧航海志（50 金币）","text":"书页被水泡得发皱，边角上，有前人的批注：“此处，勿近。”","fx":["gold-50","int_exp+8","count:charts+1"],"cond":"gold>=50","reason":"金币不足"},{"label":"请老水手指点跳帮战（60 金币）","text":"老水手一边收钱一边嫌你的姿势难看，最后还是教了你三个你没见过的动作。","fx":["gold-60","agi_exp+4","str_exp+3","exp+10"],"cond":"gold>=60","reason":"金币不足"},{"label":"请港务官看看你的船（40 金币）","text":"港务官围着你的船转了一圈，在登记簿上写了几个字。","fx":["gold-40","rep:harbor+3","flag-:ship_damaged"],"cond":"gold>=40&&count.ship>=1","reason":"金币不足，或还没有船"},{"label":"看看「贵客」才能进的货架","text":"摊主抬眼看了你一眼，把后面的布帘掀开了。","fx":["goto:ev_sea_market_vip"],"cond":"rep.harbor>=10","reason":"港口声望 ≥ 10，才有资格看"},{"label":"什么也不买，转身离开","text":"","fx":[]}],"scene":"harbor"},{"id":"ev_sea_market_vip","kind":"chain","title":"集市·贵客货架","text":"布帘后面是一间小小的库房，货架上的东西，每一样都用油布包着。\n摊主压低声音：“这些货，只卖给有名望的船长。魅力不够的，我连价都不报。”","options":[{"label":"海军弯刀（200 金币）","text":"护手上还留着军港的号码，握在手里，沉得刚好。","fx":["gold-200","item:cutlass","flag+:own_cutlass"],"cond":"cha>=10&&gold>=200&&!flag:own_cutlass","reason":"需要魅力 ≥ 10、200 金币，且尚未拥有"},{"label":"海豹皮大衣（280 金币）","text":"港口老裁缝缝的，下雨天也不透水。","fx":["gold-280","item:sealskin_coat","flag+:own_sealskin_coat"],"cond":"cha>=10&&gold>=280&&!flag:own_sealskin_coat","reason":"需要魅力 ≥ 10、280 金币，且尚未拥有"},{"label":"海女神护符（220 金币）","text":"港口的老妇人说，戴着它，海浪会客气一点。","fx":["gold-220","item:sea_charm","flag+:own_sea_charm"],"cond":"cha>=10&&gold>=220&&!flag:own_sea_charm","reason":"需要魅力 ≥ 10、220 金币，且尚未拥有"},{"label":"登船斧（520 金币）","text":"一斧劈断缆绳，一斧劈开舱门，跳帮战的老伙计。","fx":["gold-520","item:boarding_axe","flag+:own_boarding_axe"],"cond":"cha>=14&&gold>=520&&!flag:own_boarding_axe","reason":"需要魅力 ≥ 14、520 金币，且尚未拥有"},{"label":"珍珠护身符（500 金币）","text":"一颗大得不像话的珍珠，在黑暗里微微发光。","fx":["gold-500","item:pearl_amulet","flag+:own_pearl_amulet"],"cond":"cha>=14&&gold>=500&&!flag:own_pearl_amulet","reason":"需要魅力 ≥ 14、500 金币，且尚未拥有"},{"label":"海龟盾（560 金币）","text":"巨龟的甲壳打磨而成，沉得像一块礁石。","fx":["gold-560","item:turtle_shield","flag+:own_turtle_shield"],"cond":"cha>=14&&gold>=560&&!flag:own_turtle_shield","reason":"需要魅力 ≥ 14、560 金币，且尚未拥有"},{"label":"潮汐三叉戟（1100 金币）","text":"人鱼族打造的短叉，握着它，脚下的甲板仿佛也有了潮汐。","fx":["gold-1100","item:tidal_trident","flag+:own_tidal_trident"],"cond":"cha>=18&&gold>=1100&&!flag:own_tidal_trident","reason":"需要魅力 ≥ 18、1100 金币，且尚未拥有"},{"label":"珊瑚鳞甲（1300 金币）","text":"一片片珊瑚薄得像鱼鳞，却比钢硬。","fx":["gold-1300","item:coral_mail","flag+:own_coral_mail"],"cond":"cha>=18&&gold>=1300&&!flag:own_coral_mail","reason":"需要魅力 ≥ 18、1300 金币，且尚未拥有"},{"label":"海妖之牙（1200 金币）","text":"一直有点凉，贴着胸口，像是还有心跳。","fx":["gold-1200","item:kraken_tooth","flag+:own_kraken_tooth"],"cond":"cha>=18&&gold>=1200&&!flag:own_kraken_tooth","reason":"需要魅力 ≥ 18、1200 金币，且尚未拥有"},{"label":"风暴之刃（1500 金币）","text":"据说是从风暴里捞出来的，剑身永远带着一层水汽。","fx":["gold-1500","item:storm_blade","flag+:own_storm_blade"],"cond":"cha>=18&&gold>=1500&&!flag:own_storm_blade","reason":"需要魅力 ≥ 18、1500 金币，且尚未拥有"},{"label":"先到这里","text":"","fx":[]}],"scene":"harbor"},{"id":"ev_sea_tavern","kind":"chain","title":"海鸥酒馆","text":"酒馆里，水手们一边唱着走调的歌，一边用拳头敲着桌子打拍子。\n老板娘笑眯眯地擦着杯子：“今晚想玩点什么？”","options":[{"label":"坐上赌桌，押 40 金币","check":{"attr":"luk","diff":12},"ok":{"text":"骰子在碗里转了很久，最后停在你想要的那一面。满桌的水手都在起哄。","fx":["gold+85","exp+4"]},"fail":{"text":"骰子冷冰冰地落在了另一面。对面的水手收走了你的钱，笑得很和气。","fx":["gold-40"]},"cond":"gold>=40","reason":"金币不足"},{"label":"请一圈酒，听水手们讲海上的事（20 金币）","check":{"attr":"cha","diff":12},"ok":{"text":"三杯下去，几个老水手争先恐后地讲起各自见过的怪事：沉船、海妖、会唱歌的雾。你记下了几条有用的。","fx":["gold-20","count:charts+1","cha_exp+3","int_exp+2"]},"fail":{"text":"酒喝了，故事没听到，只被灌了个半醉。","fx":["gold-20","status+:fatigue:1"]},"cond":"gold>=20","reason":"金币不足"},{"label":"唱一首船歌","text":"你扯开嗓子，跟着众人吼了一整夜。第二天，好几个水手朝你点头。","fx":["rep:harbor+2","cha_exp+3","hometown+1"]},{"label":"只喝一杯，听听传闻","text":"酒很烈，传闻很杂。你带走了一句：“最近，雾礁那边，船总是一艘一艘不见。”","fx":["int_exp+1","heal:0.2"]},{"label":"离开","text":"","fx":[]}],"scene":"tavern"},{"id":"ev_scarlett_meet","kind":"chain","title":"红鲨的锚地","text":"红鲨的锚地，是远海上一座被浪冲得只剩半边的小岛。几十艘船静静地泊在那儿，每一艘都挂着红帆。\n斯嘉丽坐在一张从沉船上拆下来的桌子后面，手里转着一枚鲨鱼牙。\n“来了，”她笑，“罗盘，我这儿有。想要，你拿什么换？”","options":[{"label":"拔刀，与她一对一","text":"你把剑往桌上一拍。\n“有意思，”她站了起来，“很久没有人这么对我说话了。”","fx":[{"type":"combat","enemy":"scarlett","noFlee":true,"win":["flag+:scarlett_resolved","flag+:fragment_2","rep:sea+10","exp+60","log:斯嘉丽把罗盘扔给你：“拿去，你配得上。”"],"lose":["hp-15","gold-60","log:斯嘉丽把剑尖抵在你的喉咙上，又收了回去：“回去练练。”"]}],"avoid":true},{"label":"用金币买下罗盘（400 金币）","text":"斯嘉丽数了数金币，往空中抛了抛，笑了笑：“成交。”","fx":["gold-400","flag+:scarlett_resolved","flag+:fragment_2","rep:sea+3"],"cond":"gold>=400","reason":"金币不足"},{"label":"跟她赌一把，赌注是罗盘","check":{"attr":"luk","diff":14,"memDiff":{"id":"m_v_scarlett","diff":-2}},"ok":{"text":"骰子落下。斯嘉丽愣了一下，笑出了声：“运气比我还好！”她把罗盘扔了过来。","fx":["flag+:scarlett_resolved","flag+:fragment_2","rep:sea+5","exp+30"]},"fail":{"text":"骰子落下。斯嘉丽耸耸肩：“运气不够。回去吧，下次再来。”","fx":["gold-100"]}},{"label":"亮出你的船队，表示合作的诚意","check":{"attr":"cha","diff":14},"ok":{"text":"斯嘉丽看着你的水手们，笑得像一头餍足的猫：“好，我们一起去。”她把罗盘交给了你。","fx":["flag+:scarlett_resolved","flag+:fragment_2","flag+:scarlett_ally","rep:sea+8","exp+40"]},"fail":{"text":"她看着你的船队，不置可否：“光有人，没用。”","fx":["cha_exp+1"]},"cond":"count.crew>=3&&count.ship>=2","reason":"需要至少 3 个水手和一艘单桅帆船"},{"label":"先回去，再做准备","text":"你转身走了。斯嘉丽在身后慢悠悠地说：“我等你。”","fx":[]}],"scene":"island"},{"id":"ev_gate_1","kind":"chain","title":"暴风之海","text":"驶向潮汐之门的海面，被一堵黑色的风墙封住。\n浪头比桅杆还高，每一次砸下来，整条船都在呻吟。水手们面色发白。","options":[{"label":"把舵交给领航员薇尔","check":{"attr":"int","diff":14,"fateDiff":1},"ok":{"text":"薇尔接过舵，一句话也没说，眼睛盯着罗盘，在每一道浪的间隙里，把船一寸一寸地挪了过去。","fx":["int_exp+3","goto:ev_gate_2"]},"fail":{"text":"薇尔算错了一个浪的周期，船被抛上浪尖又砸了下来。","fx":["hp-10","flag+:ship_damaged","count:hfail+1","goto:ev_gate_2"]},"cond":"flag:vel_navigator","reason":"需要薇尔作为专属领航员"},{"label":"亲自掌舵，咬牙顶住","check":{"attr":"wil","diff":18,"fateDiff":1,"memDiff":{"id":"m_v_gate","diff":-2}},"ok":{"text":"你的手臂酸得像要断掉，但你一寸也没有松。风暴过去的时候，天边裂开了一道光。","fx":["wil_exp+5","goto:ev_gate_2"]},"fail":{"text":"一个浪头把船打得侧翻，缆绳崩断，两个水手落了水。你们花了很久才把他们捞起来。","fx":["hp-12","flag+:ship_damaged","count:hfail+1","goto:ev_gate_2"]}},{"label":"收帆下锚，躲过最凶的一阵","check":{"attr":"int","diff":17,"fateDiff":1,"memDiff":{"id":"m_v_gate","diff":-2}},"ok":{"text":"你让所有人伏在甲板上，等了整整三个时辰。风暴像一头暴怒的兽，从头顶一寸一寸地擦了过去。","fx":["int_exp+4","goto:ev_gate_2"]},"fail":{"text":"锚链在最凶的那一刻断了。船被浪裹着打了好几个旋才稳住。","fx":["hp-10","count:hfail+1","goto:ev_gate_2"]}}],"scene":"sea"},{"id":"ev_gate_2","kind":"chain","title":"溺亡骑士","text":"风暴的尽头，海面忽然安静下来。\n一队披着海藻与铁锈的骑士，从水里一个个站了起来。他们的盔甲上还刻着千年前的纹章。\n领头的那个，缓缓举起了手里已经锈蚀的剑。","options":[{"label":"与溺亡骑士们一战","text":"你拔出了剑。","fx":[{"type":"combat","enemy":"drowned_knight","noFlee":true,"win":[{"if":"count.hfail>=2","then":["log:船已经千疮百孔，再也没有力量继续了。","flag+:gate_lost","end:auto"],"else":["goto:ev_gate_3"]}],"lose":["hp-16","count:hfail+2",{"if":"count.hfail>=2","then":["log:船已经千疮百孔，再也没有力量继续了。","flag+:gate_lost","end:auto"],"else":["goto:ev_gate_3"]}]}],"avoid":true},{"label":"请奈蕾雅出面","check":{"attr":"cha","diff":14,"fateDiff":1},"ok":{"text":"奈蕾雅从浪里浮了上来，用一种你听不懂的语言，对骑士们说了几句话。骑士们沉默了一会儿，缓缓退入了海里。","fx":["cha_exp+3",{"if":"count.hfail>=2","then":["log:船已经千疮百孔，再也没有力量继续了。","flag+:gate_lost","end:auto"],"else":["goto:ev_gate_3"]}]},"fail":{"text":"骑士们不为所动，奈蕾雅也被他们逼退。你们不得不强行突围。","fx":["hp-12","count:hfail+1",{"if":"count.hfail>=2","then":["log:船已经千疮百孔，再也没有力量继续了。","flag+:gate_lost","end:auto"],"else":["goto:ev_gate_3"]}]},"cond":"flag:nerea_friend","reason":"需要得到人鱼的信任"},{"label":"举起三块星图，让它们的光指引亡魂","check":{"attr":"wil","diff":17,"fateDiff":1},"ok":{"text":"三块残片，在你手里一同亮了起来。骑士们抬着头，像是看见了很久以前的星光，一个一个地沉了下去。","fx":["wil_exp+4",{"if":"count.hfail>=2","then":["log:船已经千疮百孔，再也没有力量继续了。","flag+:gate_lost","end:auto"],"else":["goto:ev_gate_3"]}]},"fail":{"text":"光很弱。骑士们摇摇晃晃地围了上来，你们拼死杀出了一条路。","fx":["hp-12","count:hfail+1",{"if":"count.hfail>=2","then":["log:船已经千疮百孔，再也没有力量继续了。","flag+:gate_lost","end:auto"],"else":["goto:ev_gate_3"]}]},"cond":"flag:fragment_1&&flag:fragment_2&&flag:fragment_3","reason":"需要集齐三块残片"}],"scene":"wreck"},{"id":"ev_gate_3","kind":"chain","title":"门前的巨兽","text":"海水忽然向两边分开，一座巨大的、刻满纹路的石门，从水底缓缓升起。\n门前，一只比你的船还大的怪物，睁开了眼睛。它的鳞片在月光下，像一整片倒映的星空。","options":[{"label":"借潮之势，让海水替你说话","check":{"attr":"wil","diff":18,"fateDiff":1},"ok":{"text":"潮水在你脚下涌起，像一匹温顺的马。怪物低头看了你很久，缓缓让开了路。","fx":["wil_exp+5",{"if":"count.hfail>=2","then":["log:船已经千疮百孔，再也没有力量继续了。","flag+:gate_lost","end:auto"],"else":["goto:ev_gate_end"]}]},"fail":{"text":"潮水只涌了半寸便散开了。怪物摆了摆尾，把你的船打得转了一圈。","fx":["hp-14","count:hfail+1",{"if":"count.hfail>=2","then":["log:船已经千疮百孔，再也没有力量继续了。","flag+:gate_lost","end:auto"],"else":["goto:ev_gate_end"]}]},"cond":"flag:sk_tide_surge","reason":"需要学会借潮之势"},{"label":"用星图和领航员的指引，找到绕开它的航道","check":{"attr":"int","diff":18,"fateDiff":1},"ok":{"text":"薇尔指着星图上一个微不可见的缺口：“那里。”你们从巨兽的鳍边擦了过去。","fx":["int_exp+5",{"if":"count.hfail>=2","then":["log:船已经千疮百孔，再也没有力量继续了。","flag+:gate_lost","end:auto"],"else":["goto:ev_gate_end"]}]},"fail":{"text":"航道在最后一步偏了半尺。船擦着鳞片过去，木板吱呀作响。","fx":["hp-12","count:hfail+1",{"if":"count.hfail>=2","then":["log:船已经千疮百孔，再也没有力量继续了。","flag+:gate_lost","end:auto"],"else":["goto:ev_gate_end"]}]},"cond":"flag:vel_navigator&&flag:fragment_1&&flag:fragment_2&&flag:fragment_3","reason":"需要领航员和完整的星图"},{"label":"硬闯，与深渊巨兽一战","text":"你站在船头，把剑指向了巨兽。","fx":[{"type":"combat","enemy":"leviathan","noFlee":true,"win":[{"if":"count.hfail>=2","then":["log:船已经千疮百孔，再也没有力量继续了。","flag+:gate_lost","end:auto"],"else":["goto:ev_gate_end"]}],"lose":["flag+:gate_lost","end:auto"]}],"avoid":true}],"scene":"abyss"},{"id":"ev_gate_end","kind":"chain","title":"门开了","text":"石门缓缓地向两边打开。\n门后，是一座沉在光里的城，街道还保持着千年前的样子。城的中心，一颗巨大的、有节律地一明一灭的心脏，悬在海水里。\n那是「星海之心」。它在呼吸。","options":[{"label":"取走它，带回港口","text":"你把手放在那颗心上。它没有躲，只是安静地，落进了你的怀里。","fx":["flag+:returned_heart","rank:6","end:auto"]},{"label":"把它留在原处，跟奈蕾雅走进这座城","text":"奈蕾雅朝你伸出手：“欢迎回家。”","fx":["flag+:star_end","rank:6","end:auto"],"cond":"flag:nerea_friend","reason":"需要得到人鱼的信任"},{"label":"与斯嘉丽分享，让她的舰队护送你们称王","text":"斯嘉丽哈哈大笑，血红的披风在风里猎猎地抖：“我就知道，我没看错人。”","fx":["flag+:pirate_end","rank:6","end:auto"],"cond":"flag:scarlett_ally","reason":"需要斯嘉丽成为盟友"},{"label":"合上门，把心沉回深渊","text":"你闭上眼，用力把石门推了回去。深处，有什么东西，轻轻叹了口气。","fx":["flag+:guardian_end","rank:6","end:auto"],"cond":"flag:abyss_truth","reason":"需要知道深渊的真相"}],"scene":"abyss","enter":["flag+:gate_opened"]},{"id":"v_ship_1","kind":"chain","title":"第一条船","text":"旧舢板被你牵到了船台上。你刷漆，补缝，一刷就是整整一天。\n傍晚，你站在船头，用最大的一支刷子，在船舷上，写下了一个名字。","options":[{"label":"「海燕」","text":"简简单单两个字。风一吹，漆还没干，船头的海鸥，就叫了一声。","fx":["hometown+2","cha_exp+1"]},{"label":"「海德的旧梦」","text":"你写得很慢。写完，你在船边，站了很久。","fx":["rel:haide+1","hometown+3","wil_exp+1"]},{"label":"一个字也没写，留给以后","text":"船，就这样空着名字，下了水。","fx":["wil_exp+2"]}],"scene":"harbor"},{"id":"v_ship_2","kind":"chain","title":"单桅帆船的第一次升帆","text":"帆布被一点一点升起来，在风里，鼓成了一个饱满的白色。\n岸上有人在鼓掌，有人在抹眼泪。船匠站在船台边，大声嚷嚷：“这条船，我保它，能走到天边！”","options":[{"label":"请全港的人，来船上喝一杯（30 金币）","text":"码头上的水手、船匠、渔民，一个接一个地登上了甲板。那一夜，船头挂满了纸灯。","fx":["gold-30","hometown+4","rep:harbor+3","cha_exp+3"],"cond":"gold>=30","reason":"金币不足"},{"label":"只和布拉姆，站在船头，吹一整夜的风","text":"你们谁也没说话，只是看着，远处的海平线，一点点变亮。","fx":["rel:bram+2","wil_exp+2"],"cond":"flag:met_bram","reason":"还没认识布拉姆"},{"label":"一个人，悄悄地爬上桅杆，看一眼整个港口","text":"风很大，你站得很高。整座潮湾港，在你脚下，像一个小小的、闪着灯的玩具。","fx":["agi_exp+3","wil_exp+2"]}],"scene":"harbor_dusk"},{"id":"v_ship_3","kind":"chain","title":"三桅的大船","text":"三桅商船入港的那一天，所有的海鸥，都围着它转。\n商会会长站在码头边，没有说话。他旁边，几个年长的船长，抱着胳膊，互相对视了一眼。","options":[{"label":"邀会长上船，参观一圈（花 40 金币招待）","text":"会长一路没怎么说话。走到舵台，他把手放在舵轮上，沉默了很久：“好船。”","fx":["gold-40","rep:guild+4","cha_exp+3"],"cond":"gold>=40","reason":"金币不足"},{"label":"让水手们列队，行一个港口的老礼","text":"水手们整整齐齐地，站成了两排。有人，红了眼眶。","fx":["rep:harbor+3","hometown+4","rel:bram+1"]},{"label":"悄悄绕到船尾，看一眼自己的船名","text":"你把手，放在船尾那几个刚刷好的字上。它们还有一点湿。","fx":["wil_exp+2"]}],"scene":"harbor"},{"id":"v_ship_4","kind":"chain","title":"符文亮起","text":"魔导炮的炮口，缓缓从船舷里伸了出来。船底的符文，一圈接一圈地亮了起来，把半个港口，都照成了蓝色。\n船匠和魔法师，站在一边，谁也不敢出声。\n你站在舵台上，感觉整艘船，像一头醒来的巨兽。","options":[{"label":"把手，按在符文上","text":"符文的光，顺着你的手臂爬了上来。你忽然明白，这艘船，不再只是木头和帆布了。","fx":["int_exp+5","wil_exp+3","exp+40"]},{"label":"下令，试射一发","text":"一声轰鸣，一道蓝色的光，划过海面，把远处的一座礁石，削掉了半边。水手们都愣住了，随后，爆发出一阵欢呼。","fx":["str_exp+3","rep:sea+3","exp+30"]},{"label":"关掉魔导炮，把船，当成一艘普通的船来驶","text":"你把炮口收了回去。符文，一圈一圈地暗下去。水手们没说话，但每个人，都悄悄松了一口气。","fx":["wil_exp+3","hometown+2"]}],"scene":"deck"}],"content/voyager/events_derived.json":[{"id":"v_dv_dock_ship","kind":"derived","title":"靠港的大船","text":"一艘三桅的大船正在卸货，甲板上站着穿着体面的水手，船长在船头抽着雪茄。\n你扛着麻袋，忍不住多看了两眼。","options":[{"label":"把麻袋放下，多看一会儿","text":"船长看见你，笑了笑，朝你点了点头。你的心跳忽然快了一拍。","fx":["int_exp+1","wil_exp+2"]},{"label":"继续干活，咬着牙想：总有一天","text":"你的肩膀被麻袋压出了一道红印，但你的背，挺得很直。","fx":["str_exp+2"]}],"parent":"work_docks","weight":8},{"id":"v_dv_dock_knot","kind":"derived","title":"打结的手艺","text":"一个老水手教你如何打一个“永不松的结”。\n“手要慢，”他说，“心要稳。结不是绳子打的，是人打的。”","options":[{"label":"认真学三遍","text":"你的手指被绳子磨得发红，但你终于打出了那个结。","fx":["agi_exp+3","int_exp+1","count:sail+1"]}],"parent":"work_docks","weight":8},{"id":"v_dv_chart_ghost","kind":"derived","title":"图上的批注","text":"你在一张旧海图的边缘，发现了一行用红笔写的小字：“别信北边的灯塔。”\n你不知道是谁写的，也不知道，它为什么还留在这里。","options":[{"label":"把批注抄下来，留作记号","check":{"attr":"int","diff":11},"ok":{"text":"后来你在北边的海上，真的碰见了一座“不该亮”的灯塔，幸亏你记着这一行字。","fx":["int_exp+3","count:charts+1"]},"fail":{"text":"字迹太潦草，你只抄了一半。","fx":["int_exp+1"]}},{"label":"不当回事，翻到下一页","text":"","fx":["int_exp+1"]}],"parent":"study_charts","weight":8},{"id":"v_dv_chart_vel","kind":"derived","title":"薇尔的修订","text":"一支红笔，在你的海图上划了几道。你抬头，是薇尔：“这里，水深不对。这里，暗流的方向反了。”\n她说话很快，很准，一点也不客气。","options":[{"label":"谢谢她，把修订抄下来","text":"薇尔难得地笑了笑：“你抄得比我想象的快。”","fx":["int_exp+4","cha_exp+1","count:charts+1"]},{"label":"不服，与她争论","check":{"attr":"int","diff":13},"ok":{"text":"争了半个钟头，你指出了她一处遗漏。薇尔瞪着你，然后，缓缓地，露出了一个服气的表情。","fx":["int_exp+5","cha_exp+2"]},"fail":{"text":"你被她驳得哑口无言。","fx":["int_exp+2"]}}],"parent":"study_charts","weight":7,"cond":"flag:met_vel"},{"id":"v_dv_haide_sail","kind":"derived","title":"海德的舵","text":"海德把舵交给了你，自己叼着烟斗，靠在了桅杆上。\n“你来。”","options":[{"label":"稳稳握住","text":"你的手心全是汗。浪来了，你下意识地顺着它转了半圈。海德点点头：“不错，浪是用来顺的。”","fx":["agi_exp+3","wil_exp+2","exp+10"]}],"parent":"learn_haide","weight":9},{"id":"v_dv_haide_weather","kind":"derived","title":"云的语言","text":"海德指着天边一缕细长的云：“那叫‘鱼骨’。明天，要变天。”\n第二天，果然下起了雨。","options":[{"label":"记住云的样子","text":"你一连几天，每天早晚，各看一遍天。","fx":["int_exp+2","wil_exp+2","count:sail+1"]}],"parent":"learn_haide","weight":8},{"id":"v_dv_fish_net","kind":"derived","title":"满网的银鱼","text":"收网的时候，网拖得几乎拉不动。水手们一起使劲，最后拽上来一网白花花的银鱼，把整条甲板都铺满了。","options":[{"label":"把多余的鱼分给港口的邻居","text":"邻居们提着篮子来，笑得合不拢嘴。","fx":["hometown+3","rep:harbor+2"]},{"label":"全部拿去卖了","text":"你换来了一大笔钱，也换来了一点说不清的愧疚。","fx":["gold+30"]}],"parent":"fish_trip","weight":8},{"id":"v_dv_fish_dolphin","kind":"derived","title":"跟着船的海豚","text":"一群海豚，围着你的船游了整整一个下午，一会儿冒头，一会儿潜下去，像是在替你领路。","options":[{"label":"把一条鱼抛给它们","text":"领头的海豚叼着鱼，高高地跃起，又落下，溅了你一身水。","fx":["cha_exp+2","luk_exp+2","status+:blessed:2"]}],"parent":"fish_trip","weight":7},{"id":"v_dv_hire_story","kind":"derived","title":"新水手的故事","text":"新入伙的水手，夜里坐在船头，轻轻地哼着一首歌。\n你问他这是什么歌，他说：“我母亲教的。她说，听着这歌，海就不会吃我。”","options":[{"label":"请他再哼一遍","text":"整艘船都安静了下来，水手们一个一个地凑过来，听完了整首歌。","fx":["cha_exp+2","hometown+1"]}],"parent":"hire_sailor","weight":7},{"id":"v_dv_hire_runaway","kind":"derived","title":"逃出来的少年","text":"一个满脸风霜的少年，在你面前跪了下来：“船长，我逃出来的……我不想再回去了。”","options":[{"label":"收留他","check":{"attr":"cha","diff":11},"ok":{"text":"少年成了你船上最勤快的水手，对你，忠心得像一条狗。","fx":["count:crew+1","rep:harbor+1"]},"fail":{"text":"他的原主人找上了门，你不得不赔了一笔钱。","fx":["gold-60","rep:harbor-1"]}},{"label":"给他一些钱，让他自己找路","text":"他接过钱，朝你鞠了个深躬，转身走了。","fx":["gold-20","hometown+1"]}],"parent":"hire_sailor","weight":6},{"id":"v_dv_repair_carpenter","kind":"derived","title":"老船匠的叮嘱","text":"老船匠一边敲着钉子，一边嘟囔：“你的船，龙骨有点歪。再这么出海，哪天风大了，就散架了。”","options":[{"label":"请他一并加固（再花 40 金币）","text":"老船匠满意地点了点头：“这才像话。”","fx":["gold-40","rep:harbor+2","flag+:keel_fixed"],"cond":"gold>=40"},{"label":"谢谢他的提醒，下次再说","text":"","fx":["int_exp+1"]}],"parent":"repair_ship","weight":7},{"id":"v_dv_trade_port","kind":"derived","title":"陌生港口的货","text":"你把货运到对岸。收货人是个老太太，一边验货，一边念叨：“年轻人，别走得太急。慢慢来，海不会丢。”","options":[{"label":"听她说完","text":"老太太往你手里塞了一小罐果酱：“路上吃。”","fx":["hometown+1","cha_exp+2"]}],"parent":"trade_coast","weight":7},{"id":"v_dv_trade_rival","kind":"derived","title":"同行的挑衅","text":"在对岸的码头，另一家商船的船长，斜着眼看你：“小子，这趟的货，是我先看上的。”","options":[{"label":"不卑不亢，跟他谈条件","check":{"attr":"cha","diff":13},"ok":{"text":"三言两语，你让他心服口服地让出了一半。","fx":["gold+40","cha_exp+3"]},"fail":{"text":"他寸步不让。你最后只好低价出了货。","fx":["gold-20","cha_exp+1"]}},{"label":"什么也不说，把货转运去别的港口","text":"这一趟，多花了三天，也少赚了一些。但你省下了麻烦。","fx":["gold-10"]}],"parent":"trade_far","weight":7,"cond":"count.ship>=2"},{"id":"v_dv_survey_aurora","kind":"derived","title":"夜里的光","text":"观测的第二个夜里，天边亮起了一抹淡淡的绿光，像是有谁在天空里，轻轻抖开了一块丝绸。\n薇尔放下笔，轻声说：“……这是我第一次，见到极光。”","options":[{"label":"陪她看完","text":"你们谁也没有说话。光在海面上流淌了很久，才一点点暗下去。","fx":["wil_exp+2","int_exp+2","rel:bram+0"]}],"parent":"star_survey","weight":8,"cond":"flag:met_vel"},{"id":"v_dv_cargo_warn","kind":"derived","title":"收货人的暗示","text":"收货人悄悄凑近你：“下次，你带这批货时，最好……别走东边那条路。”\n他没有解释，只是意味深长地看了你一眼。","options":[{"label":"记在心里","check":{"attr":"int","diff":12},"ok":{"text":"你后来查了一下，才发现，东边那条路上，最近果然出了几艘船被劫的事。","fx":["count:charts+1","int_exp+3","rep:guild+1"]},"fail":{"text":"你没太当回事。","fx":["int_exp+1"]}}],"parent":"deliver_cargo","weight":7},{"id":"v_dv_lux_1","kind":"derived","title":"买家的暗示","text":"在最奢华的港口，一位穿着绸缎的买家，一边验货，一边用手指，轻轻敲着桌子：“船长，我听说，你对‘门’的事，也有兴趣？”","options":[{"label":"装作不知道，谈生意","text":"买家笑了笑，没再追问。但临走时，他递给你一张名片：“潮汐之门的事，我想，我们还会再见。”","fx":["count:intel+1","cha_exp+3"]},{"label":"反过来，探探他的底","check":{"attr":"cha","diff":14},"ok":{"text":"你一边谈价钱，一边悄悄套话。他说漏了嘴：北边的某个港口，有人，在收购星图的残片。","fx":["count:intel+1","count:charts+1","cha_exp+4"]},"fail":{"text":"他笑而不语，把话题，转向了天气。","fx":["cha_exp+1"]}}],"parent":"trade_luxury","weight":8},{"id":"v_dv_lux_2","kind":"derived","title":"丝绸里的信","text":"拆开那箱丝绸的时候，你在一匹绸缎的夹层里，摸到了一封信。信封上，写着一个你不认识的名字。","options":[{"label":"把信送回去，原样交给收件人","text":"收信人是个老太太。她捧着信，一个字没读，眼泪就掉了下来。","fx":["hometown+3","rep:harbor+2","wil_exp+1"]},{"label":"偷偷拆开读一读","check":{"attr":"int","diff":12},"ok":{"text":"信里，是一个人对远方亲人的思念。字字平实，却读得你，心里沉甸甸的。","fx":["int_exp+2","wil_exp+2"]},"fail":{"text":"信里的字，你一个也不认识。","fx":["int_exp+1"]}}],"parent":"trade_luxury","weight":7}],"content/voyager/events_dungeon.json":[{"id":"v_de_reef_light","kind":"dungeon","title":"礁石上的灯","text":"雾里，一座礁石上，亮着一盏灯。\n灯下，有一个人影，一动不动。","options":[{"label":"靠近，看看是谁","check":{"attr":"wil","diff":11},"ok":{"text":"那是一具被海水泡白的尸体，手里还攥着一个小小的铜铃。你合上了他的眼睛，把铜铃带走了。","fx":["gold+25","wil_exp+2"]},"fail":{"text":"你靠得太近，一只躲在礁石后的海蛇扑了出来。","fx":["hp-8"]}},{"label":"绕开，不理会","text":"你把船头转了个方向，没有回头。","fx":["agi_exp+2"]}],"dungeons":["reef"],"weight":8},{"id":"v_de_reef_pirates","kind":"dungeon","title":"藏在雾里的小艇","text":"雾里，一艘挂着黑帆的小艇，一动不动地泊在礁石的阴影里。艇上，有人在擦刀。","options":[{"label":"从背后偷袭","check":{"attr":"agi","diff":11},"ok":{"text":"你们悄悄靠了过去，一次登船，三个海盗，全都被绑在了桅杆上。","fx":["gold+45","agi_exp+3"]},"fail":{"text":"你们刚靠近，对方的瞭望手就叫了起来。","fx":["hp-8","gold-10"]}},{"label":"绕路，避开他们","text":"","fx":[]}],"dungeons":["reef"],"weight":8},{"id":"v_de_wreck_hold","kind":"dungeon","title":"沉船的货舱","text":"沉船的货舱里，木箱一层摞着一层，其中有几只，被珊瑚紧紧地裹住了。","options":[{"label":"用撬棍撬开其中一只","check":{"attr":"str","diff":12},"ok":{"text":"箱子里是一整箱沉在水里多年的银币，还带着海水的腥味。","fx":["gold+55","str_exp+2"]},"fail":{"text":"撬棍滑了，你的手腕被划了一道口子。","fx":["hp-8","str_exp+1"]}},{"label":"不碰，转身走","text":"","fx":[]}],"dungeons":["wreck"],"weight":8},{"id":"v_de_wreck_ghost","kind":"dungeon","title":"船魂的低语","text":"船舱里，一个穿着旧式制服的幽灵，坐在船长椅上，一动不动。\n你走近的时候，他缓缓地抬起头：“你……也是来找那个门的吗？”","options":[{"label":"问他：什么门？","text":"幽灵没有回答，只是指了指舱壁上的一行小字：“深渊……会唱歌。”","fx":["count:abyss_clue+1","wil_exp+2"]},{"label":"不回答，快步离开","text":"你没有回头，但身后，那句话一直在回荡。","fx":["wil_exp+1"]}],"dungeons":["wreck"],"weight":8},{"id":"v_de_kraken_pearl","kind":"dungeon","title":"发光的珍珠","text":"海妖巢穴的角落里，一颗拳头大的珍珠，在黑暗里发着淡淡的光。\n旁边的海藻里，缠着几具白骨。","options":[{"label":"小心地取走珍珠","check":{"attr":"agi","diff":13},"ok":{"text":"你屏住呼吸，一点点把珍珠从海藻里抠了出来，连一根藤蔓都没有惊动。","fx":["gold+70","agi_exp+3"]},"fail":{"text":"海藻忽然缠紧了你的脚踝。","fx":["hp-12"]}},{"label":"不动它，转身走","text":"","fx":[]}],"dungeons":["kraken_den"],"weight":8},{"id":"v_de_kraken_nerea","kind":"dungeon","title":"被困的海豚","text":"巢穴的暗处，一只被渔网缠住的海豚，在挣扎。\n它的眼睛看着你，像是在求救。","options":[{"label":"割开渔网，放它走","text":"海豚低低地叫了一声，游走了。你的心里，轻了一些。","fx":["hometown+1","wil_exp+2","rep:sea+1"]}],"dungeons":["kraken_den"],"weight":8},{"id":"v_de_abyss_voice","kind":"dungeon","title":"深渊的声音","text":"深渊的边缘，有什么东西，在轻轻地叫你的名字。\n声音像潮水，一遍一遍，漫过你的脚踝。","options":[{"label":"捂住耳朵，往前走","check":{"attr":"wil","diff":15},"ok":{"text":"你咬紧牙，一步一步地向前。声音渐渐地，被你抛在了身后。","fx":["wil_exp+5","exp+30"]},"fail":{"text":"你听了太久，眼前一阵发黑。醒来时，你已经站在了原地，浑身冷汗。","fx":["hp-14","wil_exp+2"]}},{"label":"停下，回应它","text":"你张开口，说出了自己的名字。深渊，安静了一瞬。","fx":["count:abyss_clue+1","wil_exp+3","hp-6"]}],"dungeons":["abyss_gate"],"weight":8},{"id":"v_de_abyss_door","kind":"dungeon","title":"刻着字的石门","text":"深渊的尽头，一座半沉的石门，门上刻满了古老的字。\n你伸手去摸，指尖忽然被什么东西烫了一下。","options":[{"label":"用手拓下那些字","check":{"attr":"int","diff":15},"ok":{"text":"你拓了整整一页。后来，薇尔告诉你，这是一种已经失传的、只有人鱼族才会写的文字。","fx":["count:abyss_clue+1","int_exp+5","exp+30"]},"fail":{"text":"字太深了，你什么也拓不下来，只被烫伤了手指。","fx":["hp-6","int_exp+1"]}},{"label":"不碰，转身离开","text":"","fx":[]}],"dungeons":["abyss_gate"],"weight":8},{"id":"v_de_reef_bell","kind":"dungeon","title":"礁石里的钟声","text":"雾里，传来一阵缓缓的钟声，一下，一下。不知是哪座礁石上的，也不知是谁在敲。","options":[{"label":"循着钟声，靠近","check":{"attr":"wil","diff":11},"ok":{"text":"钟声越来越近，礁石的轮廓，渐渐出现。那是一口被浪冲得发绿的旧钟，挂在一根断桅上，随着风，自己在响。","fx":["gold+30","wil_exp+2","exp+10"]},"fail":{"text":"钟声忽远忽近，你被引到了一片暗礁上。","fx":["hp-6"]}},{"label":"原地等，等雾散","text":"","fx":[]}],"dungeons":["reef"],"weight":8},{"id":"v_de_reef_nest","kind":"dungeon","title":"海鸥的巢","text":"礁石的高处，有一片白花花的海鸥巢，里面，卧着一颗颗灰白色的蛋，和一只，闪着光的东西。","options":[{"label":"爬上去，看看那闪光的东西","check":{"attr":"agi","diff":11},"ok":{"text":"你小心翼翼，没有惊动鸟群。那是一枚被海鸥捡来的金戒指。","fx":["gold+40","agi_exp+3"]},"fail":{"text":"鸟群炸了。你被啄得抱头鼠窜。","fx":["hp-6","agi_exp+1"]}},{"label":"绕开，不打扰它们","text":"","fx":[]}],"dungeons":["reef"],"weight":8},{"id":"v_de_wreck_chest","kind":"dungeon","title":"船长室里的箱子","text":"沉船的船长室里，一只带锁的铜箱，紧紧嵌在舱壁上。锁已经锈穿了，轻轻一碰，就掉了下来。","options":[{"label":"打开箱子","check":{"attr":"luk","diff":11},"ok":{"text":"箱子里，是一整箱发黑的银币，和一封封了蜡的信。","fx":["gold+65","count:charts+1","luk_exp+3"]},"fail":{"text":"箱子里，只有一堆被水泡烂的纸。","fx":["luk_exp+1"]}}],"dungeons":["wreck"],"weight":8},{"id":"v_de_wreck_hammock","kind":"dungeon","title":"吊床上的水手","text":"货舱的角落里，一张吊床，轻轻摇晃。吊床上，躺着一个穿着旧式水手服的幽灵，一边打着呼噜，一边在梦里，喊着某个人的名字。","options":[{"label":"轻轻叫醒他","text":"幽灵缓缓睁开眼：“……船，靠岸了吗？”你不知道该怎么回答。","fx":["wil_exp+3","hometown+1"]},{"label":"悄悄走开，不惊扰他的梦","text":"你踮着脚，一步一步退了出去。身后，鼾声没有停。","fx":["wil_exp+2"]}],"dungeons":["wreck"],"weight":8},{"id":"v_de_kraken_eggs","kind":"dungeon","title":"发光的卵","text":"海妖巢穴的深处，一片发着微光的卵，排列得整整齐齐。每一颗，都有一个人头那么大。","options":[{"label":"小心取走一颗","check":{"attr":"agi","diff":13},"ok":{"text":"你屏着呼吸，把其中一颗卵，慢慢放进了随身的布袋。它的温度，竟然是暖的。","fx":["gold+90","agi_exp+3","exp+20"]},"fail":{"text":"卵，被你一碰，微微颤了一下。不远处，传来一声低沉的咆哮。","fx":["hp-9"]}},{"label":"不动它们，悄悄离开","text":"你没有回头，但一直，感觉背后，有无数双眼睛。","fx":["wil_exp+2"]}],"dungeons":["kraken_den"],"weight":8},{"id":"v_de_kraken_scar","kind":"dungeon","title":"巨大的伤痕","text":"巢穴的岩壁上，有一道巨大的、深深的爪痕，像是什么东西，曾经想从这里，逃出去。","options":[{"label":"伸手，摸那道伤痕","text":"伤痕比你的手臂还深。你忽然觉得，这里的海妖，也曾经是某个更古老的东西的囚徒。","fx":["count:abyss_clue+1","wil_exp+2","int_exp+2"]}],"dungeons":["kraken_den"],"weight":8},{"id":"v_de_abyss_stairs","kind":"dungeon","title":"没有尽头的阶梯","text":"深渊的入口，是一级一级的石阶，一直向下，看不见尽头。\n你走了一百级，两百级，回头看，上面的光，早就不见了。","options":[{"label":"继续往下走","check":{"attr":"wil","diff":15},"ok":{"text":"你一级一级地数，数到第四百级，终于，脚下，踩到了平地。","fx":["wil_exp+5","exp+30"]},"fail":{"text":"你走着走着，忽然分不清，自己是在向下，还是在向上。","fx":["hp-7","wil_exp+2"]}},{"label":"停下，回头","text":"你原路折返。上去的路，比下去的，更长。","fx":["wil_exp+2","hp-3"]}],"dungeons":["abyss_gate"],"weight":8},{"id":"v_de_abyss_song","kind":"dungeon","title":"水底的歌","text":"深渊深处，传来一阵很轻很轻的歌声，是一个女人的声音，低低地哼着一首摇篮曲。\n你听着听着，竟然，有一点想睡。","options":[{"label":"捂住耳朵，咬牙前行","check":{"attr":"wil","diff":14},"ok":{"text":"你一步一步，把歌声，抛在了身后。","fx":["wil_exp+4","exp+24"]},"fail":{"text":"你听着听着，不知不觉，蹲了下来。醒过来的时候，已经过去了很久。","fx":["hp-6","wil_exp+1"]}},{"label":"跟着哼，一边往前","text":"歌声，没有恶意。你一路哼着走了很远，身后，有什么东西，轻轻地笑了。","fx":["count:abyss_clue+1","wil_exp+3"]}],"dungeons":["abyss_gate"],"weight":8}],"content/voyager/events_random.json":[{"id":"v_bottle","kind":"random","title":"漂流瓶","text":"潮水退去后，滩涂上卧着一只被藤壶包满的玻璃瓶。瓶塞已经泡得发胀，里面有一卷纸。","options":[{"label":"拔开瓶塞，读那封信","check":{"attr":"int","diff":10},"ok":{"text":"字迹很淡，但还能辨认：是一个船长写给女儿的最后一封信，信的背面，画着一幅小小的航线图。","fx":["count:charts+1","int_exp+3","hometown+1"]},"fail":{"text":"纸一碰就碎，只剩下几个模糊的字。","fx":["int_exp+1"]}},{"label":"原样放回海里","text":"你把瓶子用力扔回了浪里。也许，另一个岸上，有人在等它。","fx":["wil_exp+1"]}],"pool":"opportunity","weight":8,"scene":"harbor"},{"id":"v_whale","kind":"random","title":"鲸的歌","text":"夜里，海面下传来一阵低沉的歌声，一下一下，像是整片海在呼吸。\n一头巨大的鲸，在你的船边浮了上来，眼睛有一间屋子那么大。","options":[{"label":"熄灯，静静地听","text":"你们谁也没有说话。鲸游远的时候，有水手悄悄擦了擦眼睛。","fx":["wil_exp+3","cha_exp+1","hometown+1","status+:blessed:3"],"cond":"count.ship>=1"},{"label":"在船舷边，伸手摸摸它","check":{"attr":"luk","diff":11},"ok":{"text":"鲸缓缓靠了过来，你的手掌贴着它冰凉的皮肤。它发出一声很轻的叹息。","fx":["luk_exp+3","wil_exp+2","exp+15"]},"fail":{"text":"鲸受惊潜了下去，翻起的浪把你拍在了甲板上。","fx":["hp-5"]},"cond":"count.ship>=1"}],"pool":"opportunity","weight":7,"scene":"sea","cond":"age>=17"},{"id":"v_salvage","kind":"random","title":"漂浮的货箱","text":"海面上漂着几只木箱，上面印着某家商会的火漆，大概是被风浪冲出船的。","options":[{"label":"让水手们把它们捞上来","check":{"attr":"str","diff":11},"ok":{"text":"箱子里是整整齐齐的香料和皮货，还没被水泡坏。","fx":["gold+75","str_exp+2","count:voyages+1"]},"fail":{"text":"捞到一半，一个浪头把两个水手拍进了水里。你们折腾了半天，只拿回了一只。","fx":["gold+20","hp-4"]},"cond":"count.crew>=1","reason":"需要水手"},{"label":"在箱子上做个记号，通知港务官","text":"港务官记下了你的名字。几天后，失主送来了一小笔谢礼。","fx":["gold+30","rep:harbor+3","hometown+1"],"cond":"count.ship>=1"},{"label":"不管，继续航行","text":"","fx":[]}],"pool":"opportunity","weight":8,"scene":"sea","cond":"count.ship>=1"},{"id":"v_old_sailor","kind":"random","title":"老水手的故事","text":"码头边，一个断了一条腿的老水手，靠着缆桩晒太阳。你路过时，他叫住你：“小子，坐下，我给你讲个故事。”\n故事讲的是他年轻时，如何在雾礁里，遇到了一艘没有船员的船。","options":[{"label":"坐下，认真听完","check":{"attr":"int","diff":10},"ok":{"text":"故事的最后，他告诉你一个只有老船长才知道的暗流位置。你把它记在了心里。","fx":["count:charts+1","int_exp+3","rep:harbor+1"]},"fail":{"text":"他讲着讲着睡着了，口水流了一下巴。","fx":["int_exp+1"]}},{"label":"给他买一杯麦酒，再听","text":"老头笑得露出了缺了牙的嘴：“好孩子……”","fx":["gold-5","rep:harbor+1","cha_exp+2"],"cond":"gold>=5"},{"label":"说还有活儿，改天听","text":"你匆匆地走了。身后，老头继续对着空气讲。","fx":[]}],"pool":"opportunity","weight":8,"scene":"harbor"},{"id":"v_harbor_festival","kind":"random","title":"潮汛节","text":"潮汛节到了。整个港口都挂满了彩旗，渔民们把彩色的纸船放进海里，据说能保佑一年平安。\n孩子们挤在码头边，一边追着人群，一边偷吃摊上的糖。","options":[{"label":"帮忙搭台子，布置彩旗","text":"你一整天都在爬梯子、扯绳子。晚上，有人在你肩上拍了一下：“谢了。”","fx":["hometown+4","rep:harbor+2","str_exp+2"]},{"label":"在人群里卖些小货","check":{"attr":"cha","diff":11},"ok":{"text":"节日里，什么都好卖。你的货，在日落前就卖光了。","fx":["gold+55","cha_exp+3"]},"fail":{"text":"生意不太好，只卖了零星几样。","fx":["gold+12","cha_exp+1"]}},{"label":"放一只纸船，许个愿","text":"你把纸船放进海里，看它一点点漂远。你许了什么愿，只有海知道。","fx":["wil_exp+2","luk_exp+2"]}],"pool":"world","weight":7,"cond":"season==summer","scene":"harbor"},{"id":"v_bram_story","kind":"random","title":"布拉姆的家","text":"夜里，布拉姆坐在船头，晃着腿，一边啃着干面包，一边给你讲他的老家：一个只有三十几户人家的小渔村，每年冬天，都会被海水淹一次。\n“我想有一条自己的船，”他说，“让他们都不用再挨饿。”","options":[{"label":"认真听他说完","text":"你们一起坐到了天亮。他把最后一口面包，掰了一半给你。","fx":["rel:bram+2","cha_exp+2"]},{"label":"给他一些钱，让他寄回家（30 金币）","text":"布拉姆愣住了，半天没说话。过了一会儿，他红着眼睛，用力地拍了拍你。","fx":["gold-30","rel:bram+3","hometown+1"],"cond":"gold>=30","reason":"金币不足"}],"pool":"social","weight":8,"cond":"flag:met_bram","scene":"deck"},{"id":"v_vel_stars","kind":"random","title":"薇尔的星表","text":"薇尔把一张手绘的星表摊在你面前，指着其中一条模糊的线：“这是我老师留下的。他说，潮汐之门，不是一扇门，而是……一个时间。”\n她抬眼看你，眼睛里有一点你从没见过的光。","options":[{"label":"请她讲得更清楚些","check":{"attr":"int","diff":12},"ok":{"text":"她讲了一个多钟头，你听懂了其中的一半。那一半，就足够你重新画一遍航线。","fx":["int_exp+4","count:charts+1"]},"fail":{"text":"你听得头晕，只记住了几个名词。","fx":["int_exp+1"]}},{"label":"给她泡一杯热茶","text":"薇尔愣了一下，接过茶，小声说了句“谢谢”。","fx":["cha_exp+1","int_exp+1"]}],"pool":"social","weight":8,"cond":"flag:met_vel","scene":"deck"},{"id":"v_scarlett_toast","kind":"random","title":"红鲨的酒","text":"酒馆里，一个熟悉的红色身影，在你对面坐了下来。\n斯嘉丽把两只杯子往桌上一磕，斟满：“别紧张，今晚，我不抢你。”","options":[{"label":"和她对饮，聊聊海上的事","check":{"attr":"cha","diff":13},"ok":{"text":"你们聊到了半夜。她讲了几个关于她父亲的故事，讲得很轻。你们之间，有了一点不一样的东西。","fx":["rep:sea+3","cha_exp+3"]},"fail":{"text":"她喝得比你多，聊得也比你多。你什么也没套出来。","fx":["cha_exp+1","gold-10"]}},{"label":"只喝一杯，起身告辞","text":"她挑了挑眉，笑着说：“胆小鬼。”","fx":["rep:sea+1"]}],"pool":"social","weight":7,"cond":"flag:met_scarlett","scene":"tavern"},{"id":"v_stowaway","kind":"random","title":"藏在货舱里的孩子","text":"出海第三天，一个瘦小的孩子，从货舱的缝隙里被搜了出来。他抱着一只破了洞的布袋，浑身发抖。\n“我……我想看海。”","options":[{"label":"给他一碗热汤，让他留下做事","text":"孩子眼睛亮得像两颗新磨的珠子。接下来的航程里，他成了船上最勤快的小水手。","fx":["hometown+2","cha_exp+2"],"cond":"count.ship>=1"},{"label":"下次靠港时，送他回家","text":"你们在下一个港口找到了他的母亲，她抱着孩子哭了很久。","fx":["hometown+3","rep:harbor+2","gold-10"],"cond":"count.ship>=1"},{"label":"把他扔上最近的渔船","text":"孩子没有哭，只是用力地盯着你看。","fx":["hometown-3"],"cond":"count.ship>=1","avoid":true}],"pool":"social","weight":7,"scene":"deck","cond":"count.ship>=1&&age>=18"},{"id":"v_haide_pipe","kind":"random","title":"烟斗里的故事","text":"海德坐在断了半截桅杆的旧船上，烟斗忽明忽暗。\n“我年轻时，”他说，“也想去看看那扇门。后来我老了，才明白，有些路，要年轻人走。”","options":[{"label":"问他：那你后悔吗？","text":"他吐了一口烟，慢吞吞地说：“后悔？没有。有些东西，没走到，反而更美。”","fx":["rel:haide+2","wil_exp+2"]},{"label":"什么也没问，给他点上烟","text":"海德拍拍你的手：“你这孩子，不赖。”","fx":["rel:haide+2"]}],"pool":"social","weight":8,"cond":"flag:met_haide&&!flag:haide_gone","scene":"harbor_dusk","once":true},{"id":"v_merchant_gossip","kind":"random","title":"商会的闲话","text":"商会的茶座里，几位会员压低声音，议论着一件事：北边的海路，这个冬天，似乎出了问题，好几艘商船失踪了。","options":[{"label":"凑过去，听听细节","check":{"attr":"cha","diff":12},"ok":{"text":"他们把你当成了自己人，说得又多又快，其中有几条消息，对你的航线很有用。","fx":["count:charts+1","rep:guild+2","cha_exp+2"]},"fail":{"text":"他们看了你一眼，话题换成了天气。","fx":["cha_exp+1"]}},{"label":"不掺和，喝完茶就走","text":"","fx":[]}],"pool":"social","weight":6,"cond":"rep.guild>=10","scene":"harbor"},{"id":"v_storm_hit","kind":"random","title":"突来的风暴","text":"天空忽然黑了下来，海面起了白头浪。\n水手们慌忙地收帆，缆绳抽得嗖嗖响。","options":[{"label":"收帆，迎浪稳住船头","check":{"attr":"wil","diff":12,"seasonDiff":{"winter":2},"memDiff":{"id":"m_v_storm","diff":-2}},"ok":{"text":"你咬紧牙，一点一点把船头顶了回去。风暴过去，所有人都瘫在了甲板上，却笑了出来。","fx":["wil_exp+4","flag+:storm_survived","exp+12"]},"fail":{"text":"一个浪头拍断了桅杆，船体裂开了一道缝。你们好不容易才保住了人。","fx":["hp-12","wil_exp+2","flag+:ship_damaged"]}},{"label":"放下锚，避开最凶的一阵","check":{"attr":"int","diff":12,"seasonDiff":{"winter":2}},"ok":{"text":"你们躲在一座小岛的背风面，等了一夜。第二天，海面平静得像什么事也没发生过。","fx":["int_exp+3"]},"fail":{"text":"锚没有抓住，船被冲着打了几个旋。","fx":["hp-8","flag+:ship_damaged"]}}],"pool":"calamity","weight":11,"cond":"count.ship>=1&&!flag:ship_damaged","scene":"sea"},{"id":"v_pirate_raid","kind":"random","title":"海盗劫船","text":"瞭望台上的水手尖叫起来：“海盗！三点钟方向！”\n一条黑色的快船，从雾里冲了出来，船头的撞角，像一只张开的嘴。","options":[{"label":"下令迎战","text":"水手们抄起了刀。你深吸一口气，站在了甲板的最前面。","fx":[{"type":"combat","enemy":"pirate_raider","win":["exp+40","rep:sea+2","gold+60","log:海盗们被打退了，水手们高声欢呼。"],"lose":["hp-12","gold-70","log:海盗们抢走了货，也抢走了你们的士气。"]}]},{"label":"升满帆，试着甩开他们","check":{"attr":"agi","diff":12},"ok":{"text":"你借着风势，一路转了三个舵，把海盗甩进了雾里。","fx":["agi_exp+4"]},"fail":{"text":"他们追了上来，在船尾钉了一排钩子。你不得不割断缆绳，丢了半条货。","fx":["gold-50","hp-6"]}},{"label":"交钱买路（60 金币）","text":"领头的海盗数了数钱，满意地挥了挥手：“识相。”","fx":["gold-60","rep:sea-1"],"cond":"gold>=60","reason":"金币不足"}],"pool":"calamity","weight":10,"cond":"count.ship>=2","scene":"sea"},{"id":"v_sea_serpent","kind":"random","title":"海蛇","text":"水面下，一条粗得像桅杆的暗影，缓缓地从船底游过。\n水手们的脸都白了：“是……是海蛇。”","options":[{"label":"用鱼叉迎击","text":"你们抓起鱼叉，站在了船舷上。","fx":[{"type":"combat","enemy":"sea_serpent","win":["exp+50","rep:sea+2","log:海蛇受了伤，翻着浪游走了。"],"lose":["hp-14","flag+:ship_damaged","log:海蛇的尾巴扫断了你的舵。"]}]},{"label":"熄灭灯火，让它自己游过去","check":{"attr":"wil","diff":12},"ok":{"text":"你们在黑暗里屏息了一刻钟，直到那条暗影彻底消失在海里。","fx":["wil_exp+3"]},"fail":{"text":"一个水手没忍住，叫出了声。海蛇猛地转了头。","fx":["hp-10","flag+:ship_damaged"]}}],"pool":"calamity","weight":8,"cond":"count.ship>=2&&level>=6","scene":"sea"},{"id":"v_rats","kind":"random","title":"船舱里的老鼠","text":"货舱里传来细碎的啃咬声。你下去一看，一整麻袋的粮食，已经被咬得千疮百孔。","options":[{"label":"花钱请人灭鼠（30 金币）","text":"灭鼠人一边收钱一边摇头：“船都这么脏，还怪老鼠？”","fx":["gold-30","hometown-1"],"cond":"gold>=30"},{"label":"自己动手，抓一晚上","check":{"attr":"agi","diff":11},"ok":{"text":"你和水手们抓了一整夜，天亮的时候，舱里终于清静了。","fx":["agi_exp+2","hp-2"]},"fail":{"text":"老鼠没抓到多少，倒把几个人咬得鼻青脸肿。","fx":["hp-5","gold-15"]}}],"pool":"calamity","weight":7,"cond":"count.ship>=1","scene":"deck"},{"id":"v_fever","kind":"random","title":"船上热病","text":"一场热病，在船上悄悄蔓延。先是一个水手发烧，接着是两个，三个。\n你的额头，也开始发烫。","options":[{"label":"靠岸，请牧师治病（40 金币）","text":"牧师在你们的船上点了三天的艾草。热病渐渐退了。","fx":["gold-40","hp-3"],"cond":"gold>=40","reason":"金币不足"},{"label":"硬扛","check":{"attr":"wil","diff":12},"ok":{"text":"你一个人撑了三天，热退了。","fx":["wil_exp+4","hp-8"]},"fail":{"text":"你病得很重，足足躺了半个月。","fx":["hp-16","status+:fatigue:2","gold-10"]}}],"pool":"calamity","weight":7,"scene":"harbor_storm","cond":"season==winter"},{"id":"v_mutiny","kind":"random","title":"不稳的人心","text":"几个水手在夜里聚在一起，压低声音说着什么。你路过的时候，他们立刻闭了嘴。\n你知道，那是对工钱、对航线、对你这个船长，不太满意。","options":[{"label":"把话说开，让每个人都听到","check":{"attr":"cha","diff":13},"ok":{"text":"你把账本摊开，一笔一笔地讲。有几个人红了脸。当天夜里，所有人都回到了岗位。","fx":["rep:harbor+1","cha_exp+4","rel:bram+1"]},"fail":{"text":"你越讲越乱，场面更尴尬了。","fx":["cha_exp+1","count:crew-1"]}},{"label":"给每个人加一点工钱（30 金币）","text":"人群散了，所有人都不说话了。","fx":["gold-30"],"cond":"gold>=30"},{"label":"强硬压下去","text":"你把鞭子拍在桌上，大家都安静了。但那天以后，船上的气氛不一样了。","fx":["hometown-2","wil_exp+2"]}],"pool":"calamity","weight":8,"cond":"count.crew>=3","scene":"deck"},{"id":"v_tax","kind":"random","title":"港务官的税单","text":"港务官带着一队人，挨船登记。轮到你时，他翻开本子，笑眯眯地说：“船长，今年的泊位税，涨了。”","options":[{"label":"照付（50 金币）","text":"你数出钱，递过去。他眯着眼，把钱收进了怀里。","fx":["gold-50"],"cond":"gold>=50"},{"label":"据理力争","check":{"attr":"cha","diff":12},"ok":{"text":"你把去年的税单拍在桌上，一条一条地指出来。港务官的笑容越来越僵，最后只收了一半。","fx":["gold-25","cha_exp+3"]},"fail":{"text":"他“哼”了一声，在你的船尾，贴了一张写着“待查”的封条。","fx":["gold-50","flag+:ship_damaged"]}},{"label":"没钱，只能拖着","text":"港务官记在了本子上：“拖一天，加一成。”","fx":["rep:harbor-1","hometown-2"],"cond":"gold\u003c50"}],"pool":"calamity","weight":8,"cond":"count.ship>=2","scene":"harbor"},{"id":"v_fog","kind":"random","title":"雾中迷航","text":"海雾像牛奶一样涌了上来。三步之外，什么也看不见。\n水手们开始小声地说话，有人说，听见了远处的钟声，有人说，听见了船上不该有的歌。","options":[{"label":"靠罗盘和星表，一寸一寸地摸出去","check":{"attr":"int","diff":13},"ok":{"text":"你盯着罗盘上颤抖的指针，一点一点地修正方向。雾散的时候，你们离预定的航线，只偏了一指。","fx":["int_exp+4","count:charts+1"]},"fail":{"text":"你们绕了整整一天，才从雾里出来。物资用掉了一大半。","fx":["gold-30","hp-4"]}},{"label":"把锚抛下，原地等雾散","text":"你们在雾里干等了一天一夜。水手们的情绪，一点点变得诡异。","fx":["gold-15","wil_exp+2"]}],"pool":"calamity","weight":8,"cond":"count.ship>=1","scene":"reef"},{"id":"v_rope_snap","kind":"random","title":"崩断的缆绳","text":"缆绳在你手里“嘣”地一声断了。\n反弹的绳头抽在你的肩膀上，疼得你眼前发黑。","options":[{"label":"咬牙，继续干活","check":{"attr":"wil","diff":11},"ok":{"text":"你硬是撑着，把缆绳重新接好。","fx":["wil_exp+3","hp-5"]},"fail":{"text":"肩膀肿得抬不起来，只能躺两天。","fx":["hp-10","status+:injured:2"]}},{"label":"停下，请船医看看（20 金币）","text":"船医冷着脸把你的肩膀一扳一推，疼得你差点叫出声，但接下来几乎不疼了。","fx":["gold-20","hp-3"],"cond":"gold>=20"}],"pool":"calamity","weight":7,"scene":"deck","cond":"age>=16"},{"id":"v_north_rumor","kind":"random","title":"北方的传闻","text":"酒馆里有人说，北方的边境，魔物的踪迹越来越多。\n有人说是谣言，有人说，百年一醒的东西，又要醒了。\n你听了一耳朵，没怎么在意：大海比陆地，更靠近传说。","options":[{"label":"多听两句，打听消息","text":"你听到了几条杂乱的消息，有一条，隐隐约约和海上的商路有关。","fx":["count:charts+1","int_exp+2"]},{"label":"不关心，继续喝酒","text":"与你有什么关系呢？","fx":[]}],"pool":"world","weight":6,"cond":"age>=20","scene":"tavern"},{"id":"v_navy_press","kind":"random","title":"海军征召","text":"海军的军官，带着一队士兵，挨船登记：“北方的海岸告急，凡持船者，须出一艘小艇，为王国效力。”","options":[{"label":"出一艘小艇，为王国效力","text":"军官在文书上盖了章：“王国记得你。”","fx":["rep:kingdom+5","gold-40","hometown+2"],"cond":"count.ship>=2&&gold>=40","reason":"需要单桅帆船及以上，且金币 ≥ 40"},{"label":"用钱免役（100 金币）","text":"军官数了数钱，点点头：“识相。”","fx":["gold-100","rep:kingdom-1"],"cond":"gold>=100&&count.ship>=2"},{"label":"躲开，装作没看见","text":"船登记册上，你的名字被悄悄跳了过去。","fx":["rep:kingdom-2"],"cond":"count.ship>=2"}],"pool":"world","weight":7,"cond":"count.ship>=2&&age>=22","scene":"harbor"},{"id":"v_clue_log","kind":"random","title":"泡烂的航海日志","text":"你在一条被冲上岸的旧船里，翻到了一本泡烂的航海日志。大部分字都糊成了一团，只有最后一页，用红笔写着：“深渊在叫我们的名字。”","options":[{"label":"把那一页小心撕下来","check":{"attr":"int","diff":12},"ok":{"text":"纸边的字迹依稀可辨：船长们都记着同一个坐标，也都在同一个坐标上，听见了同一个声音。","fx":["count:abyss_clue+1","int_exp+3","flag+:v_clue_1"]},"fail":{"text":"纸一碰就碎。","fx":["int_exp+1"]}},{"label":"把日志放回去","text":"","fx":[]}],"pool":"opportunity","weight":7,"cond":"count.ship>=1&&age>=20&&!flag:v_clue_1","scene":"wreck","once":true},{"id":"v_clue_song","kind":"random","title":"鲸与歌声","text":"夜里，一头灰色的鲸，一路跟着你的船，唱着一首很古老的歌。\n歌里，有一个词，反复出现，你听不懂，却觉得耳熟。","options":[{"label":"把那个词记下来","check":{"attr":"wil","diff":12},"ok":{"text":"你一连记了很多遍，那个词的尾音，竟和你在船舱里读到的某段古语吻合。","fx":["count:abyss_clue+1","wil_exp+3","flag+:v_clue_2"]},"fail":{"text":"歌太远了，你只听到了一个模糊的尾音。","fx":["wil_exp+1"]}},{"label":"只听，不记","text":"你把耳朵贴在船舷上，听了很久，直到歌声消失。","fx":["wil_exp+2"]}],"pool":"opportunity","weight":7,"cond":"count.ship>=1&&age>=21&&!flag:v_clue_2","scene":"sea","once":true},{"id":"v_clue_tide","kind":"random","title":"潮汐表上的缺页","text":"港务署的旧档案里，保存着过去一千年的潮汐表。但其中，有四页被人整整齐齐地撕走了。","options":[{"label":"比对前后的数据，推算缺页的内容","check":{"attr":"int","diff":13},"ok":{"text":"你花了三天，算出了那四页的大致走势：每一次缺页的位置，都对应着一次“潮汐之门”。","fx":["count:abyss_clue+1","int_exp+4","flag+:v_clue_3"]},"fail":{"text":"数字太乱，你什么也没算出来。","fx":["int_exp+1"]}},{"label":"不碰，放回原位","text":"","fx":[]}],"pool":"opportunity","weight":7,"cond":"age>=22&&!flag:v_clue_3","scene":"harbor","once":true},{"id":"v_e_gull","kind":"random","title":"抢鱼的海鸥","text":"你刚把一条鲜鱼放在码头的木桶边，一只大海鸥，就俯冲下来，叼起鱼，扑棱棱地飞走了。\n旁边的老渔夫，笑得前仰后合。","options":[{"label":"追着它，跑过半条码头","text":"你追着海鸥，一路跑过了整个码头，最后，它把鱼，扔在了一个孩子的脚边。孩子高高兴兴地捡走了。","fx":["agi_exp+2","hometown+1"]},{"label":"请老渔夫，教你一招“驯海鸥”","check":{"attr":"cha","diff":10},"ok":{"text":"老渔夫神神秘秘地，教了你几个哨音。第二天，同一只海鸥，竟然停在了你的肩膀上。","fx":["cha_exp+3","hometown+1","luk_exp+1"]},"fail":{"text":"老渔夫摇摇头：“你这口哨，不够野。”","fx":["cha_exp+1"]}}],"pool":"opportunity","weight":8,"cond":"count.ship==0","scene":"harbor"},{"id":"v_e_tide","kind":"random","title":"退潮的滩涂","text":"退潮后，滩涂上，露出了大片的泥沙和礁石。孩子们提着篮子，在里面翻找着：贝壳、螃蟹、被冲上岸的各种小东西。","options":[{"label":"跟着孩子们一起，翻找","check":{"attr":"luk","diff":10},"ok":{"text":"你在一块礁石下，摸到了一只比拳头还大的珍珠贝。里面，有一颗不大不小的珍珠。","fx":["gold+35","luk_exp+3","hometown+1"]},"fail":{"text":"你翻了半天，只翻到了一只螃蟹，还被夹了一下。","fx":["hp-2","luk_exp+1"]}},{"label":"帮孩子们，把篮子拎回去","text":"孩子们笑得很开心，往你手里，塞了一把还带着海水的贝壳。","fx":["hometown+3","cha_exp+1"]},{"label":"不去，坐在堤上，看日落","text":"你坐了很久，看着太阳一点点沉进海里。","fx":["wil_exp+2"]}],"pool":"opportunity","weight":8,"cond":"count.ship==0","scene":"harbor"},{"id":"v_e_net","kind":"random","title":"补网的老妇人","text":"码头边，一位老妇人，正坐在小板凳上，补一张大得铺满半条街的渔网。她的手指，被粗麻绳勒出了深深的纹路。","options":[{"label":"蹲下来，帮她补","text":"老妇人教你打了一种“双股结”，说是她母亲教她的，也是她母亲的母亲教的。","fx":["agi_exp+3","hometown+2","count:sail+1"]},{"label":"请她讲讲，这片海的故事","text":"老妇人一边补网，一边讲了一个关于“灯塔守夜人”的故事，讲得你，起了一身鸡皮疙瘩。","fx":["int_exp+2","cha_exp+2"]},{"label":"给她买一壶热茶（5 金币）","text":"老妇人笑得很慈祥：“好孩子。”","fx":["gold-5","hometown+2"],"cond":"gold>=5"}],"pool":"opportunity","weight":8,"cond":"count.ship==0","scene":"harbor"},{"id":"v_e_repair","kind":"random","title":"船匠的铺子","text":"码头边的老船匠，正在一条旧船的龙骨上，钉最后一颗钉子。他抬起头，看见你，用锤子指了指角落里的一堆木头：“小子，有空吗？”","options":[{"label":"留下来，帮他一下午","text":"你一块一块地给他递木板，钉子，油灰。临走时，老船匠把一块磨得发亮的小船模型，塞给了你：“摆在床头，保佑你，别晕船。”","fx":["str_exp+2","int_exp+1","hometown+2","gold+10"]},{"label":"请他讲讲：怎么才能造出一条好船","text":"老船匠打开话匣子，从龙骨，讲到桅杆，讲到风帆。你听得，忘了时间。","fx":["int_exp+3","exp+10"]},{"label":"没空，改天再说","text":"","fx":[]}],"pool":"opportunity","weight":8,"cond":"count.ship==0","scene":"harbor"},{"id":"v_e_kids","kind":"random","title":"码头上的孩子们","text":"几个孩子，蹲在码头的缆桩边，用小木片，做了一艘艘小船，放进水里，比谁漂得最远。\n其中一个孩子，抬头看见你：“你有大船吗？”","options":[{"label":"蹲下来，帮他们修小船","text":"你给每一艘小船，加了一块小小的帆。孩子们尖叫着，看它们一起漂向远处。","fx":["hometown+3","cha_exp+2","agi_exp+1"]},{"label":"蹲下来，给他们讲你的梦想","text":"你讲到了海那边，讲到了潮汐之门。孩子们瞪大了眼睛：“我也要去！”","fx":["hometown+2","cha_exp+3"]},{"label":"笑笑，没说话","text":"孩子们没有在意，又自顾自地玩了起来。","fx":[]}],"pool":"social","weight":8,"cond":"count.ship==0&&age\u003c=20","scene":"harbor"},{"id":"v_e_ferry","kind":"random","title":"摆渡的老人","text":"潮湾港和对岸之间，有一个摆渡人，撑着一条小船，每天往来。你坐上去，付了两个铜币。\n老人一边撑船，一边哼着一支不成调的歌。","options":[{"label":"请他教你，撑船","text":"老人把长篙，塞进你手里。你一撑，船转了个圈。老人哈哈大笑：“没关系，我第一次，转了三个圈。”","fx":["agi_exp+3","str_exp+1","hometown+1"]},{"label":"问他：这些年，你见过最奇怪的事","text":"老人想了很久：“有一回，我在雾里，撑了一夜，对岸，一直撑不到。第二天，我才发现，我一直在原地打转。”","fx":["int_exp+2","count:charts+1"]},{"label":"只是安静地坐着","text":"风很凉，水面很静。你什么也没想。","fx":["wil_exp+1"]}],"pool":"opportunity","weight":7,"cond":"count.ship==0","scene":"harbor"},{"id":"v_e_cargo","kind":"random","title":"没人要的货","text":"码头上，一堆麻袋被丢在角落里，没人领。看货的小工说：“货主好几天没来了，再不领，就要拍卖了。”","options":[{"label":"帮他把货整理好，登记造册","text":"你一个下午，把每一只麻袋，都标上了编号。小工往你手里，塞了点酬劳。","fx":["gold+20","int_exp+1","hometown+1"]},{"label":"买下这批货（50 金币），转手卖掉","check":{"attr":"cha","diff":11},"ok":{"text":"你把整批货，转给了一个路过的商贩。转手，赚了一倍。","fx":["gold+50","cha_exp+3","exp+10"]},"fail":{"text":"货里面，有一半，已经受潮发霉了。","fx":["gold-30","cha_exp+1"]},"cond":"gold>=50","reason":"金币不足"},{"label":"不碰","text":"","fx":[]}],"pool":"opportunity","weight":8,"cond":"count.ship==0&&age>=17","scene":"harbor"},{"id":"v_s_ice","kind":"random","title":"冰封的港口","text":"冬天最冷的一周，港口的水面，结了一层薄冰。船，都被冻在了泊位上，缆绳，变得又硬又脆。","options":[{"label":"带着人，砸冰、保护船体","check":{"attr":"str","diff":12},"ok":{"text":"你们把整个港口，都砸出了一条水道，每一条船都得救了。邻居们给你端来了热汤。","fx":["hometown+4","str_exp+3","hp-3","rep:harbor+2"]},"fail":{"text":"冰层比想象的厚，你们砸了整整一天，只砸开了半个泊位。","fx":["hp-8","str_exp+1"]}},{"label":"躲在屋里，等冰化","text":"你烧着炉子，什么也没做。春天，冰化了，缆绳也烂了几根。","fx":["gold-15"],"cond":"count.ship>=1"},{"label":"趁没人出海，在港口里闲逛，打听消息","text":"你在酒馆、码头、船坞里，走了一圈。听到了一些有用的零碎。","fx":["count:charts+1","cha_exp+1"]}],"pool":"calamity","weight":9,"cond":"season==winter&&count.ship>=1","scene":"harbor_storm"},{"id":"v_s_springtide","kind":"random","title":"春天的大潮","text":"春天的第一场大潮，来得比往年更早。浪头一次一次地漫过码头的石阶，水位，涨得吓人。","options":[{"label":"把船挪到高处","text":"你们花了半天，把船往高处拖了三丈。浪头漫上来的时候，所有的船都没有事。","fx":["hometown+2","str_exp+2","count:sail+1"],"cond":"count.ship>=1"},{"label":"趁潮水大，驶出港去试试风向","check":{"attr":"int","diff":12},"ok":{"text":"你借着大潮，轻轻一送，出了港口，又悄悄地回来了。这一趟，你把整条海岸线的潮位，都记在了本子里。","fx":["int_exp+4","count:charts+1","count:voyages+1"]},"fail":{"text":"潮水比想象的更急，你被冲得偏离了航线。","fx":["hp-4","count:voyages+1"]},"cond":"count.ship>=1"},{"label":"站在高处，看大潮","text":"一波一波的白浪，像一群奔跑的白马。","fx":["wil_exp+2"]}],"pool":"opportunity","weight":8,"cond":"season==spring","scene":"harbor"},{"id":"v_s_doldrums","kind":"random","title":"无风带","text":"夏天的海面，忽然连一丝风都没有了。帆，软软地挂着。水手们坐在甲板上，用草帽扇风，没人说话。","options":[{"label":"耐心等风，利用这几天，修补船体","text":"水手们把甲板上上下下，都擦了一遍，缆绳，也一根根重新编过。风来的时候，船，几乎像是新的。","fx":["str_exp+2","hometown+1","count:sail+1"],"cond":"count.ship>=1"},{"label":"下令，所有人划桨，往前走","check":{"attr":"str","diff":12},"ok":{"text":"十几条桨，齐刷刷地落下。船像一只巨大的蜈蚣，在海面上，缓缓地爬行。三天后，你们终于等到了风。","fx":["str_exp+3","hp-5","cha_exp+2"]},"fail":{"text":"水手们划了一天，就累得东倒西歪。","fx":["hp-8","hometown-1"]},"cond":"count.crew>=2"},{"label":"钓鱼，打牌，睡觉","text":"你们在海上，度过了最悠闲的三天。","fx":["hp+0","heal:0.3"]}],"pool":"calamity","weight":8,"cond":"season==summer&&count.ship>=1","scene":"sea"},{"id":"v_s_fishrun","kind":"random","title":"秋天的鱼汛","text":"秋天的鱼汛来了。海面上，一整片银色的鱼群，翻滚着，像一块被风吹皱的绸缎。每一条船，都在抢收。","options":[{"label":"撒下大网，使劲拉","check":{"attr":"str","diff":11},"ok":{"text":"网拉上来的时候，整条船，都被压得向一侧倾斜。甲板上，堆满了银色的鱼。","fx":["gold+75","str_exp+3","hometown+2"]},"fail":{"text":"网太大了，被一块礁石钩住。你们花了半天，才解开，只收了一半。","fx":["gold+25","hp-4","str_exp+1"]},"cond":"count.ship>=1"},{"label":"只撒小网，把剩下的，分给港口的邻居","text":"邻居们提着篮子来，笑得合不拢嘴。","fx":["hometown+5","rep:harbor+2","cha_exp+2"],"cond":"count.ship>=1"},{"label":"在岸上，帮人晒鱼干","text":"你整整晒了一天，手上，沾满了鱼腥味。","fx":["gold+18","hometown+1"]}],"pool":"opportunity","weight":8,"cond":"season==autumn","scene":"sea"},{"id":"v_s_fog","kind":"random","title":"浓雾季","text":"这几天，整个海岸，都被浓雾封着。船不敢出港，渔民不敢下海，连灯塔，都被雾吞掉了一半。","options":[{"label":"在港口，教水手们认雾号","text":"你和老水手，一起教大家，如何用钟声，在雾里互相辨认位置。","fx":["cha_exp+2","int_exp+2","hometown+2"]},{"label":"冒雾出海，试一试自己的耳朵","check":{"attr":"wil","diff":12},"ok":{"text":"你闭着眼，听着浪声、风声、远处礁石的回响，一点点把船，摸出了雾区。","fx":["wil_exp+4","int_exp+2","count:voyages+1"]},"fail":{"text":"你在雾里，绕了整整一夜。","fx":["hp-5","status+:fatigue:1","count:voyages+1"]},"cond":"count.ship>=1"},{"label":"待在港口，等雾散","text":"","fx":[]}],"pool":"calamity","weight":8,"cond":["season==autumn","season==spring"],"scene":"reef"},{"id":"v_t_leak","kind":"random","title":"舢板进水","text":"出海第二天，你发现舱底，有一层薄薄的水。越来越多，越来越快。","options":[{"label":"用一整天，把漏洞堵上","check":{"attr":"str","diff":10},"ok":{"text":"你们把一整桶油灰，塞进了船底的缝里。水，终于慢了下来。","fx":["str_exp+2","hp-3","count:sail+1"]},"fail":{"text":"漏洞越堵越大。你们只好提前返航，船，被拖上了船台。","fx":["hp-5","flag+:ship_damaged"]}},{"label":"一边舀水，一边朝最近的港口开","text":"你们三个人，轮流舀水，舀得胳膊都酸了。靠岸的时候，船，几乎沉了一半。","fx":["hp-6","flag+:ship_damaged","wil_exp+2"]}],"pool":"calamity","weight":9,"cond":"count.ship==1&&!flag:ship_damag
