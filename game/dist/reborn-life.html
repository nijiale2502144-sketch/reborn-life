<title>轮回人生录</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #17151c; --panel: #22202a; --panel2: #2b2834; --line: #3d3949;
  --text: #ece6d8; --dim: #a39d92; --accent: #e0b050; --good: #7ec27a; --bad: #e07a6a; --info: #7aaee0;
  --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.loading { text-align: center; margin-top: 30vh; color: var(--dim); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 16px; }
.center { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
h1 { font-family: var(--serif); font-size: 32px; letter-spacing: 4px; margin: 24px 0 4px; text-align: center; }
h2 { font-family: var(--serif); font-size: 20px; margin: 0 0 8px; }
.sub { text-align: center; color: var(--dim); margin-bottom: 24px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 16px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: #5a4420; border-color: var(--accent); }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.dim { color: var(--dim); }
.tag { display: inline-block; font-size: 12px; padding: 0 7px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
.tag.good { color: var(--good); } .tag.bad { color: var(--bad); } .tag.info { color: var(--info); }

/* 游戏界面 */
.topbar { position: sticky; top: 0; z-index: 5; background: #1e1c25ee; backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.topbar .in { max-width: 1040px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.topbar b { font-family: var(--serif); font-size: 17px; }
.pips { letter-spacing: 2px; color: var(--accent); }
.pips .off { color: #5a5342; } .pips .neg { color: var(--bad); }
.bar { height: 6px; background: #3a3644; border-radius: 3px; overflow: hidden; min-width: 80px; }
.bar > i { display: block; height: 100%; background: var(--good); }
.bar.exp > i { background: var(--info); }
.layout { display: grid; grid-template-columns: 1fr 280px; gap: 16px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
.scene { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #000; }
.scene img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
.panel { margin-top: 12px; }
.narr { font-family: var(--serif); font-size: 17px; line-height: 1.85; white-space: pre-wrap; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tab { background: transparent; border: 1px solid var(--line); border-radius: 18px; padding: 3px 14px; color: var(--dim); }
.tab.on { color: var(--text); border-color: var(--accent); background: #3a2f18; }
.opt { display: flex; width: 100%; text-align: left; gap: 10px; align-items: baseline; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { opacity: .45; cursor: not-allowed; }
.opt .k { color: var(--dim); font-size: 12px; min-width: 14px; }
.opt .nm { font-weight: 600; }
.opt .ds { color: var(--dim); font-size: 13px; }
.opt .cost { margin-left: auto; color: var(--accent); white-space: nowrap; }
.opt.end { border-style: dashed; }
.evt { display: flex; gap: 14px; }
.evt .pt { width: 128px; height: 128px; flex: none; border: 2px solid var(--line); border-radius: 8px; background: #000; }
@media (max-width: 560px) { .evt { flex-direction: column; } }
.lines { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.lines li { font-size: 13px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; color: var(--dim); }
.lines li.good { color: var(--good); } .lines li.bad { color: var(--bad); } .lines li.hl { color: var(--accent); border-color: var(--accent); }
.vs { display: flex; gap: 20px; font-size: 17px; margin: 8px 0 12px; }
.aside .card { padding: 12px; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.kv .v { font-variant-numeric: tabular-nums; }
.sec { font-size: 12px; color: var(--dim); margin: 10px 0 4px; letter-spacing: 1px; }
.q { border-left: 3px solid var(--line); padding-left: 8px; margin: 6px 0; font-size: 13px; }
.q.main { border-color: var(--accent); } .q.done { opacity: .6; } .q.failed { opacity: .5; text-decoration: line-through; }
table.sc { width: 100%; border-collapse: collapse; }
table.sc td { padding: 4px 0; border-bottom: 1px solid var(--line); }
table.sc td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.big { font-size: 28px; color: var(--accent); font-family: var(--serif); }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; max-width: 640px; width: 92vw; }
dialog::backdrop { background: #000a; }
#logbody { max-height: 60vh; overflow: auto; white-space: pre-wrap; font-size: 14px; }
#logbody p { margin: 0 0 8px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.shop { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.shop .nm { font-weight: 600; } .shop .ds { color: var(--dim); font-size: 13px; }
label.radio { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
label.radio:has(input:checked) { border-color: var(--accent); background: #3a2f18; }

.bar.mp > i { background: var(--info); }
.tag.shadow { color: #8fb4c8; } .tag.tide { color: #70c8c0; }
.tag.martial { color: #e0a070; } .tag.holy { color: #f0d890; } .tag.magic { color: #b49af0; }
.sk { font-size: 14px; margin: 3px 0; }
.sk-locked summary { cursor: pointer; font-size: 12px; color: var(--dim); margin-top: 4px; }
.opt.skill.martial { border-left: 3px solid #e0a070; } .opt.skill.shadow { border-left: 3px solid #8fb4c8; } .opt.skill.tide { border-left: 3px solid #70c8c0; } .opt.skill.holy { border-left: 3px solid #f0d890; } .opt.skill.magic { border-left: 3px solid #b49af0; }

#tip { position: fixed; z-index: 50; max-width: min(320px, calc(100vw - 16px)); background: #302c3b; border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.6; white-space: pre-line; box-shadow: 0 6px 18px #0009; pointer-events: none; }
.has-tip { cursor: help; }
.has-tip:not(.btn):not(.tag):not(.kv):not(.bar) { text-decoration: underline dotted var(--line); text-underline-offset: 4px; }
.checks { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12px; color: var(--dim); }
.checks li.ok { color: var(--good); }
.tone-story { border-color: var(--accent); background: linear-gradient(180deg, #2a2432, var(--panel)); }
.tone-story h2 { font-size: 22px; letter-spacing: 2px; }
.tone-story .narr { font-size: 18px; line-height: 2; }
.tone-tip { border-style: dashed; }

.savebox { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; resize: vertical; }
.bad-text { color: var(--bad); }
label.radio.locked { opacity: .55; cursor: not-allowed; }
#savedlg { max-width: 720px; }

.locked-card { opacity: .65; }

.tag.off { opacity: .45; text-decoration: line-through; }
.sk-need { margin: 6px 0; font-size: 13px; }

:root { color-scheme: dark; }
.wrap, .center { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { top: env(safe-area-inset-top, 0px); }
.topbar .in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #1e1c25; }

</style>

tions":[{"label":"买一把铁剑（80 金币）","cond":"gold>=80&&!flag:has_iron_sword","reason":"金币不足或已拥有","fx":["gold-80","item:iron_sword","flag+:has_iron_sword"],"text":"剑身有点歪，但磨得很利。"},{"label":"买一瓶伤药（30 金币）","cond":"gold>=30","reason":"金币不足","fx":["gold-30","heal:0.6"],"text":"药汁苦得直吐舌头，伤口却很快不疼了。"},{"label":"随便看看","text":"你把摊子上的东西摸了个遍，什么也没买。"}],"only":["farmer_son"]},{"id":"ev_sickness","kind":"random","pool":"calamity","weight":9,"title":"一场风寒","text":"你一早醒来头昏脑涨，嗓子像吞了沙子。","options":[{"label":"硬扛着干活","check":{"attr":"wil","diff":10},"ok":{"text":"你咬牙撑了过去，到了晚上居然好了大半。","fx":["hp-4"]},"fail":{"text":"越撑越重，到傍晚已经站不稳了。","fx":["hp-10","status+:fatigue:2"]}},{"label":"老老实实躺下休养（1 体力）","cost":1,"fx":["hp-3"],"text":"躺了一天，母亲熬的姜汤很管用。"}]},{"id":"ev_thief","kind":"random","pool":"calamity","weight":8,"cond":"gold>=40","title":"手脚不干净的人","text":"半夜里，你听见屋外有窸窣的脚步声——有人在翻你放钱的柜子。","options":[{"label":"冲出去追（1 体力）","cost":1,"check":{"attr":"agi","diff":10},"ok":{"text":"你一个飞扑把贼按在地上，钱袋也追了回来。","fx":["str_exp+2","agi_exp+2"]},"fail":{"text":"贼翻墙跑了，你只捡回一只鞋。","fx":["gold-25"]}},{"label":"装作没听见","text":"第二天早上，柜子里少了一小把铜币。","fx":["gold-15"]}],"except":["thief"]},{"id":"ev_bad_harvest","kind":"random","pool":"calamity","weight":10,"cond":"season==summer","title":"旱风","text":"连着十几天没下雨，田里的麦子叶子发了黄。","options":[{"label":"挑水浇田（2 体力）","cost":2,"fx":["hometown-1","str_exp+3"],"text":"你来回挑了几十趟水，总算保住了大半。"},{"label":"听天由命","fx":["hometown-5"],"text":"秋天的收成眼看着要减了。"}],"only":["farmer_son"]},{"id":"ev_tax","kind":"random","pool":"calamity","weight":8,"cond":"season==winter","title":"收税官","text":"领主的收税官带着两名卫兵敲开了你家的门，要求补缴“战备税”。","options":[{"label":"老实交钱","cond":"gold>=25","reason":"金币不足","fx":["gold-25"],"text":"他点了点钱，满意地走了。"},{"label":"据理力争","check":{"attr":"cha","diff":10},"ok":{"text":"你搬出了去年的税单，收税官咳了两声，只收了一半。","fx":["gold-10","cha_exp+3"]},"fail":{"text":"他不耐烦地挥手，卫兵拿走了双倍的东西。","fx":["gold-40"]}}],"only":["farmer_son"]},{"id":"ev_neighbor","kind":"random","pool":"social","weight":10,"title":"邻居借工具","text":"隔壁的老农来借犁，说他家的断了，眼看就要误了农时。","options":[{"label":"借给他","fx":["hometown+2"],"text":"老农感激不尽，改天扛来一袋豆子。"},{"label":"借是借，但要他帮你干半天活（1 体力）","cost":1,"fx":["hometown+1","gold+8"],"text":"两家各取所需。"}],"only":["farmer_son"]},{"id":"ev_rival","kind":"random","pool":"social","weight":8,"cond":"age\u003c26","title":"村口的挑战","text":"村东头的小子带着几个跟班拦住你，说要比一比谁的力气大。","options":[{"label":"比腕力","check":{"attr":"str","diff":12},"ok":{"text":"你一把压倒了他，围观的人叫起好来。","fx":["cha_exp+3","hometown+1"]},"fail":{"text":"他赢了，还嘲笑了你一句。","fx":["hp-5"]}},{"label":"笑笑走开","fx":["wil_exp+2"],"text":"你拍拍衣角走了，背后的起哄声你一点也不在意。"}],"only":["farmer_son"]},{"id":"ev_monster_sign","kind":"random","pool":"world","weight":12,"cond":"age>=22&&age\u003c30","title":"魔物的征兆","text":"最近夜里总能听到远处的嚎叫，村口的牲口也不安分。商人说，北面又有魔物出没。","options":[{"label":"通宵守夜（2 体力）","cost":2,"fx":["exp+14","wil_exp+3","hometown+1"],"text":"你拿着武器守了一夜，天亮时远处的影子退去了。"},{"label":"关紧门窗","fx":["hometown-3"],"text":"一夜无事，但第二天有户人家的鸡少了几只。"}],"only":["farmer_son"]},{"id":"ev_refugees","kind":"random","pool":"world","weight":9,"cond":"age>=26","title":"北方来的难民","text":"一队衣衫褴褛的难民经过村子，孩子们饿得没有哭声。","options":[{"label":"分一些口粮（20 金币）","cond":"gold>=20","reason":"金币不足","fx":["gold-20","rep:church+3","hometown+1"],"text":"神父看见了，默默在胸口画了个圣印。"},{"label":"指路去最近的教堂","fx":["rep:church+1"],"text":"你只能做到这些。"}],"except":["thief","voyager"]},{"id":"ev_veteran_hint","kind":"derived","parent":"train","weight":10,"title":"路过的老兵","text":"你练到一半，路过的老兵停下脚步，摇头说：“腰沉一点，别光用手臂。”","options":[{"label":"照他说的试一遍","fx":["str_exp+4","agi_exp+2"],"text":"果然，同样的动作省力了不少。"}],"only":["farmer_son"]},{"id":"ev_deep_read","kind":"derived","parent":"study","weight":10,"title":"豁然开朗","text":"困扰了你好几天的一段注解，忽然就想通了。","options":[{"label":"赶紧把思路记下来","fx":["int_exp+6","wil_exp+2"],"text":"你一口气写满了三页。"}]},{"id":"de_trap","kind":"dungeon","weight":10,"title":"机关陷阱","text":"通道里的一块石板被你踩得微微下沉，墙里传来机括转动的声音。","options":[{"label":"向后翻滚","check":{"attr":"agi","diff":11},"ok":{"text":"几支箭擦着你的头皮钉进了对面的墙里。","fx":["agi_exp+3"]},"fail":{"text":"一支箭擦过你的肩膀。","fx":["hp-10"]}}]},{"id":"de_shrine","kind":"dungeon","weight":8,"title":"残破的祭坛","text":"石室中央立着一座布满青苔的祭坛，上面刻着早已无人祭拜的神徽。","options":[{"label":"静心祈祷","check":{"attr":"wil","diff":10},"ok":{"text":"一缕暖意从掌心涌入，伤痛淡了。","fx":["heal:0.25","status+:blessed:3"]},"fail":{"text":"什么也没发生，只觉得有些冷。","fx":["wil_exp+1"]}},{"label":"撬下祭坛上的宝石","fx":["gold+30","rep:church-1"],"text":"宝石沉甸甸的，你心里有点发虚。"}]},{"id":"de_stranger","kind":"dungeon","weight":8,"title":"受伤的冒险者","text":"墙角坐着一名腿部受伤的冒险者，见到你，勉强挤出一个笑。","options":[{"label":"给他包扎伤口","fx":["rep:guild+3","cha_exp+2"],"text":"他一再道谢，说回公会后一定替你美言。"},{"label":"问他有没有出路的线索","fx":["exp+15"],"text":"他指了一条近路，你少绕了许多弯。"}]},{"id":"v_fragment_3","kind":"chain","title":"沉船里的星盘","text":"沉船的最深处，一座已经被珊瑚裹住的舵台上，嵌着一块圆形的铜盘。\n你擦掉厚厚的海藻，露出了一幅被刻得极细的星图：每一颗星，都是一个小小的凹点。\n那是星图的第三块残片。","options":[{"label":"小心地，把它取下来","text":"铜盘很沉。你抱着它，一步一步地，走回了甲板。","fx":["exp+30","int_exp+3"]},{"label":"用纸拓一份，再取下来","check":{"attr":"int","diff":12},"ok":{"text":"你用一整夜，拓下了每一颗星的位置。后来，薇尔告诉你，这一份拓本，比铜盘本身，更有用。","fx":["int_exp+5","count:charts+2","exp+40"]},"fail":{"text":"你拓得太急，纸破了。","fx":["int_exp+1"]}}],"scene":"wreck"}],"content/common/events_dungeon.json":[{"id":"de_mushrooms","kind":"dungeon","weight":8,"title":"发光的蘑菇","text":"墙缝里长着一丛泛着幽蓝光芒的蘑菇，空气里有股甜腻的气味。","options":[{"label":"尝一小口","check":{"attr":"wil","diff":10},"ok":{"text":"一股清凉直冲脑门，精神振奋。","fx":["heal:0.2","int_exp+2"]},"fail":{"text":"你眼前一阵发黑，缓了好久才站稳。","fx":["hp-7","status+:fatigue:1"]}},{"label":"绕开走","fx":[],"text":"小心驶得万年船。"}]},{"id":"de_pit","kind":"dungeon","weight":8,"title":"断开的通道","text":"通道在你面前断开了，对面隔着一道两步宽的深坑，坑底隐约有尖刺。","options":[{"label":"助跑跳过去","check":{"attr":"agi","diff":10},"ok":{"text":"你稳稳落在对面，扬起一阵灰。","fx":["agi_exp+3"]},"fail":{"text":"脚尖没够着边，你死死抓住了岩壁，爬上来时手掌全是血。","fx":["hp-9"]}},{"label":"绕远路（体力 1）","cost":1,"fx":["exp+8"],"text":"绕了一大圈，但总算平安。"}]},{"id":"de_riddle_door","kind":"dungeon","weight":7,"title":"会说话的石门","text":"石门上刻着一张脸，开口问：“什么东西，越拿走，越多？”","options":[{"label":"“脚印。”","check":{"attr":"int","diff":10},"ok":{"text":"石门嘎吱一声打开，里面放着一只半满的钱袋。","fx":["gold+28","int_exp+3"]},"fail":{"text":"石脸冷笑了一声，你被一阵无形的力量推了出去。","fx":["hp-6"]}},{"label":"砸门","fx":["str_exp+2","hp-4"],"text":"门纹丝不动，你的肩膀却疼了好几天。"}]},{"id":"de_old_camp","kind":"dungeon","weight":8,"title":"废弃的营地","text":"一处不知谁留下的营地，篝火余温尚在，角落里放着半袋干粮和一卷毯子。","options":[{"label":"歇一会儿，吃点东西","fx":["heal:0.3"],"text":"粮食还没坏。"},{"label":"翻一翻行囊","check":{"attr":"luk","diff":10},"ok":{"text":"你在枕头下摸到几枚金币。","fx":["gold+22"]},"fail":{"text":"除了灰，什么也没有。","fx":[]}}]},{"id":"de_scratches","kind":"dungeon","weight":7,"title":"墙上的刻痕","text":"石壁上密密麻麻刻着字：“别往左”“有东西跟着我”“救命”。字迹越来越乱。","options":[{"label":"仔细辨认，吸取教训","check":{"attr":"int","diff":9},"ok":{"text":"你推断出前面的路有陷阱，提前做了准备。","fx":["int_exp+3","heal:0.1","exp+10"]},"fail":{"text":"你越看越心慌，脚步都不稳了。","fx":["wil_exp+1","hp-3"]}},{"label":"不去看，赶紧走","fx":["wil_exp+1"],"text":"你加快了脚步。"}]},{"id":"de_runes","kind":"dungeon","weight":8,"title":"符文机关","text":"石壁上嵌着一圈转动的符文环，只有排对顺序，前方的石门才会开启。","options":[{"label":"推演符文的顺序","check":{"attr":"int","diff":12},"ok":{"text":"石环咔哒咔哒归位，石门缓缓升起，里面是一小堆无人取走的金币。","fx":["gold+38","int_exp+4","count:arcana+1"]},"fail":{"text":"你拨错了一环，一股电弧击中了你的手臂。","fx":["hp-9","int_exp+2"]}},{"label":"强行砸开","fx":["str_exp+1","hp-5"],"text":"石门纹丝不动。"}]},{"id":"de_dread","kind":"dungeon","weight":8,"title":"令人窒息的压迫感","text":"前方的甬道里没有任何动静，空气却像灌了铅，每走一步都像逆着水流。你的耳边响起一阵嗡鸣。","options":[{"label":"稳住心神，一步一步向前","check":{"attr":"wil","diff":12},"ok":{"text":"你把呼吸放缓，数着自己的脚步，终于走出了那一段路。","fx":["wil_exp+4","exp+15"]},"fail":{"text":"你在半途就跪倒在地，爬起来时已经满头冷汗。","fx":["hp-8","wil_exp+1"]}}]},{"id":"de_mana_pool","kind":"dungeon","weight":6,"title":"魔力泉","text":"石室中央有一汪泛着淡淡蓝光的水池，空气里飘着细碎的光点。你感到体内的魔力在轻轻共鸣。","options":[{"label":"站在池边，引导魔力入体","check":{"attr":"wil","diff":10},"ok":{"text":"光点顺着呼吸钻进身体里，你觉得疲惫一扫而空。","fx":["mpheal:0.8","wil_exp+2"]},"fail":{"text":"魔力太杂，你只吸收了一小部分。","fx":["mpheal:0.25"]}},{"label":"装一瓶带走","fx":["mpheal:0.3","int_exp+2"],"text":"这东西，也许以后用得上。"}]}],"content/config.json":{"maxTurns":80,"baseStamina":5,"staminaPerStr":12,"overdraft":2,"randomEventChance":0.9,"derivedChance":0.08,"baseHp":25,"hpPerStr":2.5,"hpPerLevel":5,"regen":0.2,"expBase":40,"expPerLevel":20,"attrExpBase":8,"attrExpPer":1.5,"freePointsPerLevel":2,"labels":{"attr":{"str":"体魄","agi":"敏捷","int":"智力","wil":"意志","cha":"魅力","luk":"幸运"},"rep":{"church":"教会声望","guild":"公会声望","kingdom":"王国声望","tower":"高塔声望"},"hometown":"故乡值","status":{"fatigue":"疲劳","injured":"重伤","blessed":"祝福"},"node":{"fight":"战斗","chest":"宝箱","event":"事件","rest":"休息点","boss":"Boss"},"route":{"martial":"武技","holy":"圣光","magic":"魔法","shadow":"暗影","tide":"潮汐"},"tag":{"beast":"野兽","undead":"亡灵","demon":"魔族","human":"人类"},"statusDesc":{"fatigue":"疲劳：所有检定的成功率 -10%。透支体力或没睡好会得到它，休息可以消除。","injured":"重伤：无法进行冒险类行动（打猎、地下城、寻找月华草等）。","blessed":"祝福：战力 +3。"}},"mpRegen":0.25,"help":{"stamina":"体力：每个行动都要消耗体力，没用完的不会留到下一回合。上限 = 基础 5 + 体魄每 12 点 +1 + 其他加成。最多可以透支 2 点，下回合会扣掉相应体力并获得「疲劳」。","hp":"生命：归零时要做濒死判定（意志和幸运各一次，难度 11，全部失败就死亡）。上限 = 25 + 体魄×2.5 + 等级×5。每回合自然恢复 20%。","mp":"魔力：释放技能要消耗。上限 = 意志×2 + 智力。每回合自然恢复 25%，休息和地下城休息点可以大量恢复。","power":"战力 = 等级×4 + 体魄、智力、意志里最高的一项×1.5 + 另外两项各×0.5 + 装备 + 其他加成。装备分栏：武器、护甲、盾牌各取最强的一件，饰品取最强的两件。战斗胜率 = 50% + 战力差×2% + 幸运加成 + 战术和技能的修正。","exp":"经验：打怪、做任务、行动都会获得，升级所需 = 40 + 20×当前等级。每次升级获得 2 点可以自由分配的属性点。","gold":"金币：在集市买装备、药水、书籍，雇短工多出一点体力，也能捐赠换声望。每回合要交生活费，交不起故乡值会下降。","hometown":"故乡值：麦穗村的状况。≥ 60 时每回合体力上限 +1，年底还有额外收入；≤ 20 时体力上限 -1。春耕和秋收不做会明显下降，魔王苏醒后低故乡值会让村子遭殃。","rank":"等阶：见习 → 修士 → 圣骑士。通过主线章节晋升，影响一部分行动和技能的解锁，也计入转生点。","rep":"声望：各势力对你的评价，影响能否得到推荐、加入组织和学习技能。","rel":"好感：重要人物对你的好感（满 10）。达到一定数值会触发他们的故事和礼物。","attr":{"str":"体魄：每 12 点 +1 体力上限，每点 +2.5 生命，也是战力的来源之一（体魄、智力、意志里最高的一项算 ×1.5，另外两项各 ×0.5）。","agi":"敏捷：打猎、潜行、撤退和躲避陷阱的检定；战斗落败时减伤（每高于 8 点减 1.2%，最多减 40%）。","int":"智力：读书和研读奥术的效率，知识类检定；魔法技能的威力随智力成长；魔力上限 +1/点。","wil":"意志：对抗恐惧、诱惑和濒死判定；魔力上限 +2/点；也是战力的来源之一。","cha":"魅力：社交、说服类检定；集市的内间只对有魅力的人开放，魅力越高，能买到的装备越好（10 / 14 / 18 三档）。","luk":"幸运：每高于 10 点，所有成功判定（检定、战斗胜率、濒死判定）+0.5%；也让随机事件偏向好事。"},"fate":"命运阶位：在上一阶位通关后解锁下一阶。每提高一阶，叠加一条更苛刻的规则，同时转生点收益 +20%。","relic":"遗物：开局携带的传承物，由成就解锁，不能用转生点购买。每世只能带一件。","memory":"记忆碎片：失败的支线、发现的真相会在一世结束时留下碎片，永久保留。带着碎片转生，会出现新的选项、提示或隐藏剧情，效果自动生效。"},"tips":{"overdraft":{"title":"体力快用完了","text":"每个行动都要花体力，没用完的不会留到下一回合。\n你还可以透支：体力最多降到 -2，也就是多做两点事。代价是下回合的体力会被扣掉这部分，并且获得「疲劳」状态，所有检定成功率 -10%，持续 2 回合。\n什么时候值得透支？比如错过就没有的限时任务。"},"dungeon":{"title":"地下城怎么玩","text":"进入地下城要一次付出这趟探索的全部体力。之后每一层给你两个路口：战斗、宝箱、事件或休息点，类型看得见，内容看不见。\n生命和魔力在这一趟里不会自动回满，所以休息点很宝贵。打不动了可以随时「撤离」，带着已有的收获离开。\n最后一层是 Boss，打赢了才算通关，还有额外奖励；打输了会被打出来，通关奖励就拿不到了，但之前一路上得到的金币和经验还在。\n短时间内反复刷同一个地下城，收益会递减。"},"combat":{"title":"战斗怎么算","text":"每场战斗只做一次选择。胜率 = 50% + 战力差×2%，再加上你选的战术：\n强攻 +10% 胜率，但落败受伤更重；稳守 -5%，落败受伤减半；撤退看敏捷。\n学会的技能也在这里。技能要消耗魔力，用过之后有冷却，会在接下来的几场战斗里暂时用不了。有的技能对亡灵、魔族额外有效，界面上会写出来。"},"alloc":{"title":"自由属性点","text":"每次升级你会得到 2 点自由属性点，可以自己决定加在哪一项上。\n体魄决定体力和生命，意志和智力决定魔力，敏捷和魅力影响许多事件的检定。想走哪条路线，现在就开始想。\n把鼠标移到（手机上点一下）左侧的属性名，可以看到每一项的作用。"}},"fateRules":["灾厄类随机事件出现的权重 +20%，支线任务的期限提前 1 年，敌人战力 +0.6%。","敌人战力共 +1.2%，落败时受到的伤害 +3%。","终局提前 1 年到来（魔王苏醒、复议日）。","敌人战力共 +1.8%，落败时受到的伤害共 +8%。","敌人战力共 +2.4%，主线任务的期限提前 1 年，濒死判定的难度 +2。"],"luckBonus":0.005,"lossDamage":0.55,"bossLossMult":1.25,"nearDeathDiff":11,"rpScale":0.7,"magicScale":0.025,"endingBonus":{"fail":15,"normal":30,"true":60,"hidden":80}},"content/dungeons.json":[{"id":"cave","name":"后山洞穴","scene":"cave_entrance","layers":4,"power":48,"step":3,"bossBonus":8,"boss":"哥布林头目","enemies":["哥布林","洞穴蝙蝠","史莱姆"],"exp":[16,24],"bossExp":55,"gold":[4,8],"bossGold":20,"chest":[9,20],"loot":["leather_armor","round_shield","silver_ring"],"onClear":["rep:guild+10","exp+30","log:公会的新人试炼完成了。"],"tag":"beast"},{"id":"mine","name":"废弃矿坑","scene":"cave_entrance","layers":5,"power":92,"step":4,"bossBonus":10,"boss":"岩甲巨蝎","enemies":["矿坑蜘蛛","石像鬼","掘地鼠人"],"exp":[36,50],"bossExp":110,"gold":[8,16],"bossGold":45,"chest":[20,40],"loot":["miner_pick","chain_mail","steel_sword"],"onClear":["rep:guild+10"],"tag":"beast"},{"id":"grave","name":"亡灵墓地","scene":"cave_entrance","layers":6,"power":129,"step":5,"bossBonus":12,"boss":"枯骨骑士","enemies": ly_city"]},{"id":"clear_glen_name","name":"为格伦翻案","cost":3,"group":"quest","cond":"quest.glen_regret==active&&qstage.glen_regret==1&&!flag:glen_fail2","hint":"格伦的遗憾","desc":"到教会档案处争取一次重审。你最多有两次机会。","check":{"attr":"cha","diff":13},"ok":{"text":"你把格伦告诉你的细节一条条列出来，档案官沉默了很久，终于点了头。","fx":["flag+:glen_cleared","rep:church+8"]},"fail":{"text":"档案官不耐烦地把你轰了出去。你得想办法多练练口才。","fx":["rep:church-2","cha_exp+2",{"if":"flag:glen_fail1","then":["flag+:glen_fail2"],"else":["flag+:glen_fail1"]}]}},{"id":"march_demon","name":"讨伐魔王","cost":4,"group":"quest","cond":["flag:demon_awake&&flag:paladin&&!flag:demon_slain&&!flag:stay_home&&!flag:main_failed","flag:demon_awake&&flag:adventurer_star&&!flag:demon_slain&&!flag:stay_home"],"hint":"终战","desc":"没有退路了。","fx":["goto:ev_final_march"]},{"id":"go_market","name":"去集市逛逛","cost":1,"group":"daily","cond":"age>=17","hint":"买装备、药水、书籍","desc":"镇上的集市，三教九流都有。","fx":["goto:ev_market"]},{"id":"go_tavern","name":"去酒馆坐坐","cost":1,"group":"social","cond":"age>=18","hint":"回血回魔、打听消息","desc":"一杯热酒，一桌闲话。","fx":["goto:ev_tavern"]},{"id":"escort_caravan","name":"护送商队","cost":3,"group":"quest","tag":"adventure","scene":"mountain","cond":"quest.lorn_caravan==active&&qstage.lorn_caravan==0","hint":"洛恩的商队","desc":"押一趟货往返王都，路上不太平。","check":{"attr":"agi","diff":10},"ok":{"text":"一路有惊无险。洛恩数着钱，笑得眯起了眼睛：“你办事，我放心。”","fx":["gold+45","rel:lorn+1","count:escort+1","exp+15"]},"fail":{"text":"路上遇到岔路和一小队盗匪，货丢了一半。洛恩没有责怪你，只是叹了口气。","fx":["hp-8","exp+6"]}},{"id":"look_after_orphan","name":"照看孩子","cost":1,"group":"social","cond":"flag:took_orphan&&!flag:orphan_home","hint":"草垛里的孩子","desc":"他还不太说话，总是躲在你身后。","fx":["count:orphan+1","hometown+1","wil_exp+1","cha_exp+1"],"texts":["你教他认了几个字，他在地上用树枝画了一朵麦穗。","他第一次主动牵起了你的手。","他夜里做噩梦，你坐在床边，直到他睡着。"]},{"id":"explore_ruins","name":"探索遗迹","cost":3,"group":"quest","tag":"adventure","scene":"mountain","cond":"quest.ruins_secret==active&&!flag:ruins_open&&!flag:ruins_try3","hint":"石门后的遗迹","desc":"石室里的符文，需要智力检定。你最多有三次机会。","check":{"attr":"int","di "name":"潜入王都圣库","cost":3,"group":"quest","tag":"adventure","scene":"mountain","cond":"quest.church_shadow==active&&qstage.church_shadow==1&&flag:order_member&&!flag:vault_try3","hint":"教会的阴影","desc":"圣库第三层，只有持钥匙的人进得去。需要智力检定，最多三次机会，失败会被执事记住。","check":{"attr":"int","diff":13,"memDiff":{"id":"m_truth","diff":-3}},"ok":{"text":"钥匙转动的声音很轻。你在最深处的石架上，找到了那本没有标题的册子。","fx":["goto:ev_shadow_vault"]},"fail":{"text":"巡夜的执事提着灯从走廊尽头走来，你不得不退了出去。他看了你一眼，什么也没说，却把你的脸记住了。","fx":["rep:church-2","int_exp+2",{"if":"flag:vault_try2","then":["flag+:vault_try3"],"else":[{"if":"flag:vault_try1","then":["flag+:vault_try2"],"else":["flag+:vault_try1"]}]}]}}],"content/farmer_son/events.json":[{"id":"ev_coming_of_age","kind":"special","when":{"age":16,"season":"spring"},"priority":100,"title":"成年礼","portrait":"efna","scene":"village_spring","text":"十六岁的春天，成年礼的钟声刚响过，村子北边的天空就红了——魔潮的前哨烧毁了半片麦田。人们在田埂上哭喊，只有你攥着镰刀，一动不动地站着。\n艾芙娜拉着你的衣角，小声问：“你……在想什么？”","options":[{"label":"“我要变强，保护这个家。”","fx":["str_exp+5","hometown+3"],"text":"你的声音很轻，却没有一丝犹豫。"},{"label":"“我要成为教会的圣骑士。”","fx":["wil_exp+5","rep:church+3"],"text":"艾芙娜愣了一下，然后笑了：“那你一定要做到。”"},{"label":"“我想去外面看看。”","fx":["agi_exp+5","cha_exp+3"],"text":"你望着北边的天空，那里有从没见过的东西。"}]},{"id":"ev_meet_glen","kind":"special","when":{"age":17,"season":"summer"},"priority":50,"title":"村口的老兵","portrait":"glen","scene":"village_spring","text":"夏天，村口来了个拄着拐杖的灰胡子老兵，在榆树下搭了个窝棚住下。有人说他年轻时是教会的圣骑士，后来不知犯了什么事被赶了出来。","options":[{"label":"上前搭话，递上一壶水","fx":["flag+:met_glen","rel:glen+2"],"text":"他瞥了你一眼：“小子，手上有茧，不错。”"},{"label":"远远看着，没有上前","fx":["flag+:met_glen","rel:glen+1"],"text":"他似乎察觉到了你的目光，微微点了点头。"}]},{"id":"ev_efna_start","kind":"special","when":{"age":19,"season":"autumn"},"priority":60,"title":"艾芙娜的心事","portrait":"efna","scene":"village_autumn","text":"秋天的黄昏，艾芙娜坐在田埂上，手里握着一只枯萎的草环。\n“我想去一次圣城。”她说，“听说那里的钟声，能让人忘记所有难过。”\n她没有说下去，只是看着你。","options":[{"label":"“我会帮你，不管要多久。”","fx":["quest:start:efna_wish","rel:efna+1","flag+:efna_promise"],"text":"她咬住嘴唇，用力点了点头。"},{"label":"“我自己的事还没着落……”","fx":["rel:efna-1","flag+:efna_declined"],"text":"她笑了笑：“嗯，我知道。”笑得有一点勉强。"}]},{"id":"ev_efna_illness","kind":"chain","title":"她的秘密","portrait":"efna","scene":"village_autumn","text":"艾芙娜终于对你说出了实话：她得了“魔力枯竭症”，药师说，撑不过几年了。\n“只有圣城的神殿，或者传说中的月华草，才有办法。”她小声说，“我不是想要你为我做什么……我只是，不想一个人去。”","options":[{"label":"“我一定会找到月华草。”","fx":["rel:efna+1"],"text":"你握紧了拳头。接下来的日子，每一天都要算数。"}]},{"id":"ev_holy_city","kind":"chain","title":"圣城的钟声","portrait":"efna","scene":"village_spring","text":"圣城的钟声一下一下，沉沉地敲在胸口。艾芙娜站在神殿的台阶前，把月华草紧紧抱在怀里。\n神殿的祭司看了她一眼，摇了摇头：“药引已经有了，但治疗需要供奉……或者，一个愿意担保她的人。”","options":[{"label":"拿出积蓄供奉神殿（100 金币）","cond":"gold>=100","reason":"金币不足 100","fx":["gold-100","flag+:efna_cured","flag+:efna_resolved","rel:efna+2","rep:church+5"],"text":"月华草在圣火里化作一缕青烟。艾芙娜的脸上，慢慢有了血色。"},{"label":"以你的名义担保，请教会收她为见习神官","cond":"rep.church>=30&&attr.wil>=14","reason":"需要教会声望 30、意志 14","fx":["flag+:efna_priest","flag+:efna_resolved","rep:church+3","rel:efna+1"],"text":"祭司看着你坚定的眼神，终于答应了。艾芙娜成了神殿里最年轻的见习神官。"},{"label":"什么也做不了，只是陪她看完圣城的星空","fx":["flag+:efna_resolved","flag+:efna_lost","rel:efna+1"],"text":"她靠在你肩上，说这是她一生里最亮的一晚。你们都没有再提治病的事。"}]},{"id":"ev_glen_past","kind":"chain","title":"格伦的往事","portrait":"glen","scene":"village_autumn","text":"炉火边，格伦第一次说起了他被逐出教会的缘由：多年前的一场败仗，他被推出来顶了罪。\n“我不求翻案。”他灌了一口酒，“只是想让死去的兄弟们，名字不被写成逃兵。”","options":[{"label":"“我去教会档案处试试。”","fx":["rel:glen+1"],"text":"格伦没有说话，只是用力拍了拍你的肩。"}]},{"id":"ev_village_raid","kind":"special","when":{"age":21,"season":"winter"},"priority":90,"title":"兽人袭村","scene":"village_winter","enter":["quest:start:village_defense"],"text":"深冬的夜里，村里的钟声乱成一片——一队兽人劫掠者越过了北面的山口，火把已经逼近村口的篱笆。","options":[{"label":"拿起武器，迎战","fx":[{"type":"combat","enemy":"orc_raid","noFlee":true,"win":["hometown+8","flag+:village_saved","rep:church+2","exp+50"],"lose":["hometown-15","flag+:village_hurt"]}],"text":"你抓起武器，冲进了雪地。"},{"label":"护送家人撤离（1 体力）","cost":1,"fx":["hometown-6","agi_exp+4"],"text":"你带着家人躲进了山洞，天亮时，村口的篱笆只剩了几根黑木桩。"}]},{"id":"ev_envoy","kind":"special","priority":80,"title":"巡游使者","portrait":"priest","scene":"village_spring","cond":["level>=3&&attr.str>=15&&!flag:recommend_letter&&!flag:main_failed","level>=3&&attr.wil>=15&&!flag:recommend_letter&&!flag:main_failed"],"text":"一位身披白袍的教会使者路过麦穗村。他看着你在田里干活，忽然停下脚步：“年轻人，你身上有股稳劲儿。”\n他从袖中取出一封印着圣徽的信。“如果你有志于侍奉圣光，带着它去王都的见习骑士团。”","options":[{"label":"双手接过推荐信","fx":["flag+:recommend_letter","rep:church+5","exp+30"],"text":"信纸很轻，却像一块烙铁一样烫手。"}]},{"id":"ev_join_order","kind":"special","priority":80,"title":"王都见习","portrait":"priest","scene":"village_spring","cond":["level>=6&&rep.church>=20&&flag:recommend_letter&&!flag:order_member&&!flag:main_failed","level>=6&&rep.church>=20&&rep.guild>=20&&!flag:order_member&&!flag:main_failed"],"text":"王都的教会骑士团大门高耸，石阶上站着一排披着银甲的骑士。教官打量着你：“能走进这扇门的人，要么有信，要么有名。你是哪一种？”","options":[{"label":"宣誓加入见习骑士团","fx":["flag+:order_member","rank:2","rep:church+5","rep:kingdom+5","exp+60"],"text":"你右手按胸，念出誓词。从今天起，你不再只是村里的农夫之子。"}]},{"id":"ev_holy_trial","kind":"special","once":false,"cooldown":3,"priority":80,"title":"圣剑试炼","portrait":"priest","scene":"village_spring","cond":"level>=15&&rep.church>=60&&flag:order_member&&!flag:paladin&&!flag:main_failed","text":"教会的钟敲了十二下。大圣堂里，神官举起了一把古老的圣剑：“通过圣剑的试炼，你才配得上‘圣骑士’的名号。”\n圣剑会拷问你的内心。","options":[{"label":"接受试炼","check":{"attr":"wil","diff":14},"ok":{"text":"圣剑里传来无数低语，你一个字一个字地回应。光芒落在你肩头时，神官低下了头。","fx":["flag+:paladin","rank:3","rep:church+10","exp+120"]},"fail":{"text":"低语压得你喘不过气，你在最后一刻放弃了。神官说：“再准备一阵吧。”","fx":["hp-12","wil_exp+4"]}},{"label":"再准备一阵","text":"神官点了点头：“圣剑不会跑。” "}]},{"id":"ev_demon_awakens","kind":"special","when":{"age":30,"season":"autumn"},"priority":200,"title":"魔王苏醒","scene":"mountain","enter":["flag+:demon_awake"],"text":"三十岁的秋天，大地在夜里震了一下。北边的天空像被撕开一道口子，血红色的光一直映到你的窗台。\n所有人都知道，那个等了百年的名字，醒了。","options":[{"label":"整理行装，前往魔王城（须在 4 回合内）","cond":"flag:paladin&&!flag:main_failed","reason":"需要圣骑士身份（主线未失败）","fx":["log:你把剑磨亮，装好行囊。"],"text":"你站在村口，回头看了一眼麦田。"},{"label":"留在故乡，守护家人","fx":["flag+:stay_home",{"if":"hometown>=80","then":["end:auto"],"else":["flag+:overrun","end:auto"]}],"text":"你放下了剑，转身走回屋里。"}],"finale":true},{"id":"ev_final_march","kind":"chain","title":"魔王城","scene":"mountain","text":"魔王城的黑色城门在你身后合拢。长长的走廊两侧，无数双红色的眼睛静静地看着你。\n尽头，魔王的近卫提着巨斧，挡住了去路。","options":[{"label":"踏入大殿","fx":[{"type":"combat","enemy":"demon_guard","noFlee":true,"win":["flag+:demon_wounded","log:近卫倒下，大殿的门缓缓打开。","goto:ev_final_hall"],"lose":["flag+:final_lost","end:auto"]}],"text":"你握紧了剑。"}]},{"id":"ev_wolves","kind":"random","pool":"calamity","weight":8,"cond":"season==winter","title":"雪夜狼嚎","scene":"village_winter","text":"雪夜里，一群饿狼摸到了村边的羊圈，绿幽幽的眼睛在黑暗里闪烁。","options":[{"label":"迎上去驱赶","fx":[{"type":"combat","enemy":"wolves","win":["hometown+2"],"lose":["hometown-2"],"flee":["hometown-3"]}],"text":"你抄起火把冲了出去。"},{"label":"任由它们叼走几只羊","fx":["hometown-3"],"text":"天亮时，羊圈里空了一半。"}]},{"id":"ev_orchard","kind":"random","pool":"opportunity","weight":8,"cond":"season==summer","title":"野果林","scene":"mountain","text":"你在山脚下发现一片野果林，枝头挂满了红透的果子，鸟儿正啄得欢。","options":[{"label":"摘一筐拿去集市卖（1 体力）","cost":1,"fx":["gold+18","agi_exp+2"],"text":"小贩一口气全收了。"},{"label":"带些回家给艾芙娜","cond":"!flag:efna_resolved&&!flag:efna_lost","reason":"艾芙娜不在村里","fx":["rel:efna+1"],"text":"她吃了一口，说是她这辈子吃过最甜的。"}]},{"id":"ev_mountain_trap","kind":"derived","parent":"hunt","weight":10,"title":"山中的陷阱","scene":"mountain","text":"你发现一个猛兽夹的陷阱里夹着一名受伤的旅人，他脸色惨白，嘴唇发抖。","options":[{"label":"救人（1 体力）","cost":1,"check":{"attr":"agi","diff":10},"ok":{"text":"你小心撬开夹子，把他背回村里。他醒来后塞给你一枚旧护符：“好人会有好报。”","fx":["flag+:saved_traveler","status+:blessed:3","cha_exp+3","exp+15"]},"fail":{"text":"夹子猛地弹回，划伤了你的手。旅人总算被救出来了，但你也流了不少血。","fx":["hp-8","exp+8"]}},{"label":"搜刮财物离开","fx":["gold+30","rep:church-1"],"text":"钱袋沉甸甸的，你却一路没回头。"},{"label":"假装没看见","text":"你默默绕开了。夜里想起那双眼睛，睡得不太踏实。"}]},{"id":"ev_goblin_scout","kind":"derived","parent":"patrol","weight":10,"title":"哥布林斥候","scene":"village_spring","text":"巡逻时，你在篱笆外发现一只正在探头探脑的哥布林斥候。","options":[{"label":"冲上去","fx":[{"type":"combat","enemy":"goblin","win":["hometown+2"],"lose":["hometown-1"],"flee":[]}],"text":"你猛地翻过篱笆。"},{"label":"放它走，回头报告神父","fx":["rep:church+1"],"text":"哥布林尖叫着钻回了林子。"}]},{"id":"ev_priest_vision","kind":"derived","parent":"church_help","weight":10,"title":"神父的教诲","portrait":"priest","scene":"village_spring","text":"擦完圣像，神父叫住你，给你讲了一个关于“守护”的故事：真正的守护，不是冲在最前面，而是站在最后面。","options":[{"label":"认真听完","fx":["wil_exp+4","rep:church+1"],"text":"你若有所思地走出了教堂。"}]},{"id":"ev_final_hall","kind":"chain","title":"空旷的大殿","scene":"mountain","text":"大殿比你想象中安静。没有咆哮，没有魔物，只有一排排熄灭的烛台，和尽头的王座。\n王座上的魔王缓缓抬起头。它的铠甲下，隐约露出一枚褪了色的圣徽。","options":[{"label":"拔剑迎战","fx":[{"type":"combat","enemy":"demon_king","noFlee":true,"win":["flag+:demon_slain","end:auto"],"lose":["flag+:final_lost","end:auto"]}],"text":"你握紧了剑。"},{"label":"“我知道你是谁。”（教会的阴影）","cond":"flag:shadow_known","reason":"你还不知道这里的真相","fx":["goto:ev_final_truth"],"text":"魔王的动作停住了。"},{"label":"【前世记忆】在门边调整呼吸","cond":"memory:m_final&&!flag:final_rested","reason":"前世记忆：魔王并不急着动手","fx":["heal:1","mpheal:1","flag+:final_rested","goto:ev_final_hall"],"text":"你想起上一世倒下前的那一刻，魔王其实等了你很久。这一次，你先把呼吸理顺。"}]},{"id":"ev_final_truth","kind":"chain","title":"锁与钥匙","scene":"mountain","text":"魔王沉默了很久。\n“……百年了。”它的声音沙哑，像是很久没有对人说话，“终于有人，不是来杀我的。”\n它抬起一只手，王座旁的石阶上，放着一枚黑色的王冠，也放着一座空着的剑座。\n“我撑不住了。要么，把锁重新扣上；要么，换你来坐这里。”","options":[{"label":"“把封印交给我，我会重铸它。”","check":{"attr":"wil","diff":16},"ok":{"text":"你把圣剑插回剑座，光顺着石缝一层层亮起来。你感到什么东西从心里被抽走了一点，很轻，很凉。\n魔王靠回王座，像是终于可以睡了。","fx":["flag+:resealed","end:auto"]},"fail":{"text":"封印的力量顺着剑身反噬回来，你被掀翻在石阶上。\n魔王低声说：“……抱歉。”它站了起来。","fx":["hp-10",{"type":"combat","enemy":"demon_king","noFlee":true,"win":["flag+:demon_slain","end:auto"],"lose":["flag+:final_lost","end:auto"]}]}},{"label":"“王冠……我接过来。”","cond":"memories>=5","reason":"前世的记忆还不够多（需要 5 枚记忆碎片）","fx":["flag+:throne","end:auto"],"text":"你伸出手，王冠比你想象中轻。"},{"label":"“不管怎样，我必须杀了你。”","fx":[{"type":"combat","enemy":"demon_king","noFlee":true,"win":["flag+:demon_slain","end:auto"],"lose":["flag+:final_lost","end:auto"]}],"text":"魔王点了点头，像是早就知道你会这么说。"}]}],"content/farmer_son/events_derived.json":[{"id":"dv_train_strain","kind":"derived","parent":"train","weight":8,"title":"拉伤","text":"你练得太猛，腰侧忽然传来一阵撕裂般的疼。","options":[{"label":"咬牙继续","check":{"attr":"wil","diff":10},"ok":{"text":"你硬是撑过去了，疼痛反而让你更清醒。","fx":["wil_exp+3","str_exp+2"]},"fail":{"text":"你一下子软倒在地，缓了好一阵。","fx":["hp-7","str_exp+1"]}},{"label":"立刻停下，揉开淤血","fx":["heal:0.1"],"text":"稳妥的选择。"}]},{"id":"dv_train_rex","kind":"derived","parent":"train","weight":8,"cond":"age\u003c24","title":"雷克斯来蹭练","text":"雷克斯不知什么时候靠在篱笆上，一边啃着苹果一边看你练：“你这姿势不对。”","options":[{"label":"“那你来示范一下。”","fx":["rel:rex+1","agi_exp+3","str_exp+2"],"text":"他放下苹果，两人你来我往地比划了半天。"},{"label":"不理他","fx":["wil_exp+2"],"text":"他嘟囔着自己走了。"}]},{"id":"dv_train_dawn","kind":"derived","parent":"train","weight":10,"title":"日出","text":"天边泛出鱼肚白，整片麦田被染成了金色。你停下喘气，一时看呆了。","options":[{"label":"站着看完","fx":["wil_exp+3"],"text":"这一刻你什么都没想，却觉得有力气。"}]},{"id":"dv_train_mina","kind":"derived","parent":"train","weight":9,"title":"妹妹来看","text":"米娜趴在院墙上，用树枝学着你的样子乱挥。“哥，你教我嘛！”","options":[{"label":"教她站桩（1 体力）","cost":1,"fx":["rel:mina+1","str_exp+1","hometown+1"],"text":"她歪歪扭扭站了半刻钟，就趴下喊累。"},{"label":"“去去去，别捣乱。”","fx":["rel:mina-1"],"text":"她噘着嘴跑了。"}]},{"id":"dv_study_ink","kind":"derived","parent":"study","weight":8,"title":"打翻的墨水","text":"你正抄到关键处，一抖手，墨水泼了半页。","options":[{"label":"重新抄一遍（1 体力）","cost":1,"fx":["int_exp+4","wil_exp+1"],"text":"这一次你抄得格外认真。"},{"label":"拿袖子擦掉，继续","fx":["int_exp+1"],"text":"这一页算是废了。"}]},{"id":"dv_study_priest","kind":"derived","parent":"study","weight":9,"cond":"rep.church>=5","portrait":"priest","title":"神父借书","text":"神父路过你家门口，看见你在读书，从袖里掏出一本旧册子：“这本讲圣光的，借你看看。”","options":[{"label":"双手接过","fx":["int_exp+4","wil_exp+2","rep:church+1","rel:ambrose+1"],"text":"册子里夹着神父的笔记，字迹工整。"},{"label":"婉拒，说自己还没看完手上这本","fx":["int_exp+1"],"text":"神父笑笑：“不急。”"}]},{"id":"dv_study_star","kind":"derived","parent":"study","weight":8,"cond":"attr.int>=10","title":"夜里的星图","text":"书上画着一张星图，你抬头对照，发现窗外的星位和书上完全对不上。","options":[{"label":"推演一下，到底哪里错了（1 体力）","cost":1,"check":{"attr":"int","diff":11},"ok":{"text":"你发现是书上的年份写错了，推算后，星位完全吻合。","fx":["int_exp+6","exp+10"]},"fail":{"text":"算了一整晚，一团乱麻。","fx":["int_exp+2"]}}]},{"id":"dv_study_efna","kind":"derived","parent":"study","weight":9,"cond":"!flag:efna_resolved&&!flag:efna_lost","portrait":"efna","title":"艾芙娜来陪读","text":"艾芙娜抱着一只小凳坐到你旁边，翻开了另一本书：“我也看书，不打扰你。”","options":[{"label":"一起读","fx":["rel:efna+1","int_exp+3"],"text":"屋里只有翻页的声音，很安静。"},{"label":"趁机给她讲一个看到的有趣段落","fx":["rel:efna+1","cha_exp+2","int_exp+1"],"text":"她被逗笑了，咳嗽了两声，摆摆手说没事。"}]},{"id":"dv_rest_dream","kind":"derived","parent":"rest","weight":9,"cond":"age>=22","title":"一个梦","text":"你睡着了，梦见一座黑色的城，城门上写着你认不得的字。醒来时，窗外的鸡刚叫。","options":[{"label":"记下梦里的细节","fx":["int_exp+3","wil_exp+1"],"text":"你在纸上画了半天，却始终拼不出那几个字。"},{"label":"不去想它","fx":["wil_exp+1"],"text":"总归是梦。"}]},{"id":"dv_rest_mother","kind":"derived","parent":"rest","weight":10,"title":"母亲的汤","text":"你刚闭上眼，母亲端着一碗热汤推门进来：“喝了再睡。”","options":[{"label":"一口气喝完","fx":["heal:0.2","hometown+1"],"text":"汤里放了姜，从喉咙一路暖到肚子。"}]},{"id":"dv_social_gossip","kind":"derived","parent":"socialize","weight":10,"title":"新鲜的闲话","text":"酒馆里，有人压低声音说：“听说北边的矿坑又塌了，公会正在找人。”","options":[{"label":"追问细节","fx":["int_exp+2","exp+8"],"text":"你把听到的消息一条条记在心里。"},{"label":"一笑置之","fx":["cha_exp+1"],"text":"闲话听听就算了。"}]},{"id":"dv_social_lorn","kind":"derived","parent":"socialize","weight":8,"cond":"rel.lorn>=1","title":"洛恩的小道消息","text":"洛恩在酒馆里朝你招手：“来来来，我这儿有桩好买卖，只告诉你一个人。”","options":[{"label":"听他讲（1 体力）","cost":1,"fx":["cha_exp+2","rel:lorn+1","gold+10"],"text":"他的“好买卖”只赚了几个铜板，但也不亏。"},{"label":"笑着说改天","fx":["cha_exp+1"],"text":"他拍拍你肩膀，去找别人了。"}]},{"id":"dv_social_drink","kind":"derived","parent":"socialize","weight":9,"cond":"age>=18","title":"斗酒","text":"有人拍着桌子喊：“谁敢和我比谁先喝倒？”满桌的目光都落在你身上。","options":[{"label":"接下这一局","check":{"attr":"str","diff":11},"ok":{"text":"你一口气喝完三碗，对手趴桌子上了。全场喝彩。","fx":["cha_exp+4","gold+8"]},"fail":{"text":"你喝到第二碗就眼前发花，被人抬回了家。","fx":["status+:fatigue:2","cha_exp+1"]}},{"label":"借口还有活干，溜了","fx":["wil_exp+1"],"text":"身后传来一阵嘘声。"}]},{"id":"dv_social_matchmaker","kind":"derived","parent":"socialize","weight":6,"cond":"age>=20","title":"媒婆上门","text":"村里的媒婆拉着你的手，不容分说：“西村有个姑娘，勤快、手巧，我看和你般配！”","options":[{"label":"礼貌推辞","check":{"attr":"cha","diff":9},"ok":{"text":"你三言两语把她哄走了，还落了一包糖。","fx":["cha_exp+3"]},"fail":{"text":"媒婆缠了你一个下午，你脸都笑僵了。","fx":["cha_exp+1","status+:fatigue:1"]}},{"label":"装作没听懂","fx":["wil_exp+1"],"text":"媒婆摇摇头走了。"}]},{"id":"dv_spring_seed","kind":"derived","parent":"farm_spring","weight":9,"title":"好种子","text":"你整理种子时，发现里面混着一小袋颗粒饱满的好种，不知是谁偷偷放的。","options":[{"label":"单独种在向阳那一垄","fx":["hometown+2","gold+6"],"text":"秋天它会给你惊喜的。"},{"label":"拿去给邻居","fx":["hometown+3","cha_exp+1"],"text":"邻居高兴坏了，非要给你一篮鸡蛋。"}]},{"id":"dv_spring_ox","kind":"derived","parent":"farm_spring","weight":8,"title":"牛闹脾气","text":"耕牛忽然停下来，说什么也不肯往前走了。","options":[{"label":"耐心哄它","check":{"attr":"cha","diff":8},"ok":{"text":"你给它挠了挠下巴，它不情不愿地迈开了步。","fx":["cha_exp+2"]},"fail":{"text":"它越倔越凶，你被甩了一身泥。","fx":["hp-3"]}},{"label":"自己拉犁","fx":["str_exp+4","hp-3"],"text":"你咬着牙，拉完了半亩地。"}]},{"id":"dv_summer_storm","kind":"derived","parent":"farm_summer","weight":9,"title":"骤雨","text":"天色忽然暗了下来，一阵暴雨泼了下来。田边的小水渠眼看就要漫了。","options":[{"label":"趁机把水渠挖深（1 体力）","cost":1,"fx":["str_exp+3","hometown+1"],"text":"你浑身湿透，但水顺着新渠流走了。"},{"label":"躲进窝棚","fx":["wil_exp+1"],"text":"雨一停，水就退了，运气不坏。"}]},{"id":"dv_summer_swim","kind":"derived","parent":"farm_summer","weight":8,"cond":"!flag:efna_resolved&&!flag:efna_lost","portrait":"efna","title":"河边","text":"干完活，艾芙娜在河边朝你招手：“来洗把脸，水可凉了！”","options":[{"label":"过去坐坐（1 体力）","cost":1,"fx":["rel:efna+1","heal:0.15"],"text":"你们把脚泡在水里，谁也没说话，只听见蝉叫。"},{"label":"挥挥手，说还有活","fx":["wil_exp+1"],"text":"她笑着点点头。"}]},{"id":"dv_autumn_bumper","kind":"derived","parent":"farm_autumn","weight":9,"title":"意外的好收成","text":"这一垄的麦子长得出奇地好，一穗比一穗沉。","options":[{"label":"多割一些","fx":["gold+10","hometown+1","str_exp+1"],"text":"打谷场上，你的麦堆比别人高出一截。"}]},{"id":"dv_autumn_rats","kind":"derived","parent":"farm_autumn","weight":8,"title":"田鼠","text":"麦捆底下窜出一群田鼠，啃得到处都是缺口。","options":[{"label":"追着打（1 体力）","cost":1,"check":{"attr":"agi","diff":9},"ok":{"text":"你一气打死十几只，捡回不少粮食。","fx":["agi_exp+2","gold+6"]},"fail":{"text":"它们钻进洞里没了踪影，只留下一地碎麦。","fx":["hometown-1"]}},{"label":"撒些草木灰驱赶","fx":["int_exp+1"],"text":"效果一般，但不费力。"}]},{"id":"dv_winter_roof","kind":"derived","parent":"farm_winter","weight":9,"title":"屋顶塌了一角","text":"你刚爬上屋顶，脚下的茅草忽然塌陷，你整个人悬在半空。","options":[{"label":"抓住椽子，翻上来","check":{"attr":"str","diff":10},"ok":{"text":"你手臂一撑，翻了回来。顺手把这块也补好了。","fx":["str_exp+3","hometown+1"]},"fail":{"text":"你摔了下来，摔得不轻。","fx":["hp-8","hometown+1"]}}]},{"id":"dv_winter_snow","kind":"derived","parent":"farm_winter","weight":8,"title":"雪地里的脚印","text":"你扫雪时，在院墙外发现一串不属于人也不属于野兽的脚印。","options":[{"label":"顺着脚印追去看看（1 体力）","cost":1,"check":{"attr":"agi","diff":10},"ok":{"text":"脚印在林子里消失了，但你捡到了一枚锋利的骨刺。","fx":["agi_exp+3","exp+14"]},"fail":{"text":"追到半路你觉得不对，退了回来。","fx":["wil_exp+1"]}},{"label":"装作没看见","fx":[],"text":"第二天，脚印被新雪盖住了。"}]},{"id":"dv_hunt_bear","kind":"derived","parent":"hunt","weight":7,"cond":"age>=18","title":"棕熊","scene":"mountain","text":"灌木丛里传来低沉的呼噜声——一头刚醒的棕熊正盯着你。","options":[{"label":"拔刀迎战","fx":[{"type":"combat","enemy":"bear","win":["gold+30","item:wolf_cloak"],"lose":["status+:fatigue:2"],"flee":[]}],"text":"你握紧刀柄，一步步后撤到一棵大树下。"},{"label":"慢慢后退","check":{"attr":"agi","diff":10},"ok":{"text":"你一步一步退出了它的视线。","fx":["agi_exp+3"]},"fail":{"text":"枯枝在脚下断裂，熊吼了一声扑来，你狼狈逃了回来。","fx":["hp-10"]}}]},{"id":"dv_hunt_hermit","kind":"derived","parent":"hunt","weight":8,"scene":"mountain","title":"山中隐士","text":"你在山洞口遇见一位白胡子老人，正在烤鱼。他招手：“年轻人，坐。”","options":[{"label":"坐下聊聊（1 体力）","cost":1,"fx":["int_exp+4","wil_exp+3","exp+15"],"text":"老人只说了几句话，但每一句都让你想了很久。"},{"label":"礼貌地谢绝","fx":["wil_exp+1"],"text":"老人也不勉强，继续翻他的鱼。"}]},{"id":"dv_hunt_fox","kind":"derived","parent":"hunt","weight":8,"scene":"mountain","title":"银狐","text":"雪地里，一只银色的狐狸静静地坐着，歪头看你，似乎并不怕人。","options":[{"label":"悄悄靠近","check":{"attr":"luk","diff":10},"ok":{"text":"它让你摸了摸头，然后转身消失了。你觉得今天会有好事。","fx":["status+:blessed:3","wil_exp+2"]},"fail":{"text":"它一溜烟跑没了。","fx":["agi_exp+1"]}},{"label":"举起弓","fx":["gold+25","rep:church-1"],"text":"狐皮卖了好价钱，但你心里不太舒服。"}]},{"id":"dv_hunt_ruins","kind":"derived","parent":"hunt","weight":6,"once":true,"scene":"mountain","title":"藤蔓下的石门","text":"你拨开一片藤蔓，发现山壁上嵌着一扇半掩的石门，门楣上刻着褪色的神徽。","options":[{"label":"进去看看（2 体力）","cost":2,"check":{"attr":"int","diff":11},"ok":{"text":"门后是一间小石室，墙上刻着一段祷文，下面压着一袋旧金币。","fx":["gold+40","int_exp+4","flag+:found_ruins"]},"fail":{"text":"石室里空空荡荡，你只摸了一手灰。","fx":["int_exp+2"]}},{"label":"记下位置，改天再来","fx":["int_exp+1","flag+:found_ruins"],"text":"你在石门旁做了个记号。"}]},{"id":"dv_patrol_drunk","kind":"derived","parent":"patrol","weight":9,"title":"醉汉","text":"夜里巡逻，你在村口撞见一个醉醺醺的汉子，嘴里嘟囔着要“打魔王”。","options":[{"label":"扶他回家（1 体力）","cost":1,"fx":["hometown+1","cha_exp+2"],"text":"他一路讲着年轻时的事，到家时已经睡着了。"},{"label":"拿水泼醒他","fx":["cha_exp+1"],"text":"他骂骂咧咧地跑远了。"}]},{"id":"dv_patrol_orphan","kind":"derived","parent":"patrol","weight":7,"once":true,"cond":"age>=19","title":"躲在草垛里的孩子","text":"你在草垛后听到抽泣声。一个衣衫褴褛的孩子蜷在那里，说他从北边逃来，走丢了爹娘。","options":[{"label":"带他回家，让母亲照看（1 体力）","cost":1,"fx":["hometown+3","rep:church+2","wil_exp+2","flag+:took_orphan"],"text":"母亲什么也没问，盛了一碗热粥。"},{"label":"送他去教堂","fx":["rep:church+3","rel:ambrose+1"],"text":"神父接过孩子，轻轻点了点头。"}]},{"id":"dv_glen_drink","kind":"derived","parent":"learn_sword","weight":9,"portrait":"glen","title":"格伦的酒","text":"学完一轮，格伦从窝棚里摸出半壶酒，自己喝一口，又把壶递给你：“别告诉你娘。”","options":[{"label":"接过来抿一口","fx":["rel:glen+1","wil_exp+2"],"text":"酒辣得你直咳嗽，格伦哈哈大笑。"},{"label":"摆摆手谢绝","fx":["rel:glen+1","wil_exp+1"],"text":"格伦点头：“嗯，有分寸。”"}]},{"id":"dv_glen_test","kind":"derived","parent":"learn_sword","weight":9,"portrait":"glen","title":"格伦的考校","text":"格伦忽然把木棍往你手里一扔，自己抱臂站定：“来，打我三下，打中一下就算你过。”","options":[{"label":"全力出手","check":{"attr":"agi","diff":11},"ok":{"text":"你找到一个破绽，木棍扫到了他的肩膀。他揉着肩笑：“不错。”","fx":["agi_exp+4","str_exp+3","rel:glen+1","exp+14"]},"fail":{"text":"三招全被他轻描淡写地拨开，还被敲了一下脑门。","fx":["agi_exp+2","hp-3"]}}]},{"id":"dv_church_confess","kind":"derived","parent":"church_help","weight":8,"portrait":"priest","title":"听告解","text":"神父有事离开，让你在告解室外看着。有人推门进去，隔着木板低声念着自己的罪。","options":[{"label":"认真听，不插话","fx":["wil_exp+3","int_exp+1"],"text":"你听完了一个陌生人的忏悔，什么也没说，但心里沉甸甸的。"},{"label":"悄悄离开岗位","fx":["rep:church-1"],"text":"你心虚了一下午。"}]},{"id":"dv_church_letter","kind":"derived","parent":"church_help","weight":6,"once":true,"portrait":"priest","title":"圣物箱里的旧信","text":"擦拭圣物箱时，你发现底层压着一封泛黄的信，封口上盖着已不通用的教会印章。","options":[{"label":"悄悄放回去","fx":["wil_exp+2"],"text":"有些东西，不属于你看。"},{"label":"告诉神父","fx":["rel:ambrose+2","rep:church+2"],"text":"神父沉默了很久，说：“……有些事，只能由时间决定。”"},{"label":"打开读一读","check":{"attr":"int","diff":11},"ok":{"text":"信里提到“北境圣骑士团曾在百年前封印过一件东西”，后面的字被虫蛀了。","fx":["int_exp+4","flag+:church_clue_1"]},"fail":{"text":"字迹太模糊，你什么也没看出来。","fx":["int_exp+1"]}}]},{"id":"dv_efna_gift","kind":"derived","parent":"accompany_efna","weight":10,"portrait":"efna","title":"小礼物","text":"艾芙娜背着手走过来，神神秘秘地问：“猜猜我给你带了什么？”","options":[{"label":"“野果？”","fx":["rel:efna+1","heal:0.1"],"text":"她摊开手心——是几颗酸得眯眼的山莓。你们笑成一团。"},{"label":"“你亲手编的什么？”","fx":["rel:efna+1","cha_exp+2"],"text":"她递过来一只草编的小马，“不许嫌丑。”"}]},{"id":"dv_efna_cough","kind":"derived","parent":"accompany_efna","weight":9,"portrait":"efna","title":"她的咳嗽","text":"艾芙娜忽然捂住嘴，肩膀一阵颤抖。你扶住她，才发现她指缝里有淡淡的血色。","options":[{"label":"扶她回家，守着她（1 体力）","cost":1,"fx":["rel:efna+2","wil_exp+2"],"text":"她很快缓了过来，却一直抓着你的袖口没放。"},{"label":"“你没事吧？”（她摆了摆手）","fx":["rel:efna+1"],"text":"“没事，老毛病。”她笑得很勉强。"}]},{"id":"dv_efna_stars","kind":"derived","parent":"accompany_efna","weight":9,"portrait":"efna","title":"数星星","text":"夜里，你们躺在麦垛上。艾芙娜指着天空：“看，那颗最亮的，像不像圣城钟楼上的灯？”","options":[{"label":"“像。以后我带你去看。”","fx":["rel:efna+2","wil_exp+1"],"text":"她没有回答，只是把头靠在了你肩上。"},{"label":"“那是北极星。”","fx":["rel:efna+1","int_exp+2"],"text":"“你真扫兴。”她笑着捶了你一下。"}]},{"id":"dv_hunt_net","kind":"derived","parent":"hunt","weight":8,"scene":"mountain","title":"别人的陷阱","text":"你踩到一根绊索，头顶一张网猛地罩了下来——是另一个猎人布下的。","options":[{"label":"用刀割开","check":{"attr":"agi","diff":9},"ok":{"text":"你三两下割断绳子，还顺手摘了网里的野鸡。","fx":["gold+10","agi_exp+2"]},"fail":{"text":"网越挣越紧，你在原地吊了半个下午。","fx":["status+:fatigue:1","wil_exp+2"]}}]},{"id":"dv_train_wolf_cloak","kind":"derived","parent":"patrol","weight":6,"once":true,"cond":"season==winter","title":"雪夜的哨岗","text":"大雪封了村口，你裹着破毯子守夜，冻得牙齿打战。路过的行商看不过去，从车上抽出一件旧斗篷递给你。","options":[{"label":"道谢，收下","fx":["item:wolf_cloak","rel:lorn+1","cha_exp+1"],"text":"斗篷里衬着厚厚的毛，一裹上就不冷了。"},{"label":"婉拒，说自己扛得住","fx":["wil_exp+3"],"text":"行商摇摇头，把斗篷收了回去。"}]},{"id":"dv_social_news_capital","kind":"derived","parent":"socialize","weight":7,"cond":"age>=22","title":"王都来的信使","text":"酒馆里坐着一位刚从王都回来的信使，正大声谈论着王都的新鲜事。","options":[{"label":"凑过去听","fx":["cha_exp+2","int_exp+2","exp+8"],"text":"他讲得绘声绘色：学院、骑士团、贵族的宴会，你听得入了神。"},{"label":"请他喝一杯，打听骑士团招人的事（5 金币）","cond":"gold>=5","reason":"金币不足","fx":["gold-5","rep:church+1","exp+8"],"text":"他挤了挤眼：“有路子的话，不难。”"}]},{"id":"dv_study_calendar","kind":"derived","parent":"study","weight":8,"cond":"age>=24","title":"年历的空白","text":"你翻到一本旧年历，上面每一页都画着一个小小的月亮，只有那一年秋天的那一页，画着一个黑圈。","options":[{"label":"盯着那个黑圈看了很久","fx":["wil_exp+3","int_exp+2"],"text":"你合上书，手有些凉。"},{"label":"合上书，继续往下读","fx":["int_exp+2"],"text":"该做的事不会因为害怕而变少。"}]},{"id":"dv_study_tome","kind":"derived","parent":"study","weight":7,"once":true,"cond":"attr.int>=9&&!flag:magic_tome","title":"夹层里的册子","text":"你翻旧书时发现书脊夹层里藏着一本更小的册子，封面画着一个六芒星，里面是密密麻麻的咒文图解。","options":[{"label":"带回去仔细研读","fx":["flag+:magic_tome","int_exp+4","exp+10"],"text":"这不是普通的书。"}]},{"id":"dv_arcana_spark","kind":"derived","parent":"study_arcana","weight":10,"title":"指尖的火星","text":"你按照图解默念咒文，指尖忽然亮起一点橙红色的火星，随即熄灭。","options":[{"label":"再试一次","fx":["int_exp+4","wil_exp+2"],"text":"这一次，火星停留了半个呼吸。"}]},{"id":"dv_arcana_backfire","kind":"derived","parent":"study_arcana","weight":8,"title":"失控的咒文","text":"你念错了一个音节，面前的蜡烛突然窜起半人高的火苗，把桌上的纸烧着了。","options":[{"label":"赶紧扑灭","check":{"attr":"agi","diff":9},"ok":{"text":"你一把按住火苗，只烧焦了一角。","fx":["agi_exp+2","int_exp+2"]},"fail":{"text":"火苗燎到了你的袖子，疼得你直叫。","fx":["hp-6","int_exp+1"]}}]},{"id":"dv_prayer_light","kind":"derived","parent":"church_help","weight":8,"portrait":"priest","title":"掌心的暖意","text":"你擦拭圣像时，神父握住你的手，口中念着短短的祷词。你的掌心泛起一点柔和的光。","options":[{"label":"闭上眼，记住这种感觉","fx":["wil_exp+3","mpheal:0.5"],"text":"神父说：“圣光不是力量，是回应。”"}]},{"id":"dv_glen_form","kind":"derived","parent":"learn_sword","weight":8,"portrait":"glen","title":"格伦的架势","text":"格伦握着你的手腕，纠正你的起手式：“剑不是抡出去的，是送出去的。”","options":[{"label":"照他说的练一百遍","fx":["str_exp+3","agi_exp+3","count:sword+1"],"text":"练到最后，你的手腕像是换了一只。"}]},{"id":"dv_study_riddle","kind":"derived","parent":"study","weight":8,"title":"书里的谜题","text":"书页空白处，有前一位读者留下了一道算题，旁边写着：“能解出来的，才算真的读懂了这一章。”","options":[{"label":"试着解一解","check":{"attr":"int","diff":11},"ok":{"text":"你写满了半页草稿，终于推出了那个数字。","fx":["int_exp+6","exp+10"]},"fail":{"text":"你绕进了死胡同，只好先放下。","fx":["int_exp+2"]}}]},{"id":"dv_church_doubt","kind":"derived","parent":"church_help","weight":8,"portrait":"priest","title":"一瞬的怀疑","text":"擦着圣像，你忽然想：如果神真的存在，为什么魔王还会醒来？这个念头让你的手停住了。","options":[{"label":"把疑问压在心里，继续擦","check":{"attr":"wil","diff":11},"ok":{"text":"疑问没有消失，但你学会了和它共处。","fx":["wil_exp+5","rep:church+1"]},"fail":{"text":"整个下午你都心神不宁。","fx":["wil_exp+2"]}},{"label":"去问神父","fx":["wil_exp+2","rel:ambrose+1","int_exp+2"],"text":"神父沉吟了很久：“我也没有答案，但我选择相信。”"}]},{"id":"dv_arcana_flow","kind":"derived","parent":"study_arcana","weight":9,"title":"魔力的流动","text":"读到某一页时，你忽然感觉到一股细细的暖流顺着指尖流进了书页，咒文的笔画微微发亮。","options":[{"label":"屏息凝神，顺着它引导","check":{"attr":"int","diff":11},"ok":{"text":"那股暖流听从了你的引导，在掌心转了一圈又回到身体里。你觉得精神一振。","fx":["int_exp+5","count:arcana+1","mpheal:0.5"]},"fail":{"text":"你一分神，暖流就散了。","fx":["int_exp+2"]}}]},{"id":"dv_train_meditate","kind":"derived","parent":"train","weight":7,"title":"练后的静坐","text":"练完之后，你坐在田埂上，呼吸还没完全平复。远处的钟声一下一下传来，你忽然想试试让心安静下来。","options":[{"label":"闭眼数息","check":{"attr":"wil","diff":10},"ok":{"text":"心跳慢慢和钟声合上了拍，你睁开眼时，觉得比练之前还轻。","fx":["wil_exp+4","heal:0.15","mpheal:0.3"]},"fail":{"text":"杂念一个接一个冒出来，你只好放弃。","fx":["wil_exp+1"]}}]},{"id":"dv_patrol_fear","kind":"derived","parent":"patrol","weight":7,"cond":"age>=22","title":"夜巡的恐惧","text":"夜巡走到村口的老橡树下，树影里似乎有什么东西正盯着你。你的手心一阵发凉。","options":[{"label":"提灯走过去看","check":{"attr":"wil","diff":12},"ok":{"text":"树后只是一只受惊的夜枭，你松了口气，心里却涌起一股难得的踏实。","fx":["wil_exp+4","hometown+1"]},"fail":{"text":"你走到一半就退了回来，一晚上没再靠近那棵树。","fx":["wil_exp+1"]}}]}],"content/farmer_son/events_dungeon.json":[{"id":"de_bats","kind":"dungeon","dungeons":["cave"],"weight":10,"title":"蝙蝠群","text":"头顶传来细碎的扇翅声，成百上千只蝙蝠被你的火把惊醒，尖叫着扑下来。","options":[{"label":"趴下护头","check":{"attr":"wil","diff":9},"ok":{"text":"蝙蝠群擦着你的背脊掠过，你一点伤也没受。","fx":["wil_exp+2"]},"fail":{"text":"你被抓出几道血痕。","fx":["hp-7"]}},{"label":"挥动火把驱赶","fx":["agi_exp+2","hp-3"],"text":"蝙蝠散了，你的袖子被烧焦了一角。"}]},{"id":"de_goblin_stash","kind":"dungeon","dungeons":["cave"],"weight":9,"title":"哥布林的藏宝","text":"一块松动的石头后面，藏着哥布林们偷来的东西：破皮鞋、生锈的剪刀，还有一小袋铜币。","options":[{"label":"全拿走","fx":["gold+26"],"text":"够吃好几顿的了。"},{"label":"只拿铜币，把其他东西放回去","fx":["gold+16","rep:guild+2"],"text":"这些东西是附近村民丢的，你回头会通知公会。"}]},{"id":"de_cave_spring","kind":"dungeon","dungeons":["cave"],"weight":8,"title":"地下泉","text":"洞穴深处有一汪清澈的泉水，水面倒映着头顶的钟乳石。","options":[{"label":"痛快喝一口","fx":["heal:0.3","status-:fatigue"],"text":"泉水冰凉，连疲劳都洗去了。"},{"label":"灌满水囊","fx":["heal:0.15","int_exp+1"],"text":"这趟没白来。"}]},{"id":"de_cave_painting","kind":"dungeon","dungeons":["cave"],"weight":6,"once":true,"title":"洞壁上的壁画","text":"洞壁上有人用红色颜料画了一幅壁画：一个人举着剑，站在一座黑色的城前。","options":[{"label":"盯着看了很久","fx":["wil_exp+3","exp+12","flag+:cave_painting"],"text":"画里的人看不清脸，却让你觉得熟悉。"},{"label":"拓一份带走","fx":["int_exp+3"],"text":"也许学者们看得懂。"}]},{"id":"de_collapse","kind":"dungeon","dungeons":["mine"],"weight":10,"title":"落石","text":"头顶传来一阵隆隆声，碎石和灰尘簌簌落下，整条坑道都在摇晃。","options":[{"label":"冲向出口","check":{"attr":"agi","diff":11},"ok":{"text":"你在最后一刻冲了出去，身后的坑道被石头填满了。","fx":["agi_exp+3","exp+10"]},"fail":{"text":"碎石砸在你的背上，你狼狈地爬了出来。","fx":["hp-14"]}},{"label":"蜷缩在岩壁凹处","check":{"attr":"wil","diff":10},"ok":{"text":"你靠着岩壁撑到了最后。","fx":["wil_exp+3"]},"fail":{"text":"一块碎石砸中了你的肩膀。","fx":["hp-10"]}}]},{"id":"de_gem_vein","kind":"dungeon","dungeons":["mine"],"weight":9,"title":"宝石矿脉","text":"岩壁里嵌着一线发亮的东西，是没被人挖干净的宝石。","options":[{"label":"用战镐撬出来（1 体力）","cost":1,"check":{"attr":"str","diff":12},"ok":{"text":"几颗拇指大的宝石应声落地。","fx":["gold+55","str_exp+3"]},"fail":{"text":"镐头崩了口，只撬下几粒碎屑。","fx":["gold+10","str_exp+1"]}},{"label":"留着，下次再来","fx":["exp+8"],"text":"你在岩壁上做了记号。"}]},{"id":"de_lost_miner","kind":"dungeon","dungeons":["mine"],"weight":8,"title":"迷路的矿工","text":"一个满脸煤灰的老矿工靠在岔路口，说他在这里转了两天，水和灯油都用完了。","options":[{"label":"分给他水和灯油，带他出去","fx":["rep:guild+4","cha_exp+3","exp+15"],"text":"他一路上都在道谢，还指给你一条没去过的近路。"},{"label":"给他指路，自己继续前进","fx":["rep:guild+1"],"text":"他勉强点头，扶着墙走了。"}]},{"id":"de_gas","kind":"dungeon","dungeons":["mine"],"weight":8,"title":"可疑的气味","text":"坑道里飘着一股甜腥味，你的火把火焰忽然变成了诡异的蓝色。","options":[{"label":"捂住口鼻快速通过","check":{"attr":"wil","diff":11},"ok":{"text":"你屏住呼吸冲了过去。","fx":["wil_exp+3"]},"fail":{"text":"你吸进一口，头晕目眩，扶着墙吐了好一阵。","fx":["hp-8","status+:fatigue:1"]}},{"label":"原路退出，换条路（1 体力）","cost":1,"fx":["int_exp+2"],"text":"保险起见。"}]},{"id":"de_whispers","kind":"dungeon","dungeons":["grave"],"weight":10,"title":"耳边的低语","text":"空无一人的墓道里，你分明听见有人在耳边叫你的名字，一声又一声。","options":[{"label":"不理，默念祷词","check":{"attr":"wil","diff":12},"ok":{"text":"低语渐渐远去，你的心反而更静了。","fx":["wil_exp+4","rep:church+1"]},"fail":{"text":"你不由自主回了头，什么也没看见，却冷汗涔涔。","fx":["hp-9","wil_exp+1"]}},{"label":"大声喝问","fx":["wil_exp+2"],"text":"声音在墓道里回荡，低语停了一瞬，又继续。"}]},{"id":"de_grave_robber","kind":"dungeon","dungeons":["grave"],"weight":8,"title":"同行的盗墓贼","text":"一个穿黑斗篷的人蹲在石棺边翻找，听见动静，迅速亮出短刃：“别误会，我们是同行。”","options":[{"label":"和他分赃","fx":["gold+40","rep:church-3"],"text":"棺里的东西被拆成了两份。你没敢抬头看对方的眼睛。"},{"label":"制服他，交给公会","check":{"attr":"agi","diff":11},"ok":{"text":"你一脚踢开短刃，把他绑成了粽子。公会的赏金很可观。","fx":["gold+30","rep:guild+4","rep:church+3"]},"fail":{"text":"他滑得像鱼，一个烟雾弹后不见了。","fx":["hp-5"]}}]},{"id":"de_holy_water","kind":"dungeon","dungeons":["grave"],"weight":8,"title":"圣水池","text":"石室里有一方干净的水池，池沿刻着教会的神徽，水面泛着淡淡的光。","options":[{"label":"掬一捧洗手洗脸","fx":["heal:0.35","status+:blessed:3"],"text":"一股暖流涌遍全身。"},{"label":"取一瓶带走","fx":["heal:0.15","rep:church+2"],"text":"回去后可以交给神父。"}]},{"id":"de_cursed_coffin","kind":"dungeon","dungeons":["grave"],"weight":7,"title":"贴着符纸的石棺","text":"一口石棺被七道符纸封得严严实实，棺盖上刻着“不可开启”。","options":[{"label":"撕开符纸","check":{"attr":"luk","diff":11},"ok":{"text":"棺里是一柄擦得发亮的短剑，没有任何诅咒。","fx":["gold+50","exp+20"]},"fail":{"text":"一股阴风灌进你的衣领，你打了个寒颤，手臂上多了一道青印。","fx":["hp-10","status+:fatigue:2"]}},{"label":"在棺前默哀，转身离开","fx":["rep:church+2","wil_exp+2"],"text":"有些东西，让它安息就好。"}]},{"id":"de_wounded_knight","kind":"dungeon","dungeons":["fortress"],"weight":10,"title":"重伤的骑士","text":"废墟里，一名王国骑士倚着墙，铠甲裂了，他认出你的徽记：“……带话给王都……魔潮……不止这一座……”","options":[{"label":"替他包扎，答应带话","fx":["rep:kingdom+5","rep:church+2","cha_exp+2","exp+25"],"text":"他把一枚带血的徽章按进你手里，闭上了眼。"},{"label":"听完就走，时间紧迫","fx":["rep:kingdom+1","exp+10"],"text":"你记下了他说的每一个字。"}]},{"id":"de_supply_cache","kind":"dungeon","dungeons":["fortress"],"weight":9,"title":"军需箱","text":"一只印着王国纹章的木箱被丢在墙角，里面是干粮、药水和一小袋军饷。","options":[{"label":"拿药水和军饷","fx":["heal:0.35","gold+50"],"text":"这些东西，本来也是给人用的。"},{"label":"只拿药水","fx":["heal:0.35","rep:kingdom+2"],"text":"军饷留给后来的人。"}]},{"id":"de_demon_sigil","kind":"dungeon","dungeons":["fortress"],"weight":8,"title":"魔王的印记","text":"地上刻着一枚暗红色的魔法阵，正在缓缓转动，散发着令人头晕的气息。","options":[{"label":"用意志力抵抗并记下它的结构","check":{"attr":"wil","diff":13},"ok":{"text":"你顶着压力记下了阵纹的走向，这也许能在最终一战里派上用场。","fx":["int_exp+5","wil_exp+4","exp+30","flag+:sigil_studied"]},"fail":{"text":"魔力像潮水一样冲击着你的意识，你踉跄后退。","fx":["hp-14","wil_exp+2"]}},{"label":"绕开魔法阵","fx":["agi_exp+2"],"text":"你从边缘擦过，没有触发它。"}]},{"id":"de_war_horn","kind":"dungeon","dungeons":["fortress"],"weight":8,"title":"号角声","text":"远处的城墙上响起了低沉的号角，那是魔潮的号令，整座要塞的敌人都被惊动了。","options":[{"label":"趁乱突进","check":{"attr":"agi","diff":12},"ok":{"text":"你利用混乱，一路悄无声息地穿过了守卫。","fx":["agi_exp+4","exp+25"]},"fail":{"text":"你被发现，一路杀出重围。","fx":["hp-14","str_exp+2"]}},{"label":"找掩体先躲一躲（1 体力）","cost":1,"fx":["heal:0.15","wil_exp+2"],"text":"号角声平息后，你才继续前进。"}]}],"content/farmer_son/events_random.json":[{"id":"ev_lost_calf","kind":"random","pool":"opportunity","weight":9,"cond":["season==spring","season==summer"],"title":"迷路的小牛","scene":"village_spring","text":"邻居家的小牛挣脱绳子跑进了林子，主人急得直跺脚。","options":[{"label":"帮忙去找（1 体力）","cost":1,"check":{"attr":"agi","diff":9},"ok":{"text":"你在溪边找到了它，邻居硬塞给你一小袋铜币。","fx":["gold+14","hometown+2","agi_exp+2"]},"fail":{"text":"追了半天也没追上，反倒摔了一跤。","fx":["hp-4","hometown+1"]}},{"label":"告诉他往溪边找","fx":["hometown+1"],"text":"邻居谢过你，拔腿就跑。"}]},{"id":"ev_herb_gatherer","kind":"random","pool":"opportunity","weight":8,"title":"采药的老妇","scene":"mountain","text":"山脚下，一位背着竹篓的老妇正在辨认草药，篓子已经压得她直不起腰。","options":[{"label":"帮她把篓子背回村（1 体力）","cost":1,"fx":["str_exp+2","int_exp+3","heal:0.2"],"text":"路上她给你讲了哪些草能止血、哪些草碰不得，还往你手里塞了一把干草药。"},{"label":"请教几种草药的辨认法","fx":["int_exp+4"],"text":"老妇笑着捡了几种给你看：“记住它们的叶脉。”"}]},{"id":"ev_wandering_bard","kind":"random","pool":"opportunity","weight":9,"cond":["season==summer","season==autumn"],"title":"吟游诗人","scene":"village_autumn","text":"一位背着旧鲁特琴的吟游诗人在村口的树下弹唱，唱的是百年前勇者与魔王的故事。","options":[{"label":"坐下来听完整首","fx":["cha_exp+3","wil_exp+2","rel:efna+1"],"text":"最后一段唱到勇者独自走进黑暗，周围一片安静。"},{"label":"请他讲讲圣城的见闻（5 金币）","cond":"gold>=5","reason":"金币不足","fx":["gold-5","int_exp+3","flag+:heard_holy_city"],"text":"他说圣城的钟楼有九十九级台阶，登顶之后，整座城都在脚下。"}]},{"id":"ev_old_coin","kind":"random","pool":"opportunity","weight":7,"title":"犁出来的旧银币","scene":"village_spring","text":"犁头在地里碰到了硬物，是一只生了绿锈的小罐，里头装着几枚没见过的旧银币。","options":[{"label":"拿去集市兑换","fx":["gold+24"],"text":"钱商瞥了一眼就报了价，你觉得亏了，但也没处说理。"},{"label":"交给神父，说不定是古物","fx":["rep:church+3","rel:ambrose+1"],"text":"神父仔细端详后，说是前朝的祭币，他会登记在教堂的档案里。"}]},{"id":"ev_guild_board","kind":"random","pool":"opportunity","weight":11,"cond":"flag:guild","title":"公会布告栏","scene":"village_spring","text":"公会布告栏上贴着一张新的委托：护送行商穿过北边的山路，报酬不菲。","options":[{"label":"接下委托（2 体力）","cost":2,"check":{"attr":"agi","diff":10},"ok":{"text":"一路无事，行商满意地多付了小费。","fx":["gold+34","rep:guild+3","exp+12"]},"fail":{"text":"路上遇到岔路绕了远，行商只付了半数报酬。","fx":["gold+14","rep:guild+1"]}},{"label":"看看有没有别的","fx":["exp+3"],"text":"你在布告栏前站了很久，把每一张都记在了心里。"}]},{"id":"ev_market_day","kind":"random","pool":"opportunity","weight":10,"cond":["season==spring","season==autumn"],"title":"集市日","scene":"village_autumn","text":"镇上的集市开张了，来自各地的货郎摆满了街道，吆喝声此起彼伏。","options":[{"label":"摆摊卖家里的余粮（1 体力）","cost":1,"check":{"attr":"cha","diff":9},"ok":{"text":"你嘴皮子利索，余粮卖了个好价钱。","fx":["gold+24","cha_exp+3"]},"fail":{"text":"没人买账，最后贱卖了出去。","fx":["gold+8","cha_exp+1"]}},{"label":"逛一逛，长长见识","fx":["cha_exp+2","int_exp+2"],"text":"你看见了南方的香料、东方的瓷器，还有一个会算命的老头。"}]},{"id":"ev_mina_flowers","kind":"random","pool":"social","weight":9,"title":"妹妹的花环","scene":"village_spring","text":"妹妹米娜举着一只歪歪扭扭的花环跑过来，非要套在你头上。","options":[{"label":"低头让她戴上","fx":["rel:mina+1","hometown+1"],"text":"花环有点刺，但你戴了一整天。"},{"label":"趁机教她认几个字（1 体力）","cost":1,"fx":["rel:mina+1","int_exp+2","cha_exp+1"],"text":"她学会了写自己的名字，高兴得转圈。"}]},{"id":"ev_hot_spring","kind":"random","pool":"opportunity","weight":7,"cond":"season==winter","title":"山中的温泉","scene":"mountain","text":"雪地里腾起一缕白汽——你在山坳里发现了一眼天然的温泉。","options":[{"label":"泡一会儿（1 体力）","cost":1,"fx":["heal:0.6","status-:fatigue","wil_exp+1"],"text":"冻僵的手脚慢慢缓过来，你几乎要睡着了。"},{"label":"记下位置，不多停留","fx":["agi_exp+1"],"text":"以后受了伤，这里是个好去处。"}]},{"id":"ev_pilgrim_blessing","kind":"random","pool":"opportunity","weight":8,"cond":"rep.church>=10","title":"朝圣者的祝福","scene":"village_spring","text":"一队去圣城朝圣的信徒经过村子，领头的老人看了你一眼，伸手在你额前画了个圣印。","options":[{"label":"低头接受祝福","fx":["status+:blessed:3","wil_exp+2"],"text":"额头上留下一点暖意，像刚晒过的石头。"},{"label":"请他们在教堂歇歇脚（1 体力）","cost":1,"fx":["rep:church+3","hometown+1","cha_exp+2"],"text":"神父很高兴，说你有教养。"}]},{"id":"ev_smith_apprentice","kind":"random","pool":"opportunity","weight":8,"once":true,"cond":"attr.str>=14&&age\u003c24","title":"铁匠的邀请","scene":"village_spring","text":"镇上的铁匠看你抡锄头的架势，笑着说：“小子，要不要来帮我拉几天风箱？”","options":[{"label":"去铁匠铺帮工（2 体力）","cost":2,"fx":["str_exp+5","gold+12","wil_exp+1"],"text":"火花在你手背上烫出几个小点，但你学到了不少。"},{"label":"请铁匠帮你磨一磨武器","cond":"gold>=10","reason":"金币不足","fx":["gold-10","exp+8"],"text":"刀刃亮了一倍，铁匠还给你指了怎么保养。"}]},{"id":"ev_barn_fire","kind":"random","pool":"calamity","weight":8,"cond":["season==summer","season==autumn"],"title":"谷仓失火","scene":"village_autumn","text":"黄昏时，村西的谷仓突然冒起浓烟，有人在大喊“救火”。","options":[{"label":"冲进去抢粮食（1 体力）","cost":1,"check":{"attr":"wil","diff":10},"ok":{"text":"你屏住气，一袋一袋拖了出来，邻居们感激得说不出话。","fx":["hometown+2","wil_exp+3","hp-4"]},"fail":{"text":"浓烟呛得你睁不开眼，被人拖了出来。","fx":["hp-9","hometown-2"]}},{"label":"组织人排队传水","check":{"attr":"cha","diff":9},"ok":{"text":"你一声吆喝，大家排成长龙，火很快被压住了。","fx":["hometown+1","cha_exp+3"]},"fail":{"text":"场面一团乱，等火灭了，谷仓只剩焦黑的梁。","fx":["hometown-4"]}}]},{"id":"ev_wild_boar","kind":"random","pool":"calamity","weight":8,"cond":["season==summer","season==autumn"],"title":"野猪拱田","scene":"village_autumn","text":"一头发了狂的野猪闯进了麦田，所过之处一片狼藉。","options":[{"label":"拿起农具迎战","fx":[{"type":"combat","enemy":"boar","win":["hometown+2","gold+10"],"lose":["hometown-3"],"flee":["hometown-3"]}],"text":"你抄起铁叉冲了过去。"},{"label":"点燃火把驱赶（1 体力）","cost":1,"check":{"attr":"agi","diff":10},"ok":{"text":"火光吓得它掉头逃了，损失很小。","fx":["hometown+1","agi_exp+2"]},"fail":{"text":"野猪没被吓住，反而更凶了。","fx":["hometown-4","hp-6"]}}]},{"id":"ev_livestock_plague","kind":"random","pool":"calamity","weight":7,"title":"牲口瘟","scene":"village_spring","text":"村里的羊开始接连倒下，兽医说是一种叫“软蹄”的瘟病。","options":[{"label":"帮着隔离病羊（2 体力）","cost":2,"fx":["hometown-1","int_exp+3","wil_exp+2"],"text":"你们把病羊赶到村外的棚子，没让瘟病蔓延。"},{"label":"拿钱请兽医（30 金币）","cond":"gold>=30","reason":"金币不足","fx":["gold-30"],"text":"兽医忙了三天，总算压住了。"},{"label":"听天由命","fx":["hometown-6"],"text":"年底，村里的羊少了一半。"}]},{"id":"ev_bandits_toll","kind":"random","pool":"calamity","weight":8,"cond":"gold>=40&&age>=18","title":"山道劫匪","scene":"mountain","text":"你赶路时，三个蒙面人从树后窜出，拦住了去路：“留下买路钱。”","options":[{"label":"交钱了事（30 金币）","cond":"gold>=30","reason":"金币不足","fx":["gold-30"],"text":"他们数了数，放你过去了。"},{"label":"拔刀迎战","fx":[{"type":"combat","enemy":"bandit","win":["rep:guild+2"],"lose":["gold-30"],"flee":["gold-15"]}],"text":"你握紧了武器。"}]},{"id":"ev_nightmare","kind":"random","pool":"calamity","weight":8,"cond":"age>=24","title":"噩梦","scene":"village_winter","text":"你梦见魔王的城堡，黑色的城门缓缓打开，门后有双眼睛一直在看着你。你醒来时，浑身是汗。","options":[{"label":"咬牙再睡","check":{"attr":"wil","diff":11},"ok":{"text":"你强迫自己把心放平，一觉睡到天亮。","fx":["wil_exp+3"]},"fail":{"text":"你睁着眼睛等到鸡叫，头痛欲裂。","fx":["status+:fatigue:2"]}},{"label":"起身祈祷（1 体力）","cost":1,"fx":["wil_exp+2","rep:church+1"],"text":"跪在窗前，你慢慢安静下来。"}]},{"id":"ev_broken_plow","kind":"random","pool":"calamity","weight":9,"cond":"season==spring","title":"断了的犁","scene":"village_spring","text":"春耕正忙，犁头在地里崩断了，眼看就要耽误农时。","options":[{"label":"自己动手修（1 体力）","cost":1,"check":{"attr":"int","diff":9},"ok":{"text":"你用麻绳和铁片勉强把它加固了。","fx":["int_exp+2","str_exp+1"]},"fail":{"text":"越修越糟，只好花钱请铁匠。","fx":["gold-12"]}},{"label":"直接请铁匠（12 金币）","cond":"gold>=12","reason":"金币不足","fx":["gold-12"],"text":"花钱省心。"}]},{"id":"ev_spring_flood","kind":"random","pool":"calamity","weight":8,"cond":"season==spring","title":"春汛","scene":"village_spring","text":"雪水涌下山，村东的溪水漫出了河道，眼看要淹进麦田。","options":[{"label":"挖沟引水（2 体力）","cost":2,"fx":["str_exp+3","hometown+1"],"text":"你和邻居们挖了一下午，水被引到了荒地里。"},{"label":"垒沙袋","check":{"attr":"str","diff":12},"ok":{"text":"沙袋垒成了一道坝，水退得很快。","fx":["str_exp+2","hometown+1"]},"fail":{"text":"坝垒得不够高，淹了一角。","fx":["hometown-4"]}}]},{"id":"ev_bad_rumor","kind":"random","pool":"calamity","weight":6,"cond":"age>=19","title":"流言","scene":"village_spring","text":"村里不知从哪传出一种说法：你天天往外跑，是不是不想守着这片地了？","options":[{"label":"挨家挨户解释（1 体力）","cost":1,"check":{"attr":"cha","diff":10},"ok":{"text":"你用勤快的事实堵住了他们的嘴。","fx":["hometown+1","cha_exp+3"]},"fail":{"text":"越解释越乱，反而被笑话了一阵。","fx":["hometown-2"]}},{"label":"不理，继续干活","fx":["wil_exp+2"],"text":"流言传了两天，自己也就散了。"}]},{"id":"ev_rex_duel","kind":"random","pool":"social","weight":9,"once":true,"cond":"age>=17&&age\u003c=22","title":"雷克斯的挑战","scene":"village_spring","text":"村东的雷克斯又来了。这次他不拿腕力说事，直接点名要和你比一场木剑。“输的人，以后见了对方得喊哥。”","options":[{"label":"接受挑战","check":{"attr":"agi","diff":11},"ok":{"text":"你一记虚晃，木剑停在他喉前。他涨红了脸，半晌憋出一句：“……哥。”之后他反倒常来找你切磋。","fx":["rel:rex+3","cha_exp+3","exp+10"]},"fail":{"text":"你被他敲在手腕上，疼得直吸气。但他走时回头说：“下次再来。”","fx":["rel:rex+1","hp-5","agi_exp+3"]}},{"label":"笑笑拒绝","fx":["rel:rex+1","wil_exp+1"],"text":"他嘟囔着走了，但没再找你麻烦。"}]},{"id":"ev_village_wedding","kind":"random","pool":"social","weight":8,"once":true,"cond":"hometown>=40&&age>=18","title":"村里的婚礼","scene":"village_autumn","text":"村西的一对新人办婚礼，全村人都去了。有人起哄让你上台唱一段。","options":[{"label":"清清嗓子，唱一段","check":{"attr":"cha","diff":9},"ok":{"text":"你的歌声跑了调，但大家笑成一片，气氛更热了。","fx":["cha_exp+4","hometown+2"]},"fail":{"text":"你唱到一半忘了词，台下哄堂大笑。","fx":["cha_exp+2","hometown+1"]}},{"label":"在一旁帮着端菜","fx":["hometown+2","str_exp+1"],"text":"累是累，吃到了第一口热乎的肘子。"}]},{"id":"ev_mother_worry","kind":"random","pool":"social","weight":9,"once":true,"cond":"age>=18","title":"母亲的担忧","scene":"village_spring","text":"夜里，母亲在灯下补你的衣裳，忽然轻声说：“你要是哪天走了，家里就剩你爹一个人了。”","options":[{"label":"“我会回来，一定。”","fx":["hometown+3","wil_exp+2"],"text":"母亲没说话，只是把针线放下，握了握你的手。"},{"label":"“我还没想好。”","fx":["wil_exp+1"],"text":"母亲低头继续缝，缝了很久。"}]},{"id":"ev_father_story","kind":"random","pool":"social","weight":8,"once":true,"cond":"age>=20","title":"父亲的旧事","scene":"village_autumn","text":"收工的晚上，父亲难得多喝了一杯，开口讲起他年轻时给教会运过粮，在边境见过魔物的脚印。","options":[{"label":"认真听完","fx":["wil_exp+3","int_exp+2","rel:mina+1"],"text":"原来这个沉默的男人，也曾走得很远。"},{"label":"追问魔物长什么样","fx":["int_exp+4","exp+10"],"text":"他比划了一个很大的手势，然后摇摇头：“你别去看。”"}]},{"id":"ev_lorn_first","kind":"random","pool":"social","weight":9,"once":true,"title":"行商洛恩","scene":"village_spring","text":"一位自称洛恩的行商，推着满载杂货的小车停在你家门前，说他想找个熟路的向导带他走北边的山路。","options":[{"label":"带他走一趟（2 体力）","cost":2,"fx":["gold+24","rel:lorn+2","agi_exp+2"],"text":"他一路都在说笑，临别时塞给你一张写着地址的纸条：“以后有货，先想着你。”"},{"label":"告诉他路怎么走","fx":["rel:lorn+1","cha_exp+1"],"text":"他道了谢，说有缘再会。"}]},{"id":"ev_lorn_deal","kind":"random","pool":"opportunity","weight":8,"cond":"rel.lorn>=2","title":"洛恩的生意","scene":"village_autumn","text":"洛恩又路过了村子，神神秘秘地说：“有一批货，你要是肯垫钱，转手就有赚头。”","options":[{"label":"投 40 金币","cond":"gold>=40","reason":"金币不足","check":{"attr":"luk","diff":10},"ok":{"text":"那批货在王都卖出了好价钱，洛恩分给你一大份。","fx":["gold+40","rel:lorn+1"]},"fail":{"text":"货被山贼劫了，洛恩愧疚地赔了你一部分。","fx":["gold-18"]}},{"label":"婉拒","fx":["cha_exp+1"],"text":"洛恩耸耸肩：“下次再说。”"}]},{"id":"ev_story_time","kind":"random","pool":"social","weight":9,"title":"孩子们要听故事","scene":"village_spring","text":"一群村里的孩子围住你，吵着要听你讲故事。","options":[{"label":"讲一个勇者的故事（1 体力）","cost":1,"fx":["cha_exp+3","hometown+1"],"text":"你添油加醋，孩子们听得瞪圆了眼睛。"},{"label":"教他们一套简单的拳法（1 体力）","cost":1,"fx":["str_exp+1","cha_exp+2","hometown+1"],"text":"一排小不点咿咿呀呀打了半天，场面混乱又好笑。"}]},{"id":"ev_priest_chess","kind":"random","pool":"social","weight":8,"cond":"rep.church>=8","title":"神父的棋局","scene":"village_spring","portrait":"priest","text":"神父安布罗斯摆开一副旧棋盘，笑着说：“闲着也是闲着，陪我下一局？”","options":[{"label":"落座对弈（1 体力）","cost":1,"check":{"attr":"int","diff":10},"ok":{"text":"你险胜半子，神父大笑：“后生可畏。”","fx":["int_exp+4","rel:ambrose+1","rep:church+1"]},"fail":{"text":"你被杀得片甲不留，但学到了几手。","fx":["int_exp+2","rel:ambrose+1"]}},{"label":"推辞，说还有活要干","fx":[],"text":"神父点头：“年轻人，手上的活要紧。”"}]},{"id":"ev_comet","kind":"random","pool":"world","weight":9,"once":true,"cond":"age>=24","title":"拖着尾巴的星","scene":"village_autumn","text":"夜里，一颗拖着长长尾巴的红色彗星划过北方的天空，持续了整整三个晚上。老人们说，这是上一次魔王苏醒前也出现过的征兆。","options":[{"label":"和村里人一起守夜（1 体力）","cost":1,"fx":["wil_exp+3","hometown+1"],"text":"大家围着篝火，谁也没说话。"},{"label":"记下它的方位和日期","fx":["int_exp+3","exp+10"],"text":"你在本子上画下星图，打算以后拿去问学者。"}]},{"id":"ev_conscription","kind":"random","pool":"world","weight":9,"once":true,"cond":"age>=20&&age\u003c=27","title":"王国征兵","scene":"village_spring","text":"王国的征兵官带着卫兵来到村里，要从每家抽一名青壮去北边戍边。","options":[{"label":"主动报名（2 体力）","cost":2,"fx":["rep:kingdom+6","str_exp+3","exp+25","hometown-2"],"text":"你在边境待了几周，回来时身上多了几道伤疤和一份军功文书。"},{"label":"交钱免役（40 金币）","cond":"gold>=40","reason":"金币不足","fx":["gold-40"],"text":"征兵官收了钱，在名册上划掉了你的名字。"},{"label":"托词躲过去","check":{"attr":"cha","diff":11},"ok":{"text":"你一脸诚恳地说家里离不开你，征兵官挥挥手走了。","fx":["cha_exp+2"]},"fail":{"text":"被识破了，罚了一笔钱。","fx":["gold-30","rep:kingdom-2"]}}]},{"id":"ev_church_collection","kind":"random","pool":"world","weight":8,"cond":"age>=19","title":"教会募捐","scene":"village_spring","portrait":"priest","text":"神父拿着募捐箱来到你家，说教会要给北境的难民修一座避难所。","options":[{"label":"捐 15 金币","cond":"gold>=15","reason":"金币不足","fx":["gold-15","rep:church+3"],"text":"神父在你的名字后面画了一个小十字。"},{"label":"出力帮着搬砖（2 体力）","cost":2,"fx":["str_exp+3","rep:church+3","hometown+1"],"text":"你干了一整天，神父给你留了一碗热汤。"},{"label":"婉拒","fx":[],"text":"神父没说什么，转身去了下一家。"}]},{"id":"ev_trade_route_cut","kind":"random","pool":"world","weight":9,"once":true,"cond":"age>=25","title":"北方商路中断","scene":"village_winter","text":"行商们带来消息：北边的商路被魔物截断，粮价和铁价都在涨。","options":[{"label":"囤些粮食以防万一（30 金币）","cond":"gold>=30","reason":"金币不足","fx":["gold-30","hometown+3"],"text":"仓房里多了几袋粮，心里踏实了些。"},{"label":"照常过日子","fx":["wil_exp+1"],"text":"该来的总会来，该做的事一样要做。"}]},{"id":"ev_knight_passing","kind":"random","pool":"world","weight":8,"cond":"age>=19","title":"过路的骑士","scene":"village_spring","text":"一队王国骑士路过村子，披风上沾满了尘土。领头的骑士下马喝水，目光在你身上停了一下。","options":[{"label":"上前请教几招（1 体力）","cost":1,"check":{"attr":"cha","diff":10},"ok":{"text":"他看你诚恳，随手教了你一个格挡的窍门。","fx":["str_exp+3","agi_exp+2","rep:kingdom+2"]},"fail":{"text":"他礼貌地摇了摇头，翻身上马走了。","fx":["cha_exp+1"]}},{"label":"递上水囊","fx":["rep:kingdom+1","cha_exp+1"],"text":"骑士点点头：“多谢。”"}]},{"id":"ev_church_inspection","kind":"random","pool":"world","weight":7,"cond":"rep.church>=20&&age>=21","title":"教会巡查","scene":"village_spring","portrait":"priest","text":"教会的巡查官来到村里检查教堂账目，神父紧张得一晚没睡好。","options":[{"label":"帮神父整理账目（1 体力）","cost":1,"fx":["int_exp+3","rep:church+3","rel:ambrose+1"],"text":"账目没出问题，神父长出了一口气。"},{"label":"带巡查官参观村子","check":{"attr":"cha","diff":10},"ok":{"text":"巡查官对村里的秩序很满意。","fx":["rep:church+4","hometown+1"]},"fail":{"text":"你讲得磕磕绊绊，巡查官皱了皱眉。","fx":["cha_exp+2"]}}]},{"id":"ev_war_news","kind":"random","pool":"world","weight":8,"once":true,"cond":"age>=27","title":"前线战报","scene":"village_winter","text":"邮差带来了前线的消息：魔物攻陷了两座边境据点，王国正在紧急调兵。","options":[{"label":"立刻整理行装，加紧练习（2 体力）","cost":2,"fx":["str_exp+3","wil_exp+3","exp+20"],"text":"时间不多了，你把剩下的每一天都排得很满。"},{"label":"按兵不动，守好家里","fx":["hometown+1"],"text":"你在村口加了两个岗哨。"}]},{"id":"ev_old_scar","kind":"random","pool":"social","weight":7,"once":true,"cond":"flag:met_glen&&rel.glen>=2","title":"格伦的伤疤","scene":"village_autumn","portrait":"glen","text":"格伦在窝棚前擦拭一把旧剑，衣袖滑落，露出一道从肩到肘的长疤。他发现你在看，没遮。","options":[{"label":"“那是怎么来的？”","fx":["rel:glen+1","wil_exp+2"],"text":"“一次不该打的仗。”他说，然后再没说话。"},{"label":"默默递上一杯水","fx":["rel:glen+1"],"text":"他接过去，点了点头。"}]},{"id":"ev_harvest_dispute","kind":"random","pool":"social","weight":7,"cond":"season==autumn","title":"田埂之争","scene":"village_autumn","text":"两户邻居为了一道田埂吵了起来，眼看就要动手，村里人都围过来看热闹。","options":[{"label":"站出来调解","check":{"attr":"cha","diff":10},"ok":{"text":"你一人一句，把他们说得面红耳赤，各让了三寸。","fx":["cha_exp+4","hometown+2"]},"fail":{"text":"两家人一起骂你多管闲事。","fx":["cha_exp+2","hometown-1"]}},{"label":"拉开他们（1 体力）","cost":1,"fx":["str_exp+2","hometown+1"],"text":"你硬生生把两人分开，各自的鼻子都挂了彩。"}]},{"id":"ev_wandering_mage","kind":"random","pool":"opportunity","weight":12,"once":true,"cond":"age>=18&&age\u003c=27","title":"路过的老法师","scene":"village_autumn","text":"一位披着旧斗篷的老法师在村口歇脚，行囊里露出半截书脊。他打量你的手：“种田的手，有意思。”","options":[{"label":"请他讲讲魔法是怎么回事（1 体力）","cost":1,"fx":["int_exp+4","exp+10","flag+:magic_tome"],"text":"他笑着从行囊里抽出一本磨破角的小册子：“拿去看，别的我没有。能不能入门，看你自己。”"},{"label":"帮他把行李搬到客栈","fx":["str_exp+2","cha_exp+1","gold+8"],"text":"他道了谢，给了你几个铜板，没提魔法的事。"}]},{"id":"ev_old_spellbook","kind":"random","pool":"opportunity","weight":8,"once":true,"cond":"attr.int>=8&&age\u003c=28","title":"一本旧法术书","scene":"village_spring","text":"集市的旧书摊上，你翻到一本封面烫金的残本，书页上全是奇怪的符号，摊主说是前朝学院的遗物。","options":[{"label":"花 30 金币买下","cond":"gold>=30","reason":"金币不足","fx":["gold-30","flag+:magic_tome","int_exp+3"],"text":"你抱着它跑回家，翻开第一页就舍不得放下。"},{"label":"翻看几页，记下几条咒文","fx":["int_exp+4"],"text":"摊主瞪了你一眼：“看够了就买。”"}]},{"id":"ev_wise_riddle","kind":"random","pool":"opportunity","weight":9,"title":"拦路的谜题","scene":"village_autumn","text":"一位拄着竹杖的游方智者拦在路中间，笑眯眯地说：“年轻人，答对我一个题，这几个铜板就归你。”他出的是：“有一物，越用越多，越藏越少，是什么？”","options":[{"label":"仔细想一想","check":{"attr":"int","diff":11},"ok":{"text":"你想到了“知识”，智者拊掌大笑，把钱袋塞给了你。","fx":["gold+35","int_exp+4"]},"fail":{"text":"你绞尽脑汁，智者摇着头给了你一个提示，没收钱。","fx":["int_exp+2"]}},{"label":"笑笑，不参与","fx":[],"text":"智者也不勉强，拄着竹杖慢悠悠走远了。"}]},{"id":"ev_ancient_marker","kind":"random","pool":"opportunity","weight":8,"once":true,"cond":"age>=20","title":"古老的界碑","scene":"mountain","text":"田边挖沟时，铲子磕到了一块刻着符文的石碑，上面的字比教会用的任何一种文字都古老。","options":[{"label":"拓下纹路，慢慢辨认（1 体力）","cost":1,"check":{"attr":"int","diff":12},"ok":{"text":"你认出了其中几个词根，隐约摸到了一套符文的规律。","fx":["int_exp+6","exp+30","count:arcana+1"]},"fail":{"text":"线条太繁复，你只看得头晕。","fx":["int_exp+2"]}},{"label":"让它继续埋着","fx":["wil_exp+1"],"text":"有些东西，不碰也好。"}]},{"id":"ev_scholar_debate","kind":"random","pool":"social","weight":8,"cond":"age>=19","title":"学者的辩论","scene":"village_spring","text":"巡回的学者在教堂前摆开辩论席，说谁能驳倒他关于“魔王是否有意志”的论点，就赠书一本。围观者你看我、我看你。","options":[{"label":"上台辩一场","check":{"attr":"int","diff":12},"ok":{"text":"你抓住他论证里的一个漏洞，逼得他沉默了很久。台下一片叫好，学者笑着送你一本旧册。","fx":["int_exp+6","cha_exp+3","rep:church+2","exp+25"]},"fail":{"text":"几个回合就被他驳得哑口无言，但你记住了他的几个论点。","fx":["int_exp+3","cha_exp+1"]}},{"label":"站在人群里听","fx":["int_exp+2"],"text":"听明白了一半，另一半留着回去想。"}]},{"id":"ev_forged_deed","kind":"random","pool":"calamity","weight":8,"cond":"age>=20&&hometown>=30","title":"可疑的地契","scene":"village_winter","text":"一位衣着体面的外乡人拿着一份地契来到村里，声称村东的一片荒地归他所有。村长看不出破绽，一脸为难。","options":[{"label":"仔细查验那份文书","check":{"attr":"int","diff":12},"ok":{"text":"你发现印章的纹路和领主府的旧例对不上，当场戳穿了他。","fx":["hometown+3","int_exp+4","gold+20"]},"fail":{"text":"你看不出破绽，眼睁睁看着村里让出了半块地。","fx":["hometown-3","int_exp+1"]}},{"label":"建议去领主府核实","fx":["hometown+1","cha_exp+1"],"text":"外乡人脸色变了变，说改日再来，从此没了踪影。"}]},{"id":"ev_poisoned_well","kind":"random","pool":"calamity","weight":8,"title":"发臭的水井","scene":"village_spring","text":"村里的水井忽然发出一股怪味，好几个人喝了水就上吐下泻。有人说是魔物下的毒，人心惶惶。","options":[{"label":"查明原因","check":{"attr":"int","diff":11},"ok":{"text":"你顺着水脉找到井下的死鼠，清理后又煮了三天水，村里渐渐安稳。","fx":["hometown+3","int_exp+4"]},"fail":{"text":"你没找到根源，大家只好改去溪边挑水。","fx":["hometown-3","hp-4"]}},{"label":"让神父来做祈福","fx":["rep:church+1"],"text":"祈福不能治病，但至少让大家安了心。"}]},{"id":"ev_haunted_barn","kind":"random","pool":"calamity","weight":7,"title":"闹鬼的谷仓","scene":"village_winter","text":"夜里，村西废弃的谷仓传来哭声和拖拽锁链的声响，几个孩子吓得不敢回家。","options":[{"label":"提着灯去看看","check":{"attr":"wil","diff":12},"ok":{"text":"你推开门，里面只有一只被困的老驴和一堆乱晃的铁链。你笑着把它牵了出来。","fx":["wil_exp+4","hometown+2"]},"fail":{"text":"黑暗里什么东西碰了你一下，你拔腿就跑，一夜没睡。","fx":["wil_exp+1","status+:fatigue:1"]}},{"label":"让大人们天亮再看","fx":["hometown-1"],"text":"孩子们都说你胆小。"}]},{"id":"ev_gold_temptation","kind":"random","pool":"social","weight":8,"cond":"gold>=30&&age>=19","title":"诱人的买卖","scene":"village_autumn","text":"一个笑容和善的陌生人悄悄拉住你：“有一桩买卖，稳赚不赔，就是得瞒着教会。”他搓了搓手指，意思是金币。","options":[{"label":"摇头，拒绝","check":{"attr":"wil","diff":12},"ok":{"text":"你把他的手拨开，转身就走。回头想想，后背都是汗。","fx":["wil_exp+4","rep:church+2"]},"fail":{"text":"你犹豫了很久才拒绝，那几晚你都睡不好。","fx":["wil_exp+2"]}},{"label":"先听听条件","fx":["gold+55","rep:church-3","cha_exp+1"],"text":"买卖不算太脏，但你知道神父不会高兴。"}]},{"id":"ev_siege_night","kind":"random","pool":"world","weight":9,"cond":"age>=26","title":"漫长的守夜","scene":"village_winter","text":"北边传来号角声，村里组织青壮守夜。整整一夜，远处的火光忽明忽暗，每个人都握紧了手里的武器。","options":[{"label":"站在最前面的岗哨（2 体力）","cost":2,"check":{"attr":"wil","diff":13},"ok":{"text":"黑暗里的影子试探了几次，都被你冷静地逼退了。天亮时，大家都看着你。","fx":["wil_exp+5","hometown+3","exp+30"]},"fail":{"text":"你死撑着没动，但手一直在抖。天亮时，你的腿几乎站不稳。","fx":["wil_exp+2","status+:fatigue:2"]}},{"label":"留在后方照顾伤员","fx":["hometown+1","wil_exp+2","rep:church+1"],"text":"你给每一个被碎石划伤的人包好了伤口。"}]},{"id":"ev_mage_trial","kind":"random","pool":"opportunity","weight":10,"once":true,"cond":"flag:magic_tome&&attr.int>=10","title":"魔法师的小测试","scene":"village_autumn","text":"路过的一位魔法师看你手里那本旧册子，挑了挑眉：“读到第几页了？来，我考你一个咒文的结构。”","options":[{"label":"接受考校","check":{"attr":"int","diff":13},"ok":{"text":"你一气说出了咒文的三个层次，他点点头，随手指点了你几句要领。","fx":["int_exp+7","count:arcana+3","exp+30"]},"fail":{"text":"答到一半就卡壳了。他没有责备，只是在你书里夹了一张便条。","fx":["int_exp+3","count:arcana+1"]}},{"label":"婉拒，说还没读熟","fx":["int_exp+2"],"text":"他耸耸肩：“好学生不怕考。”"}]},{"id":"ev_church_exam","kind":"random","pool":"social","weight":8,"cond":"rep.church>=15","portrait":"priest","title":"经义考核","scene":"village_spring","text":"教会每年会对来侍奉的信众做一次经义考核。神父递给你一张写满问答的羊皮纸：“不必紧张，答得出多少算多少。”","options":[{"label":"凭理解作答","check":{"attr":"int","diff":11},"ok":{"text":"你答得条理清楚，神父连连点头，批了一个“优”。","fx":["rep:church+5","int_exp+4","rel:ambrose+1"]},"fail":{"text":"几处条文你记混了，神父叹了口气，批了一个“中”。","fx":["rep:church+2","int_exp+2"]}},{"label":"凭信仰作答","check":{"attr":"wil","diff":11},"ok":{"text":"你写得不多，但每一句都带着一股执着的劲，神父沉默了很久，在末尾画了个圣印。","fx":["rep:church+5","wil_exp+4","rel:ambrose+1"]},"fail":{"text":"写到一半，你对自己的答案产生了怀疑。","fx":["rep:church+2","wil_exp+2"]}}]},{"id":"ev_cursed_trinket","kind":"random","pool":"calamity","weight":7,"cond":"age>=21","title":"诅咒的饰品","scene":"village_autumn","text":"行商贱卖一枚镶着黑石的戒指，说是从坟里挖的。你戴上它的一瞬间，手指像被冰针扎了一下。","options":[{"label":"凝神抵抗，把它摘下来","check":{"attr":"wil","diff":12},"ok":{"text":"你咬着牙摘下戒指，一转手卖给了收旧货的，居然还赚了点。","fx":["wil_exp+4","gold+40"]},"fail":{"text":"你摘了很久才摘下来，手指上留下一圈青黑的印子。","fx":["hp-8","status+:fatigue:2"]}},{"label":"请神父来净化","fx":["rep:church+2","rel:ambrose+1"],"text":"神父在戒指上洒了圣水，黑石裂成了两半。"}]}],"content/farmer_son/events_story.json":[{"id":"ev_capital_arrival","kind":"special","priority":40,"cond":"flag:order_member","title":"初到王都","scene":"village_spring","text":"见习骑士团的营房在王都东区。第一晚，你躺在硬板床上，听着窗外的钟声和远处的马蹄，一时分不清这里是现实还是梦。","options":[{"label":"翻出推荐信，重读一遍","fx":["wil_exp+3","rep:church+1"],"text":"信纸边角已经磨毛了，字迹还是那样工整。"},{"label":"出去走走，认认路","fx":["agi_exp+2","cha_exp+2","exp+15"],"text":"你在夜色里走了一个多时辰，记下了每一条街的名字。"}]},{"id":"ev_knight_rival","kind":"special","priority":30,"cond":"flag:order_member&&level>=8","title":"见习骑士阿拉里克","scene":"village_spring","text":"同期的见习骑士阿拉里克出身贵族，总在训练场上有意无意地和你比较。“农夫的儿子，也配穿这身银甲？”","options":[{"label":"比一场，用实力回答","check":{"attr":"str","diff":14},"ok":{"text":"你一拳不留情面地压倒了他。围观的见习生们起了哄，他咬着牙，第一次正视了你。","fx":["rep:church+3","str_exp+3","cha_exp+2","exp+30","flag+:alaric_respect"]},"fail":{"text":"他略胜一筹，笑得很得意。你却把每一招都记在了心里。","fx":["str_exp+2","wil_exp+3","hp-6"]}},{"label":"不接话，转身去练剑","fx":["wil_exp+3","rep:church+1"],"text":"你把木剑抡得虎虎生风，直到手心磨出了血泡。"}]},{"id":"ev_knight_mentor","kind":"special","priority":30,"cond":"flag:order_member&&level>=10","portrait":"glen","title":"教官的指点","scene":"village_spring","text":"训练结束后，满脸风霜的教官留下了你：“你的剑，招式漂亮，但没杀气。上过战场吗？”","options":[{"label":"如实回答：只对付过哥布林和山贼","fx":["wil_exp+3","exp+20"],"text":"教官哼了一声：“那就多去战场看看。”"},{"label":"请他教怎么在乱战中保命","fx":["agi_exp+4","str_exp+3","exp+30","rep:church+2"],"text":"他一口气教了你七个保命的小窍门，没有一个体面，但都管用。"}]},{"id":"ev_frontline_call","kind":"special","priority":50,"cond":"flag:paladin","title":"前线的征召","scene":"mountain","text":"成为圣骑士后的第一道命令，来自王国和教会的联合署名：调你去北境前线协助布防，同时留意魔王苏醒的任何迹象。","options":[{"label":"服从命令，前往前线（2 体力）","cost":2,"fx":["rep:kingdom+6","rep:church+3","exp+60","hometown-2"],"text":"你在前线待了数日，亲眼看见了魔物的真实模样。"},{"label":"请求暂留故乡，协助布防","fx":["hometown+4","rep:church+1"],"text":"你在村子北口加建了一道木栅，请神父登记了三十个能拿起武器的人。"}]},{"id":"ev_omen_1","kind":"special","when":{"age":27,"season":"spring"},"priority":70,"title":"第一个征兆","scene":"village_spring","text":"开春后，北边的鸟不再飞回来了。老猎人说，山里的野兽都在往南迁。","options":[{"label":
