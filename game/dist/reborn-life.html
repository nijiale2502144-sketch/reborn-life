你替我看看。”\n他顿了顿，补了一句：“别急着认定是谁。”"},"reward":["log:高塔的藏书室，又安静了下来。"],"stages":[{"desc":"在塔里调查，收集线索（行动：调查塔中失窃案，线索 ≥ 3）","done":"count.theft_clue>=3","fx":["goto:n_theft_verdict"],"checks":[{"label":"线索 ≥ 3","cond":"count.theft_clue>=3","cur":"count.theft_clue"}]},{"desc":"揭晓偷书人","done":["flag:theft_solved","flag:theft_framed"]}],"snag":{"p":0.45,"text":"失窃的那卷书，在一夜之间被悄悄放回了架子上。案子，成了一桩没人再提的悬案。"}},{"id":"cellar_lab","type":"side","name":"旧宅的地窖","start":"age>=18&&flag:father_letter","deadlineAge":26,"score":25,"intro":{"portrait":"alfred","title":"被堵住的门","text":"阿尔弗在清点旧宅的仓库时，忽然说了一句：“地窖的暗门，老爷在时，常常一个人下去，一待就是一整夜。”\n他又补了一句：“他走之后，那扇门，就被我用橱柜堵住了。”"},"reward":["log:地窖里的东西，一件一件地被你搬了上来。"],"stages":[{"desc":"清理地窖的暗门，找到父亲的实验室（行动：探索旧宅的地窖，成功 2 次）","done":"count.cellar>=2","fx":["goto:n_cellar_notes"],"checks":[{"label":"成功探索 ≥ 2 次","cond":"count.cellar>=2","cur":"count.cellar"}]},{"desc":"取走父亲留下的东西","done":"flag:cellar_done"}],"snag":{"p":0.45,"text":"一场暴雨灌进了地窖，积水没过了台阶，暗门被泥封住了。"}},{"id":"lockwood_spy","type":"side","name":"宰相的耳目","start":"age>=22&&flag:met_valen&&flag:letters_decoded","deadlineAge":27,"score":25,"intro":{"portrait":"valen","title":"瓦伦的提醒","text":"回廊里，瓦伦头也不回地从你身边走过，低声说了一句：“你家里，有他们的人。”\n你没来得及问，他已经走远了。"},"reward":["log:旧宅里，再没有一只陌生的眼睛。"],"stages":[{"desc":"盯梢宰相府的出入，找出泄露消息的人（行动：盯梢宰相府的出入，线索 ≥ 3）","done":"count.spy_clue>=3","fx":["goto:n_spy_unmask"],"checks":[{"label":"线索 ≥ 3","cond":"count.spy_clue>=3","cur":"count.spy_clue"}]},{"desc":"处理这件事","done":"flag:spy_found"}],"snag":{"p":0.4,"text":"宰相府的人先一步察觉，那条线索，在一夜之间断得干干净净。"}},{"id":"forbidden_tome","type":"hidden","name":"高塔的禁书","start":"memory:m_truth&&flag:tower_admitted&&age>=20","deadlineAge":27,"score":40,"intro":{"portrait":"metis","title":"另一个人生的回响","text":"一个念头，莫名其妙地在你脑子里响起：“圣剑不是剑，是锁。魔晶……是锁的燃料。”\n你不记得是谁告诉你的，也不记得在哪里读到。但它的每一个字，都像刻在了骨头上。\n你想，也许，禁书库里，能找到答案。"},"reward":["log:你读到了关于封印的真相。魔晶，不是魔法的燃料，而是封印的燃料。"],"stages":[{"desc":"潜入高塔禁书库，查阅关于封印的古籍（行动：查阅高塔禁书库，成功 3 次）","done":"count.seal_pages>=3","fx":["goto:n_metis_seal"],"checks":[{"label":"读出的残页 ≥ 3","cond":"count.seal_pages>=3","cur":"count.seal_pages"}]},{"desc":"向墨提斯求证","done":"flag:seal_lore"}]}],"content/noble_heir/script.json":{"name":"灰烬中的家徽","subtitle":"没落贵族 → 大魔法师","unlockCost":300,"desc":"格雷蒙特伯爵家的独子（独女），16 岁。五年前，父亲被控叛国，家产被封。下一次「旧案复议日」在你 28 岁的秋天，那是你唯一的机会。","intro":"王都东区，格雷蒙特旧宅。你是没落伯爵家唯一的继承人，今年十六岁。家里欠着六百金币，下一次旧案复议日，在你二十八岁的秋天。","introPages":[{"title":"旧宅","scene":"manor_spring","text":"王都的东区，有一座没人愿意多看一眼的旧宅。\n三层的石楼，铁艺的围栏，大门上还嵌着褪了色的家徽：一朵被荆棘缠住的白玫瑰。\n五年前，这里每天都有马车进出。现在，只有送账单的信使和债主会来敲门。"},{"title":"五年前","scene":"court","portrait":"alfred","text":"“老爷是被冤枉的。”老管家阿尔弗总是这样说，说了五年。\n五年前，格雷蒙特伯爵被控与魔族勾结，一夜之间下狱，三个月后死在狱中。宰相洛克伍德亲自宣读的判词。家产被封，爵位被停，昔日宾客的名字，一个接一个从请帖上消失。\n没有人告诉你真相。你只知道，父亲被带走前，把你抱在怀里，说了一句话：“别恨，要查清楚。”"},{"title":"十六岁","scene":"manor_spring","portrait":"noble","text":"今天你十六岁。\n母亲病着，账本上全是赤字，你手里有半屋子读不完的旧书，和一点点还没熄灭的火。\n王国每十二年举行一次「旧案复议日」，被判有罪的家族可以请求重审。上一次，是父亲去世后的第二个月。下一次，在你二十八岁的秋天。\n十二年。足够一个人成为另一个人。"},{"title":"玩法提示","scene":"manor_spring","text":"时间以「季」为单位，每一季你有几点体力，每个行动都要花费体力。\n这一世，你不能靠种地吃饭：家教、誊写、变卖旧物能换钱，高塔的课程和研读奥术能让你变强，档案馆和宴会里藏着真相和人脉。\n顶栏的「家族名望」是格雷蒙特这个姓氏在王都的分量，「债务」每年都会涨利息，两个数字都不会等你。\n把鼠标移到（手机上点一下）各项数值上，可以看到它们的说明。\n十二年之后，你要站在复议日的法庭上。想清楚，你要带着什么走进去。"}],"start":{"age":16,"attrs":{"str":8,"agi":9,"int":14,"wil":11,"cha":13,"luk":7},"gold":300,"hometown":25,"rep":{"tower":0,"kingdom":8,"church":0,"guild":0},"rel":{"vera":4,"alfred":3},"gear":["signet_ring"],"counters":{"debt":600},"flags":{"vera_alive":true,"library_open":true}},"labels":{"hometown":"家族名望","rep":{"tower":"高塔声望","kingdom":"王国声望"}},"help":{"hometown":"家族名望：格雷蒙特这个姓氏在王都的分量。≥ 60 时每回合体力上限 +1（人脉带来的便利）；≤ 15 时体力上限 -1。债务太重、变卖家产会让它下降，宴会、还债和体面的成就会让它上升。复议日呈堂时，名望也会提高成功率（最多 +8%，名望 80 封顶）。","gold":"金币：给债主还款、买药、买书、雇誊写员（多出一点体力）、出席宴会都要钱。每回合要交一笔体面的生活费，交不起家族名望会下降。","rank":"等阶：落魄少爷 → 学徒 → 初级 → 中级 → 高级魔法师。通过高塔的考核晋升，影响技能的解锁，也计入转生点。"},"display":[{"key":"debt","label":"债务","top":true,"help":"债务：家里欠债主的钱。每年年底会涨 40 金币利息；≥ 1200 时家族名望每年下降；清零后每年还会涨名望。随时可以用「偿还债务」行动还款，每次 100 金币。"},{"key":"lead","label":"线索","help":"线索：第三章之前遇到的、暂时还不能算作证据的零碎信息。第三章开启时，最多折算为 2 份证据。"},{"key":"evidence","label":"证据","help":"证据：能证明父亲被冤枉的线索。只有进入第三章（或 24 岁起）之后才能计入，之前遇到的只会先记成「线索」，第三章开启时最多折算 2 条；档案馆、书记官、密信这几项调查也要等第三章才能开始。复议日呈堂时，证据越多，成功率越高（每份 +3%，最多计 9 份），≥ 6 份和 ≥ 9 份还会解锁更有力的陈词。来源有档案馆、书记官、父亲的密信、老管家的暗格、艾琳和一些事件。"},{"key":"allies","label":"盟友","help":"盟友：公开答应在复议日站在你这一边的人。只有进入第四章之后，通过「请求支持」行动才能得到。墨提斯、艾琳、瓦伦、阿尔弗各自有一段故事，每位盟友让呈堂成功率 +6%（最多计 3 位）。"}],"livingCost":25,"livingMsg":"这一季的开销没有着落，仆人们开始私下议论，债主的信也更勤了","ranks":["落魄少爷","学徒魔法师","初级魔法师","中级魔法师","高级魔法师","大魔导师"],"npcs":{"vera":{"name":"母亲薇拉"},"alfred":{"name":"老管家阿尔弗"},"metis":{"name":"墨提斯导师"},"elin":{"name":"艾琳"},"valen":{"name":"瓦伦"}},"staminaMods":[{"cond":"hometown>=60","add":1,"label":"家族名望 ≥ 60：人脉的便利"},{"cond":"hometown\u003c=15","add":-1,"label":"家族名望 ≤ 15：世人避之不及"}],"powerBonus":[{"cond":"status:blessed","add":3,"label":"祝福状态"},{"cond":"flag:metis_gift","add":3,"label":"墨提斯的赠礼"},{"cond":"flag:seal_lore","add":3,"label":"封印学知识"}],"clearCond":["flag:trial_won","flag:revenge_done"],"aspirations":[{"id":"mid_mage","name":"塔中之星","desc":"在复议日前成为中级魔法师","cond":"rank>=4","score":30},{"id":"rich","name":"重振家业","desc":"债务清零，并持有 800 金币","cond":"count.debt\u003c=0&&gold>=800","score":30},{"id":"justice","name":"为父申冤","desc":"在复议日上胜诉","cond":"flag:trial_won","score":30}],"yearEnd":[{"cond":"count.debt>0","text":"债主送来了今年的利息账单。","fx":["count:debt+40"]},{"cond":"memory:m_n_debt&&count.debt>0","text":"你对账本上的每一行红字都很熟，利息被你一笔一笔地压了下去。","fx":["count:debt-10"]},{"cond":"count.debt>=1200","text":"债务压得家里喘不过气，王都里到处是关于格雷蒙特家的闲话。","fx":["hometown-6"]},{"cond":"count.debt\u003c=0","text":"账本上再没有赤字，管家第一次在年底露出了笑容。","fx":["hometown+4"]},{"cond":"true","text":"人们渐渐不再提起格雷蒙特这个姓氏。","fx":["hometown-2"]},{"cond":"age==16","text":"十六岁的一年过去了。你第一次读完了父亲书房里最旧的那本书。","fx":[]},{"cond":"age==17","text":"十七岁，你开始分得清，谁是真的同情，谁只是好奇。","fx":[]},{"cond":"age==18","text":"十八岁了。母亲咳得更厉害，你把夜里的灯又拨亮了一点。","fx":[]},{"cond":"age==19","text":"十九岁。你第一次在高塔的走廊里被人叫了一声“同学”。","fx":[]},{"cond":"age==20","text":"二十岁。镜子里的人，眉眼越来越像画像上的父亲。","fx":[]},{"cond":"age>=21&&age\u003c=24","text":"又一年。离复议日更近了，你比去年更强，也更清楚自己还缺什么。","fx":[]},{"cond":"age>=25&&age\u003c=27","text":"宰相府的灯，夜里总是亮着。你知道，对方也在等那一天。","fx":[]},{"cond":"true","fx":["count:hires-99"]},{"cond":"fate>=3&&count.debt>0","text":"债主又找了个名目，多收了一笔手续费。","fx":["count:debt+20"]},{"cond":"true","fx":["flagclear:y_"]}],"autoLearn":[{"skill":"spark","cond":"count.arcana>=2","story":{"title":"魔法飞弹","text":"父亲书房里的那本入门册，你读了不下十遍。这一夜，你照着图解念出最后一个音节，指尖亮起一颗橙红色的小火星，在烛光里跳了一下。\n你屏住呼吸，把它向前一推：火星擦过窗棂，在院子里的积雪上点出了一个小黑洞。\n你笑了。五年来，第一次笑得这么响。"},"checks":[{"label":"研读奥术 ≥ 2 次","cond":"count.arcana>=2","cur":"count.arcana"}]},{"skill":"ice_lance","cond":"count.arcana>=5&&attr.int>=14","story":{"title":"冰锥术","text":"高塔的讲师在黑板上画了一根冰锥，转身问：“谁能告诉我，它为什么会尖？”\n你举了手。\n课后，他把你留下来，单独教了你一个手势：“你的想法是对的，现在，把它变成真的。”\n你的掌心凝出一根透明的细刺，在阳光下闪了一下。"},"checks":[{"label":"研读奥术 ≥ 5 次","cond":"count.arcana>=5","cur":"count.arcana"},{"label":"智力 ≥ 14","cond":"attr.int>=14","cur":"attr.int"}]},{"skill":"fireball","cond":"count.arcana>=9&&attr.int>=16","story":{"title":"火球术","text":"你合上书的那一刻，空气里的温度忽然变了。\n你知道该念哪一句，该在哪个音节上收气。掌心浮起一团越来越亮的火焰，照亮了整座书房。\n阿尔弗站在门口，手里的茶盘微微发抖，半晌才说：“老爷年轻时，也是这样的。”"},"checks":[{"label":"研读奥术 ≥ 9 次","cond":"count.arcana>=9","cur":"count.arcana"},{"label":"智力 ≥ 16","cond":"attr.int>=16","cur":"attr.int"}]},{"skill":"mana_shield","cond":"count.arcana>=12&&attr.wil>=13","story":{"title":"魔力护盾","text":"意志是魔法最后的门槛。\n你闭着眼，一遍遍把魔力从胸口引到指尖，再从指尖织成一层透明的壳。你想起很多不愿想起的东西，又一件件把它们放在壳外面。\n睁开眼的时候，一圈微光静静地漂在你身周，像一口刚温好的水。"},"checks":[{"label":"研读奥术 ≥ 12 次","cond":"count.arcana>=12","cur":"count.arcana"},{"label":"意志 ≥ 13","cond":"attr.wil>=13","cur":"attr.wil"}]},{"skill":"arcane_burst","cond":"count.arcana>=18&&attr.int>=22","story":{"title":"奥术洪流","text":"没有咒文，没有手势。\n你站在高塔的试炼场中央，什么也没有想，只是把魔力一口气放了出去。远处的石靶应声碎成了粉末，尘烟里，所有旁观的学徒都安静了。\n那一刻你明白了：魔法最强的时候，不是被控制，而是被信任。"},"checks":[{"label":"研读奥术 ≥ 18 次","cond":"count.arcana>=18","cur":"count.arcana"},{"label":"智力 ≥ 22","cond":"attr.int>=22","cur":"attr.int"}]},{"skill":"time_slow","cond":"flag:metis_gift","story":{"portrait":"metis","title":"时缓术","text":"墨提斯把一枚旧怀表放在你的手心：“这不是魔法，是一个提醒。”\n他教你把意识沉进那一秒的缝隙里，让周围的一切慢下来。“记住，”他说，“真正的敌人从来不是对手，是你的慌乱。”\n你听见怀表的指针，一格一格地走。很慢，很稳。"},"checks":[{"label":"完成墨提斯的三道题（支线）","cond":"flag:metis_gift"}]}],"endings":[{"id":"hearth_reborn","name":"家徽重燃","kind":"true","mult":1.5,"cond":"flag:trial_won&&rank>=4&&count.debt\u003c=300","text":"复议日的法庭上，你把最后一份证据放在了审判席上。洛克伍德的脸色，从红变白，又从白变灰。\n判决宣读的那一刻，旁听席上有人站了起来，有人哭了，有人悄悄擦了擦眼睛。老管家阿尔弗站在最后一排，手里攥着一块洗得发白的手帕。\n几天后，旧宅的大门重新挂上了白玫瑰的家徽。你站在门前，母亲坐在窗边，阳光落在她的白发上。\n你想起十六岁的那个春天，想起五年前父亲说的那句话：“别恨，要查清楚。”\n你查清楚了。而且，你没有变成自己恨的那种人。","hint":"赢得复议日，并让家业重新站稳。"},{"id":"vindicated","name":"沉冤得雪","kind":"normal","mult":1,"cond":"flag:trial_won","text":"判决书上，格雷蒙特伯爵的名字终于被擦去了“叛国”二字。\n你走出法庭的时候，阳光很刺眼。有人在你身后鼓掌，有人低声议论，有人和你擦肩而过时，轻轻说了一句：“令尊是个好人。”\n可你心里并不轻松。这十二年里，你错过了很多东西，有些再也补不回来。\n但至少，父亲的名字，不会再被人用来吓唬孩子了。","hint":"在复议日上胜诉。"},{"id":"avenger","name":"复仇者","kind":"normal","mult":1,"cond":"flag:revenge_done","text":"你用魔法击败了宰相。\n法庭的穹顶被炸开了一道缺口，碎石和灰尘从空中落下。洛克伍德倒在地上，睁着眼，看着你，像是想说什么，却什么也没有说出口。\n你赢了。可你听见身后有人喊，有人逃，有人拔出了剑。\n格雷蒙特这个姓氏，从此以另一种方式，被所有人记住了。你站在废墟里，忽然不知道，接下来还有什么可以做。","hint":"用另一种方式，了结这笔旧账。"},{"id":"hush_money","name":"沉默的代价","kind":"normal","mult":0.9,"cond":"flag:bought_off","text":"你收下了宰相的条件。\n家徽被重新挂回了旧宅的大门，债务被一笔勾销，母亲得以在温暖的房间里安养晚年。官方的文书上，格雷蒙特这个姓氏，不再有“叛国”二字，只是也没有“冤”字。\n你再也没有提起过那场审判。\n每逢秋天，阿尔弗都会在你书房的窗前站很久，什么也不说。\n后来你成了高塔里最受人敬重的魔法师，所有人都说你年轻有为。只有你自己知道，书架最底层那份没有交出去的证据，一直都在。","hint":"接受了某个人的条件。"},{"id":"let_go","name":"尘埃落定","kind":"normal","mult":1,"cond":"flag:let_go","text":"你在法庭的门口停住了脚步。\n阳光从高窗斜斜地落下来，落在你手里那一叠没有递出去的证据上。你想起很多个夜晚，想起母亲、阿尔弗、墨提斯和艾琳，想起那些愿意陪你走一程的人。\n你把证据收进怀里，转身走下了台阶。\n后来，你成了高塔里最安静的那位学者。偶尔有年轻的学徒问起：“您的家徽是什么？”\n你笑笑，说：“一朵花。以后再讲。”","hint":"放下一切，转身离开法庭。"},{"id":"lost_trial","name":"败诉","kind":"fail","mult":0.6,"cond":"flag:trial_lost","text":"法官的木槌落下的那一声，你听得很清楚。\n“驳回。”\n洛克伍德坐在席上，礼貌地对你点了点头，像是在送一位客人。\n你走出法庭的时候，天正下着小雨。管家撑着伞迎上来，什么也没问。你们沿着湿漉漉的石板路慢慢走回旧宅，谁也没有说话。\n十二年。你还欠自己一个答案。","hint":"站上法庭，却没能赢。"},{"id":"last_stand","name":"殊死一搏","kind":"fail","mult":0.6,"cond":"flag:final_lost","text":"魔法在法庭里炸开的时候，你以为自己会赢。\n洛克伍德抬了抬手，一道你从没见过的光幕挡住了你的全部力量。你听见自己的声音，隔得很远：“……这不可能。”\n他叹了口气：“孩子，你父亲当年，也是这么想的。”\n黑暗合上之前，你想起了那朵被荆棘缠住的白玫瑰。","hint":"向宰相发起决斗，却倒下了。"},{"id":"early_death","name":"天不假年","kind":"fail","mult":0.6,"cond":"flag:dead","text":"你没能走到复议日。\n旧宅的钟声在一个清晨停了。阿尔弗把你的书房原样锁好，钥匙放在了母亲枕下。\n很多年后，有位年轻的学者在一间尘封的书房里翻到了一本写满批注的旧册子，扉页上写着：“别恨，要查清楚。”\n那是你的字迹。","hint":"人生在半路中断。"},{"id":"endless","name":"平淡一生","kind":"fail","mult":0.6,"cond":"true","text":"复议日过去了。\n你没有走进那座法庭，也没有彻底放下。很多年里，你在高塔和旧宅之间来回走，读书、教课、还债，把日子过成了一条平静的河。\n只是每年秋天，你都会在书房的窗前，坐上一整个下午。","hint":"没有走到任何一个终点。","safety":true}],"scenes":{"spring":"manor_spring","summer":"manor_spring","autumn":"manor_autumn","winter":"manor_winter"},"fateRules":["灾厄类随机事件出现的权重 +20%，支线任务的期限提前 1 年，敌人战力 +0.6%。","敌人战力共 +1.2%，落败时受到的伤害 +3%。","复议日提前 1 年到来；债务每年多涨 20 金币利息，查案类检定难度 +1。","敌人战力共 +1.8%，落败时受到的伤害共 +8%，复议日呈堂更难。","敌人战力共 +2.4%，主线任务的期限提前 1 年，濒死判定的难度 +2。"],"counterGates":{"evidence":{"cond":["flag:ch3_open","age>=24"],"alt":"lead"}},"dungeonLoot":{"cave":["oak_staff","tower_cloak","silver_ring"],"mine":["crystal_staff","silk_robe","silver_ring"],"grave":["silk_robe","lion_pendant","crystal_staff"],"fortress":["archmage_staff","star_robe","dragon_charm"]}},"content/scripts.json":["farmer_son","noble_heir","thief","voyager"],"content/skills.json":[{"id":"slash","name":"破绽斩","route":"martial","mp":0,"win":0.08,"desc":"抓住对手的破绽，一击制敌。","learn":"向格伦学艺 2 次，格伦好感 ≥ 2","cd":0},{"id":"parry","name":"格挡反击","route":"martial","mp":0,"win":0.02,"injure":0.4,"desc":"以守为攻，落败时也能卸掉大半力道。","learn":"向格伦学艺 5 次，格伦好感 ≥ 4","cd":0},{"id":"sword_master","name":"老兵绝技","route":"martial","mp":0,"win":0.14,"desc":"格伦压箱底的剑技，毫无花哨，只求一击。","learn":"为格伦洗清冤屈","cd":2},{"id":"heal_light","name":"治愈之光","route":"holy","mp":6,"win":0,"heal":0.25,"injure":0.7,"desc":"掌心浮起温暖的光，伤口慢慢合拢。","learn":"帮神父打杂 3 次，教会声望 ≥ 15","cd":1},{"id":"smite","name":"圣光斩","route":"holy","mp":8,"win":0.1,"vs":{"undead":0.15,"demon":0.15},"desc":"以圣光灌注剑锋，对亡灵和魔族格外有效。","learn":"帮神父打杂 10 次，教会声望 ≥ 40","cd":1},{"id":"holy_shield","name":"圣盾","route":"holy","mp":10,"win":0.05,"injure":0.2,"desc":"一面看不见的光盾挡在身前。","learn":"成为修士，教会声望 ≥ 60","cd":2},{"id":"spark","name":"魔法飞弹","route":"magic","mp":5,"win":0.14,"desc":"最基础的攻击魔法，百发百中。","learn":"研读奥术 3 次","cd":0},{"id":"fireball","name":"火球术","route":"magic","mp":10,"win":0.26,"desc":"一团炽热的火焰，威力大，耗魔也大。","learn":"研读奥术 8 次，智力 ≥ 12","cd":2},{"id":"mana_shield","name":"魔力护盾","route":"magic","mp":8,"win":0.06,"injure":0.25,"desc":"以魔力在身周织出护盾。","learn":"研读奥术 14 次，意志 ≥ 14","cd":1},{"id":"ice_lance","name":"冰锥术","route":"magic","mp":8,"win":0.18,"cd":0,"desc":"凝结空气中的水汽，射出一根尖锐的冰锥。","learn":"研读奥术 5 次，智力 ≥ 14"},{"id":"arcane_burst","name":"奥术洪流","route":"magic","mp":16,"win":0.34,"cd":2,"desc":"把魔力不加修饰地倾泻出去，威力惊人。","learn":"研读奥术 18 次，智力 ≥ 22"},{"id":"time_slow","name":"时缓术","route":"magic","mp":14,"win":0.1,"injure":0.1,"cd":2,"desc":"让周围的时间短暂地慢了下来，对手的攻势变得迟缓。","learn":"完成墨提斯的三道试炼"},{"id":"backstab","name":"背刺","route":"shadow","mp":0,"win":0.08,"desc":"从对手看不见的角度出手，对人类尤其有效。","learn":"向灰鼠学艺 2 次","cd":0,"vs":{"human":0.06}},{"id":"smoke_bomb","name":"烟雾弹","route":"shadow","mp":0,"win":0.02,"desc":"一颗烟雾弹，换一次全身而退。","learn":"在黑市买到配方，或向灰鼠学艺 4 次","cd":0,"injure":0.4},{"id":"shadow_step","name":"影步","route":"shadow","mp":0,"win":0.14,"desc":"脚步没有声音，影子比人先到。","learn":"通过三手试炼，敏捷 ≥ 18","cd":2},{"id":"board","name":"跳帮战","route":"tide","mp":0,"win":0.08,"desc":"抓住缆绳荡过去，抢在对方列阵之前。","learn":"在船上跑满 3 趟航线","cd":0,"vs":{"human":0.05}},{"id":"storm_ward","name":"风暴庇护","route":"tide","mp":0,"win":0.02,"desc":"站稳甲板，借浪卸力。","learn":"一次风暴中守住了船","cd":0,"injure":0.4},{"id":"tide_surge","name":"借潮之势","route":"tide","mp":0,"win":0.14,"desc":"把整片海的力量借到手里。","learn":"得到人鱼的认可","cd":2}],"content/thief/actions.json":[{"id":"pickpocket","name":"扒窃","cost":1,"group":"daily","hint":"金币·敏捷·通缉度","desc":"人多的地方，手快的人吃饭。成功率看敏捷，失败会挨揍、涨通缉度。","check":{"attr":"agi","diff":11,"seasonDiff":{"winter":1}},"ok":{"text":"指尖一勾，钱袋已经换了主人。你贴着墙根慢慢走远，心跳平稳得像什么都没发生。","fx":["gold+30","agi_exp+3","count:heat+4","exp+12"]},"fail":{"text":"手刚伸进去就被抓住了手腕。你挨了两拳，丢下一把铜币才脱身。","fx":["hp-5","agi_exp+1","count:heat+8","gold-6"]}},{"id":"burgle","name":"撬锁入室","cost":2,"group":"daily","cond":"age>=17","hint":"金币·敏捷·通缉度","desc":"挑一户没人的人家，用撬锁工具进去。来钱快，但通缉度涨得也快。","check":{"attr":"agi","diff":13},"ok":{"text":"锁舌“咔”地一声松开。你在黑暗里摸到了抽屉，摸到了首饰盒，又摸到了窗台，然后原路退了出去。","fx":["gold+75","agi_exp+4","int_exp+1","count:heat+12","exp+24"]},"fail":{"text":"楼板突然响了。你从后窗跳出去的时候，听见身后有人喊“抓贼”。","fx":["hp-9","agi_exp+1","count:heat+16"]}},{"id":"dock_work","name":"码头扛包","cost":2,"group":"daily","hint":"金币·体魄·降温","desc":"正经活儿，钱少，但没人盯着你。","fx":["gold+22","str_exp+3","count:heat-3","hometown+1"],"texts":["船不等人，你和一群光膀子的汉子一起，把一麻袋一麻袋的货搬上跳板。","工头给你结了账，瞥了你的手一眼：“手这么细，别干这个了。”你没接话。"]},{"id":"learn_rat","name":"向灰鼠学艺","cost":2,"group":"daily","cond":"flag:met_rat&&!flag:rat_dead","hint":"敏捷·灰鼠好感·背刺","desc":"灰鼠的手艺，是鼠街最干净的那一种。","fx":["agi_exp+4","int_exp+1","rel:rat+1","count:knife+1","exp+16"],"texts":["灰鼠让你闭着眼开锁，开不了就不给饭吃。","“手要稳，心要冷，”他叼着草茎，“最后一步，脸要笑。”"]},{"id":"scout","name":"打探消息","cost":2,"group":"social","hint":"情报·魅力","desc":"在酒馆、茶摊、赌桌旁，花点时间，听一点不该听的话。","check":{"attr":"cha","diff":11},"ok":{"text":"一个醉醺醺的守卫把轮岗表、换班时间、哪条水渠不上锁，一股脑地倒给了你。","fx":["count:intel+1","cha_exp+3","rep:shadow+1","exp+6"]},"fail":{"text":"你问得太直，对方警觉地看了你一眼，转身走了。","fx":["cha_exp+1","count:heat+2"]}},{"id":"recruit","name":"拉拢同伙","cost":3,"group":"social","cond":"rep.shadow>=15&&count.crew\u003c5","hint":"同伙·魅力","desc":"一个人偷东西，两个人才能干大活。","check":{"attr":"cha","diff":12},"ok":{"text":"你在酒馆里坐了一晚上，到天亮的时候，对方把手拍在桌上：“算我一个。”","fx":["count:crew+1","cha_exp+3","rep:shadow+2","gold-20"]},"fail":{"text":"对方听完你的计划，笑着摇了摇头，还顺手蹭走了你的酒钱。","fx":["gold-20","cha_exp+1"]}},{"id":"lay_low","name":"避风头","cost":2,"group":"daily","cond":"count.heat>=8","hint":"降通缉度·回血","desc":"待在下水道或阁楼里，哪都不去。","fx":["count:heat-18","heal:0.3","wil_exp+1"],"texts":["你在阁楼里蜷了三天，听着楼下巡逻队的脚步一次次走过。","你什么也没干，只是听水管滴水。有时候，什么也不干也是一种技术。"]},{"id":"bribe_guard","name":"贿赂巡逻队","cost":1,"group":"social","cond":"gold>=50&&count.heat>=10","hint":"金币·降通缉度","desc":"五十个金币，让某个巡逻队长“没看见”你。","fx":["gold-50","count:heat-25","rep:shadow+1"],"texts":["钱袋换了手，巡逻队长咳嗽了一声：“最近天黑得早，注意脚下。”"]},{"id":"help_orphans","name":"接济孤儿院","cost":1,"group":"social","cond":"gold>=30","hint":"街区人望","desc":"孤儿院的老嬷嬷从不问钱从哪里来。","fx":["gold-30","hometown+4","count:donate+1","rel:lila+1",{"if":"memory:m_t_lila","then":["hometown+2","cha_exp+1"]}],"texts":["一袋面粉，一小包盐，嬷嬷接过去的时候，手抖了抖。","孩子们围过来，叫你“手哥哥”。你难得地没有躲开。"]},{"id":"go_blackmarket","name":"去黑市逛逛","cost":1,"group":"daily","cond":"age>=17&&rep.shadow>=5","hint":"装备·配方·情报","desc":"黑市在下城最深的那条地下街，见面不问姓名。","fx":["goto:ev_black_market"]},{"id":"go_tavern","name":"去「醉鼠」酒馆","cost":1,"group":"social","cond":"age>=17","hint":"赌局·传闻·情报","desc":"鼠街最老的酒馆，赌桌、传闻和斗殴，什么都有。","fx":["goto:ev_tavern"]},{"id":"dg_sewer","name":"探索鼠街下水道","cost":4,"group":"adventure","tag":"adventure","cond":"flag:met_rat","hint":"战斗·宝箱","desc":"推荐等级 3–6，共 4 层。","fx":[],"dungeon":"sewer","dungeonName":"鼠街下水道"},{"id":"dg_warehouse","name":"夜探红手帮仓库区","cost":5,"group":"adventure","tag":"adventure","cond":"flag:guild_member&&level>=6","hint":"战斗·宝箱","desc":"推荐等级 6–10，共 5 层。红手帮的看门狗可不讲道理。","fx":[],"dungeon":"warehouse","dungeonName":"红手帮仓库区"},{"id":"dg_manor","name":"夜袭贵族宅邸","cost":5,"group":"adventure","tag":"adventure","cond":"flag:guild_member&&level>=10&&rep.shadow>=30","hint":"战斗·宝箱","desc":"推荐等级 10–14，共 6 层。屋顶、窗台、书房，最后是魔法守卫。","fx":[],"dungeon":"manor_heist","dungeonName":"贵族宅邸"},{"id":"dg_vault","name":"潜入王城地下水渠","cost":6,"group":"adventure","tag":"adventure","cond":"flag:half_key&&level>=15","hint":"战斗·宝箱","desc":"推荐等级 15–20，共 7 层。通往魔晶库的暗道，只有一半的钥匙。","fx":[],"dungeon":"vault_outer","dungeonName":"王城地下水渠"},{"id":"guild_trial","name":"参加三手试炼","cost":3,"group":"quest","tag":"adventure","cond":"quest.main_key==active&&qstage.main_key==0&&flag:met_rat&&!flag:trial_try3","hint":"影子公会","desc":"三手：偷到、开到、跑掉。敏捷检定，最多三次机会。","check":{"attr":"agi","diff":14,"memDiff":{"id":"m_t_rat","diff":-2}},"ok":{"text":"第一手，你摸走了考官腰间的钥匙；第二手，你开了那扇连他自己都打不开的门；第三手，你从他身后走过，他还在找。\n他终于笑了：“欢迎，影子。”","fx":["flag+:guild_member","rep:shadow+15","agi_exp+6","exp+40"]},"fail":{"text":"第三手，你被抓住了衣领。考官把你扔回了街上：“回去练练。”","fx":["hp-6","agi_exp+2",{"if":"flag:trial_try2","then":["flag+:trial_try3"],"else":[{"if":"flag:trial_try1","then":["flag+:trial_try2"],"else":["flag+:trial_try1"]}]}]}},{"id":"search_hideout","name":"搜寻灰鼠的藏身处","cost":3,"group":"quest","tag":"adventure","cond":"quest.main_key==active&&qstage.main_key==1&&flag:rat_dead&&!flag:half_key&&!flag:hideout_try3","hint":"半把钥匙","desc":"灰鼠把另一半钥匙藏在鼠街的某个角落。智力检定，最多三次机会。","check":{"attr":"int","diff":13},"ok":{"text":"你想起灰鼠常说的那句“最安全的地方，是最没人想看的地方”。你在他的旧床板下，摸到了一截发黑的钥匙。","fx":["flag+:half_key","int_exp+4","exp+30"]},"fail":{"text":"你把阁楼翻了个底朝天，只翻出一堆灰和老鼠屎。","fx":["int_exp+2","hp-3",{"if":"flag:hideout_try2","then":["flag+:hideout_try3"],"else":[{"if":"flag:hideout_try1","then":["flag+:hideout_try2"],"else":["flag+:hideout_try1"]}]}]}},{"id":"steal_plan","name":"窃取魔晶库图纸","cost":4,"group":"quest","tag":"adventure","cond":"quest.main_key==active&&qstage.main_key==2&&!flag:vault_plan&&!flag:plan_try3","hint":"月蚀之夜","desc":"王城建造署的档案室里，有魔晶库的旧图纸。敏捷检定，最多三次机会。","check":{"attr":"agi","diff":15,"memDiff":{"id":"m_t_mask","diff":-2}},"ok":{"text":"档案室的锁并不难，难的是在守夜人转身的那十二息里，把三十七张图纸原样放回去。你带走了一份描摹。","fx":["flag+:vault_plan","agi_exp+5","count:heat+10","exp+40"]},"fail":{"text":"守夜人回头的那一瞬，你正趴在书架上。你从窗口跳下去，在屋檐上摔了一跤。","fx":["hp-10","count:heat+14",{"if":"flag:plan_try2","then":["flag+:plan_try3"],"else":[{"if":"flag:plan_try1","then":["flag+:plan_try2"],"else":["flag+:plan_try1"]}]}]}},{"id":"challenge_boss","name":"挑战红手帮老大","cost":4,"group":"quest","tag":"adventure","cond":"quest.red_hand_war==active&&flag:warehouse_cleared&&!flag:red_hand_broken","hint":"红手帮","desc":"是时候让「断指」知道，鼠街不是他一个人的。","fx":["goto:t_red_boss_duel"]},{"id":"free_lila_brother","name":"营救莉拉的哥哥","cost":4,"group":"quest","tag":"adventure","cond":"quest.lila_brother==active&&qstage.lila_brother==1&&!flag:brother_free&&!flag:brother_try3","hint":"莉拉","desc":"王城监牢的第二层。敏捷检定，最多三次机会。","check":{"attr":"agi","diff":14},"ok":{"text":"钥匙在锁孔里转了半圈，你扶起那个瘦得脱形的人，从水牢旁边的暗门里钻了出去。","fx":["flag+:brother_free","agi_exp+4","count:heat+14","rel:lila+2","exp+30"]},"fail":{"text":"走廊里的火把突然亮了。你们躲进了一个空牢房，在黑暗里屏息了很久，才勉强退出来。","fx":["hp-6","count:heat+8",{"if":"flag:brother_try2","then":["flag+:brother_try3"],"else":[{"if":"flag:brother_try1","then":["flag+:brother_try2"],"else":["flag+:brother_try1"]}]}]}},{"id":"fetch_goods","name":"替老鬼取货","cost":3,"group":"quest","tag":"adventure","cond":"quest.gu_list==active&&count.goods\u003c3","hint":"老鬼的货单","desc":"老鬼的货单上有三件货，每一件都不好取。敏捷检定。","check":{"attr":"agi","diff":13},"ok":{"text":"货在你的怀里，还带着别人家里的檀香味。老鬼验货的时候，眼睛都没眨一下。","fx":["count:goods+1","agi_exp+3","count:heat+8","gold+20"]},"fail":{"text":"你空着手回来，身上多了两道看门犬的牙印。","fx":["hp-8","count:heat+6"]}},{"id":"help_cass","name":"协助卡斯办案","cost":2,"group":"social","cond":"flag:met_cass&&quest.cass_hunt==active&&count.cass_help\u003c3","hint":"卡斯好感","desc":"卡斯手里有几桩悬案，需要鼠街的人才知道的消息。一共可以帮三次。","check":{"attr":"cha","diff":11},"ok":{"text":"你把鼠街里零碎的传闻，一条一条地捋给她听。卡斯在本子上记了很久，抬头看你的眼神，不再像看一个贼。","fx":["rel:cass+2","count:cass_help+1","cha_exp+3","count:heat+2","exp+10"]},"fail":{"text":"你说得含糊，她也听得皱眉。“你在替谁隐瞒什么？”","fx":["rel:cass+1","count:cass_help+1","count:heat+4"]}},{"id":"report_cass","name":"把红手帮的罪证交给卡斯","cost":1,"group":"social","cond":"flag:red_hand_broken&&flag:met_cass&&!flag:cass_gift_red","hint":"卡斯好感","desc":"断指的账本里，有几页，足够卡斯拿去结案。","fx":["goto:t_report_cass"]}],"content/thief/events.json":[{"id":"t_meet_rat","kind":"special","title":"灰鼠","text":"夜里，你的手刚伸进一个老头的袖子，就被另一只更快的手扣住了。\n“手法不错，”老头吐掉嘴里的草茎，“就是脸上写着‘我在偷’三个字。”\n他松开手，看着你，像在掂量一块不知道值不值钱的料。","options":[{"label":"老老实实挨训，问他是谁","text":"“鼠街的灰鼠，”他说，“想活得久一点，就跟我来。”从这一夜起，你有了一个师父，虽然他从来不承认。","fx":["flag+:met_rat","rel:rat+3","int_exp+2"]},{"label":"趁他不备，再偷一次","check":{"attr":"agi","diff":14},"ok":{"text":"你在他松手的刹那，摸走了他的烟袋。灰鼠愣了一下，哈哈大笑：“有意思，真有意思！”","fx":["flag+:met_rat","rel:rat+3","agi_exp+4","gold+10"]},"fail":{"text":"他连头也没回，一把按住你的手，顺势拧了半圈。“疼吗？记住这个疼。”","fx":["hp-6","flag+:met_rat","rel:rat+1","agi_exp+1"]}},{"label":"掉头就跑","text":"你钻进巷子，跑了三条街才敢回头。身后没有脚步声，只有一声很轻的笑。","fx":["agi_exp+2","flag+:met_rat"]}],"when":{"age":16,"season":"autumn"},"priority":70,"portrait":"rat","scene":"alley"},{"id":"t_meet_lila","kind":"special","title":"巷口的女孩","text":"你在蹲点的时候，被人从背后拍了一下。回头，是个扎着脏辫子的女孩，指着你要偷的那辆货车：“别动，那是孤儿院的粮。”\n她叫莉拉，十五岁，在孤儿院长大，偶尔也替嬷嬷“拿”点东西。","options":[{"label":"把到手的面包分她一半","text":"她接过去，咬了一口：“……行，你不算坏人。”","fx":["flag+:met_lila","rel:lila+3","hometown+2"]},{"label":"跟她打听孤儿院的事","text":"莉拉说了很多：谁家的孩子被送走，谁的病没人管。你听着，心里有点堵。","fx":["flag+:met_lila","rel:lila+2","cha_exp+2"]},{"label":"不理她，转身走掉","text":"你走出老远，才发现她一直在后面远远地看着你。","fx":["flag+:met_lila","rel:lila+1"]}],"when":{"age":17,"season":"spring"},"priority":65,"portrait":"lila","scene":"alley"},{"id":"t_red_threat","kind":"special","title":"红手印","text":"一夜之间，鼠街的墙上多了一只红手印。\n红手帮的人在街口收“保护费”：卖菜的、修鞋的、摆摊的，一个也不放过。领头的是个缺了小指的男人，人称「断指」。\n有人悄悄看向你，什么也没说。","options":[{"label":"先观察几天，看他们的人手","text":"你蹲在屋顶上数了三个晚上。他们有十二个人，三条狗，一间仓库。","fx":["flag+:red_hand_threat","int_exp+3","count:intel+1","quest:start:red_hand_war"]},{"label":"去找灰鼠商量","text":"灰鼠听完，沉默了很久：“红手帮不是普通的地头蛇。小心点，别一个人去。”","fx":["flag+:red_hand_threat","rel:rat+1","quest:start:red_hand_war"]},{"label":"装作没看见","text":"但街坊们看你的眼神，变得有点不一样。","fx":["flag+:red_hand_threat","hometown-3","quest:start:red_hand_war"]}],"when":{"age":19,"season":"summer"},"priority":60,"portrait":"cass","scene":"alley"},{"id":"t_meet_cass","kind":"special","title":"追捕","text":"那晚你从一户人家后窗出来，迎面就是一队巡逻的火把。\n为首的是个年轻的女捕快，目光像刀。“站住。”她说，声音不高，却让你的腿停了半拍。\n她叫卡斯，是新上任的巡逻队队长。","options":[{"label":"翻上屋顶，拔腿就跑","check":{"attr":"agi","diff":14,"fateDiff":1,"memDiff":{"id":"m_t_cass","diff":-2}},"ok":{"text":"你从屋檐一路跑过三条街，把火把的光远远甩在身后。卡斯站在巷口，看着屋顶上你的背影，一动不动。","fx":["flag+:met_cass","agi_exp+4","count:heat+6"]},"fail":{"text":"你从屋顶上滑了下去，摔在一堆麻袋上。卡斯的火把照着你，“带走。”","fx":["flag+:met_cass","hp-8","count:heat+10","gold-20","log:卡斯把你拎回巡逻队，盘问了一整夜。没有证据，只能放人。她在你离开前，说了一句：“我会盯着你。”"]}},{"label":"丢下一枚金币，装作路人","text":"卡斯没接。“路人不会半夜从后窗出来。”她看了你很久，才让开了路。“……我记住你了。”","fx":["flag+:met_cass","gold-15","count:heat+4","cha_exp+2"],"cond":"gold>=15","reason":"金币不足"},{"label":"点头哈腰，说自己是送货的","check":{"attr":"cha","diff":13},"ok":{"text":"你一连串的谎话说得天衣无缝。卡斯皱着眉，最后还是放了你。","fx":["flag+:met_cass","cha_exp+4"]},"fail":{"text":"她盯着你的鞋看了一眼，那上面还沾着别人家窗台上的青苔。","fx":["flag+:met_cass","count:heat+8","gold-15","log:卡斯没有证据，只能放你走。她盯着你的背影，一直盯到你转过街角。"]}}],"when":{"age":20,"season":"winter"},"priority":60,"portrait":"cass","scene":"alley_snow"},{"id":"t_orphan_raid","kind":"special","title":"深夜的孤儿院","text":"半夜，莉拉气喘吁吁地敲你的窗：“红手帮的人在孤儿院门口，他们要抢地契！”\n你赶到的时候，七八个人正堵在门口，孩子们挤在二楼窗后，哭声一阵一阵传出来。","options":[{"label":"冲进去，挡在门口","text":"你一脚踹开最前面的人，把嬷嬷护在身后。","fx":[{"type":"combat","enemy":"red_hand","win":["flag+:orphan_defended","hometown+8","rel:lila+2","exp+30","log:红手帮的人被你们打跑了。"],"lose":["hp-15","hometown-3","flag+:orphan_defended","log:你被打得很惨，但他们也没敢再往里闯。"]}]},{"label":"从后院绕进去，把孩子们先带走","check":{"attr":"agi","diff":13},"ok":{"text":"你们从后院的墙洞里把孩子一个个送了出去。红手帮的人闯进去的时候，只抓到了一屋子的空床。","fx":["flag+:orphan_defended","hometown+6","rel:lila+2","agi_exp+3"]},"fail":{"text":"你们被发现了。混乱里，有人受了伤。","fx":["hp-10","hometown-4","flag+:orphan_defended"]}},{"label":"不管了，这不是你的事","text":"第二天，孤儿院的门被钉上了板。你路过时，没敢抬头。","fx":["hometown-10","rel:lila-3","flag+:orphan_cold"]}],"when":{"age":22,"season":"autumn"},"priority":55,"portrait":"lila","scene":"alley"},{"id":"t_rat_dying","kind":"special","title":"灰鼠的最后一夜","text":"冬天最冷的那个夜晚，灰鼠把你叫到了他的阁楼。\n老人躺在一张发黑的床板上，脸色灰得像他的名字。“咳……别哭，”他说，“我这辈子偷过的东西，比你见过的都多，没什么亏的。”\n他从枕下摸出一枚小小的、断了一半的钥匙，塞进你手里。","options":[{"label":"握住他的手，一直陪到天亮","text":"灰鼠没有再说话。天亮前，他的手慢慢松开了。你把那半把钥匙贴在胸口，坐了很久。","fx":["flag+:rat_dead","flag+:half_key","rel:rat+3","wil_exp+4","hometown+2"],"cond":"rel.rat>=4","reason":"灰鼠还没信任你到这个地步（好感 ≥ 4）"},{"label":"接过钥匙，问他另一半在哪","text":"灰鼠笑了，笑得很吃力：“……最没人想看的地方。”这是他留下的最后一句话。","fx":["flag+:rat_dead","rel:rat+1","wil_exp+2"]},{"label":"什么也不说，只是点点头","text":"你站在床边，看着他一点点变凉。窗外的雪下得很静。","fx":["flag+:rat_dead","wil_exp+3"]}],"when":{"age":22,"season":"winter"},"priority":75,"portrait":"rat","scene":"alley_snow"},{"id":"t_mask_invite","kind":"special","title":"面具先生的邀请","text":"一张没有署名的邀请函，夹在你每天经过的那块松动的砖缝里。\n公会大厅的最深处，一个戴着白色无面面具的人，背对着你站着。“影子，”他说，声音像是从很远的井底传上来，“月蚀之夜，我需要一双最快的手。”\n他知道你的所有事，也知道你不知道的那一部分。","options":[{"label":"答应他，听听他的条件","text":"“你只需要在魔晶库里，替我拿一样东西。别的，随你。”他递给你一枚金币，“预付。”","fx":["flag+:mask_hired","rep:shadow+8","gold+150","count:intel+1"]},{"label":"婉拒，说你有自己的计划","check":{"attr":"cha","diff":14},"ok":{"text":"面具沉默了一会儿：“很好。有自己想法的人，才值得信任。”他没有再逼你。","fx":["rep:shadow+5","cha_exp+3"]},"fail":{"text":"面具轻轻地“嗯”了一声。你的背后，不知什么时候多出了几个人。“……再考虑考虑。”","fx":["count:heat+8","rep:shadow-3"]}},{"label":"装作恭敬，暗中留意他的破绽","check":{"attr":"int","diff":13},"ok":{"text":"他说话时，左手总是下意识地摸一下腰间。那里，似乎挂着什么东西。","fx":["count:mask_clue+1","int_exp+3","count:intel+1"]},"fail":{"text":"你什么也没看出来，只觉得后背发凉。","fx":["int_exp+1"]}}],"when":{"age":23,"season":"spring"},"priority":60,"portrait":"mask","scene":"tavern"},{"id":"t_last_job","kind":"special","title":"最后一票","text":"年轻的时候，你从没想过自己会有退路。\n可今天，你的钱袋里有了一点分量，街角那家要转让的小铺子，又被人提起了。\n“金盆洗手吧，”莉拉说，“你已经做得够多了。”","options":[{"label":"金盆洗手，开一间修锁的铺子","text":"你把撬锁工具擦干净，放进了柜台下的抽屉。从今天起，你只修锁，不开锁。","fx":["flag+:retired","end:auto"],"cond":"gold>=800&&hometown>=30","reason":"需要金币 ≥ 800，街区人望 ≥ 30","avoid":true},{"label":"再干一票，攒够再说","text":"你把铺子的事暂时压在了心底。","fx":["wil_exp+1"]},{"label":"不，我要去月蚀之夜","text":"莉拉叹了口气，没有再劝。","fx":["wil_exp+2","cha_exp+1"]}],"when":{"age":25,"season":"spring"},"priority":50,"portrait":"lila","scene":"alley"},{"id":"t_eclipse_warn","kind":"special","title":"月缺之时","text":"王都的天空，一夜比一夜暗。\n老人们说，那是月蚀要来了。公会大厅里点起了一盏盏灯，每个人都在检查自己的家什。\n莉拉把你拉到一边，问：“你准备好了吗？”","options":[{"label":"清点准备：图纸、同伙、钥匙","text":"你把能用的东西摊在桌上，一件一件地过。\n心里有数了。","fx":["int_exp+2","wil_exp+2"]},{"label":"一个人在屋顶上，看了一夜的月亮","text":"风很凉。你想起灰鼠，想起鼠街，想起第一次被他抓住手腕的那个晚上。","fx":["wil_exp+4","hp+0"]},{"label":"找卡斯，试探她的态度","check":{"attr":"cha","diff":13},"ok":{"text":"卡斯没有拦你，只说了一句：“月蚀之夜，我会在城里。你自己，别让我抓住你。”","fx":["rel:cass+1","cha_exp+3"]},"fail":{"text":"她看了你一眼：“你在打听什么？”","fx":["count:heat+6"]}}],"when":{"age":26,"season":"autumn"},"priority":50,"portrait":"lila","scene":"rooftop"},{"id":"t_heist_night","kind":"special","title":"月蚀之夜","text":"月亮被一点点吞掉的时候，整座王都都安静了。\n鼠街的老人们说得没错：王城地下，魔晶库的结界，在这一夜松开了一道缝。\n你站在水渠入口，身后是你的同伙，或许是一个，或许是三个。你知道，这扇门一旦推开，就不会再有一个“原来的你”。","options":[{"label":"按计划行动","text":"你摊开图纸，把最后一遍任务讲给每个人。\n“走。”","fx":["goto:ev_heist_1"],"cond":"flag:vault_plan&&count.crew>=3&&flag:half_key","reason":"准备不足（需要图纸、3 个同伙、半把钥匙）"},{"label":"带着已有的东西硬闯","text":"你没有图纸，也没有足够的人手。你只有一双手，和一个不肯回头的念头。","fx":["goto:ev_heist_1"]},{"label":"不去了，回到鼠街","text":"你转身走回了下城。身后，月亮正好被吞尽。","fx":["flag+:skipped_heist","end:auto"]}],"when":{"age":27,"season":"autumn"},"priority":200,"finale":true,"portrait":"thief","scene":"rooftop"},{"id":"ev_black_market","kind":"chain","title":"地下黑市","text":"下城最深处的一条地下街，没有门牌，只有暗号。摆摊的人都戴着兜帽，客人也一样。\n一个驼背的老头从阴影里抬起头：“买卖，不问姓名。”","options":[{"label":"买一瓶伤药（30 金币）","text":"苦得你直皱眉，伤口却很快不疼了。","fx":["gold-30","heal:0.6"],"cond":"gold>=30","reason":"金币不足"},{"label":"买一颗烟雾弹配方（120 金币）","text":"老头把卷着的纸条塞给你，指尖冰凉：“记住，别在室内用。”","fx":["gold-120","flag+:tricks_smoke"],"cond":"gold>=120&&!flag:tricks_smoke","reason":"金币不足或已拥有"},{"label":"买一份魔晶库图纸（300 金币）","text":"图纸是描摹来的，有一两处模糊，但足够你认出主要的暗道。","fx":["gold-300","flag+:vault_plan"],"cond":"gold>=300&&!flag:vault_plan","reason":"金币不足或已拥有"},{"label":"请老头指点开锁的窍门（60 金币）","text":"老头一边收钱一边吐槽，最后还是给你演示了三种你没见过的法子。","fx":["gold-60","agi_exp+5","int_exp+2","exp+10"],"cond":"gold>=60","reason":"金币不足"},{"label":"打听最近的风声（40 金币）","text":"老头眯着眼睛，慢吞吞地说了几句。有两句是有用的。","fx":["gold-40","count:intel+1","exp+5"],"cond":"gold>=40","reason":"金币不足"},{"label":"看看「贵客」才能进的货架","text":"老头抬眼看了看你，一言不发地把后面的布帘掀开了。","fx":["goto:ev_black_market_vip"],"cond":"rep.shadow>=10","reason":"影子公会声望 ≥ 10，才有资格看"},{"label":"什么也不买，转身离开","text":"","fx":["wil_exp+0"]}],"scene":"black_market","enter":["flag+:met_gu"]},{"id":"ev_black_market_vip","kind":"chain","title":"黑市·贵客区","text":"布帘后面是另一个世界：每样东西都用黑绒布盖着，掀开时，灯光会在刀刃上跳一下。\n老头压低声音：“这些货，只卖给‘有门路’的人。魅力不够的，我连说都不说。”","options":[{"label":"细长匕首（200 金币）","text":"这把匕首薄得能插进门缝，握在手里却很稳。","fx":["gold-200","item:stiletto","flag+:own_stiletto"],"cond":"cha>=10&&gold>=200&&!flag:own_stiletto","reason":"需要魅力 ≥ 10、200 金币，且尚未拥有"},{"label":"暗纹软甲（280 金币）","text":"贴身，无声，针脚里缝着细细的软钢丝。","fx":["gold-280","item:shadow_leathers","flag+:own_shadow_leathers"],"cond":"cha>=10&&gold>=280&&!flag:own_shadow_leathers","reason":"需要魅力 ≥ 10、280 金币，且尚未拥有"},{"label":"黑珍珠（220 金币）","text":"一颗黑色的珍珠，凑近了能看见里面有一点点光。","fx":["gold-220","item:black_pearl","flag+:own_black_pearl"],"cond":"cha>=10&&gold>=220&&!flag:own_black_pearl","reason":"需要魅力 ≥ 10、220 金币，且尚未拥有"},{"label":"影刃（520 金币）","text":"刀身涂着一层吸光的黑漆，你几乎看不见它的轮廓。","fx":["gold-520","item:shadow_dagger","flag+:own_shadow_dagger"],"cond":"cha>=14&&gold>=520&&!flag:own_shadow_dagger","reason":"需要魅力 ≥ 14、520 金币，且尚未拥有"},{"label":"幻影斗篷（600 金币）","text":"披上它，巡逻的人总会多看你两眼，却不知道自己在看什么。","fx":["gold-600","item:phantom_cloak","flag+:own_phantom_cloak"],"cond":"cha>=14&&gold>=600&&!flag:own_phantom_cloak","reason":"需要魅力 ≥ 14、600 金币，且尚未拥有"},{"label":"幸运金币（500 金币）","text":"两面都是同一个头像的金币，抛出去，总是你想要的那面。","fx":["gold-500","item:fortune_coin","flag+:own_fortune_coin"],"cond":"cha>=14&&gold>=500&&!flag:own_fortune_coin","reason":"需要魅力 ≥ 14、500 金币，且尚未拥有"},{"label":"毒牙短剑（1100 金币）","text":"老头一路上嘟囔：“这把货，上一个主人是个公爵。”","fx":["gold-1100","item:venom_fang","flag+:own_venom_fang"],"cond":"cha>=18&&gold>=1100&&!flag:own_venom_fang","reason":"需要魅力 ≥ 18、1100 金币，且尚未拥有"},{"label":"面具符咒（1200 金币）","text":"刻着一张没有五官的脸。戴着它，别人更容易忘记你。","fx":["gold-1200","item:mask_charm","flag+:own_mask_charm"],"cond":"cha>=18&&gold>=1200&&!flag:own_mask_charm","reason":"需要魅力 ≥ 18、1200 金币，且尚未拥有"},{"label":"夜行者之刃（1500 金币）","text":"老头亲手把它从布里取出来，像是在递一个婴儿：“别让它沾太多人的血。”","fx":["gold-1500","item:night_edge","flag+:own_night_edge"],"cond":"cha>=18&&gold>=1500&&!flag:own_night_edge","reason":"需要魅力 ≥ 18、1500 金币，且尚未拥有"},{"label":"先到这里","text":"","fx":[]}],"scene":"black_market"},{"id":"ev_tavern","kind":"chain","title":"醉鼠酒馆","text":"酒馆里烟雾腾腾，赌桌边永远围着人，角落里永远有人在压低声音说话。\n老板娘擦着杯子，朝你抬了抬下巴：“今晚想玩点什么？”","options":[{"label":"坐上赌桌，押 40 金币","check":{"attr":"luk","diff":12},"ok":{"text":"骰子在碗里转了很久，最后停在你想要的那一面。你把赢来的钱揣进怀里，没敢多留。","fx":["gold+85","exp+4"]},"fail":{"text":"骰子冷冰冰地落在了另一面。对面的人收走了你的钱，笑得很和气。","fx":["gold-40"]},"cond":"gold>=40","reason":"金币不足"},{"label":"请一圈酒，套套话（20 金币）","check":{"attr":"cha","diff":12},"ok":{"text":"三杯下去，几个常客开始争先恐后地讲起王城里的事。你听到了两条有用的。","fx":["gold-20","count:intel+1","cha_exp+3"]},"fail":{"text":"酒喝了，话没问出来，只被灌了个半醉。","fx":["gold-20","status+:fatigue:1"]},"cond":"gold>=20","reason":"金币不足"},{"label":"打听红手帮的动向","text":"一个独眼的酒客压低声音：“断指最近缺钱，仓库里堆的东西，不是他自己的。”","fx":["count:intel+1","int_exp+2"],"cond":"flag:red_hand_threat","reason":"还没听说红手帮的事"},{"label":"只喝一杯热酒，听听传闻","text":"酒很烈，传闻很杂。你只带走了一句：“月蚀之夜的守卫，今年要换新的了。”","fx":["count:intel+1","hp+0","heal:0.2"]},{"label":"离开","text":"","fx":[]}],"scene":"tavern"},{"id":"ev_arrested","kind":"chain","title":"被带走了","text":"冰冷的铁链咬住了你的手腕。\n你被带到巡逻队的小黑屋里，一盏油灯在头顶晃着，对面的人在翻你的口袋。","options":[{"label":"认罚，交出一半的钱","text":"“算你识相。”对方把你的钱袋翻了个底朝天，又把你推了出去。","fx":[{"if":"fate>=3","then":["gold-60"],"else":[]},"count:arrests+1","count:heat-25","gold-40","hp-6",{"if":"count.arrests>=3","then":["flag+:jailed_end","end:auto"]}]},{"label":"咬牙不认，硬扛","check":{"attr":"wil","diff":14},"ok":{"text":"你一句话也没说，扛了整整一夜。天亮时，对方不耐烦地把你踢了出去。","fx":["count:arrests+1","count:heat-15","wil_exp+4","hp-10",{"if":"count.arrests>=3","then":["flag+:jailed_end","end:auto"]}]},"fail":{"text":"第二天，你被关进了牢里，整整一个月。","fx":["count:arrests+1","count:heat-25","gold-80","hp-12","status+:fatigue:2",{"if":"count.arrests>=3","then":["flag+:jailed_end","end:auto"]}]}},{"label":"塞钱，托人说情（金币 ≥ 150）","text":"你托人把钱递了进去。当晚，你就走出了巡逻队的大门。","fx":["gold-150","count:heat-20","count:arrests+1",{"if":"count.arrests>=3","then":["flag+:jailed_end","end:auto"]}],"cond":"gold>=150","reason":"金币不足"}],"scene":"court"},{"id":"ev_heist_1","kind":"chain","title":"水渠入口","text":"王城地下水渠的入口，被一道生锈的铁栅封着。栅栏后面，是一股潮湿的黑暗。\n暗哨的脚步声每隔十息响一次，你数着。","options":[{"label":"让同伙分头引开暗哨","check":{"attr":"cha","diff":15,"fateDiff":1},"ok":{"text":"同伙们在远处制造了一阵恰到好处的骚动。暗哨们被调开了。你推开铁栅，滑了进去。","fx":["goto:ev_heist_2","cha_exp+3"]},"fail":{"text":"骚动太大了，守卫们把整个水渠都围了起来。你们不得不硬闯。","fx":["count:heat+15","hp-6","flag+:heist_alarm","count:hfail+1","goto:ev_heist_2"]},"cond":"count.crew>=3","reason":"需要至少 3 个同伙"},{"label":"一个人摸进去","check":{"attr":"agi","diff":19,"fateDiff":1},"ok":{"text":"你贴着墙，数着暗哨的脚步，在第七次交错的间隙里翻过了铁栅。","fx":["agi_exp+5","goto:ev_heist_2"]},"fail":{"text":"你的靴子踩进了水里，“哗”的一声。暗哨猛地回头。","fx":["hp-10","flag+:heist_alarm","count:hfail+1","goto:ev_heist_2"]}},{"label":"用烟雾弹封住入口，闯进去","text":"白烟翻涌，你在一片混乱里冲了进去。","fx":["flag+:heist_alarm","count:hfail+1","goto:ev_heist_2"],"cond":"flag:sk_smoke_bomb","reason":"需要会用烟雾弹"}],"scene":"vault"},{"id":"ev_heist_2","kind":"chain","title":"魔晶库深处","text":"水渠尽头，是一道刻满符文的黑色石门。门后有微弱的光，像一颗被捂住的心跳。","options":[{"label":"用半把钥匙和图纸开启暗门","check":{"attr":"int","diff":15,"fateDiff":1,"memDiff":{"id":"m_t_vault","diff":-2}},"ok":{"text":"暗门缓缓地向内打开，没有发出一点声音。你想起灰鼠，想起他说过：钥匙只有一半是钥匙。","fx":["int_exp+4","goto:ev_heist_3"]},"fail":{"text":"你把图纸上的暗号读错了一个符号。石门轰的一声，所有的符文都亮了。","fx":["hp-8","flag+:heist_alarm","count:hfail+1","goto:ev_heist_3"]},"cond":"flag:half_key&&flag:vault_plan","reason":"需要半把钥匙和图纸"},{"label":"撬开主门","check":{"attr":"agi","diff":19,"fateDiff":1,"memDiff":{"id":"m_t_vault","diff":-2}},"ok":{"text":"你屏住呼吸，用最细的钩子，一枚一枚地拨开了三十七个机括。主门打开的时候，你的手心全是汗。","fx":["agi_exp+5","goto:ev_heist_3"]},"fail":{"text":"第三十一个机括弹了回来，削掉了你指尖的一块皮。符文骤然亮起。","fx":["hp-12","flag+:heist_alarm","count:hfail+1","goto:ev_heist_3"]}},{"label":"请同伙里的锁匠出手","text":"同伙里的锁匠接过你的工具，一言不发地开了门。他说：“剩下的，你自己来。”","fx":["count:crew-1","goto:ev_heist_3"],"cond":"count.crew>=4","reason":"需要至少 4 个同伙"}],"scene":"vault"},{"id":"ev_heist_3","kind":"chain","title":"水晶与看守","text":"门后，是一间圆形的石室。中央的石台上，悬浮着一颗拳头大小的水晶，在黑暗里一明一灭，像是在呼吸。\n水晶前，站着一尊魔晶魔像。它的眼睛，慢慢亮了起来。","options":[{"label":"与魔像正面交战","text":"你拔出了匕首。","fx":[{"type":"combat","enemy":"vault_golem","noFlee":true,"win":["goto:ev_heist_4"],"lose":["flag+:heist_caught","end:auto"]}],"avoid":true},{"label":"用烟雾弹和影步，绕开它","check":{"attr":"luk","diff":15,"fateDiff":1},"ok":{"text":"白烟里，你贴着魔像的脚边滑了过去。它的巨拳砸在你身后的石板上，激起一片碎屑。","fx":["agi_exp+4","goto:ev_heist_4"]},"fail":{"text":"魔像转头的速度比你想的快。它的拳头擦着你的肩膀砸了下去。","fx":["hp-14","flag+:heist_alarm","count:hfail+1","goto:ev_heist_4"]},"cond":["flag:sk_smoke_bomb","flag:sk_shadow_step"],"reason":"需要烟雾弹或影步"},{"label":"让同伙缠住魔像","text":"同伙们冲了上去。魔像的拳头落下来的时候，你听见有人喊了一声。\n你没有回头。","fx":["count:crew-1","hp-4","goto:ev_heist_4"],"cond":"count.crew>=3","reason":"需要至少 3 个同伙"}],"scene":"vault"},{"id":"ev_heist_4","kind":"chain","title":"悬浮的水晶","text":"你把手放在水晶上。\n没有警报，没有光，只有一种说不清的温度，顺着手臂往上爬。你忽然明白，王城里传了几百年的魔晶库，守着的不是金币，不是魔晶，而是这颗心脏。","options":[{"label":"拿走它","text":"水晶落进你掌心的那一刻，整座魔晶库的符文，一圈一圈，缓缓地暗了下去。","fx":[{"if":"count.hfail>=3","then":["log:魔晶库里警钟大作，所有的出口都被封死了。","flag+:heist_caught","end:auto"],"else":[{"if":"flag:heist_alarm","then":["goto:ev_heist_escape"],"else":["goto:ev_heist_mask"]}]}]}],"scene":"vault"},{"id":"ev_heist_escape","kind":"chain","title":"警钟","text":"魔晶库上方，警钟终于敲响了。\n整座王城都醒了。你从水渠冲出去的时候，前面是一队举着火把的王室禁卫，领头的那个人，面无表情地拔出了剑。","options":[{"label":"与禁卫一战，杀出一条路","text":"你把水晶塞进怀里，握紧了匕首。","fx":[{"type":"combat","enemy":"royal_guard","noFlee":true,"win":["goto:ev_heist_mask"],"lose":["flag+:heist_caught","end:auto"]}],"avoid":true},{"label":"扔出烟雾弹，趁乱遁入暗巷","check":{"attr":"agi","diff":18,"fateDiff":1},"ok":{"text":"烟雾里，你从禁卫的盔甲缝隙间钻了过去。身后的叫喊声越来越远。","fx":["agi_exp+5","goto:ev_heist_mask"]},"fail":{"text":"你冲出烟雾的时候，一支弩箭擦过了你的小腿。你踉跄着摔在了巷口，禁卫们围了上来。","fx":["hp-16","flag+:heist_caught","end:auto"]},"cond":"flag:sk_smoke_bomb","reason":"需要会用烟雾弹"}],"scene":"street"},{"id":"ev_heist_mask","kind":"chain","title":"水晶的主人","text":"鼠街最老的那条暗巷里，一个戴着白色无面面具的人，早就等在那儿了。\n“辛苦了，影子。”他说，伸出手，“交给我吧。”\n你的同伙们站在你身后，没人说话。","options":[{"label":"把水晶交给他","text":"他接过去，掌心发出一阵很淡的光。\n“从今天起，鼠街，是你的了。”","fx":["flag+:gave_crystal","flag+:heist_done","rank:5","end:auto"]},{"label":"拔刀，与他一战","text":"你抽出匕首，一步一步地向前。","fx":[{"type":"combat","enemy":"mask_man","noFlee":true,"win":["flag+:mask_defeated","flag+:heist_done","rank:6","log:面具被你一刀挑落。","end:auto"],"lose":["flag+:heist_caught","end:auto"]}]},{"label":"当众揭穿他的身份","text":"你一件一件，把税务署的旧账、赌场的流水、那枚家徽，说了出来。同伙们的脸色一点点变了。\n面具先生愣了很久，慢慢地摘下了面具。","fx":["flag+:mask_defeated","flag+:heist_done","rank:6","end:auto"],"cond":"flag:mask_unmasked&&rep.shadow>=40","reason":"需要知道他的真面目，且影子公会声望 ≥ 40"},{"label":"把水晶交给等在巷口的卡斯","text":"卡斯看着你，又看了看你手里的东西。\n“我该抓你，”她说，“但今晚，我会先抓他。”","fx":["flag+:returned_crystal","flag+:heist_done","rank:5","end:auto"],"cond":"flag:cass_trust","reason":"需要卡斯信任你"},{"label":"扔出烟雾弹，带着水晶消失在夜里","check":{"attr":"agi","diff":19,"fateDiff":1},"ok":{"text":"你一脚蹬上了屋檐。身后的叫喊声很快就听不见了。","fx":["flag+:ghosted","flag+:heist_done","rank:5","end:auto"]},"fail":{"text":"面具先生的手，在黑暗里按在了你的肩上。“你以为，我会让你走？”\n你没有选择，只能拔刀。","fx":[{"type":"combat","enemy":"mask_man","noFlee":true,"win":["flag+:mask_defeated","flag+:heist_done","rank:6","end:auto"],"lose":["flag+:heist_caught","end:auto"]}]},"cond":["flag:sk_smoke_bomb","flag:sk_shadow_step"],"reason":"需要烟雾弹或影步"}],"scene":"alley"},{"id":"t_red_boss_duel","kind":"chain","title":"断指","text":"红手帮的老大「断指」，坐在仓库最深处的酒桶上，右手只剩四根指头。\n“就你？”他笑，“鼠街的小老鼠，也敢来我这儿撒野？”","options":[{"label":"拔刀，一对一","text":"你把匕首握紧了。\n“来吧。”","fx":[{"type":"combat","enemy":"red_boss","noFlee":true,"win":["flag+:red_hand_broken","rep:shadow+10","hometown+6","log:断指倒下的时候，身后的红手帮，没一个人敢动。","log:断指的账本还在他的腰间。这东西，也许卡斯会想要。"],"lose":["hp-15","gold-50","log:你被打得趴在地上，断指踩着你的手说：“回去告诉鼠街，这里是红手帮的。”"]}]},{"label":"先退一步，等时机","text":"你什么也没说，转身离开。\n至少今晚，没有人会为此送命。","fx":["wil_exp+1"]}],"scene":"warehouse"},{"id":"t_gu_intro","kind":"special","title":"黑市里的老头","text":"你在黑市的暗摊前，被一只干瘦的手拉住了袖口。\n“小子，”一个驼背的老头压低声音，“我看你手上的茧，是个干活的人。”\n黑市里的人都叫他老鬼。他不问姓名，不问来路，只做一种生意：别人不敢做的买卖。","options":[{"label":"听他说下去","text":"老鬼眯着眼，把一张泛黄的纸推到你面前：“三件货，取回来，我给你一样好东西。”纸上没有名字，只有地址。","fx":["flag+:met_gu","flag+:gu_invited","rep:shadow+2","quest:start:gu_list"]},{"label":"谢绝，只买点东西","text":"老鬼耸耸肩：“哪天不紧了，再来。”","fx":["flag+:met_gu","flag+:gu_invited_declined"]}],"when":{"age":18,"season":"autumn"},"priority":45,"portrait":"gu","scene":"black_market"},{"id":"t_report_cass","kind":"chain","title":"账本上的名字","text":"卡斯在巡逻队的值房里，把你递来的账本翻了一遍，又翻了一遍。\n“这些名字……”她的手指停在其中一行上，“有两个，是我们队里的人。”\n她把账本合上，抬起眼：“你知道，把这个交给我，意味着什么吗？”","options":[{"label":"交给她，什么也不要","text":"卡斯沉默了很久，把账本收进了抽屉：“……我欠你一次。”","fx":["flag+:cass_gift_red","rel:cass+3","rep:shadow-2","hometown+3","count:heat-8"]},{"label":"交给她，也要一个承诺：别再追我","check":{"attr":"cha","diff":12},"ok":{"text":"卡斯盯着你，嘴角动了动：“好。至少这一阵，我不会。”","fx":["flag+:cass_gift_red","rel:cass+3","count:heat-15","cha_exp+3"]},"fail":{"text":"卡斯收下账本，却摇了摇头：“我不能答应这种事。”","fx":["flag+:cass_gift_red","rel:cass+2","cha_exp+1"]}}],"scene":"court","portrait":"cass"}],"content/thief/events_derived.json":[{"id":"t_dv_pick_mark","kind":"derived","title":"好看的钱袋","text":"人群里，一只绣着金线的钱袋格外显眼，它的主人正低头看着摊上的小玩意儿。","options":[{"label":"下手","text":"你的指尖像蜻蜓点水，轻轻一点，就换了手。","fx":["gold+22","agi_exp+2","count:heat+3"]}],"parent":"pickpocket","weight":8},{"id":"t_dv_pick_cop","kind":"derived","title":"不远处的制服","text":"你刚得手，一抬头，不远处有一件深蓝色的制服，正朝这个方向看来。","options":[{"label":"不慌，慢慢走开","check":{"attr":"cha","diff":11},"ok":{"text":"你装作路人，和对方擦肩而过。他什么也没发现。","fx":["cha_exp+2","agi_exp+1"]},"fail":{"text":"你走得太快，他喊了一声：“站住！”","fx":["count:heat+6","hp-3"]}},{"label":"把钱袋扔进水沟","text":"钱袋沉进了水里。你空着手，慢慢走开了。","fx":["gold-10","count:heat-2"]}],"parent":"pickpocket","weight":8},{"id":"t_dv_pick_child","kind":"derived","title":"孩子的手","text":"你得手后，被一只小手抓住了衣角。一个瘦瘦的孩子，盯着你手里的钱袋。\n“你偷了我哥的钱。”","options":[{"label":"把钱袋还给他","text":"孩子一愣，抱着钱袋跑了。你的心里，有一点说不清的东西。","fx":["gold-20","hometown+3","cha_exp+2"]},{"label":"塞给他几个铜板，让他闭嘴","text":"孩子接了钱，没吭声。他看你的眼神，有点失望。","fx":["gold-5","hometown-1"]},{"label":"甩开他的手，走掉","text":"你没回头。有些东西，你不想看。","fx":["count:heat+2"]}],"parent":"pickpocket","weight":6},{"id":"t_dv_burgle_diary","kind":"derived","title":"抽屉里的日记","text":"你在一间书房里撬开了抽屉，里面除了首饰，还有一本日记。翻开第一页，写着：“今年的冬天，不知道父亲还能不能熬过去。”","options":[{"label":"合上，原样放回去","text":"你把首饰拿了，把日记放回了原处。","fx":["gold+20","hometown+2"]},{"label":"带走，当作情报","check":{"attr":"int","diff":12},"ok":{"text":"日记里记着几位朝臣的往来。你把它抄了下来，又悄悄放回去。","fx":["count:intel+1","int_exp+3"]},"fail":{"text":"日记里全是家长里短，毫无价值。","fx":["int_exp+1"]}}],"parent":"burgle","weight":8},{"id":"t_dv_burgle_dog","kind":"derived","title":"看家狗","text":"你刚翻过墙，一条黑背大狗就从暗处缓缓走了出来，喉咙里发出低低的咕噜声。","options":[{"label":"丢一块肉过去","check":{"attr":"luk","diff":10},"ok":{"text":"大狗叼着肉，满足地趴在了地上。你顺利地进了屋。","fx":["gold+15","agi_exp+1"]},"fail":{"text":"它对肉不感兴趣，直接扑了过来。","fx":["hp-10","count:heat+6"]}},{"label":"翻墙退走","text":"你悄悄退到了墙外。今晚，不适合进这户人家。","fx":["agi_exp+1"]}],"parent":"burgle","weight":8},{"id":"t_dv_burgle_servant","kind":"derived","title":"没睡着的仆人","text":"你推开书房的门时，一盏小灯忽然亮了。一个年迈的仆人坐在角落里，看着你，没有喊。\n“少爷们都睡了，”他轻声说，“你想拿什么，快拿吧。”","options":[{"label":"只拿一点，鞠躬离开","text":"老人点点头，没有拦你。“这家人，不值得你冒这么大的险。”","fx":["gold+25","cha_exp+2","count:heat+3"]},{"label":"把能拿的全拿走","text":"你装满了口袋。老人没有动，只是静静看着你的背影。","fx":["gold+70","count:heat+8","hometown-2"]},{"label":"悄悄退走，什么也不拿","text":"老人看着你，什么也没说。第二天，你在门口的台阶上，发现了一只包好的面包。","fx":["hometown+2","wil_exp+2"]}],"parent":"burgle","weight":7},{"id":"t_dv_scout_whisper","kind":"derived","title":"酒馆里的耳语","text":"你坐在酒馆的角落里，隔壁桌的两个人，正压低声音说话。\n“王城的结界……今年松得比往年快。”","options":[{"label":"假装喝酒，竖起耳朵","check":{"attr":"int","diff":12},"ok":{"text":"你听到了结界松动的大致日期，和一位守卫队长的名字。","fx":["count:intel+1","int_exp+3"]},"fail":{"text":"他们忽然换了话题。","fx":["int_exp+1"]}}],"parent":"scout","weight":8},{"id":"t_dv_scout_guard","kind":"derived","title":"喝醉的卫兵","text":"一个王城卫兵，喝得面红耳赤，正拍着桌子骂他的上司。\n你在他旁边坐下，给他倒了一杯。","options":[{"label":"请他喝酒，让他骂个够","text":"他骂了一个钟头，期间，漏出了三条有用的消息。","fx":["gold-10","count:intel+1","cha_exp+2"]},{"label":"顺手摸走他的钥匙环","check":{"attr":"agi","diff":12},"ok":{"text":"钥匙环在你的怀里，沉甸甸的。你记下了几把钥匙的形状，把环放回了他的腰上。","fx":["count:intel+1","agi_exp+3","count:heat+4"]},"fail":{"text":"他正好伸手摸腰，抓到了你的手。","fx":["hp-4","count:heat+8"]}}],"parent":"scout","weight":7},{"id":"t_dv_laylow_dream","kind":"derived","title":"阁楼里的梦","text":"阁楼里的第三个夜晚，你做了一个梦：很多年前，你还是个孩子，被一个陌生人从一条冰冷的河边抱起来。\n他没有留名字，只在你怀里塞了半块面包。","options":[{"label":"醒来，对着窗外发了很久的呆","text":"你记不得那个人的脸。但你记得，那半块面包，很暖。","fx":["wil_exp+2","hometown+1"]}],"parent":"lay_low","weight":6},{"id":"t_dv_laylow_visit","kind":"derived","title":"不速之客","text":"阁楼里，有人敲了敲你的门。是莉拉，手里提着一小罐热汤。\n“你躲了三天，”她说，“我以为你死了。”","options":[{"label":"请她进来，一起喝汤","text":"你们谁也没说话。一罐汤，两个人，一盏灯。","fx":["rel:lila+2","hp+0","heal:0.2"]},{"label":"隔着门说谢谢，不开门","text":"莉拉在门口站了一会儿，把汤放在地上，走了。","fx":["rel:lila+1"]}],"parent":"lay_low","weight":6,"cond":"flag:met_lila"},{"id":"t_dv_rat_lesson","kind":"derived","title":"灰鼠的考题","text":"灰鼠把一枚硬币藏在了掌心，让你猜在哪只手里。你猜了十次，十次都猜错。\n“你不是笨，”他说，“你只是在看我的手。看人，要看肩。”","options":[{"label":"再试一次","text":"这一次，你盯着他的肩。肩一抖，你猜中了。","fx":["agi_exp+4","int_exp+2","exp+8"]}],"parent":"learn_rat","weight":9},{"id":"t_dv_rat_tip","kind":"derived","title":"关于锁的三句话","text":"灰鼠说，开锁有三句话：\n“耳朵比手重要。耐心比耳朵重要。运气，比所有东西都重要，但你不能靠它。”","options":[{"label":"默念三遍，记在心里","text":"你闭上眼睛，在脑子里又过了一遍那三句话。","fx":["agi_exp+3","wil_exp+2","count:knife+1"]}],"parent":"learn_rat","weight":8},{"id":"t_dv_orphan_kids","kind":"derived","title":"孩子们的涂鸦","text":"你把米放在孤儿院的门口，一个小姑娘拉住你，递给你一张被攥得皱巴巴的纸。\n纸上，是一个歪歪扭扭的人，戴着一顶高高的帽子。“这是你，”她说。","options":[{"label":"收下，说谢谢","text":"你把那张纸叠好，放进了口袋的最深处。","fx":["hometown+3","cha_exp+2","rel:lila+1"]}],"parent":"help_orphans","weight":8},{"id":"t_dv_orphan_matron","kind":"derived","title":"嬷嬷的话","text":"老嬷嬷握着你的手，手很粗糙，掌心全是茧。\n“孩子，我知道这些钱从哪来的。”她轻声说，“但我也知道，这些钱用在了哪里。”","options":[{"label":"低头，什么也没说","text":"你想说点什么，嗓子却发紧。","fx":["wil_exp+2","hometown+2"]}],"parent":"help_orphans","weight":7},{"id":"t_dv_dock_rumor","kind":"derived","title":"码头上的传闻","text":"码头上的工人们一边扛包，一边低声说着话：“……下个月，王城的粮船会提前到港。”\n“听说守卫队要调去北边了。”","options":[{"label":"假装没听见，继续干活","text":"你把一麻袋盐扛上肩，耳朵却一直竖着。","fx":["count:intel+1","str_exp+2"]}],"parent":"dock_work","weight":8},{"id":"t_dv_recruit_doubt","kind":"derived","title":"新同伙的犹豫","text":"新入伙的同伴在半夜把你叫到一边，压低声音：“你说实话，月蚀之夜之后，我们……还能回到原来的生活吗？”","options":[{"label":"老实说：不能","text":"他沉默了很久，点点头：“……那我陪你到底。”","fx":["rel:lila+0","cha_exp+2","wil_exp+2"]},{"label":"笑笑，说一切都会好","text":"他没再问。但你们之间，多了一点不一样的东西。","fx":["cha_exp+1"]}],"parent":"recruit","weight":7},{"id":"t_dv_bribe_1","kind":"derived","title":"熟悉的面孔","text":"你把钱袋递给巡逻队长的时候，他看了你一眼，目光里，有一点你说不清的东西。\n“这条街，我也是在这里长大的，”他低声说，“有些路，一旦走了，就回不了头。”","options":[{"label":"点点头，没说话","text":"他把钱袋收进怀里，转身走了。背影，有点驼。","fx":["wil_exp+2","cha_exp+1"]},{"label":"问他：那你为什么还在这条路上？","text":"他愣了很久，最后只说了一句：“因为，我还有个女儿。”","fx":["cha_exp+2","count:intel+1"]}],"parent":"bribe_guard","weight":8},{"id":"t_dv_bribe_2","kind":"derived","title":"多收的一枚金币","text":"巡逻队长数了数钱，忽然抬头，笑了：“多了一枚。”\n“给您添茶的。”你说。\n他把那枚金币，又弹了回来：“记着，我今天没收你的钱。”","options":[{"label":"收好，笑着退下","text":"你把金币握在手心，心里，对这个人，有了一点新的看法。","fx":["rel:cass+0","cha_exp+2","count:heat-2"]}],"parent":"bribe_guard","weight":7},{"id":"t_dv_dock_1","kind":"derived","title":"码头上的老乡","text":"扛包的间隙，一个同样从鼠街出来的汉子，凑过来，递给你半壶酒：“听说，你在公会里混？”\n你没答话。他笑了：“都一样。咱们这样的人，不就是靠这条命，换口饭吃。”","options":[{"label":"跟他喝一口，聊聊","text":"你们聊了半个钟头，聊到最后，他才低声说了一件码头上的怪事。","fx":["count:intel+1","hometown+1","cha_exp+1"]},{"label":"摇头，继续干活","text":"他耸耸肩，把酒收回去了。","fx":["str_exp+2"]}],"parent":"dock_work","weight":8},{"id":"t_dv_recruit_1","kind":"derived","title":"不一样的同伙","text":"新来的同伙，在夜里，悄悄把你叫到一边：“头儿，我有个不情之请。”\n他想拿出一半的分成，交给孤儿院。","options":[{"label":"答应，再多添一份","text":"他红着眼，朝你鞠了个躬。从这一天起，他对你，格外尽心。","fx":["gold-20","hometown+3","cha_exp+2"]},{"label":"笑他傻，但随他去","text":"你拍拍他的肩，什么也没说。","fx":["hometown+1"]}],"parent":"recruit","weight":7},{"id":"t_dv_rat_late","kind":"derived","title":"灰鼠的手","text":"灰鼠给你示范一个手法的时候，你忽然发现，他的手，在微微发抖。\n“老了，”他自己先笑了，“再过几年，我就要把这一手，传给别人了。”","options":[{"label":"认真看完整个手法","text":"你记住了每一个细节。这一课，比之前的每一堂，都更沉。","fx":["agi_exp+4","rel:rat+1","wil_exp+1"]},{"label":"扶他坐下，给他倒杯水","text":"灰鼠愣了一下，接过水，笑得很淡：“你这孩子……”","fx":["rel:rat+2","hometown+1"]}],"parent":"learn_rat","weight":8,"cond":"flag:met_rat&&!flag:rat_dead&&age>=20"},{"id":"t_dv_orphans_late","kind":"derived","title":"孩子们的新游戏","text":"孤儿院的院子里，几个孩子，在玩一种新游戏：一个人扮贼，一个人扮捕快。\n“抓到你啦！”扮捕快的小女孩，拽住了你的衣角。","options":[{"label":"假装被“抓”，投降","text":"孩子们哄笑着，把你围在中间。你被“判”了三个月的“苦役”：给每人讲一个故事。","fx":["hometown+3","cha_exp+2","rel:lila+1"]},{"label":"悄悄地，给他们讲个别的游戏","text":"你教他们一个“捉迷藏”的新玩法。后来，整个孤儿院的孩子，都变成了躲藏的高手。","fx":["hometown+2","agi_exp+1"]}],"parent":"help_orphans","weight":8,"cond":"count.donate>=2"},{"id":"t_dv_burgle_study","kind":"derived","title":"书房里的信","text":"你在一间书房里，翻到了一叠没寄出的信。字写得很好，一笔一划，都带着一种藏不住的、小心翼翼的难过。","options":[{"label":"读完，原样放回去","text":"你悄悄离开了那间屋子，带走了一点比金币更沉的东西。","fx":["wil_exp+2","hometown+1"]},{"label":"把信带走，当作情报","check":{"attr":"int","diff":12},"ok":{"text":"信里有几个熟悉的人名，和一桩你不知道的旧事。","fx":["count:intel+1","int_exp+3","count:heat+2"]},"fail":{"text":"信里只有琐碎的家常。你有点后悔。","fx":["int_exp+1"]}}],"parent":"burgle","weight":7}],"content/thief/events_dungeon.json":[{"id":"t_de_sewer_light","kind":"dungeon","title":"下水道里的光","text":"下水道的尽头有一束光，来自头顶一个缺了盖的井口。\n光里，站着一个人，蹲着，在翻一堆什么东西。","options":[{"label":"悄悄靠近，看他在做什么","check":{"attr":"agi","diff":11},"ok":{"text":"那人是个拾荒的老头，他在翻一具冻僵的老鼠。他看你的眼神，没有恶意。老头递给你一枚从泥里捡来的金戒指。","fx":["gold+30","agi_exp+2"]},"fail":{"text":"你一脚踩在了湿滑的石头上，哗啦一声。老头吓得跳了起来。","fx":["hp-5"]}}],"dungeons":["sewer"],"weight":8},{"id":"t_de_sewer_rats","kind":"dungeon","title":"鼠群","text":"黑暗里，一阵细碎的声音由远及近，像成千上万的小脚在爬行。\n不是一只，是一整群。","options":[{"label":"点燃火把，逼退它们","check":{"attr":"wil","diff":11},"ok":{"text":"火光里，鼠群骚动着退了回去。你从它们让出的缝隙里，发现了一个被啃坏的小箱子。","fx":["gold+25","wil_exp+2"]},"fail":{"text":"火把被撞灭了，你被咬了好几口。","fx":["hp-10","wil_exp+1"]}},{"label":"躲进一条侧道","text":"你躲在一个狭窄的管道里，听着鼠群从身边涌过。","fx":["agi_exp+2"]}],"dungeons":["sewer"],"weight":8},{"id":"t_de_ware_dog","kind":"dungeon","title":"看家的恶犬","text":"仓库的角落里，拴着一条黑色的大狗，眼睛是红的。它没有叫，只是低低地看着你。","options":[{"label":"给它丢一块带药的肉","check":{"attr":"int","diff":12},"ok":{"text":"狗吃了肉，慢慢卧下。你在它的窝旁，发现了一小袋被藏起来的钱。","fx":["gold+35","int_exp+2"]},"fail":{"text":"狗没有上当，扑了上来。","fx":["hp-12"]},"cond":"gold>=10"},{"label":"绕开它，走另一条路","text":"你屏息从它的视线边缘滑了过去。","fx":["agi_exp+3"]}],"dungeons":["warehouse"],"weight":8},{"id":"t_de_ware_ledger","kind":"dungeon","title":"红手帮的账本","text":"仓库的一个木箱里，放着一本厚厚的账本，上面记着许多名字和数字。其中有几个名字，你很熟悉。","options":[{"label":"撕下几页，带走","text":"这几页纸，足以让一些人睡不着觉。","fx":["count:intel+1","int_exp+2","rep:shadow+2"]},{"label":"一页不动，原样放回","text":"账本放回原位。你什么也没看见。","fx":["wil_exp+1"]}],"dungeons":["warehouse"],"weight":8},{"id":"t_de_manor_study","kind":"dungeon","title":"书房的暗门","text":"贵族宅邸的书房里，一排书架的后面，有一道缝，吹出凉凉的风。","options":[{"label":"推开暗门，进去看看","check":{"attr":"int","diff":13},"ok":{"text":"暗门后是一间小小的密室，里面堆着几只上了锁的箱子。你撬开其中一只，是一小袋宝石。","fx":["gold+60","int_exp+3"]},"fail":{"text":"暗门上的机关被你触发，一支弩箭擦着你的肩膀飞过。","fx":["hp-12"]}},{"label":"不动，继续往前走","text":"","fx":[]}],"dungeons":["manor_heist"],"weight":8},{"id":"t_de_manor_lady","kind":"dungeon","title":"阳台上的小姐","text":"你从二楼的阳台翻进去，迎面是一位穿着睡袍的年轻小姐。她看着你，没喊，也没躲。\n“你是来偷东西的吗？”她轻声问，“那你能带我走吗？”","options":[{"label":"告诉她：这不是你该走的路","text":"她低下头，轻轻点了点。你从阳台翻出去的时候，听见她在身后说：“……谢谢。”","fx":["cha_exp+2","wil_exp+2"]},{"label":"把她手里的首饰接过来，转身就走","text":"你拿了首饰，没敢回头。","fx":["gold+55","count:heat+6","hometown-2"]}],"dungeons":["manor_heist"],"weight":8},{"id":"t_de_vault_pipe","kind":"dungeon","title":"水渠里的回声","text":"水渠深处，传来一阵有节奏的敲击声，一下一下，像是有人在用锤子敲击什么。","options":[{"label":"循着声音摸过去","check":{"attr":"agi","diff":14},"ok":{"text":"你在转角处停下，看见两个王室暗哨，一边巡逻，一边在墙上敲着暗号。你悄悄记下了他们的节奏。","fx":["count:intel+1","agi_exp+3"]},"fail":{"text":"你一脚踢到了一块松动的石头，暗哨猛地回头。","fx":["hp-12","count:heat+6"]}}],"dungeons":["vault_outer"],"weight":8},{"id":"t_de_vault_graffiti","kind":"dungeon","title":"墙上的涂鸦","text":"水渠的墙上，有一行用刀刻的小字。字迹很旧，像是几十年前的：\n“后来者，别信面具。”","options":[{"label":"用手摸着那些刻痕，沉思片刻","text":"你的指尖沿着那些凹槽，慢慢走了很久。","fx":["count:mask_clue+1","int_exp+3","wil_exp+1"]}],"dungeons":["vault_outer"],"weight":8},{"id":"t_de_sewer_kid","kind":"dungeon","title":"水里的孩子","text":"下水道的拐角，有一个比你小很多的孩子，缩在一个破木桶里。\n他抬起头，眼睛亮得让人心疼：“你……是来抓我的吗？”","options":[{"label":"蹲下来，给他一块干饼","text":"孩子狼吞虎咽，一边吃，一边含糊地，告诉你了一条通往上层的捷径。","fx":["count:intel+1","hometown+2","wil_exp+1"]},{"label":"让他带你找路","check":{"attr":"cha","diff":10},"ok":{"text":"孩子很熟悉这里，七拐八绕，带你绕开了一整队巡逻的恶犬。","fx":["agi_exp+2","exp+14"]},"fail":{"text":"他带你绕了半天，把你带进了一个死胡同。","fx":["hp-4"]}}],"dungeons":["sewer"],"weight":8},{"id":"t_de_sewer_old","kind":"dungeon","title":"下水道的石碑","text":"一块半沉在水里的石碑，上面刻着许多凌乱的名字，和日期。\n最近的一个日期，是三年前。","options":[{"label":"把名字一个个看完","text":"你读了很久。其中有几个，你认识。","fx":["wil_exp+3","hometown+1"]}],"dungeons":["sewer"],"weight":8},{"id":"t_de_ware_vat","kind":"dungeon","title":"藏着的酒桶","text":"仓库的角落里，整整齐齐地码着一排酒桶。有一只，盖子没盖紧，里面飘出的，不是酒香。","options":[{"label":"掀开看看","check":{"attr":"int","diff":11},"ok":{"text":"桶里是一整桶的细盐和香料，走私货。红手帮的标记，印在桶底。","fx":["gold+40","count:intel+1","exp+14"]},"fail":{"text":"你一不小心，碰翻了桶。香料呛得你大咳不止，引来了看守。","fx":["hp-6","count:heat+4"]}},{"label":"不碰，继续往前","text":"","fx":[]}],"dungeons":["warehouse"],"weight":8},{"id":"t_de_ware_cell","kind":"dungeon","title":"上锁的小房间","text":"仓库最深处，有一扇上了三道锁的小门。里面，隐隐传来低低的哭声。","options":[{"label":"撬开锁，看看里面","check":{"attr":"agi","diff":13},"ok":{"text":"门后，是两个被捆着的孩子。他们是被红手帮拐来，要卖到城外的。你割断绳子，带着他们，从后窗悄悄溜了出去。","fx":["hometown+6","rep:shadow+3","exp+30","count:heat+5"]},"fail":{"text":"锁芯里有一道机关，咔哒一声，整个仓库，都响起了警铃。","fx":["hp-8","count:heat+8"]}},{"label":"不管，转身走开","text":"你一路都没敢回头。那个哭声，一直追着你。","fx":["hometown-3","wil_exp+1"],"avoid":true}],"dungeons":["warehouse"],"weight":8},{"id":"t_de_manor_portrait","kind":"dungeon","title":"画像里的眼睛","text":"宅邸的走廊上，挂满了一幅一幅的肖像。每一双眼睛，都像在跟着你转。\n你走过其中一幅的时候，那双眼睛，忽然眨了一下。","options":[{"label":"举起匕首，对着画像","text":"画像里的人，缓缓开口：“年轻人，宅子的主人，不在这里。”它指了指书房的方向。","fx":["wil_exp+2","count:intel+1"]},{"label":"当没看见，加快脚步","check":{"attr":"wil","diff":12},"ok":{"text":"你咬着牙，一口气走过了整条走廊。身后，传来一声悠长的叹息。","fx":["wil_exp+3"]},"fail":{"text":"走到一半，你整个人僵住了，直到画像里的眼睛，缓缓闭上。","fx":["hp-6","wil_exp+1"]}}],"dungeons":["manor_heist"],"weight":8},{"id":"t_de_manor_ledger","kind":"dungeon","title":"书房里的账本","text":"书房的桌上，摊着一本打开的账本。上面，是你熟悉的几个名字，和一串很大的数字。\n其中一行，用红笔，圈了出来。","options":[{"label":"把那一页撕下来","check":{"attr":"agi","diff":12},"ok":{"text":"你悄悄撕下那一页，折进怀里。那一行字，足以让某个体面的人，睡不着觉。","fx":["count:intel+1","count:mask_clue+1","exp+20"]},"fail":{"text":"纸张撕裂的声音，在寂静里，格外刺耳。","fx":["hp-6","count:heat+5"]}},{"label":"只记下数字，不动账本","text":"你闭上眼，把那一串数字，默念了三遍。","fx":["int_exp+3","count:intel+1"]}],"dungeons":["manor_heist"],"weight":8},{"id":"t_de_vault_rune","kind":"dungeon","title":"发光的符文","text":"水渠的拱顶上，刻着一圈淡蓝色的符文，一明一灭，像在呼吸。\n你想起了灰鼠说过的话：“魔晶库的每一道门，都有一个节拍。”","options":[{"label":"数着节拍，穿过去","check":{"attr":"int","diff":14},"ok":{"text":"你闭着眼睛，默数着节拍，一步，两步，三步。符文在你身后，一圈圈熄灭。","fx":["int_exp+4","count:intel+1","exp+24"]},"fail":{"text":"你数错了一拍，符文骤然大亮，把你狠狠地弹了回来。","fx":["hp-12"]}},{"label":"绕开，找别的路","text":"","fx":["agi_exp+2"]}],"dungeons":["vault_outer"],"weight":8},{"id":"t_de_vault_guard","kind":"dungeon","title":"睡着的暗哨","text":"水渠的转角，坐着一个王室暗哨，靠着墙，打着盹。他的钥匙，挂在腰间，随着呼吸一起一伏。","options":[{"label":"悄悄偷走钥匙","check":{"attr":"agi","diff":15},"ok":{"text":"钥匙到手的那一刻，你的手心全是汗。暗哨，咂了咂嘴，翻了个身，继续睡。","fx":["agi_exp+5","count:intel+1","exp+26"]},"fail":{"text":"钥匙环发出一声清脆的“叮”。暗哨猛地睁开了眼睛。","fx":["hp-12","count:heat+8"]}},{"label":"绕过去，不惊动他","text":"你屏着呼吸，贴着对面的墙，一步一步地挪了过去。","fx":["agi_exp+3"]}],"dungeons":["vault_outer"],"weight":8}],"content/thief/events_random.json":[{"id":"t_drunk_noble","kind":"random","title":"喝醉的少爷","text":"一个喝得东倒西歪的年轻贵族，从酒馆里晃出来，腰间的钱袋随着他的步子一荡一荡。\n他的随从不知跑哪去了。","options":[{"label":"顺手牵羊","check":{"attr":"agi","diff":10},"ok":{"text":"你从他身边擦过去的时候，钱袋已经到了你手里。他还在哼着小调。","fx":["gold+60","agi_exp+2","count:heat+5"]},"fail":{"text":"他忽然转过身，醉醺醺地盯着你：“你……你是谁？”你拔腿就跑。","fx":["count:heat+8","hp-3"]}},{"label":"把他扶到巷口，让他的随从找到","text":"他迷迷糊糊地塞了你一把金币：“好小子……明天来我家喝酒。”","fx":["gold+20","cha_exp+3","hometown+1"]},{"label":"不管他","text":"你从他身边走过去。有些钱，今晚不属于你。","fx":[]}],"pool":"opportunity","weight":9,"cond":"age>=16","scene":"alley"},{"id":"t_lost_cart","kind":"random","title":"翻倒的货车","text":"一辆运货的马车在巷口翻了，木箱滚了一地。车夫抱着头在骂，行人围了一圈，却没有人敢靠近。\n其中一只破开的箱子里，露出了一角绸缎。","options":[{"label":"趁乱抱走几匹绸缎","check":{"attr":"agi","diff":11},"ok":{"text":"你像一阵风一样从人群里穿了过去，等车夫回过神来，你已经在三条街外。","fx":["gold+55","agi_exp+2","count:heat+6"]},"fail":{"text":"一只手抓住了你的后领：“贼！”你挨了两脚才挣脱。","fx":["hp-6","count:heat+8"]}},{"label":"帮车夫把箱子搬回车上","text":"车夫涨红了脸，往你手里塞了几个铜板。“好孩子……”","fx":["gold+15","str_exp+2","hometown+2"]},{"label":"只在远处看着","text":"你站在街角，看着人群慢慢散去。","fx":[]}],"pool":"opportunity","weight":8,"scene":"alley"},{"id":"t_street_magician","kind":"random","title":"街头魔术师","text":"广场上，一个戴着礼帽的男人正在变戏法：硬币在他指间翻来翻去，最后从孩子的耳朵里掏出来。\n你看得入了神，他却忽然看了你一眼，眨眨眼。","options":[{"label":"蹲下来，认真偷师","check":{"attr":"int","diff":11},"ok":{"text":"三个手法，你看了两遍就看懂了。这是你一直缺的最后一块。","fx":["agi_exp+3","int_exp+3","count:knife+1","exp+8"]},"fail":{"text":"你只看出了他袖子里藏了东西，没看出来是怎么放进去的。","fx":["agi_exp+1"]}},{"label":"趁着人群，顺走他帽子里的钱","text":"礼帽里的硬币，你顺走了十几枚。魔术师看了你一眼，没有声张。","fx":["gold+18","count:heat+2"],"cond":"age>=17"},{"label":"扔一枚铜板，鼓个掌","text":"魔术师朝你鞠了一躬，把一枚硬币从你的耳朵里“变”了出来。","fx":["gold-1","cha_exp+2","hometown+1"]}],"pool":"opportunity","weight":8,"scene":"street"},{"id":"t_map_seller","kind":"random","title":"卖地图的老人","text":"一个坐在墙根的老人，面前摆着几张发黄的地图。他对你招了招手：“年轻人，要地图吗？下城的，王城的，水渠的……”\n你注意到他的眼睛，看起来看不太清，却总是对着你的口袋。","options":[{"label":"买一张水渠图（50 金币）","text":"图画得潦草，但有几处你一眼就认出是真的：那是别人没有走过的暗道。","fx":["gold-50","count:intel+1","int_exp+3"],"cond":"gold>=50","reason":"金币不足"},{"label":"请他讲讲王城的事","check":{"attr":"cha","diff":11},"ok":{"text":"老人开了话匣子，絮絮叨叨讲了一个钟头。有两三句话，你记在了心里。","fx":["count:intel+1","cha_exp+2"]},"fail":{"text":"他说着说着就睡着了。","fx":["cha_exp+1"]}},{"label":"不买，转身走了","text":"","fx":[]}],"pool":"opportunity","weight":7,"cond":"age>=17","scene":"street"},{"id":"t_keysmith","kind":"random","title":"钥匙匠的铺子","text":"巷尾有一间小小的钥匙铺。铺主是个沉默的中年人，柜台下面摆着上百把锁，每一把都被他拆开又装好。\n他抬头看了你一眼：“看够了就走，想学，就给我磨半天钥匙。”","options":[{"label":"留下来磨半天钥匙","text":"你的指尖被磨得发烫。但中年人最后只说了一句：“……不算太差。”并随手把一套细钩塞给了你。","fx":["int_exp+3","agi_exp+4","exp+10","gold+5"]},{"label":"偷偷在旁边看，不出声","check":{"attr":"agi","diff":12},"ok":{"text":"他拆一把锁，你在心里拆十把。他假装没看见。","fx":["agi_exp+5","exp+8"]},"fail":{"text":"他“咣”地把柜台合上，你被撵了出去。","fx":["agi_exp+1"]}},{"label":"走开","text":"","fx":[]}],"pool":"opportunity","weight":7,"cond":"age>=16&&age\u003c=22","scene":"alley"},{"id":"t_borrowed_coat","kind":"random","title":"借来的外套","text":"你在晾衣绳上，看中了一件很体面的外套。衣服的主人不在，窗台上还摆着半碗没吃完的汤。","options":[{"label":"拿走它","check":{"attr":"agi","diff":10},"ok":{"text":"外套套在你的身上，居然很合身。你再走进“上等人”的街区时，没人多看你一眼。","fx":["cha_exp+3","count:heat+3","gold+10"]},"fail":{"text":"主人在你伸手的时候回来了，你被泼了一盆水。","fx":["hp-2","count:heat+4"]}},{"label":"留下一枚金币，换走它","text":"你把金币放在窗台上，换走了那件外套。你想，也许这算一桩买卖。","fx":["gold-5","cha_exp+3","hometown+1"],"cond":"gold>=5"},{"label":"算了，不拿","text":"","fx":[]}],"pool":"opportunity","weight":7,"scene":"alley"},{"id":"t_lila_favor","kind":"random","title":"莉拉的请求","text":"莉拉在你的窗口敲了三下，这是她的暗号。\n“我有个小忙要你帮，”她小声说，“孤儿院有个孩子发烧了，我钱不够，药铺老板不赊账。”","options":[{"label":"替她去药铺“拿”一副药","check":{"attr":"agi","diff":12},"ok":{"text":"药铺老板转身的瞬间，你已经把药包放进了怀里。莉拉红着眼，说不出话来。","fx":["rel:lila+2","agi_exp+3","count:heat+6","hometown+2"]},"fail":{"text":"药铺老板的目光落在了你的手上。你只好掏钱买了。","fx":["gold-35","rel:lila+1"]}},{"label":"直接给她 35 金币","text":"莉拉拿着钱，沉默了好一会儿：“……我会还你。”","fx":["gold-35","rel:lila+2","hometown+2"],"cond":"gold>=35","reason":"金币不足"},{"label":"这事我帮不了","text":"莉拉的笑容很淡：“没事。我再想想办法。”","fx":["rel:lila-1"]}],"pool":"social","weight":9,"cond":"flag:met_lila","scene":"alley"},{"id":"t_street_kid","kind":"random","title":"巷口的孩子","text":"一个瘦瘦的孩子，一直在你住的巷口晃悠。你问他要什么，他说：“我想跟你学。”\n他的手很脏，指甲缝里全是泥，但看你的眼神，亮得像两颗没擦干净的珠子。","options":[{"label":"收下他，教他几手","text":"你教了他怎么把手藏进袖子里，怎么看人的步子。他学得很快。","fx":["cha_exp+2","hometown+2","count:knife+1"]},{"label":"给他一块面包，叫他回孤儿院去","text":"他接过面包，咬了一口：“……那里太吵了。”但他还是走了。","fx":["gold-2","hometown+1"]},{"label":"不理他","text":"他站了很久，直到天黑才走。","fx":[]}],"pool":"social","weight":8,"cond":"age>=18","scene":"alley"},{"id":"t_gu_invite","kind":"random","title":"老鬼的邀约","text":"黑市里的老鬼，托人带了句话：“今晚来我这儿一趟，有桩买卖，不是人人都配听。”\n你知道老鬼的买卖，从来不干净。","options":[{"label":"赴约","text":"老鬼端着一碗热茶，慢吞吞地说：“我这儿有三件货，要人去取。取回来，我有好处给你。”","fx":["quest:start:gu_list","rep:shadow+2","flag+:gu_invited"]},{"label":"婉拒，说自己手头紧","text":"老鬼点点头：“哪天不紧了，再来。”","fx":["flag+:met_gu"]}],"pool":"social","weight":12,"cond":"flag:met_gu&&!flag:gu_invited&&age>=19&&age\u003c=23","scene":"black_market","once":true},{"id":"t_cass_tea","kind":"random","title":"茶摊偶遇","text":"你在茶摊上碰见了卡斯。她没穿制服，一个人坐在角落里，面前是一碗已经凉了的茶。\n她看见你，没有拔刀，只是淡淡地说：“坐吧。”","options":[{"label":"坐下，装作随口聊聊","check":{"attr":"cha","diff":13},"ok":{"text":"你们聊了很久，聊鼠街的冬天，聊她的老家。她第一次，在你面前笑了一下。","fx":["rel:cass+2","cha_exp+3"]},"fail":{"text":"她盯着你的手指看了一会儿：“你的手，不像一个干活的人。”","fx":["count:heat+5"]}},{"label":"起身就走","text":"你背对着她，一步一步走出了茶摊。直到转过街角，你才松了一口气。","fx":["count:heat+1"]},{"label":"请她喝一碗热茶（5 金币）","text":"她愣了一下，接过茶碗，什么也没说。但她放下碗的时候，似乎没那么紧绷了。","fx":["gold-5","rel:cass+1"],"cond":"gold>=5"}],"pool":"social","weight":7,"cond":"flag:met_cass","scene":"street"},{"id":"t_poet","kind":"random","title":"吟游诗人","text":"一个年轻的吟游诗人，在酒馆里唱起了一支新歌：关于一个“来无影，去无踪”的鼠街盗贼。\n歌词里的人，和你很像，又不太像。听众们笑着，鼓掌。","options":[{"label":"塞给他几个铜板，让他多唱几遍","text":"诗人欣然领受。从此，鼠街的人，多了一点对你的好奇。","fx":["gold-5","cha_exp+3","hometown+2"]},{"label":"把他拉到一边，让他换一首","text":"诗人耸耸肩：“好吧，好吧。”当晚他换成了关于一个厨子的歌。","fx":["count:heat-5","cha_exp+1"]},{"label":"不动声色，听完再走","text":"一首歌的工夫，你想了很多。","fx":["wil_exp+2"]}],"pool":"social","weight":6,"cond":"count.heat>=20","scene":"tavern"},{"id":"t_rat_story","kind":"random","title":"灰鼠的旧事","text":"灰鼠难得没有骂人，他倚着墙，叼着草茎，讲了一个很久以前的故事：\n关于一个年轻的盗贼，一次失败的大案，和一把一分为二的钥匙。\n“后来呢？”你问。他吐出草茎，说：“后来，我就成了灰鼠。”","options":[{"label":"追问那把钥匙","text":"灰鼠眯起眼：“急什么。有些事，要等你配得上，才能知道。”","fx":["rel:rat+1","count:intel+1"]},{"label":"什么也没问，给他倒了一杯水","text":"灰鼠接过水，笑了笑：“你小子，倒也不算笨。”","fx":["rel:rat+2","wil_exp+2"]}],"pool":"social","weight":8,"cond":"flag:met_rat&&rel.rat>=3&&!flag:rat_dead","scene":"alley","once":true},{"id":"t_patrol_sweep","kind":"random","title":"巡逻队搜查","text":"半夜，一阵整齐的脚步声从巷子两头同时涌来。\n领头的是个不认识的队长：“奉命搜查下城，闲杂人等，一律待命。”","options":[{"label":"躲进下水道，等他们走","check":{"attr":"agi","diff":12},"ok":{"text":"你在黑暗里屏息了半个钟头，直到脚步声彻底消失。","fx":["agi_exp+3","count:heat-4"]},"fail":{"text":"他们的火把照到了你的鞋子。","fx":["count:heat+6","goto:ev_arrested"]}},{"label":"塞点钱，装作良民","text":"巡逻队长数了数，咳了一声，带人走了。","fx":["gold-40","count:heat-5"],"cond":"gold>=40","reason":"金币不足"},{"label":"翻上屋顶，跑","text":"你在屋顶上跑了三条街。身后的叫骂声渐渐淡了。","fx":["agi_exp+2","count:heat+4","hp-4"]}],"pool":"calamity","weight":12,"cond":"count.heat>=25","scene":"alley"},{"id":"t_bounty","kind":"random","title":"悬赏令","text":"墙上贴出了一张新的悬赏令：画像不算像，但鼻子和眼睛，足够让人想起你。\n赏金是 200 金币。","options":[{"label":"撕下来，当没见过","check":{"attr":"cha","diff":12},"ok":{"text":"你一把撕下，揉成一团扔进了水沟。围观的人没说什么。","fx":["count:heat-4","cha_exp+2"]},"fail":{"text":"撕告示的手，被一个路过的人看见了。","fx":["count:heat+8"]}},{"label":"去黑市，买一张假身份（80 金币）","text":"老鬼什么也没问，递来一张盖着章的纸。","fx":["gold-80","count:heat-20"],"cond":"gold>=80&&flag:met_gu","reason":"金币不足，或还不认识老鬼"},{"label":"躲上几天","text":"你在阁楼里待了四天，每天听着巷子里人们议论那张画像。","fx":["count:heat-8","wil_exp+1"]}],"pool":"calamity","weight":14,"cond":"count.heat>=50","scene":"alley"},{"id":"t_informer","kind":"random","title":"叛徒","text":"有人把你的落脚处，报给了巡逻队。\n你从窗口看见街对面有一个熟悉的背影，是你曾经帮过的人。","options":[{"label":"追上去，和他谈谈","check":{"attr":"cha","diff":13},"ok":{"text":"他哭着说是被逼的。你叹了口气，没再追究。","fx":["wil_exp+2","count:heat+4","cha_exp+2"]},"fail":{"text":"他一见你，转身就跑，边跑边喊：“贼！”","fx":["count:heat+10","hp-3"]}},{"label":"连夜换一个落脚点","text":"你收拾了一个小包袱，一晚上换了三条街。","fx":["count:heat-6","gold-10"]},{"label":"等着，看他们敢不敢来","text":"你磨亮了刀，在黑暗里坐了一夜。他们没有来。","fx":["wil_exp+3"]}],"pool":"calamity","weight":9,"cond":"count.crew>=1&&count.heat>=20","scene":"alley"},{"id":"t_extortion","kind":"random","title":"红手帮收账","text":"两个红手帮的人堵在你面前，笑嘻嘻地伸出手：“听说你最近发财了？按规矩，该交份子钱。”","options":[{"label":"动手","text":"你一拳挥了出去。","fx":[{"type":"combat","enemy":"red_hand","win":["exp+20","rep:shadow+2","hometown+2","log:他们灰溜溜地走了。"],"lose":["hp-12","gold-40","log:他们拿走了你的钱，还踹了你两脚。"]}]},{"label":"交钱免灾（40 金币）","text":"他们收了钱，笑着拍了拍你的肩：“识相。”","fx":["gold-40","rep:shadow-1"],"cond":"gold>=40","reason":"金币不足"},{"label":"甩出烟雾弹","check":{"attr":"agi","diff":12},"ok":{"text":"烟雾里，你从他们的腋下钻了过去。","fx":["agi_exp+3"]},"fail":{"text":"烟还没散，一只手已经卡住了你的脖子。","fx":["hp-10","gold-30"]},"cond":"flag:sk_smoke_bomb","reason":"需要烟雾弹"}],"pool":"calamity","weight":10,"cond":"flag:red_hand_threat&&!flag:red_hand_broken","scene":"alley"},{"id":"t_stash_stolen","kind":"random","title":"藏的钱不见了","text":"你回到那块松动的砖头前，伸手一摸，空的。\n藏在里面的钱，不翼而飞。","options":[{"label":"四处查问，找到小偷","check":{"attr":"int","diff":12},"ok":{"text":"你顺着几条线索找到了偷钱的人，是一个饿坏了的孩子。你看了他很久，只拿回了一半。","fx":["gold+25","int_exp+3","hometown+1"]},"fail":{"text":"找了半天，一无所获。你只能骂自己太大意。","fx":["gold-20","int_exp+1"]}},{"label":"咬牙认栽","text":"算了，下次换个地方藏。","fx":["gold-30","wil_exp+2"]}],"pool":"calamity","weight":8,"cond":"gold>=120","scene":"alley"},{"id":"t_rooftop_slip","kind":"random","title":"雨夜屋顶","text":"一场突如其来的暴雨，把屋顶变成了冰面。你在高处的瓦片上，一脚踩空。","options":[{"label":"抓住屋檐，翻回去","check":{"attr":"agi","diff":13},"ok":{"text":"你吊在屋檐边，咬紧牙，一点一点把自己撑了上去。","fx":["agi_exp+3","hp-3"]},"fail":{"text":"你重重地摔进了下面的水沟，疼得半天没爬起来。","fx":["hp-14","status+:injured:2"]}}],"pool":"calamity","weight":8,"cond":"age>=17&&season!=summer","scene":"rooftop"},{"id":"t_fever","kind":"random","title":"下城热病","text":"鼠街又起了热病。巷子里每天抬出去几个人，空气里都是艾草和石灰的味道。\n你开始觉得头沉。","options":[{"label":"花钱买药（40 金币）","text":"药很苦，但退烧很快。","fx":["gold-40","hp-3"],"cond":"gold>=40","reason":"金币不足"},{"label":"硬扛过去","check":{"attr":"wil","diff":12},"ok":{"text":"你一个人躺了三天，把烧挨了过去。","fx":["wil_exp+4","hp-8"]},"fail":{"text":"你病得很重，足足躺了半个月，才爬得起来。","fx":["hp-16","status+:fatigue:2","gold-10"]}}],"pool":"calamity","weight":7,"scene":"alley_snow","cond":"season==winter"},{"id":"t_snitch_gang","kind":"random","title":"公会内部的闲话","text":"有人在公会里放话，说你抢了不该抢的功劳，还说你和巡逻队的人走得太近。\n传到你耳朵里的时候，已经变成了另一个版本。","options":[{"label":"找传话的人对质","check":{"attr":"cha","diff":13},"ok":{"text":"三言两语，你把话说开了，对方有点下不来台，反倒承了你的情。","fx":["rep:shadow+2","cha_exp+3"]},"fail":{"text":"越描越黑。","fx":["rep:shadow-4","cha_exp+1"]}},{"label":"不辩解，用行动证明","text":"你什么也没说，一连几个月办了几件漂亮的活。","fx":["rep:shadow+1","wil_exp+2","gold-15"]}],"pool":"calamity","weight":7,"cond":"flag:guild_member","scene":"tavern"},{"id":"t_raid_unlucky","kind":"random","title":"盯梢的人","text":"你察觉到，有人跟了你三条街。\n对方很专业，不近不远，每次你回头，他都恰好在看橱窗。","options":[{"label":"绕进死胡同，伏击他","check":{"attr":"agi","diff":13},"ok":{"text":"他刚转进巷子，你的刀已经抵在了他的腰上。他是卡斯派来的人，被你放了回去，带话：你已经发现了。","fx":["count:heat-3","agi_exp+3","rel:cass-1"]},"fail":{"text":"他早有防备，反手把你按在了墙上。","fx":["hp-6","count:heat+8"]}},{"label":"甩掉他，换一条路","text":"你在人群里拐了六个弯，才把他甩开。","fx":["agi_exp+2","count:heat+2"]}],"pool":"calamity","weight":9,"cond":"flag:met_cass&&count.heat>=30","scene":"street"},{"id":"t_festival","kind":"random","title":"王城节庆夜","text":"王城里正在庆祝收获节，烟火从塔尖升起，一直亮到下城。\n所有人都仰着头，没有人看自己的口袋。","options":[{"label":"趁乱在人群里下手","check":{"attr":"agi","diff":11},"ok":{"text":"烟火一朵朵炸开，你的手在一个个口袋之间游走，快得没有人察觉。","fx":["gold+90","agi_exp+3","count:heat+8"]},"fail":{"text":"一个壮汉抓住了你的手腕，你被挤出了人群。","fx":["hp-5","count:heat+10"]}},{"label":"混进人群，看看烟火","text":"你难得没有想着偷谁。烟火在夜空里炸开，像一场无声的雨。","fx":["wil_exp+1","cha_exp+1","hometown+1"]},{"label":"趁着没人盯梢，去踩点王城外围","check":{"attr":"int","diff":12},"ok":{"text":"今夜没人关心王城的围墙。你在围墙外绕了一圈，记下了暗哨的位置。","fx":["count:intel+1","int_exp+3"]},"fail":{"text":"你绕得太久，被一队巡逻的兵盯上了。","fx":["count:heat+6"]}}],"pool":"world","weight":7,"cond":"season==autumn","scene":"rooftop"},{"id":"t_tax_season","kind":"random","title":"收税季","text":"税官们挨家挨户地敲门，下城的人们数着铜板，一脸苦相。\n有人在巷子里低声咒骂，有人把家里最后一件值钱的东西拿去了当铺。","options":[{"label":"把赚的钱匀一些给街坊","text":"几个人千恩万谢。你被人叫了一整个月的“手哥”。","fx":["gold-35","hometown+5","rep:shadow+1"],"cond":"gold>=35","reason":"金币不足"},{"label":"趁他们交钱的时候，在当铺附近蹲点","check":{"attr":"agi","diff":12},"ok":{"text":"当铺柜台后面的钱箱，被你轻轻地划开了一道口。","fx":["gold+70","count:heat+7","agi_exp+2"]},"fail":{"text":"当铺的伙计比你想象的警觉。","fx":["hp-6","count:heat+6"]}},{"label":"什么也不做，低头走过","text":"你把手插在口袋里，没有看任何一个人的脸。","fx":[]}],"pool":"world","weight":7,"cond":["season==winter","season==spring"],"scene":"street"},{"id":"t_north_rumor","kind":"random","title":"北方的传闻","text":"酒馆里有人说，北方的边境上，魔物的踪迹越来越多。\n有人说是谣言，有人说，百年一醒的东西，又要醒了。\n你听了一耳朵，没怎么在意：王都的灯，总是亮得很稳。","options":[{"label":"多听两句，打听消息","text":"你听到了几条杂乱的消息，有一条，隐隐约约和王城的魔晶有关。","fx":["count:intel+1","int_exp+2"]},{"label":"不关心，继续喝酒","text":"与你有什么关系呢？","fx":[]}],"pool":"world","weight":6,"cond":"age>=20","scene":"tavern"},{"id":"t_clue_ledger","kind":"random","title":"账本上的缺页","text":"你在公会的账房里等人，无意中翻到了一本旧账簿。最近三年的几页，被人小心翼翼地撕走了，只留下装订线旁的一点碎边。","options":[{"label":"把残页的痕迹记下来","check":{"attr":"int","diff":13},"ok":{"text":"碎边上还留着几个字，像是一笔来自税务署的“特别拨款”。","fx":["count:mask_clue+1","int_exp+3","flag+:clue_1"]},"fail":{"text":"你看不出什么，倒是账房先生回来了，一脸狐疑。","fx":["count:heat+3"]}},{"label":"把账簿放回去","text":"你什么也没碰。有些事，现在还不到时候。","fx":[]}],"pool":"opportunity","weight":7,"cond":"count.intel>=2&&age>=21&&!flag:clue_1","scene":"tavern","once":true},{"id":"t_clue_coin","kind":"random","title":"金币上的印记","text":"面具先生给你的预付金币，在酒馆的灯光下，反射出一点不寻常的光。\n你仔细看，币边上，有一圈极细的刻痕，像是一个家徽的轮廓。","options":[{"label":"拿去黑市，请老鬼看看","check":{"attr":"cha","diff":12},"ok":{"text":"老鬼只看了一眼，就把金币还给你，脸色变了变：“……别问，也别说是我看的。”","fx":["count:mask_clue+1","count:intel+1","flag+:clue_2"]},"fail":{"text":"老鬼只说了一句：“假币。”就不再理你。","fx":["cha_exp+1"]},"cond":"flag:met_gu","reason":"还不认识老鬼"},{"label":"收好，不声张","text":"金币在你的口袋里，沉得有点不寻常。","fx":["int_exp+2"]}],"pool":"opportunity","weight":7,"cond":"flag:mask_hired&&!flag:clue_2","scene":"black_market","once":true},{"id":"t_clue_voice","kind":"random","title":"熟悉的声音","text":"你在王城边上的一家茶楼里，隔着一道屏风，听见了一个声音，沙哑，像从井底传上来。\n你浑身一僵：那是面具先生的声音，却是另一种口音，更体面，更老练。","options":[{"label":"贴着屏风，屏息细听","check":{"attr":"agi","diff":13},"ok":{"text":"你听见他说：“……魔晶库的事，不必操之过急。下城那些人，只是棋子。”\n你悄悄地后退，没有惊动任何人。","fx":["count:mask_clue+1","agi_exp+3","flag+:clue_3"]},"fail":{"text":"屏风后的声音忽然停了。你慌忙离开。","fx":["count:heat+6"]}},{"label":"不敢多留，赶紧走开","text":"你一路没有回头。","fx":["wil_exp+1"]}],"pool":"opportunity","weight":7,"cond":"count.intel>=4&&age>=22&&!flag:clue_3","scene":"street","once":true},{"id":"t_e_baker","kind":"random","title":"面包铺的后门","text":"天还没亮，面包铺的后门虚掩着。热烘烘的香味，一阵阵地往外飘。\n门口的垃圾桶边，坐着一个比你更瘦的孩子，一直盯着那扇门。","options":[{"label":"悄悄溜进去，拿几个面包","check":{"attr":"agi","diff":10},"ok":{"text":"面包在你怀里，还带着烤炉的温度。你分给那个孩子一半，他没说谢谢，但狼吞虎咽的样子，你记了很久。","fx":["gold+8","hometown+1","agi_exp+2","count:heat+3"]},"fail":{"text":"面包师傅举着擀面杖冲了出来，你们两个都挨了一下。","fx":["hp-5","count:heat+5"]}},{"label":"帮面包师搬一早上的面粉，换几个面包","text":"师傅一边骂你们瘦得像猴，一边让每人多拿了一个。","fx":["str_exp+2","hometown+2","hp+0"],"cond":"hp>0"},{"label":"不去了，转身走开","text":"你饿着肚子走远了。有些底线，不到最后，你不想碰。","fx":["wil_exp+2"]}],"pool":"opportunity","weight":9,"cond":"age\u003c=18","scene":"street"},{"id":"t_e_dice","kind":"random","title":"巷口的骰子","text":"几个半大的孩子，围在巷口的石板上掷骰子，赌的是几块干面包。\n一个比你高半个头的男孩，看见你，招手：“来一把？”","options":[{"label":"押一块面包","check":{"attr":"luk","diff":10},"ok":{"text":"骰子在石板上滚了几圈，停在了你想要的那一面。你赢了三块面包，分给了旁边饿着肚子的孩子。","fx":["gold+10","luk_exp+3","hometown+1"]},"fail":{"text":"骰子冷冰冰地落在了另一面。你输得干干净净。","fx":["luk_exp+1"]}},{"label":"看他们赌，顺便学几招","text":"你蹲在一旁，看了一下午。那个男孩的手法，其实藏着几个小花招。","fx":["agi_exp+2","int_exp+1"]},{"label":"走开","text":"","fx":[]}],"pool":"opportunity","weight":8,"cond":"age\u003c=18","scene":"alley"},{"id":"t_e_rain","kind":"random","title":"雨天的屋檐","text":"一场突如其来的大雨，把整条鼠街变成了河。你躲在一个窄窄的屋檐下，旁边是一个盖着破毯子的老乞丐。\n他咳嗽着，从毯子里，递给你半块干饼。","options":[{"label":"接过来，两个人分着吃","text":"饼很硬，但很暖。老乞丐讲起了很多年前的鼠街，那时候，路灯是亮的。","fx":["hometown+2","wil_exp+2","int_exp+1"]},{"label":"把自己最后的铜币，放进他的碗里","text":"老乞丐没抬头，只是低低地说了声：“鼠街会记得你的。”","fx":["gold-5","hometown+3"],"cond":"gold>=5"},{"label":"摸一摸他毯子下面，有没有值钱的东西","text":"你的手刚伸过去，老乞丐忽然睁开眼，看了你一眼。你缩回了手，心里一阵发虚。","fx":["hometown-2","count:heat+1"],"avoid":true}],"pool":"opportunity","weight":8,"cond":"age\u003c=18","scene":"alley"},{"id":"t_e_vendor","kind":"random","title":"被抢的小贩","text":"一个卖菜的小贩，被两个地痞按在墙上，篮子里的菜，滚了一地。\n没有人上去帮忙，巷子里的门，一扇接一扇地关上了。","options":[{"label":"冲上去，捣乱一把","check":{"attr":"agi","diff":11},"ok":{"text":"你从背后撞倒了其中一个，趁乱拉着小贩就跑。地痞骂着追了两条街，最后放弃了。","fx":["hometown+3","agi_exp+3","rep:shadow+1","exp+10"]},"fail":{"text":"你冲得太莽，被其中一个拎住了衣领。他们打了你一顿，把你扔进了垃圾堆。","fx":["hp-8","agi_exp+1"]}},{"label":"躲在暗处，等他们走了再出来","text":"你屏着呼吸，等地痞走远，才从暗处出来，帮小贩把菜一颗颗捡回篮子里。","fx":["hometown+1","gold+4"]},{"label":"关上自己的门","text":"你听见墙外，小贩一声低低的叹气。你把耳朵，捂得更紧了。","fx":["hometown-1"]}],"pool":"opportunity","weight":8,"cond":"age\u003c=19","scene":"street"},{"id":"t_e_watcher","kind":"random","title":"屋顶上的人","text":"夜里，你偶然抬头，看见对面屋顶上，坐着一个人影，一动不动。\n他像一团比夜更深的影子，却在朝你这边，轻轻地点了点头。","options":[{"label":"爬上去，看看是谁","check":{"attr":"agi","diff":12},"ok":{"text":"屋顶上的人，是个陌生的年轻人。他递给你一根烤焦的玉米：“新来的？这条街的屋顶，是我的。”你们聊了一夜。","fx":["agi_exp+3","cha_exp+2","hometown+1"]},"fail":{"text":"你一脚踩空了一块松瓦，差点摔下去。对方在屋顶上，低低地笑了一声。","fx":["hp-4","agi_exp+1"]}},{"label":"装作没看见","text":"你把头缩回屋里。心里，却有点不踏实。","fx":[]}],"pool":"opportunity","weight":7,"cond":"age\u003c=18&&!flag:guild_member","scene":"rooftop"},{"id":"t_e_chalk","kind":"random","title":"墙上的粉笔记号","text":"你注意到，鼠街的墙根下，到处画着奇怪的粉笔符号：一个圆里套着三角，一条斜线，一只小小的鼠。\n后来才知道，那是贼们之间的暗语。","options":[{"label":"把符号一个个记下来","check":{"attr":"int","diff":11},"ok":{"text":"你花了一个下午，把每一个符号的位置和朝向，都画在了手心里。再看鼠街的墙，忽然就像一本翻开的书。","fx":["int_exp+3","count:intel+1","agi_exp+1"]},"fail":{"text":"符号太多，你记了一半就乱了。","fx":["int_exp+1"]}},{"label":"去问灰鼠这是什么意思","text":"灰鼠看了你一眼，笑了：“能看出来的人，总有一天，会用得上。”","fx":["rel:rat+1","int_exp+2"],"cond":"flag:met_rat"},{"label":"不管它们","text":"","fx":[]}],"pool":"opportunity","weight":7,"cond":"age\u003c=19","scene":"alley"},{"id":"t_g_feud","kind":"random","title":"公会里的两派","text":"公会里，最近分成了两派：一派要“稳稳地发财”，一派要“干一票大的”。\n两边都来拉你。茶馆里，每个人的目光，都比往常多停留了一秒。","options":[{"label":"站在“稳”的一边","text":"你被分到了守仓库、管账本的那一队。日子无聊了些，却也安全。","fx":["rep:shadow+2","gold+20","count:heat-3"]},{"label":"站在“干大的”一边","text":"你们商量了三个晚上，计划漂亮得让人心跳。可惜，有人先泄了密。","fx":["rep:shadow+3","count:heat+8","agi_exp+2"]},{"label":"哪边都不靠","check":{"attr":"cha","diff":13},"ok":{"text":"你笑着给每一方，都敬了一杯，又说了一堆模棱两可的好话。两边都把你当成了自己人。","fx":["rep:shadow+4","cha_exp+4"]},"fail":{"text":"两边都觉得你在骑墙。接下来的几个月，你在公会里，没有一个人肯和你多说话。","fx":["rep:shadow-3","cha_exp+1"]}}],"pool":"calamity","weight":8,"cond":"flag:guild_member&&age>=20","scene":"tavern"},{"id":"t_g_assassin","kind":"random","title":"不该接的活","text":"一个蒙着脸的人，在黑市的暗摊前拦住你，塞来一个钱袋：“只要一个晚上。对象，是个商会的会计。”\n钱袋很沉。里面，大概够你付半年的房租。","options":[{"label":"拒绝，把钱袋推回去","text":"那人笑了一下：“清高。”但他转身走的时候，脚步，略微顿了一顿。","fx":["wil_exp+3","hometown+2","rep:shadow+1"]},{"label":"假装答应，转身通知那个会计","check":{"attr":"cha","diff":13},"ok":{"text":"会计吓得脸都白了，把半个月的积蓄，都塞进了你的手里。第二天，他全家都不见了。你看着那一袋钱，什么感觉都没有。","fx":["gold+60","hometown+2","count:heat+4","cha_exp+3"]},"fail":{"text":"你找到会计家的时候，已经晚了。屋里，什么也没有。","fx":["hometown-3","wil_exp+2"]}},{"label":"收下钱，然后不管","text":"那人，第二天又来了一次。这一次，他没有笑。","fx":["gold+80","hometown-4","count:heat+6"],"avoid":true}],"pool":"social","weight":7,"cond":"flag:guild_member&&age>=21","scene":"black_market"},{"id":"t_g_casino","kind":"random","title":"暗赌场的邀请","text":"一张画着骰子的黑色卡片，被人塞进了你的口袋。背面只有一行字：“今晚，三号巷，有一桌不限注的局。”","options":[{"label":"带着 100 金币，去碰碰运气","check":{"attr":"luk","diff":13},"ok":{"text":"骰子在碗里转了很久。你赢了。赢得很大，大到桌对面的人，开始用不一样的眼神看你。","fx":["gold+190","luk_exp+4","count:heat+5","rep:shadow+1"]},"fail":{"text":"你输光了带去的一百，还被人送出了门。","fx":["gold-100","luk_exp+1"]},"cond":"gold>=100","reason":"金币不足"},{"label":"不赌，只是在门口，看看谁进谁出","check":{"attr":"int","diff":13},"ok":{"text":"你在街对面蹲了一晚上，认出了好几张脸：有衙门的书吏，有商会的账房，还有一位，你绝对没想到。","fx":["count:intel+1","int_exp+3","exp+14"]},"fail":{"text":"你什么也没看出来，只被冻得打了一晚上喷嚏。","fx":["int_exp+1","status+:fatigue:1"]}},{"label":"把卡片扔了","text":"","fx":[]}],"pool":"opportunity","weight":7,"cond":"age>=20&&gold>=60","scene":"black_market"},{"id":"t_g_smuggle","kind":"random","title":"码头的货","text":"码头上，有人在悄悄地卸一批没有标记的货箱。领头的人看见你，招了招手：“新手？帮我把这几个箱子，运到三号仓库，一个钟头，二十个金币。”","options":[{"label":"帮他搬","check":{"attr":"str","diff":10},"ok":{"text":"箱子很沉，里面叮当作响。你一个钟头搬完，拿了钱，什么也没问。","fx":["gold+25","str_exp+3","count:heat+4"]},"fail":{"text":"第三趟，你的肩膀被压得脱了臼。","fx":["hp-8","gold+10"]}},{"label":"打听里面是什么","check":{"attr":"cha","diff":12},"ok":{"text":"领头人压低声音：“魔晶的碎片。上面查得紧，别说出去。”你记住了这个消息。","fx":["count:intel+1","cha_exp+2","gold+10"]},"fail":{"text":"他脸色一沉：“不该问的别问。”你被晾在了原地。","fx":["cha_exp+1"]}},{"label":"没兴趣，走开","text":"","fx":[]}],"pool":"opportunity","weight":7,"cond":"age>=19","scene":"warehouse"},{"id":"t_g_informer","kind":"random","title":"线人的消息","text":"一个断了半只耳朵的线人，在暗巷里拦住你，递给你一张折得很小的纸：“今晚，巡逻队会换班。换班的间隙，有半个钟头，三号街没有人。”","options":[{"label":"给他 20 金币，买下这个消息","text":"他数了数钱，笑着消失在了黑暗里。后来你才发现，这条消息，的确是真的。","fx":["gold-20","count:intel+1","count:heat-3"],"cond":"gold>=20","reason":"金币不足"},{"label":"不信他，问他的来路","check":{"attr":"cha","diff":13},"ok":{"text":"三言两语，你就看出这个人在撒谎，也顺带从他的话里，听出了另一条有用的。","fx":["count:intel+1","cha_exp+3"]},"fail":{"text":"他一眼看穿了你的试探，笑了笑，转身走了。","fx":["cha_exp+1"]}},{"label":"不理会","text":"","fx":[]}],"pool":"social","weight":7,"cond":"age>=19&&count.intel\u003c6","scene":"alley"},{"id":"t_g_cursed","kind":"random","title":"带血的怀表","text":"你在一次“小活儿”里，顺走了一块金怀表。回到阁楼打开一看，表盖内侧，刻着一行小字：“赠吾儿，愿你一生平安。”\n怀表的背面，有一点已经发黑的血迹。","options":[{"label":"想办法物归原主","check":{"attr":"int","diff":12},"ok":{"text":"你顺着刻字，找到了那位失主的母亲。老妇人抱着怀表，坐在门槛上哭了很久。她没有问你是谁，只是给你泡了一杯茶。","fx":["hometown+4","wil_exp+3","count:heat+4","rep:shadow-1"]},"fail":{"text":"你找了很久，没有找到失主。怀表，被你放在了阁楼最深的抽屉里。","fx":["wil_exp+1","hometown+0"]}},{"label":"拿去黑市卖了","text":"老鬼瞥了一眼，价钱压得很低。你拿着钱，却觉得，手心有点烫。","fx":["gold+45","count:heat+2","hometown-2"]},{"label":"扔进河里","text":"怀表沉下去的时候，水面，连一点波纹都没有。","fx":["wil_exp+2"]}],"pool":"calamity","weight":7,"cond":"age>=18","scene":"alley"},{"id":"t_g_fire","kind":"random","title":"下城起火","text":"半夜，鼠街最东边，忽然烧了起来。木头的房子一座接一座，火光把半个下城，照得通红。\n到处都是喊声。有孩子的哭声，从一座塌了一半的屋子里，传了出来。","options":[{"label":"冲进去救人","check":{"attr":"str","diff":11},"ok":{"text":"你顶着浓烟，从塌了一半的屋梁下，拖出了一个小女孩。她的母亲跪在地上，抱着她哭，一句话也说不出来。","fx":["hometown+8","rep:shadow+2","str_exp+4","hp-6","exp+30"]},"fail":{"text":"火势比你想的更猛。你只救出了一个，自己被烧伤了手臂。","fx":["hp-12","hometown+4","status+:injured:2"]}},{"label":"组织街坊传水","text":"你扯着嗓子，指挥人们排成一条长队，一桶一桶地把水传过去。火，在天亮前，被扑灭了。","fx":["hometown+5","cha_exp+3","rep:shadow+1"]},{"label":"趁乱溜进被撤离的屋子","text":"","fx":["gold+60","hometown-6","count:heat+3"],"avoid":true}],"pool":"calamity","weight":6,"cond":"age>=17","scene":"alley"},{"id":"t_s_snow","kind":"random","title":"封街的大雪","text":"冬天最大的一场雪，把鼠街的每一条巷子，都封了起来。积雪厚得没过膝盖，连屋檐上，都垂着一尺长的冰凌。","options":[{"label":"帮邻居清理门口的积雪","text":"一上午，你把半条街的门口，都扫出了一条路。有人偷偷塞给你一块热饼。","fx":["hometown+3","str_exp+2","hp+0"]},{"label":"趁雪天，没人巡逻，出去“工作”","check":{"attr":"agi","diff":13},"ok":{"text":"脚印会暴露一切，但风雪，也盖住了一切。你走了一整夜，天亮前，把所有脚印，都踩进了新雪里。","fx":["gold+70","count:heat+6","agi_exp+3"]},"fail":{"text":"你在一座屋顶上滑了一跤，雪埋住了半个身子，被冻得几乎失去知觉。","fx":["hp-10","status+:fatigue:2"]}},{"label":"躲在阁楼里，烤火","text":"你和几个邻居，挤在一个火盆旁，聊了整整一个冬夜。","fx":["hometown+2","wil_exp+1","heal:0.3"]}],"pool":"calamity","weight":9,"cond":"season==winter","scene":"alley_snow"},{"id":"t_s_flood","kind":"random","title":"春汛","text":"春天的水，漫过了下水道的井盖，鼠街的低洼处，一夜间变成了泽国。有人把床板拆下来，当船使。","options":[{"label":"帮邻居转移家当","text":"你和几个年轻人，趟着齐腰深的水，一趟一趟地背人搬东西。","fx":["hometown+4","str_exp+3","hp-3"]},{"label":"去水里，摸那些漂出来的东西","check":{"attr":"luk","diff":11},"ok":{"text":"你在齐腰深的水里，摸到了一只被泡得发胀的木匣，里面，竟是一小袋银币。","fx":["gold+55","luk_exp+3"]},"fail":{"text":"你什么也没摸到，只被一块漂浮的木板，撞了个正着。","fx":["hp-5"]}},{"label":"回阁楼，等水退","text":"","fx":[]}],"pool":"calamity","weight":8,"cond":"season==spring","scene":"sewer"},{"id":"t_s_heat","kind":"random","title":"夏夜的闷热","text":"夏天的夜，闷得让人睡不着。整条鼠街的人，都搬着凳子，坐到了巷子里。\n有人弹起了一把走了调的琴，有人唱起了一支很老的歌。","options":[{"label":"坐下来，听他们唱","text":"一首接一首，没人在意谁偷了谁，谁欠了谁。那一夜，鼠街，像一个真正的家。","fx":["hometown+3","wil_exp+2","cha_exp+1"]},{"label":"趁人都在外面，进几间空屋","check":{"attr":"agi","diff":12},"ok":{"text":"整条街的人都聚在巷子里，家家户户的门，都虚掩着。你很轻松地，拿到了几样小东西。","fx":["gold+50","count:heat+7"
