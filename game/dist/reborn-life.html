ed","scene":"deck"},{"id":"v_t_crew","kind":"random","title":"水手们的闲谈","text":"甲板上，几个水手围坐在一起，一边吃着干面包，一边小声聊天。他们说的，是故乡，是母亲，是出海前，没来得及说的话。","options":[{"label":"坐下来，认真地听","text":"你们聊了很久。有人哽咽，有人笑，有人唱起了一支，只有他们那个小村子才会唱的歌。","fx":["hometown+2","cha_exp+3","rel:bram+1"]},{"label":"分给每人一份额外的朗姆酒（10 金币）","text":"水手们，一个接一个，举起了杯子。那一夜，整条船，都是歌声。","fx":["gold-10","hometown+3","cha_exp+2"],"cond":"gold>=10"},{"label":"悄悄走开，不打扰","text":"你在船尾，站了很久。","fx":["wil_exp+1"]}],"pool":"social","weight":8,"cond":"count.ship>=2&&count.crew>=2","scene":"deck"},{"id":"v_t_dinner","kind":"random","title":"甲板上的晚宴","text":"三桅商船的甲板，足够宽敞。商会的几位会员，提议，在你的船上，办一场海上的晚宴。","options":[{"label":"欣然答应，把甲板布置得漂漂亮亮（30 金币）","check":{"attr":"cha","diff":13},"ok":{"text":"那一夜，整艘船，都被灯火照得发亮。会员们喝得很尽兴，临别时，每个人，都主动留下了一张名片。","fx":["gold-30","rep:guild+5","cha_exp+4","exp+20"]},"fail":{"text":"菜上得太慢，酒又不够。会员们，笑得有点勉强。","fx":["gold-30","rep:guild+1","cha_exp+1"]},"cond":"gold>=30","reason":"金币不足"},{"label":"婉拒，说船上，只做生意","text":"会员们耸了耸肩，没有勉强。","fx":["wil_exp+1"]}],"pool":"opportunity","weight":7,"cond":"count.ship>=3","scene":"deck"},{"id":"v_t_rune","kind":"random","title":"符文失灵","text":"魔导战帆船的船底，一道符文，忽然闪了一下，熄灭了。接着，另一道，也暗了下去。\n水手们面面相觑。","options":[{"label":"请魔法师来修（80 金币）","text":"魔法师一边骂着，一边爬进船底，花了一天，才让符文重新亮起来。","fx":["gold-80","int_exp+2"],"cond":"gold>=80","reason":"金币不足"},{"label":"自己动手，试着重新刻画符文","check":{"attr":"int","diff":15},"ok":{"text":"你对着符文，研究了整整一夜。凌晨时分，最后一道符文，终于，亮了起来。","fx":["int_exp+6","exp+30","wil_exp+2"]},"fail":{"text":"你刻错了一笔，整艘船的符文，同时闪了一下，熄灭了。","fx":["hp-8","flag+:ship_damaged"]}}],"pool":"calamity","weight":7,"cond":"count.ship>=4","scene":"deck"},{"id":"v_traveler","kind":"random","title":"求渡海的旅人","text":"码头上，一个风尘仆仆的旅人，拎着一只旧皮箱，拦住了你：“船长，能不能，捎我一程？去北边的灰港。我可以付钱。”","options":[{"label":"答应，收他的船费","check":{"attr":"cha","diff":10},"ok":{"text":"一路上，旅人讲了许多他走过的地方。到港的时候，他多给了你一枚金币：“船长，你的船，是我坐过的，最稳的一条。”","fx":["gold+30","cha_exp+2","count:voyages+1","exp+10"]},"fail":{"text":"一路上，旅人都在抱怨船的颠簸。到港时，他只付了一半。","fx":["gold+12","count:voyages+1"]},"cond":"count.ship>=1","reason":"需要有一条船"},{"label":"给他介绍一位熟识的船长","text":"旅人谢了你，往你手里塞了几个铜币。","fx":["gold+5","rep:harbor+1"]},{"label":"摇头：今天不出海","text":"","fx":[]}],"pool":"opportunity","weight":8,"cond":"age>=17","scene":"harbor"},{"id":"v_refugee_boat","kind":"random","title":"难民的小船","text":"一条破破烂烂的小船，在港口外，漂了整整一夜。船上，是十几个衣衫褴褛的人。他们说，北边的海岸，被魔物毁了。","options":[{"label":"让港口收留，送上热汤和毯子","text":"你和几位船长，一起把难民，一个个接上了岸。那一晚，整个港口，都点着灯。","fx":["hometown+5","rep:harbor+3","wil_exp+2","gold-15"],"cond":"gold>=15"},{"label":"请商会，出一笔救济金","check":{"attr":"cha","diff":13},"ok":{"text":"你在商会的茶座里，说了一个下午。最后，会长叹了口气：“好吧。”","fx":["rep:guild+3","hometown+4","cha_exp+4"]},"fail":{"text":"商会的人，推说近来资金紧张。","fx":["cha_exp+1"]},"cond":"rep.guild>=10","reason":"商会声望 ≥ 10"},{"label":"远远看着，没有上前","text":"你在码头，站了很久。船上的一个孩子，也一直，看着你。","fx":["wil_exp+1","hometown-2"],"avoid":true}],"pool":"world","weight":7,"cond":"age>=18","scene":"harbor_dusk"}],"content/voyager/events_story.json":[{"id":"v_19s","kind":"special","title":"第一次独自掌舵","text":"海德把一船货，交到你手里：“送去对岸，三天。我不跟你去。”\n他叼着烟斗，站在码头上，没有多说一个字。\n你握着舵，掌心全是汗。身后，码头越来越小，越来越小。","options":[{"label":"按海图，稳稳地走","check":{"attr":"int","diff":11},"ok":{"text":"三天后，你把货，一包不少地，送到了对岸。收货人签字的时候，你的手还在发抖。\n回港的时候，海德在码头上，抽着烟斗，只说了三个字：“还行吧。”","fx":["flag+:first_solo","int_exp+4","count:voyages+1","gold+40","rel:haide+2","exp+30"]},"fail":{"text":"第二天夜里，你走偏了半条航线。多绕了一天，货晚了。海德没骂你，只是让你把海图，重新抄了三遍。","fx":["int_exp+2","count:voyages+1","rel:haide+1","gold+10"]}},{"label":"抄近路，想早点回港","check":{"attr":"agi","diff":12},"ok":{"text":"你借着一股顺风，抢了半天，提前一天靠岸。海德看了看你，把烟斗拿下来，没说话，只是笑了。","fx":["flag+:first_solo","agi_exp+4","count:voyages+1","gold+55","rel:haide+1"]},"fail":{"text":"近路上，有一片暗礁。你的船底擦了一下，半夜进水，靠着一整夜的舀水，才勉强撑到了港。","fx":["hp-8","agi_exp+1","count:voyages+1","gold-20"]}},{"label":"心里没底，请水手布拉姆跟你一起","text":"你们两个，一个掌舵，一个盯着风帆。三天，竟然很快就过去了。","fx":["flag+:first_solo","rel:bram+2","count:voyages+1","gold+30","cha_exp+2"],"cond":"flag:met_bram","reason":"还没认识布拉姆"}],"when":{"age":19,"season":"spring"},"priority":50,"portrait":"haide","scene":"sea"},{"id":"v_24s","kind":"special","title":"红帆围港","text":"夏天的一个清晨，整个潮湾港，都被一片红色的帆，围住了。\n几十艘海盗船，静静地泊在港口外，没有一艘，放下过一只小艇。\n斯嘉丽站在最大的那艘船头，用一只铜喇叭，朝港口里，喊了一句话。","options":[{"label":"驾自己的船，出港去见她","text":"你的船，缓缓地穿过一排排红帆。斯嘉丽在船头，朝你举起一只酒杯：“我没有恶意。我只是来看看，你的港口，还能撑多久。”","fx":["rep:sea+3","cha_exp+3","exp+30","flag+:red_visit"],"cond":"count.ship>=1","reason":"需要有一条船"},{"label":"号召港口的人，一起布防","check":{"attr":"cha","diff":13},"ok":{"text":"你站在码头最高的货堆上，把一席话喊了出来。渔民、水手、船匠，一个接一个，抄起了家伙。红帆在日落前，悄悄地退走了。","fx":["hometown+6","rep:harbor+4","cha_exp+4","exp+30"]},"fail":{"text":"人心，没有聚拢起来。港口里一片混乱，有人开始往内陆跑。","fx":["hometown-4","cha_exp+1"]}},{"label":"躲在家里，等风波过去","text":"你把门窗都关死了。直到傍晚，才听见外面的人说：“红帆走了。”","fx":["hometown-3","wil_exp+1"],"avoid":true}],"when":{"age":24,"season":"summer"},"priority":45,"portrait":"scarlett","scene":"harbor_dusk"},{"id":"v_27s","kind":"special","title":"祭海节的前夜","text":"潮汐之门，只剩一年了。\n整座港口，都在为“祭海节”忙碌：彩旗，纸灯，和一排排将要被放进海里的小木船。\n每个人，都有一句想对你说的话。","options":[{"label":"去找海德的旧船，坐一夜","text":"旧船还在老泊位。你一个人，坐在断了半截的桅杆下，听着潮声，坐了一夜。","fx":["wil_exp+4","rel:haide+1","hometown+2"]},{"label":"和布拉姆、薇尔，一起放一只纸船","text":"你们三个，各自在纸船上，写下了一句话。放进海里的时候，谁也没说自己写了什么。","fx":["rel:bram+2","cha_exp+3","hometown+3"],"cond":"flag:met_bram&&flag:met_vel","reason":"需要认识布拉姆和薇尔"},{"label":"在祭海节上，向全港的人，敬一杯酒","text":"你站在码头上，高高举起酒杯。人群里响起一片欢呼。那一刻，整个潮湾港，都是你的家。","fx":["rep:harbor+4","hometown+5","cha_exp+4"],"cond":"rep.harbor>=15","reason":"港口声望 ≥ 15"}],"when":{"age":27,"season":"summer"},"priority":45,"portrait":"bram","scene":"harbor_dusk"}],"content/voyager/quests.json":[{"id":"main_star","type":"main","name":"潮汐之门","start":"age>=16","score":100,"onFail":["flag+:main_failed","log:通往潮汐之门的准备，没能赶上。"],"stages":[{"desc":"第一章·出海：完成至少 3 次航次，通过船长考试，拿到船长执照（行动：参加船长考试）","done":"flag:captain_license","score":20,"deadlineAge":21,"fx":["rank:2"],"checks":[{"label":"航次 ≥ 3","cond":"count.voyages>=3","cur":"count.voyages"},{"label":"年满 18 岁","cond":"age>=18","cur":"age"}],"story":{"title":"第一章 完 · 船长执照","portrait":"haide","text":"海事官盖章的那一刻，海德在码头另一头摘下了帽子。\n老头什么也没说，只是用烟斗，轻轻敲了敲栏杆，三下。\n那是港口的老规矩：给新船长的敬礼。\n——第二章：第一条船"}},{"desc":"第二章·第一条船：拥有一条单桅帆船（船 ≥ 2），并有至少 2 名水手","done":"count.ship>=2&&count.crew>=2","score":20,"deadlineAge":24,"fx":["rank:3"],"checks":[{"label":"船 ≥ 2（单桅帆船）","cond":"count.ship>=2","cur":"count.ship"},{"label":"水手 ≥ 2","cond":"count.crew>=2","cur":"count.crew"}],"story":{"title":"第二章 完 · 属于自己的船","portrait":"bram","text":"帆被风鼓满的那一刻，布拉姆在甲板上大叫了一声。\n你站在舵前，掌心全是汗。\n这是你的船，你的水手，你的海。\n——第三章：三块残片"}},{"desc":"第三章·三块残片：集齐星图的三块残片（老船长的海图、红鲨的罗盘、沉船里的星盘）","done":"flag:fragment_1&&flag:fragment_2&&flag:fragment_3","score":20,"deadlineAge":27,"fx":["rank:4"],"checks":[{"label":"老船长的海图","cond":"flag:fragment_1"},{"label":"红鲨的罗盘","cond":"flag:fragment_2"},{"label":"沉船里的星盘（通关沉船墓场）","cond":"flag:fragment_3"}],"story":{"title":"第三章 完 · 星图合一","portrait":"vel","text":"三块残片，在桌上被一点点拼起来。\n灯光下，一条蓝色的细线，从港口出发，穿过雾礁，穿过沉船，绕过海妖的巢，直指深渊的最深处。\n薇尔屏住了呼吸：“就是这里……”\n——终章：潮汐之门"}},{"desc":"第四章·潮汐之门：28 岁的秋天，驶向潮汐之门","done":"flag:gate_opened","score":20}],"doneStory":{"title":"终章 · 潮汐","text":"海水从你的脚边退去，一座沉睡千年的城，在月光下缓缓浮出水面。\n你站在船头，身后是你的船，你的水手，你一路走来的每一道浪。\n而属于你的故事，才刚刚被写成。"}},{"id":"haide_chart","type":"side","name":"老船长的海图","start":"flag:met_haide","deadlineAge":22,"score":25,"intro":{"portrait":"haide","title":"那半张图","text":"海德的床头，永远摊着一张画不完的海图。\n你问他那是什么，他吐着烟圈：“一个年轻时候没走完的梦。”\n他没有再多说。"},"onFail":["flag+:chart_pawned","log:海德的海图，不知什么时候被抵押进了当铺。"],"reward":["rep:harbor+5","flag+:haide_trust","log:海德的海图，终于有人继承了。"],"stages":[{"desc":"多陪陪老船长，让他愿意说出海图的来历（好感 ≥ 5，行动：向老船长学艺）","done":"rel.haide>=5","checks":[{"label":"海德好感 ≥ 5","cond":"rel.haide>=5","cur":"rel.haide"}]},{"desc":"收下老船长的海图（他的告别在 21 岁的冬天）","done":"flag:fragment_1"}],"snag":{"p":0.25,"text":"海德病倒了，那卷海图被他的侄子抵押给了当铺。"}},{"id":"scarlett_deal","type":"side","name":"红鲨的挑战","start":"flag:met_scarlett","deadlineAge":26,"score":30,"intro":{"portrait":"scarlett","title":"红鲨的邀请","text":"斯嘉丽把一枚染红的鲨鱼牙，留在了你的甲板上。\n牙齿下面压着一张纸条：“想要我手里那块罗盘，来我的锚地谈。”"},"onFail":["flag+:scarlett_foe","log:红鲨把你的名字，写进了她的黑名单。"],"reward":["rep:sea+8","gold+150","log:红鲨在你的甲板上，留下了一杯酒。"],"stages":[{"desc":"前往红鲨的锚地，与她了断（行动：前往红鲨的锚地）","done":"flag:scarlett_resolved"}]},{"id":"nerea_song","type":"side","name":"人鱼的歌","start":"flag:met_nerea","deadlineAge":26,"score":30,"intro":{"portrait":"nerea","title":"海面下的眼睛","text":"那个被你放走的人鱼，隔了几天，又在礁石边浮了上来。\n她没有说话，只是用一只湿漉漉的手，指了指雾礁的方向。"},"onFail":["log:奈蕾雅不再出现在礁石边了。"],"reward":["rep:sea+6","wil_exp+8","log:你听懂了海的另一种语言。"],"stages":[{"desc":"通关雾礁海域，替奈蕾雅找回被抢走的珍珠","done":"flag:reef_cleared","checks":[{"label":"通关雾礁海域","cond":"flag:reef_cleared"}]},{"desc":"在新月夜，听她唱完那首歌（行动：在新月夜听人鱼的歌）","done":"flag:nerea_song"}]},{"id":"bram_crew","type":"side","name":"布拉姆的家","start":"flag:met_bram&&age>=18","deadlineAge":25,"score":25,"intro":{"portrait":"bram","title":"布拉姆的父亲","text":"布拉姆今天没有笑。他的父亲留下的那条小船，被商会抵押了，下个月，就要被拍卖。\n他站在码头上，一句话也没说，只是盯着那条船看。"},"onFail":["flag+:bram_lost","rel:bram-2","log:拍卖那天，布拉姆没有去。"],"reward":["count:crew+2","rel:bram+2","flag+:bram_crew","log:布拉姆带着他的几个兄弟，登上了你的船。"],"stages":[{"desc":"凑够 200 金币，赎回布拉姆父亲的船（行动：替布拉姆赎回父亲的船）","done":"flag:bram_boat"}],"snag":{"p":0.25,"text":"布拉姆的父亲在一场风浪里出了事，那条小船，也沉了。"}},{"id":"vel_chart","type":"side","name":"领航员的星位","start":"flag:met_vel","deadlineAge":26,"score":25,"intro":{"portrait":"vel","title":"薇尔的请求","text":"薇尔把一卷星图摊在你面前：“我需要三个夜晚，三个不同的星位。你有船，我有六分仪。”\n她的眼神认真得有点可怕。"},"onFail":["log:薇尔登上了另一艘船，没有告别。"],"reward":["flag+:vel_navigator","rel:bram+0","log:薇尔收起了六分仪：“船长，从今天起，航线由我来画。”"],"stages":[{"desc":"陪薇尔观测三个星位（行动：观测星位）","done":"count.stars>=3","checks":[{"label":"观测到的星位","cond":"count.stars>=3","cur":"count.stars"}]}],"snag":{"p":0.4,"text":"薇尔收到一封家信，匆匆搭上了另一艘船，离开了潮湾港。"}},{"id":"merchant_contract","type":"side","name":"商会的委托","start":"flag:merchant_offer","deadlineAge":26,"score":20,"intro":{"portrait":"merchant","title":"商会会长的合同","text":"商会会长把一份盖着火漆的合同推到你面前：“三批货，三个港口，三次准时。你若做到，我保你一个商会的位子。”"},"onFail":["log:商会会长把合同收回了抽屉。"],"reward":["rep:guild+15","gold+300","flag+:guild_friend","log:会长在合同上盖了第二枚章，笑了：“欢迎入会。”"],"stages":[{"desc":"准时送达三批货（行动：递送商会的货，需要单桅帆船以上）","done":"count.cargo>=3","checks":[{"label":"已送达","cond":"count.cargo>=3","cur":"count.cargo"}]}],"snag":{"p":0.3,"text":"商会换了会长，那份合同，被新会长随手收进了抽屉。"}},{"id":"abyss_secret","type":"hidden","name":"深渊的低语","start":"count.abyss_clue>=1&&age>=21","deadlineAge":28,"score":40,"reward":["flag+:abyss_truth","log:你知道了深渊之下沉睡的是什么。这知识，沉得像锚。"],"stages":[{"desc":"沉船、海妖的巢、礁石的刻痕，都指向同一件事（线索 ≥ 3）","done":"count.abyss_clue>=3","checks":[{"label":"收集到的线索","cond":"count.abyss_clue>=3","cur":"count.abyss_clue"}],"story":{"title":"深渊的低语","portrait":"nerea","text":"三条线索，在你脑子里渐渐拼成了一幅图：\n潮汐之门后面，不是宝藏，不是城，而是一颗沉睡的心，海的心。\n千年前，有人把它沉下去，是为了让陆地上的人，永远不要听见它的呼吸。"}}]}],"content/voyager/script.json":{"name":"远海的星图","subtitle":"码头学徒 → 传说船长","unlockCost":600,"desc":"潮湾港的码头少年（少女），16 岁。老船长手里有半张星图，据说它通向一座沉在海底的城。每二十年一次的「潮汐之门」，会在你 28 岁的秋天打开。","intro":"潮湾港。你十六岁，一双被盐水泡粗的手，一个想看看海那边的念头。潮汐之门在你二十八岁的秋天。","introPages":[{"title":"潮湾港","scene":"harbor","text":"潮湾港的清晨，是被海鸥叫醒的。\n码头上的人们扛着麻袋，叫着号子，把一船一船的货搬上搬下。远处的灯塔，一夜没熄，亮得有点倦。\n你生在这里，是个捡缆绳、擦甲板的穷小子，却总爱坐在码头的尽头，看海的那一边。"},{"title":"老船长","scene":"harbor_dusk","portrait":"haide","text":"港口的人都认识海德老船长。他有一条断了半截桅杆的旧船，和一张据说“永远画不完”的海图。\n“海不是用来看的，”他曾对你说，“是用来走的。”\n你一直想问他：那半张图，画的是哪里？"},{"title":"潮汐之门","scene":"sea","text":"港口的老人们说，每隔二十年，月亮和潮水会在同一夜里，把海底沉睡的一座城推到水面。\n那座城的门，叫潮汐之门。\n下一次，是你二十八岁的秋天。\n没人知道门后有什么。但每个出海的人，都想去看一眼。"},{"title":"玩法提示","scene":"deck","text":"这个剧本里，你要先有一条船。船分四档，越好的船，能跑的航线、能挑战的海域就越多。出海做买卖，冬天的风浪要大得多。\n每年年底，水手们要发工钱；风暴会损坏船，坏了的船要先修好才能再出海。\n想走到最后，需要三块星图残片，一条够大的船，和一群值得信任的人。"}],"start":{"age":16,"attrs":{"str":11,"agi":11,"int":11,"wil":12,"cha":10,"luk":10},"gold":90,"hometown":35,"rep":{"harbor":0,"sea":0,"guild":0,"kingdom":0},"rel":{"haide":0,"bram":1},"gear":["rusty_cutlass","sailor_vest","brass_compass"],"counters":{"ship":0,"crew":0,"voyages":0},"flags":{}},"labels":{"hometown":"港口人望","rep":{"harbor":"港口声望","sea":"海上声望","guild":"商会声望","kingdom":"王国声望"},"status":{},"route":{}},"help":{"hometown":"港口人望：潮湾港的人对你的看法。≥ 60 时每回合体力上限 +1（港口的人愿意帮你搬货、修船）；≤ 15 时体力上限 -1。帮港口的人、守约、守住航线会涨，每年自然下降一点。","gold":"金币：买船、雇水手、修船、买装备都要钱。每回合要交一笔最低的生活费，交不起，港口人望会下降。","rank":"等阶：见习水手 → 水手 → 船长 → 老船长 → 海上传奇 → 星海之主。完成主线章节晋升，也计入转生点。"},"display":[{"key":"ship","label":"船","top":true,"help":"船：0 没有船，1 舢板，2 单桅帆船，3 三桅商船，4 魔导战帆船。船越大，能跑的航线越多，战力也越高。买船在「购置船只」行动里。"},{"key":"crew","label":"水手","top":true,"help":"水手：愿意跟你出海的人。有 3 个以上水手战力 +3；每年年底要发工钱（每人 15 金币）。"},{"key":"voyages","label":"航次","help":"航次：你已经完成的出海次数（跑商、航线）。船长考试需要至少 3 次。"},{"key":"stars","label":"星位","help":"星位：领航员薇尔需要你帮忙观测的星位数。观测够 3 个，她就愿意成为你的专属领航员。"}],"livingCost":10,"livingMsg":"这一季你付不起房钱，只好睡在码头的货堆里","ranks":["见习水手","水手","船长","老船长","海上传奇","星海之主"],"npcs":{"haide":{"name":"老船长海德"},"bram":{"name":"大副布拉姆"},"vel":{"name":"领航员薇尔"},"scarlett":{"name":"红鲨斯嘉丽"},"nerea":{"name":"人鱼奈蕾雅"},"merchant":{"name":"商会会长"}},"staminaMods":[{"cond":"hometown>=60","add":1,"label":"港口人望 ≥ 60：港口的人愿意帮忙"},{"cond":"hometown\u003c=15","add":-1,"label":"港口人望 ≤ 15：没人肯为你出力"}],"powerBonus":[{"cond":"count.ship>=2","add":3,"label":"船体（单桅帆船）"},{"cond":"count.ship>=3","add":4,"label":"船体（三桅商船）"},{"cond":"count.ship>=4","add":5,"label":"船体（魔导战帆船）"},{"cond":"count.crew>=3","add":3,"label":"水手 ≥ 3：有人并肩"},{"cond":"flag:vel_navigator","add":3,"label":"领航员薇尔的指引"},{"cond":"status:blessed","add":3,"label":"祝福状态"}],"clearCond":["flag:gate_opened"],"aspirations":[{"id":"captain","name":"一船之长","desc":"成为船长，拥有三桅商船","cond":"rank>=3&&count.ship>=3","score":30},{"id":"rich","name":"满载而归","desc":"结束时持有 2000 金币","cond":"gold>=2000","score":30},{"id":"gate","name":"推开那扇门","desc":"打开潮汐之门","cond":"flag:gate_opened","score":30}],"scenes":{"spring":"harbor","summer":"harbor","autumn":"harbor_dusk","winter":"harbor_storm"},"yearEnd":[{"cond":"true","text":"一年又过去了，海风把旧的缆绳吹得更脆。","fx":["hometown-3"]},{"cond":"count.crew>=1","text":"年底了，水手们排着队，等船长发工钱。","fx":["gold-15"]},{"cond":"count.crew>=3","text":"人多了，年底的工钱也厚了一摞。","fx":["gold-30"]},{"cond":"count.crew>=5","text":"满船的人都在盯着账本，你一笔一笔数过去。","fx":["gold-30"]},{"cond":"count.ship>=2","text":"船要保养，油漆、缆绳、帆布，哪样都要钱。","fx":["gold-20"]},{"cond":"count.ship>=3","text":"三桅的大船，吃水深，花钱也深。","fx":["gold-40"]},{"cond":"fate>=2","text":"这一年的海风格外凶，船受了暗伤。","fx":["gold-25"]},{"cond":"age==16","text":"十六岁这一年，你第一次在海上看见了日出。","fx":[]},{"cond":"age==17","text":"十七岁。你的掌心里，全是被缆绳磨出来的茧。","fx":[]},{"cond":"age==18","text":"十八岁。你已经能凭浪的颜色，认出明天的天气。","fx":[]},{"cond":"age==20","text":"二十岁。老船长咳嗽的次数，一年比一年多了。","fx":[]},{"cond":"age==22","text":"二十二岁。你开始在睡前，用手指在被子上画海图。","fx":[]},{"cond":"age==24","text":"二十四岁。离潮汐之门只剩四年。","fx":[]},{"cond":"age==26","text":"二十六岁。每一次出海，你都往更远的地方多走一天。","fx":[]}],"autoLearn":[{"skill":"board","cond":"count.voyages>=3&&flag:met_haide","story":{"title":"跳帮战","portrait":"haide","text":"海盗的船横着撞了上来，木板咬着木板，发出让人牙酸的声响。\n你一抓缆绳，荡了出去。\n甲板上，有人叫了一声：“小子，你学得比我想的快！”\n是海德。他靠在桅杆上，胡子被风吹乱，笑得像个孩子。"},"checks":[{"label":"完成 ≥ 3 次航次","cond":"count.voyages>=3","cur":"count.voyages"},{"label":"认识老船长","cond":"flag:met_haide"}]},{"skill":"storm_ward","cond":"flag:storm_survived","story":{"title":"风暴庇护","portrait":"sailor","text":"风暴里，桅杆在哀鸣，每一道浪都像一座山。\n你死死抓着舵，直到指节发白。当第一缕光从云缝里落下来的时候，你发现，船还在，人还在。\n你忽然明白了老船长说的那句：风暴不会过去，是你自己，走了出来。"},"checks":[{"label":"在一次风暴中守住了船","cond":"flag:storm_survived"}]},{"skill":"tide_surge","cond":"flag:nerea_song","story":{"title":"借潮之势","portrait":"nerea","text":"奈蕾雅把手放在你的胸口，低声哼起一支你听不懂的歌。\n潮水在你脚下涌起，像一匹温顺的马。你从没想过，大海可以这样安静。\n“借给你，”她说，“但你要记得，还回去。”"},"checks":[{"label":"得到人鱼的认可（人鱼的歌）","cond":"flag:nerea_song"}]}],"endings":[{"id":"drowned","name":"沉入深海","kind":"fail","mult":0.6,"cond":"flag:dead","text":"浪把船打碎的时候，你听见海在笑。\n你沉下去，一寸一寸，从光亮沉到昏暗，又从昏暗沉到什么都没有。\n很多年后，有渔夫的网里，勾上来一块刻着字的木头。字是你写的：想去看看海那边。\n渔夫看了很久，又把它放回了海里。","hint":"死在海上。"},{"id":"star_legend","name":"星海传说","kind":"true","mult":1.5,"cond":"flag:gate_opened&&flag:star_end","text":"潮汐之门在你面前缓缓打开。门后是一座沉在光里的城，街道还保持着千年前的样子，鱼群像鸽子一样穿过拱门。\n奈蕾雅站在城的尽头，朝你伸出手：“欢迎回家。”\n后来，潮湾港的老人们说，那一年的潮汐，涨得特别安静。你的船队，再也没有回港。\n但每到秋天，海的那一边，总会亮起一颗新的星。","hint":"打开潮汐之门，并得到了人鱼的信任。"},{"id":"harbor_hero","name":"满载归港","kind":"normal","mult":1.2,"cond":"flag:gate_opened&&flag:returned_heart","text":"你带着「星海之心」回到了潮湾港。\n全港的人都站在码头上，没有人欢呼，没有人说话。只有海德的旧船，在远处，轻轻地鸣了一声。\n你把那颗心放进了灯塔的塔顶。从那一夜起，潮湾港的灯，再也没有熄过。\n你的名字被刻在了码头的石碑上，挨着海德的。","hint":"打开潮汐之门，把「心」带回港口。"},{"id":"pirate_king","name":"红鲨的王座","kind":"normal","mult":1.1,"cond":"flag:gate_opened&&flag:pirate_end","text":"斯嘉丽把血红的披风披在你肩上：“从今天起，七海归你。”\n你站在旗舰的船头，身后是几十艘战船，浩浩荡荡，旗帜遮天。\n你想起了很多年前，潮湾港码头上的那个少年。他想看看海那边。\n现在，你看到了。只是，他当年没想到，海那边也有王座。","hint":"打开潮汐之门，与红鲨分享了它。"},{"id":"guardian","name":"深渊守望者","kind":"normal","mult":1.3,"cond":"flag:gate_opened&&flag:guardian_end","text":"你合上了潮汐之门，把「星海之心」交还给了海底。\n深渊里有什么在低语，你一个字也没有答应。\n后来你成了一座灯塔的守塔人，每年秋天，你都会在塔顶点一盏灯，照着海面，也照着海面之下的东西。\n有孩子来问：“你守的是什么？”\n你说：“一个不要被打开的故事。”","hint":"打开潮汐之门，却把它重新合上。"},{"id":"retired_sea","name":"归港养老","kind":"normal","mult":1,"cond":"flag:retired_sea","text":"你把船停在了潮湾港最老的那个泊位，在码头边开了一间小小的酒馆。\n酒馆的名字叫“海德”。\n没有人再问你那张星图的事。偶尔有年轻的水手来，坐在角落里，一边喝酒，一边盯着墙上那面旧罗盘看。\n你笑一笑，替他们把酒再满上。","hint":"在出海之前靠岸。"},{"id":"tide_swallow","name":"潮汐吞没","kind":"fail","mult":0.6,"cond":"flag:gate_lost","text":"潮汐之门打开了，又关上了。你没有赶上，或者，你没有准备好。\n港口的潮水一夜之间涨得很高，淹掉了半条街。\n你站在码头上，看着那些被冲走的木箱，在海面上漂远。\n下一次，是二十年后。","hint":"没能赶上潮汐之门。"},{"id":"endless_sea","name":"港口的潮声","kind":"fail","mult":0.6,"cond":"true","text":"日子一天一天地过去，船一次一次地出海，又一次一次地回来。\n你没有看到潮汐之门，也没有再追问那半张星图。\n只是每到秋天，你仍然会在码头上，对着海的那一边，坐一整夜。","hint":"没有走到潮汐之门。","safety":true}],"fateRules":["灾厄类随机事件出现的权重 +20%，支线任务的期限提前 1 年，敌人战力 +0.6%。","敌人战力共 +1.2%，落败时受到的伤害 +3%，每年多一笔船只暗伤的修理费。","潮汐之门提前 1 年到来；冬天跑商的风浪更大。","敌人战力共 +1.8%，落败时受到的伤害共 +8%，潮汐之门的检定更难。","敌人战力共 +2.4%，主线任务的期限提前 1 年，濒死判定的难度 +2。"]}}; window.__ASSETS = {"../portraits/portrait_alfred_normal.png":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAADXklEQVR4nO1aP2gTURj/RV9sa/OvWrAIOlSCRshUkK4WEWykSJRAuliXkMnBwbGDQ0cHBzluEReFWm+SCiLVSUo2EWylmEGhpLXF/rNNbRSHV0O5y937m96l9Dcd7773fd/vfX/u3bsLjeSH0MogAC6e7/XbDUl8/lI+sv9WE/GoRm0+EFhZXdeozZWA3nVqHlwJ6F2n5oGdQm6hcI4rBk1uOpuAWyic44pBk5tOANRqf1QMNw/dJxNLyyveMgQAI
