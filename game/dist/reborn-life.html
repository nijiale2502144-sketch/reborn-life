el.cass>=3"],"text":"一世里被卡斯抓住，或和她有了交集"}},{"id":"m_t_vault","name":"水晶的心跳","script":["thief"],"text":"悬浮的水晶，一明一灭，像一颗心。","use":"月蚀之夜里开门的两个检定难度 -2。","unlock":{"cond":["flag:heist_caught","flag:heist_done"],"text":"一世里走进了魔晶库的深处"}},{"id":"m_t_betrayal","name":"面具下的名字","script":["thief"],"text":"税务署的旧账、赌场的流水、那枚家徽。","use":"19 岁起，只要情报 ≥ 2，就能开启隐藏任务「面具之下」。","unlock":{"cond":"flag:mask_unmasked","text":"一世里看清了某个人的真面目"}},{"id":"m_v_haide","name":"老船长的口诀","script":["voyager"],"text":"“看云，看浪，看人。三样看清了，海就是自家后院。”","use":"「参加船长考试」的检定难度 -2。","unlock":{"cond":"flag:haide_gone","text":"一世里送走了老船长"}},{"id":"m_v_scarlett","name":"红鲨的骰子","script":["voyager"],"text":"她把骰子往桌上一磕：“赌，还是不赌？”","use":"与红鲨赌骰子的检定难度 -2。","unlock":{"cond":"flag:met_scarlett","text":"一世里与红鲨打过交道"}},{"id":"m_v_storm","name":"风暴的节拍","script":["voyager"],"text":"每一道浪的间隙，都像心跳。","use":"突来风暴的检定难度 -2。","unlock":{"cond":["flag:storm_survived","flag:ship_damaged"],"text":"一世里经历过风暴"}},{"id":"m_v_song","name":"人鱼的歌谣","script":["voyager"],"text":"海的另一种语言。","use":"「在新月夜听人鱼的歌」的检定难度 -2。","unlock":{"cond":["flag:nerea_song","flag:v_clue_2"],"text":"一世里听过鲸或人鱼的歌"}},{"id":"m_v_chart","name":"星位的轮廓","script":["voyager"],"text":"三颗星的夹角，你已经能闭着眼睛算出来。","use":"「观测星位」的检定难度 -2。","unlock":{"cond":["flag:fragment_1","flag:fragment_2","flag:fragment_3"],"text":"一世里找到过任一块星图残片"}},{"id":"m_v_gate","name":"门后的光","script":["voyager"],"text":"石门打开的那一刻，海水一寸一寸地让出了路。","use":"驶向潮汐之门的两个风暴检定难度 -2。","unlock":{"cond":["flag:gate_opened","flag:gate_lost"],"text":"一世里走到了潮汐之门前"}},{"id":"m_n_alfred","name":"老管家的茶","script":["noble_heir"],"text":"阿尔弗把茶杯放在你手边：“老爷当年也爱这么喝。”","use":"「开启书房暗格」的检定难度 -3。","unlock":{"cond":"flag:safe_opened","text":"一世里打开了书房的暗格"}},{"id":"m_n_valen","name":"金鹰的约定","script":["noble_heir"],"text":"瓦伦别过脸：“复议日，我会在旁听席上。”","use":"请求瓦伦的支持时，魅力检定难度 -3。","unlock":{"cond":"flag:ally_valen","text":"一世里与瓦伦有了了断，并读懂了他的想法"}},{"id":"m_n_debt","name":"账本上的红字","script":["noble_heir"],"text":"每一行数字，都像一道看不见的锁链。","use":"每年的债务利息少 10 金币。","unlock":{"cond":"count.debt>=900","text":"一世里被债务压得喘不过气"}},{"id":"m_n_lockwood","name":"宰相的木匣","script":["noble_heir"],"text":"一只黑檀木匣，一纸撤诉文书，一句“令尊也许会理解”。","use":"「宰相的交易」里，假装考虑、套他话的检定难度 -3。","unlock":{"cond":["flag:bought_off","flag:refused_offer"],"text":"一世里面对过宰相的交易"}},{"id":"m_n_cellar","name":"地窖的石阶","script":["noble_heir"],"text":"潮湿的石阶，暗门后，一盏没有熄的灯。","use":"「探索旧宅的地窖」的检定难度 -3。","unlock":{"cond":"flag:cellar_done","text":"一世里找到了父亲的实验室"}},{"id":"m_n_spy","name":"宅子里的眼睛","script":["noble_heir"],"text":"每一条消息，都在当天夜里，出现在宰相府的侧门。","use":"「盯梢宰相府的出入」的检定难度 -3。","unlock":{"cond":"flag:spy_found","text":"一世里揪出了泄露消息的人"}}]},"content/noble_heir/actions.json":[{"id":"study_arcana","name":"研读奥术","cost":2,"group":"daily","tag":"study","cond":"flag:library_open","hint":"魔法·智力","desc":"父亲书房里的藏书，大部分你都还没读懂。","fx":["int_exp+5","wil_exp+1","count:arcana+1"],"texts":["你对着咒文图解比划了一整个下午，指尖偶尔蹿出一点火星。","符文的笔画总在关键处差一点，你一遍遍重画，直到眼睛发酸。","你找到了书页边缘的批注，是父亲年轻时的字迹，潦草，却很有用。"]},{"id":"tower_lecture","name":"旁听高塔讲座","cost":2,"group":"daily","cond":"age>=17","hint":"高塔声望·智力","desc":"高塔的公开课对所有人开放，座位最后几排属于旁听生。","fx":["int_exp+3","rep:tower+2","count:arcana+1","cha_exp+1"],"texts":["讲师在黑板上画了一个你从没见过的图形，满教室的人都在低头记笔记。","你坐在最后一排，认真得像是在抄命。","课后你拦住讲师问了一个问题，他看了你一眼，回答得很认真。"]},{"id":"tutoring","name":"给商人之子做家教","cost":2,"group":"daily","hint":"金币","desc":"旧贵族的头衔，在商人眼里还是值点钱。","fx":["gold+34","cha_exp+2","int_exp+1"],"texts":["富商的儿子心不在焉，你一遍遍耐心地讲，换来了一小袋金币。","孩子的母亲在门口偷偷看你，说：“格雷蒙特家的人，到底不一样。”"]},{"id":"copywork","name":"为抄书铺誊写","cost":2,"group":"daily","hint":"金币·智力","desc":"字写得漂亮的人，不愁没有活干。","fx":["gold+26","int_exp+3","wil_exp+1"],"texts":["你抄了一整天的契约和祈祷文，手腕酸得抬不起来。","抄书铺的老板看着你的字，啧啧称奇：“少爷，这手字可惜了。”"]},{"id":"banquet","name":"出席贵族宴会（30 金币）","cost":2,"group":"social","cond":"gold>=30","hint":"家族名望·魅力","desc":"体面的衣服，得体的微笑，一张哪怕不被欢迎的请帖。","fx":["gold-30","hometown+3","cha_exp+4",{"if":"quest.vera_friend==active","then":["count:odette+1"]}],"texts":["宴会厅里金碧辉煌，你端着酒杯，把每个人的脸都记在了心里。","有人认出了你，神色微妙，却还是举杯点了点头。"]},{"id":"salon","name":"参加沙龙","cost":1,"group":"social","hint":"魅力","desc":"一杯清茶，几个自视甚高的年轻人。","fx":["cha_exp+3","hometown+1","int_exp+1"],"texts":["沙龙里在争论魔法与诗歌谁更接近真理，你一句话没说，听了两个钟头。","有人好奇地问你家的玫瑰园还在不在，你说：“在，只是没人浇水了。”"]},{"id":"repay_debt","name":"偿还债务（100 金币）","cost":0,"group":"daily","cond":"gold>=100&&count.debt>0","hint":"债务 -100","desc":"每还一笔，肩上就轻一分。","fx":["gold-100","count:debt-100"],"texts":["你把一小袋金币推到债主面前，他数了两遍，在账本上划掉了一行字。"]},{"id":"visit_vera","name":"陪母亲说话","cost":1,"group":"social","cond":"flag:vera_alive","hint":"母亲好感","desc":"她靠在窗边的躺椅上，朝你招了招手。","fx":["rel:vera+1","cha_exp+1","wil_exp+1"],"texts":["母亲给你讲了她和父亲第一次见面的事，讲到一半，笑着咳了起来。","你读了一首诗给她听，她闭着眼，嘴角一直带着一点笑。","她把你的手握在掌心，什么也没说。"]},{"id":"chat_alfred","name":"与老管家聊聊","cost":1,"group":"social","hint":"阿尔弗好感·往事","desc":"他总是在厨房里擦那几个银杯。每一次闲聊，都可能多一点往事。","fx":["goto:n_alfred_chat"]},{"id":"buy_medicine","name":"购买药材（90 金币）","cost":1,"group":"quest","cond":"quest.vera_illness==active&&qstage.vera_illness==0&&gold>=90","hint":"母亲的药","desc":"药铺老板认得你，每次都多抓一小包。","fx":["gold-90","count:medicine+1","rel:vera+1"],"texts":["你抱着一包药材走回旧宅，雨点打在油纸上，很响。"]},{"id":"investigate_archive","name":"调查旧案档案","cost":3,"group":"quest","tag":"adventure","scene":"library","cond":["age>=17&&count.archive\u003c4&&flag:ch3_open","age>=17&&count.archive\u003c4&&age>=24"],"hint":"证据（第三章或 24 岁起才能调查）","desc":"王家档案馆的深处，存放着十二年前的卷宗。智力检定。（最多成功 4 次）","check":{"attr":"int","diff":12,"fateDiff":1,"memDiff":{"id":"m_n_witness","diff":-3}},"great":{"text":"你在一堆错乱的卷宗里，发现了一张被人换过日期的审讯记录，笔迹和判词上的不是同一个人。","fx":["count:evidence+2","count:archive+1","int_exp+5","exp+20"]},"ok":{"text":"你一页一页地翻，终于在一份会审记录的边缘，找到了被人刻意抹去的一行字。","fx":["count:evidence+1","count:archive+1","int_exp+4","exp+10"]},"fail":{"text":"你在档案馆里待了一整夜，什么也没找到，还被巡夜的守卫盘问了半天。","fx":["int_exp+2","hp-4"]}},{"id":"bribe_clerk","name":"买通书记官（80 金币）","cost":2,"group":"quest","cond":["gold>=80&&count.bribe\u003c2&&age>=18&&flag:ch3_open","gold>=80&&count.bribe\u003c2&&age>=18&&age>=24"],"hint":"证据（第三章或 24 岁起才能调查）","desc":"当年经手卷宗的书记官，如今在宰相府外围当差。魅力检定。","check":{"attr":"cha","diff":11,"fateDiff":1},"ok":{"text":"书记官把一只信封推到你面前，低声说：“你没来过。”信封里是一份当年的会审名单。","fx":["gold-80","count:evidence+1","count:bribe+1","cha_exp+3"]},"fail":{"text":"他收下了钱，却什么也没说，转身走进了宰相府的侧门。","fx":["gold-80","count:bribe+1","cha_exp+1","hometown-2"]}},{"id":"decode_letters","name":"破译父亲的密信","cost":3,"group":"quest","cond":["flag:father_letter&&!flag:letters_decoded&&flag:ch3_open","flag:father_letter&&!flag:letters_decoded&&age>=24"],"hint":"证据（第三章或 24 岁起才能调查）","desc":"信里的字，每一句都像是另一种意思。智力检定。","check":{"attr":"int","diff":14,"fateDiff":1,"memDiff":{"id":"m_n_letter","diff":-3}},"ok":{"text":"你发现信里每隔七个字，就藏着一个名字：洛克伍德。\n你把这封信读了一遍又一遍，直到眼睛发酸。","fx":["count:evidence+1","flag+:letters_decoded","int_exp+6","exp+30"]},"fail":{"text":"字里行间似乎有规律，可你怎么也抓不住它。","fx":["int_exp+3","wil_exp+1"]}},{"id":"metis_trial","name":"墨提斯的试炼","cost":3,"group":"quest","tag":"adventure","scene":"tower","cond":"quest.metis_trials==active&&qstage.metis_trials==0&&rep.tower>=15","hint":"墨提斯的三道题","desc":"老法师出的题，从来没有标准答案。智力检定。","check":{"attr":"int","diff":13},"ok":{"text":"墨提斯听完你的回答，沉默了很久，在羊皮纸上写下了两个字：“继续。”","fx":["count:metis+1","int_exp+5","rep:tower+3","exp+25"]},"fail":{"text":"你的答案绕了一个很大的圈，墨提斯摇头：“再想想。”","fx":["int_exp+2","hp-3"]}},{"id":"guild_register","name":"冒险者公会登记","cost":1,"group":"adventure","cond":"age>=18&&!flag:guild","hint":"解锁地下城","desc":"魔法师也需要实战，高塔的学徒，常去那里接委托。","fx":["flag+:guild","rep:guild+5","exp+20"],"texts":["接待员瞥了一眼你的家徽戒指，没有多问：“从最低阶开始，别死在半路上。”"]},{"id":"go_market","name":"逛王都集市","cost":1,"group":"daily","cond":"age>=17","hint":"法杖、法袍、药剂、书籍","desc":"魔法商人和旧书摊挤在同一条街上。","fx":["goto:n_market"]},{"id":"go_teahouse","name":"去茶馆坐坐","cost":1,"group":"social","cond":"age>=18","hint":"回复、打听消息","desc":"茶馆里人人都在聊别人的事。","fx":["goto:n_teahouse"]},{"id":"dg_cave","name":"高塔地窖试炼","cost":4,"group":"adventure","tag":"adventure","cond":"flag:tower_admitted","hint":"战斗·宝箱","desc":"推荐等级 3–6，共 4 层。","dungeon":"cave","dungeonName":"高塔地窖"},{"id":"dg_mine","name":"废弃魔晶矿坑","cost":5,"group":"adventure","tag":"adventure","cond":"flag:tower_admitted&&level>=6","hint":"装备·金币","desc":"推荐等级 8–12，共 5 层。","dungeon":"mine","dungeonName":"废弃魔晶矿坑"},{"id":"dg_grave","name":"旧王陵","cost":5,"group":"adventure","tag":"adventure","cond":"flag:tower_admitted&&level>=10","hint":"圣物·古籍","desc":"推荐等级 12–18，共 6 层。","dungeon":"grave","dungeonName":"旧王陵"},{"id":"dg_fortress","name":"远征北境要塞","cost":6,"group":"adventure","tag":"adventure","cond":"rank>=3&&level>=16","hint":"顶级装备","desc":"推荐等级 18–25，共 7 层。","dungeon":"fortress","dungeonName":"北境要塞"},{"id":"hire_hand","name":"雇一个誊写员（60 金币）","cost":0,"group":"daily","cond":"gold>=60&&!flag:t_hired&&count.hires==0","hint":"本回合体力 +1，同一年内越雇越贵","desc":"花钱买时间，每回合最多一次，每年年底价格重置。","fx":["gold-60","stamina+1","flag+:t_hired","count:hires+1"],"texts":["你把一堆杂事交给了誊写员，自己腾出了半天。"]},{"id":"hire_hand_2","name":"雇一个誊写员（80 金币）","cost":0,"group":"daily","cond":"gold>=80&&!flag:t_hired&&count.hires==1","hint":"本回合体力 +1，同一年内越雇越贵","desc":"花钱买时间，每回合最多一次，每年年底价格重置。","fx":["gold-80","stamina+1","flag+:t_hired","count:hires+1"],"texts":["你把一堆杂事交给了誊写员，自己腾出了半天。"]},{"id":"hire_hand_3","name":"雇一个誊写员（110 金币）","cost":0,"group":"daily","cond":"gold>=110&&!flag:t_hired&&count.hires==2","hint":"本回合体力 +1，同一年内越雇越贵","desc":"花钱买时间，每回合最多一次，每年年底价格重置。","fx":["gold-110","stamina+1","flag+:t_hired","count:hires+1"],"texts":["你把一堆杂事交给了誊写员，自己腾出了半天。"]},{"id":"hire_hand_4","name":"雇一个誊写员（150 金币）","cost":0,"group":"daily","cond":"gold>=150&&!flag:t_hired&&count.hires>=3","hint":"本回合体力 +1，同一年内越雇越贵","desc":"花钱买时间，每回合最多一次，每年年底价格重置。","fx":["gold-150","stamina+1","flag+:t_hired","count:hires+1"],"texts":["你把一堆杂事交给了誊写员，自己腾出了半天。"]},{"id":"ask_support","name":"请求支持","cost":2,"group":"quest","cond":["quest.main_revenge==active&&qstage.main_revenge==3&&count.allies\u003c3","flag:main_failed&&age>=25&&count.allies\u003c3"],"hint":"复议日前夜","desc":"把你的处境和证据摊开，请他们在复议日站到你这边。","fx":["goto:n_pledge"],"scene":"library"},{"id":"challenge_valen","name":"向瓦伦下战书","cost":2,"group":"quest","cond":["quest.valen_rivalry==active&&!flag:valen_duel_won&&count.valen_clash>=2","quest.valen_rivalry==active&&!flag:valen_duel_won&&age>=24"],"hint":"宿敌瓦伦","desc":"你们的几次交锋，总要有个了断。输了可以再来。","fx":["goto:n_valen_duel"],"scene":"tower"},{"id":"open_safe","name":"开启书房暗格","cost":2,"group":"quest","cond":"quest.alfred_secret==active&&qstage.alfred_secret==1&&!flag:safe_opened","hint":"老管家的秘密","desc":"暗格的锁是一道魔法与机括的双重谜题。智力检定，可以多次尝试。","check":{"attr":"int","diff":13,"flagDiff":{"id":"letters_decoded","diff":-2},"memDiff":{"id":"m_n_alfred","diff":-3}},"ok":{"text":"你把家徽戒指按进锁孔，同时念出了那一行咒文。机括一层层退开，暗格里是一叠被油纸裹得严实的信件和一本账簿。阿尔弗站在你身后，轻轻地闭上了眼。","fx":["flag+:safe_opened","goto:n_alfred_safe"]},"fail":{"text":"锁没有动。咒文念错了一个音节，机括反而咬得更紧。阿尔弗在一旁攥着衣角，什么也没说。","fx":["int_exp+2","hp-3"]}},{"id":"investigate_theft","name":"调查塔中失窃案","cost":2,"group":"quest","tag":"adventure","cond":"quest.tower_theft==active&&qstage.tower_theft==0","hint":"高塔声望·智力","desc":"高塔的藏书室丢了一卷书，所有人都在互相怀疑。智力检定。","check":{"attr":"int","diff":12},"ok":{"text":"你在书架后发现了一枚被踩过的蜡印，又从管理员口中套出了当晚的轮值表。线索，一点点地拼了起来。","fx":["count:theft_clue+1","int_exp+3","rep:tower+1","exp+14"]},"fail":{"text":"你问了一圈，所有人都在撇清关系，只换来几道不太友好的目光。","fx":["int_exp+1","rep:tower-1"]},"scene":"tower"},{"id":"explore_cellar","name":"探索旧宅的地窖","cost":3,"group":"quest","tag":"adventure","cond":"quest.cellar_lab==active&&qstage.cellar_lab==0","hint":"智力·父亲的实验室","desc":"旧宅地窖的暗门，一直被家具堵着。智力检定。","check":{"attr":"int","diff":12,"memDiff":{"id":"m_n_cellar","diff":-3}},"ok":{"text":"你推开了被蛛网封死的暗门，石阶的尽头，是一间摆满瓶瓶罐罐的小实验室。父亲的手稿还摊在桌上。","fx":["count:cellar+1","int_exp+4","exp+16"]},"fail":{"text":"石阶下面全是积水，什么也看不清。你摔了一跤，爬回了一楼。","fx":["hp-4","int_exp+1"]},"scene":"manor_winter"},{"id":"watch_manor","name":"盯梢宰相府的出入","cost":2,"group":"quest","tag":"adventure","cond":"quest.lockwood_spy==active&&qstage.lockwood_spy==0","hint":"敏捷·宰相的耳目","desc":"夜里蹲在宰相府对面，看谁进，谁出。敏捷检定。","check":{"attr":"agi","diff":12,"memDiff":{"id":"m_n_spy","diff":-3}},"ok":{"text":"你在一堵矮墙后蹲了两个钟头，看见一个熟悉的背影，从宰相府的侧门里出来，往你家的方向走去。","fx":["count:spy_clue+1","agi_exp+3","exp+14"]},"fail":{"text":"你被巡夜的家丁盯上，只好绕了一大圈才甩掉。","fx":["agi_exp+1","hp-3"]},"scene":"street"},{"id":"read_forbidden","name":"查阅高塔禁书库","cost":3,"group":"quest","tag":"study","cond":"quest.forbidden_tome==active&&qstage.forbidden_tome==0","hint":"智力·封印学","desc":"禁书库只对学徒的导师开放，你得想办法。智力检定。","check":{"attr":"int","diff":14},"ok":{"text":"书页发脆，字是古魔导文。你用一晚上，读出了一整段关于“封印与魔晶”的记载：魔晶，是封印的燃料。","fx":["count:seal_pages+1","int_exp+5","exp+22","count:arcana+1"]},"fail":{"text":"古魔导文太艰深了，你只看懂了几个单词，眼睛却被烛烟熏得流泪。","fx":["int_exp+2"]},"scene":"library"}],"content/noble_heir/events.json":[{"id":"n_market","kind":"chain","title":"王都集市","text":"集市里，魔法商人的摊位和旧书摊挤在同一条窄街上。卖药水的小贩嗓门最大，卖魔晶的老头最沉默。你摸了摸钱袋，里面的重量让你有点心虚。","options":[{"label":"买一根橡木法杖（120 金币）","text":"法杖握在手里有点凉，杖头的蓝晶在日光下闪了一下。","fx":["gold-120","item:oak_staff","flag+:has_staff"],"cond":"gold>=120&&!flag:has_staff","reason":"金币不足或已拥有"},{"label":"买一件学徒法袍（100 金币）","text":"深蓝色的袍子，袖口绣着星纹。穿上后，镜子里的人忽然像个像样的学徒。","fx":["gold-100","item:mage_robe","flag+:has_robe"],"cond":"gold>=100&&!flag:has_robe","reason":"金币不足或已拥有"},{"label":"买一瓶魔力药剂（40 金币）","text":"带着薄荷凉味的蓝色药剂，一口下去，胸口的空虚被慢慢填满。","fx":["gold-40","mpheal:0.8"],"cond":"gold>=40","reason":"金币不足"},{"label":"买一瓶伤药（30 金币）","text":"苦得你直皱眉，伤口却很快不疼了。","fx":["gold-30","heal:0.6"],"cond":"gold>=30","reason":"金币不足"},{"label":"买一本旧魔导书（50 金币）","text":"书脊上的烫金早已磨光，但里面有前人密密麻麻的批注。","fx":["gold-50","int_exp+8","count:arcana+1"],"cond":"gold>=50","reason":"金币不足"},{"label":"请高塔的高年级学徒指点（60 金币）","text":"对方一边收钱一边挑你的毛病，挑完又纠正了三个你一直没发觉的错。","fx":["gold-60","int_exp+5","wil_exp+3","exp+10"],"cond":"gold>=60","reason":"金币不足"},{"label":"向教会的施粥处捐一些钱（20 金币）","text":"没人知道你是谁。但粥铺的老太太把你的名字，写进了捐赠簿里。","fx":["gold-20","rep:church+3","hometown+1"],"cond":"gold>=20","reason":"金币不足"},{"label":"走进内间看看贵重货（只对有魅力的人开放）","fx":["goto:n_market_vip"],"text":"店员看了看你的袖口，掀开了内间的帘子。"},{"label":"什么也不买，转一圈","text":"你看了很久，最后只是买了一块糖，带回去给母亲。","fx":["cha_exp+1","rel:vera+1"]}],"scene":"street"},{"id":"n_teahouse","kind":"chain","title":"茶馆","text":"茶馆里烟气氤氲，每一桌都在小声议论别人的事。你找了个靠窗的位置坐下，伙计很快端来了一壶茶。","options":[{"label":"喝一壶热茶，吃点点心（6 金币）","text":"热茶下肚，一整天的疲惫都散了。","fx":["gold-6","heal:0.4","mpheal:0.4","status-:fatigue"],"cond":"gold>=6","reason":"金币不足"},{"label":"请邻座喝一杯，打听消息（8 金币）","text":"邻座的人话匣子一打开，就收不住了。","fx":["gold-8","cha_exp+2",{"if":"count.rumor==0","then":["log:听说当年的会审书记官里，有一位后来回了乡下，据说一直留着一份抄本。","count:evidence+1"],"else":[{"if":"count.rumor==1","then":["log:听说高塔的下一轮考核，会特别看重“实操”，不是死背书。","rep:tower+2"],"else":[{"if":"count.rumor==2","then":["log:听说洛克伍德家的少爷，最近和他父亲吵了一架。","count:valen_clash+1"],"else":[{"if":"count.rumor==3","then":["log:听说债主们最近换了新的管事，对旧账“会宽限一些”。","count:debt-40"],"else":["exp+8"]}]}]}]},"count:rumor+1"],"cond":"gold>=8","reason":"金币不足"},{"label":"和人下一盘棋，押 20 金币","check":{"attr":"int","diff":11},"ok":{"text":"你布了一个很长的局，对手落子越来越慢，最后推倒了自己的王。","fx":["gold+34","int_exp+3"]},"fail":{"text":"你输了半子，对手笑着把钱收了过去。","fx":["gold-20","int_exp+2"]},"cond":"gold>=20","reason":"金币不足"},{"label":"坐一会儿就走","text":"你听了半个时辰的闲话，没有一句是新的。","fx":["wil_exp+1"]}],"scene":"street"},{"id":"n_vera_recover","kind":"chain","title":"母亲的病情","text":"药煎了一服又一服。深冬的某个夜里，母亲忽然睁开眼，轻声叫了你的名字，声音很虚，却是清醒的。","options":[{"label":"守在床边，一夜没合眼","text":"你握着她的手，一直到天亮。她的手心渐渐有了温度。","fx":["flag+:vera_better","rel:vera+3","wil_exp+3"]},{"label":"请城里最好的医生再来看一次（60 金币）","text":"医生诊了很久，说：“用药得当，能熬过这个冬天。”","fx":["gold-60","flag+:vera_better","rel:vera+2","hometown+2"],"cond":"gold>=60","reason":"金币不足"}],"portrait":"vera","scene":"manor_winter"},{"id":"n_alfred_safe","kind":"chain","title":"书房的暗格","text":"阿尔弗领你到书房最里面，推开一排书，露出一个锈迹斑斑的铁暗格。“老爷走之前，把钥匙交给我，说等少爷能自己守住秘密的时候，再打开。”他的手在抖。","options":[{"label":"用家徽戒指开启","text":"戒指的内圈正好嵌进了锁孔。咔哒一声，暗格里躺着一叠被油纸裹得严实的信件和一本账簿。","fx":["flag+:safe_opened","count:evidence+1","rel:alfred+2","exp+30"]},{"label":"请阿尔弗一起打开","text":"两个人的手同时按在锁上。暗格里，是一本账簿和一叠被虫蛀的信。","fx":["flag+:safe_opened","count:evidence+1","rel:alfred+3","wil_exp+2"]}],"portrait":"alfred","scene":"library"},{"id":"n_metis_gift","kind":"chain","title":"墨提斯的赠礼","text":"三道题全部答完，墨提斯把你叫到塔顶的露台上。风吹得他的白袍猎猎作响。“你父亲，是我最好的学生。”他说，“也是我没有保护好的人。”","options":[{"label":"接受他的怀表与支持","text":"怀表里的指针走得很慢，像一颗沉稳的心。墨提斯伸出手：“复议日那天，我会站在你身后。”","fx":["flag+:metis_gift","flag+:ally_metis","item:tower_cloak","rel:metis+3","rep:tower+5"]},{"label":"道谢，但不想拖累他","text":"墨提斯长长地看了你一会儿，叹了口气：“你比他倔。”但还是把怀表塞进了你的口袋。","fx":["flag+:metis_gift","rel:metis+2","int_exp+4","wil_exp+2"]}],"portrait":"metis","scene":"tower"},{"id":"n_elin_ally","kind":"chain","title":"艾琳的决定","text":"档案馆闭馆后，艾琳锁上了大门，转身对你说：“我替你查了两个月，才发现，这个案子牵涉的东西，比你以为的大得多。”她把一叠抄录的副本放在你手里，“我想帮你到底。”","options":[{"label":"接受她的帮助","text":"你看着她被烛光映红的脸，说不出话，只是握紧了那叠纸。","fx":["flag+:ally_elin","count:evidence+1","rel:elin+3"]},{"label":"婉拒，不想牵连她","text":"“你一个人撑不住的。”她摇了摇头，“但没关系，我先替你收着这份东西，什么时候想要，来找我。”","fx":["flag+:ally_elin","rel:elin+2","cha_exp+2"]}],"portrait":"elin","scene":"library"},{"id":"n_valen_truth","kind":"chain","title":"瓦伦的真相","text":"比试之后，瓦伦把你叫到了走廊尽头。他看起来第一次有些局促：“我不想成为我爸那样的人。”他把一份宰相府的出入记录推给你，“拿着，别问我为什么。”","options":[{"label":"接过记录，对他点头","text":"他侧过脸，不看你：“复议日，我会在旁听席上。”","fx":["flag+:ally_valen","count:evidence+1","rel:valen+3"]},{"label":"不相信，先放在一边","text":"他苦笑了一下：“也对。你没有理由相信我。”","fx":["rel:valen+1","wil_exp+2","flag+:ally_valen"]}],"portrait":"valen","scene":"tower"},{"id":"n_exam_apprentice","kind":"special","title":"入塔考试","text":"高塔每年两次招收学徒。考官把一枚星形的石片放在你面前：“让它亮起来。不用多，一瞬就够。”\n你深吸一口气。","options":[{"label":"接受考试","check":{"attr":"int","diff":11},"ok":{"text":"石片从中心亮起，一圈蓝色的光渐渐漾开。考官点了点头：“合格。”\n你走出考场时，手心里全是汗。","fx":["flag+:tower_admitted","rank:2","rep:tower+5","exp+40","item:oak_staff"]},"fail":{"text":"石片连闪都没闪。考官面无表情：“下一次吧。”","fx":["int_exp+3","wil_exp+1"]}},{"label":"再准备一阵","text":"考官点点头：“门一直开着。”","fx":[]}],"once":false,"cooldown":3,"priority":80,"cond":"attr.int>=13&&level>=2&&count.arcana>=2&&rep.tower>=5&&!flag:tower_admitted&&!flag:main_failed","portrait":"metis","scene":"tower"},{"id":"n_exam_junior","kind":"special","title":"初级魔法师考核","text":"学徒到初级，是高塔里淘汰最多的一关。考题只有一道：在三分钟里，同时维持两个不同属性的法术。","options":[{"label":"接受考核","check":{"attr":"int","diff":14},"ok":{"text":"火与冰在你掌心同时亮起，彼此相安无事。考官的笔停在了半空，很久才落下一个“优”。","fx":["rank:3","rep:tower+8","exp+80","item:mage_robe"]},"fail":{"text":"冰在火里化成了一滩水，你的手指烫红了一片。","fx":["int_exp+4","wil_exp+2","hp-3"]}},{"label":"再准备一阵","text":"考官点点头：“不急，别勉强。”","fx":[]}],"once":false,"cooldown":3,"priority":80,"cond":"rank>=2&&rank\u003c3&&level>=8&&attr.int>=17&&rep.tower>=25","portrait":"metis","scene":"tower"},{"id":"n_exam_mid","kind":"special","title":"中级魔法师考核","text":"高塔的大殿里，九位导师围坐成半圆。“中级魔法师，不是比谁的魔力更多，”首席导师说，“是看谁知道什么时候不该用。”","options":[{"label":"接受考核","check":{"attr":"int","diff":16},"ok":{"text":"你没有放出一个攻击咒。你只是在导师设下的试炼幻象里，一步一步走到了最后一个房间。首席导师把一枚银色的星纹徽章放在你的掌心。","fx":["rank:4","rep:tower+10","exp+120"]},"fail":{"text":"幻象把你困了很久，你最终选择了放弃。导师没有说话，只是把门打开了。","fx":["int_exp+5","wil_exp+3"]}},{"label":"再准备一阵","text":"首席导师点了点头：“那就再磨一磨。”","fx":[]}],"once":false,"cooldown":3,"priority":80,"cond":"rank>=3&&rank\u003c4&&level>=14&&attr.int>=22&&rep.tower>=50","portrait":"metis","scene":"tower"},{"id":"n_trial_day","kind":"special","title":"旧案复议日","text":"二十八岁的秋天。王国的法庭里，红毯一路铺到审判席前。旁听席坐满了人，窃窃私语声像潮水。\n宰相洛克伍德坐在右侧的席位上，神色平静，甚至对你微微颔首。\n书记官宣读：“格雷蒙特一案，申请复议。”\n你站了起来。\n（成功率 = 证据 + 盟友 + 名望为底，魅力为浮动；呈堂时会显示每一项的贡献。）","options":[{"label":"履行约定，缄口不言","text":"你站在门口，听见法官在身后宣布：“原告撤诉。”洛克伍德没有回头。","fx":["end:auto"],"cond":"flag:bought_off","reason":"没有接受过宰相的条件"},{"label":"凭完整的证据链与盟友，堂堂正正地陈词","check":{"attr":"cha","diff":0,"fateDiff":2,"memDiff":{"id":"m_n_trial","diff":-2},"compose":{"base":0,"add":[{"key":"count.evidence","per":0.03,"max":9,"label":"证据"},{"key":"count.allies","per":0.06,"max":3,"label":"盟友"},{"key":"hometown","per":0.001,"max":80,"label":"名望"}],"from":16,"per":0.015},"bonus":0.12},"ok":{"text":"你的声音在大厅里很稳。每一份证据被呈上去，每一位盟友被请出来作证。洛克伍德的辩词，一条一条被你驳了回去。\n最后，法官合上卷宗，长久地沉默。\n“本案，改判。”","fx":["flag+:trial_won","end:auto"]},"fail":{"text":"证据被一一质疑。洛克伍德的律师提出了一个你没有想到的反驳，大厅里响起一片低语。法官摇了摇头：“证据链不完整，驳回。”","fx":["flag+:trial_lost","end:auto"]},"cond":"count.evidence>=9&&count.allies>=2&&!flag:bought_off","reason":"需要证据 ≥ 9 份、盟友 ≥ 2 位"},{"label":"凭已有的证据陈词","check":{"attr":"cha","diff":0,"fateDiff":2,"memDiff":{"id":"m_n_trial","diff":-2},"compose":{"base":0,"add":[{"key":"count.evidence","per":0.03,"max":9,"label":"证据"},{"key":"count.allies","per":0.06,"max":3,"label":"盟友"},{"key":"hometown","per":0.001,"max":80,"label":"名望"}],"from":16,"per":0.015},"bonus":0.05},"ok":{"text":"你把每一份证据按时间排好，一句一句地念。每念一份，旁听席就安静一分。最后，法官看向宰相：“洛克伍德大人，您有何解释？”\n宰相的嘴唇动了动，没有说出话来。","fx":["flag+:trial_won","end:auto"]},"fail":{"text":"证据太散，你的陈词被打断了好几次。洛克伍德轻描淡写地说了一句：“年轻人，凭空想象，是要负责任的。”","fx":["flag+:trial_lost","end:auto"]},"cond":"count.evidence>=6&&!flag:bought_off","reason":"需要证据 ≥ 6 份"},{"label":"证据不足，只能赌一把","check":{"attr":"cha","diff":0,"fateDiff":2,"memDiff":{"id":"m_n_trial","diff":-2},"compose":{"base":0,"add":[{"key":"count.evidence","per":0.03,"max":9,"label":"证据"},{"key":"count.allies","per":0.06,"max":3,"label":"盟友"},{"key":"hometown","per":0.001,"max":80,"label":"名望"}],"from":16,"per":0.015},"bonus":-0.05},"ok":{"text":"你空着手，却凭着十二年的执念说完了一切。大厅里有人站了起来，一个老书记官颤抖着走上前：“我，我当年在场。”\n局势，在这一刻翻转了。","fx":["flag+:trial_won","end:auto"]},"fail":{"text":"你空着手，什么也说服不了。洛克伍德甚至没有开口，法官就敲下了木槌：“驳回。”","fx":["flag+:trial_lost","end:auto"]},"cond":"!flag:bought_off","reason":""},{"label":"以魔法师的身份，向宰相发起决斗","text":"你抬起手，法庭的灯光一盏一盏地暗了下去。\n“你确定？”洛克伍德站了起来，眼里第一次有了一丝波动。","fx":[{"type":"combat","enemy":"lockwood","noFlee":true,"win":["flag+:revenge_done","end:auto"],"lose":["flag+:final_lost","end:auto"]}],"cond":"rank>=3","reason":"需要至少是初级魔法师"},{"label":"放下一切，转身离开法庭","text":"你在门口停住了脚步，阳光从高窗斜斜地落在你的肩头。","fx":["flag+:let_go","end:auto"]}],"priority":200,"scene":"court","when":{"age":28,"season":"autumn"},"portrait":"lockwood","finale":true},{"id":"n_vera_funeral","kind":"special","title":"母亲的葬礼","text":"葬礼很简单。只有阿尔弗、几个老仆人，和你。\n那天的雨不大，落在墓碑上，像是有人在轻轻敲门。你站了很久。","options":[{"label":"把母亲最爱的白玫瑰放在碑前","text":"白玫瑰是你从旧宅花园里最后一株上剪下来的。","fx":["wil_exp+4","hometown-2"]},{"label":"在碑前立誓，一定要查清楚","text":"风吹过墓园，很安静。","fx":["wil_exp+5","exp+30"]}],"priority":70,"once":true,"cond":"flag:vera_died","portrait":"alfred","scene":"manor_winter"},{"id":"n_main_failed","kind":"special","title":"紧闭的大门","text":"高塔的名册上，没有你的名字。\n你在石阶上站了很久，最后把那封一直没递出去的推荐信，折好，放回了怀里。\n通往法庭的路，被切掉了一条。\n但复议日还在那里。你还有证据，还有人，还有两手空空走进去的勇气。","options":[{"label":"去找艾琳，换一种方式查下去","text":"艾琳听完你的话，没有劝你，只是把一把钥匙推到你面前：“档案馆后门，每晚十点。”","fx":["flag+:met_elin","rel:elin+1","wil_exp+3"]},{"label":"回旧宅，重新开始读书","text":"你把父亲书房里的书一本一本搬下来。阿尔弗什么都没问，默默生了火。","fx":["int_exp+4","wil_exp+3","hometown+1"]},{"label":"沉默地走回去","text":"街灯一盏盏亮起来，你的影子被拉得很长。","fx":["wil_exp+4"]}],"priority":95,"once":true,"cond":"flag:main_failed","scene":"street","portrait":"noble"},{"id":"n_debt_seize","kind":"special","title":"查封令","text":"债主带着两名差役站在门口，手里的文书盖着王都法院的章：“按照借据，格雷蒙特家的剩余资产，今日起查封。”\n阿尔弗挡在门前，被推到了一边。","options":[{"label":"变卖剩下的家产，先还一部分","text":"你看着差役们把一件件东西搬上马车。母亲的梳妆台，父亲的画像。","fx":["gold+200","count:debt-200","hometown-8","wil_exp+3"]},{"label":"据理力争，请求宽限","check":{"attr":"cha","diff":12},"ok":{"text":"你把借据一条一条念出来，指出其中的几处违例。差役面面相觑，最后同意宽限三个月。","fx":["hometown-1","cha_exp+4"]},"fail":{"text":"你的话被粗暴地打断了。差役把封条贴在了大门上。","fx":["hometown-8","gold-50"]}}],"priority":90,"once":true,"cond":"count.debt>=1500","scene":"manor_winter","portrait":"alfred"},{"id":"n_16sp","kind":"special","title":"旧宅的清晨","text":"阿尔弗拉开窗帘，晨光落在积灰的书桌上。“少爷，早饭是昨天的面包，凑合一下。”\n你坐起来，看见桌上摊着一叠没拆的账单，最上面一张的数字，红得刺眼。\n今天，是你十六岁的第一天。","options":[{"label":"去父亲的书房，整理他留下的东西","text":"书架最底层有一排没人动过的册子，封面上有父亲的批注。","fx":["int_exp+3","count:arcana+1","wil_exp+1"]},{"label":"出门，变卖一件旧物换钱","text":"你捧着父亲的银杯走进典当铺，价钱比想象的低，但够今天用了。","fx":["gold+120","count:sold+1","hometown-3"]},{"label":"去高塔外，远远看看","text":"高塔的尖顶刺进云里。石阶下，有个金发少年也在抬头看。","fx":["rep:tower+2","cha_exp+1"]}],"when":{"age":16,"season":"spring"},"priority":40,"portrait":"alfred","scene":"manor_spring"},{"id":"n_16su","kind":"special","title":"债主上门","text":"午后，债主的管家带着两个壮汉敲响了大门：“格雷蒙特少爷，这个月的利息，该付了。”\n阿尔弗把门挡住一半，脸色铁青。","options":[{"label":"付 60 金币，先应付过去","text":"你把金币放进他手心。管家掂了掂，不满意，却也没再说什么。","fx":["gold-60","count:debt-60"],"cond":"gold>=60","reason":"金币不足"},{"label":"与他谈，请他宽限一个月","check":{"attr":"cha","diff":11},"ok":{"text":"你站得笔直，用最体面的语气说完了你的计划。管家想了想，竟点了头。","fx":["cha_exp+3","hometown+1"]},"fail":{"text":"他冷笑一声：“少爷，您的头衔值不了钱。”临走前，利息又涨了一点。","fx":["count:debt+30","hometown-3","cha_exp+1"]}},{"label":"闭门不见，让阿尔弗回绝","text":"门外的敲门声，持续了很久。","fx":["wil_exp+2","hometown-2"]}],"when":{"age":16,"season":"summer"},"priority":40,"scene":"manor_spring"},{"id":"n_16au","kind":"special","title":"母亲的药","text":"秋天，母亲的咳嗽越来越重。大夫开了一张长长的药方，抓一服要九十金币。\n母亲靠在躺椅上，勉强笑着：“别花钱，我没事。”\n她的手在发抖。","options":[{"label":"变卖母亲的首饰，先抓一服药","text":"你把首饰盒里最后一对耳坠递给了典当铺老板。他看了你一眼，没有说话。","fx":["gold+90","count:sold+1","hometown-2","rel:vera+1","quest:start:vera_illness"]},{"label":"先赊账，再慢慢还","text":"药铺老板叹了口气，把药包推过来：“记在账上。”","fx":["count:debt+80","rel:vera+1","quest:start:vera_illness"]},{"label":"“我来想办法。”","text":"你把这句话咽了回去，只是点了点头。","fx":["wil_exp+2","quest:start:vera_illness"]}],"when":{"age":16,"season":"autumn"},"priority":40,"portrait":"vera","scene":"manor_autumn"},{"id":"n_16wi","kind":"special","title":"冬夜的书房","text":"停电、没有柴火，你只能抱着蜡烛在书房里翻书。\n你在一本旧账簿的夹层里，摸到了一封信。信封上没有字，封口的火漆是格雷蒙特家徽，一朵白玫瑰。\n里面的字，用了你不认识的暗号。","options":[{"label":"把信藏好，慢慢研究","text":"你把信塞进了衣服最里面的口袋，心跳得很快。","fx":["flag+:father_letter","int_exp+2","wil_exp+1"]},{"label":"拿去给阿尔弗看","text":"阿尔弗看了很久，手有些抖：“这是老爷的笔迹。少爷，这件事别对任何人说。”","fx":["flag+:father_letter","rel:alfred+2","wil_exp+1"]}],"when":{"age":16,"season":"winter"},"priority":40,"scene":"library"},{"id":"n_17sp","kind":"special","title":"第一次踏进高塔","text":"高塔的大门敞开着，学徒们三五成群地进出，每个人的袖口都有星纹。\n你站在石阶下，攥着一张旁听申请，手心在出汗。\n一个金发少年从你身边挤过去，看了你的衣服一眼，不屑地哼了一声：“东区的？”\n他胸前别着一枚金鹰徽章。你认得：那是洛克伍德家的徽记。他是宰相的独子，瓦伦。","options":[{"label":"递交旁听申请","text":"门卫看了一眼你的名字，愣了一下，但还是盖了章。","fx":["rep:tower+3","cha_exp+1","flag+:met_valen"]},{"label":"直接溜进去旁听一堂课（1 体力）","text":"你坐在教室最后一排，认真得像是在抄命。","fx":["int_exp+4","rep:tower+2","flag+:met_valen"],"cost":1},{"label":"转身离开","text":"你走了很远，才发现手里的申请已经被攥皱了。","fx":["wil_exp+1","flag+:met_valen"]}],"when":{"age":17,"season":"spring"},"priority":40,"portrait":"valen","scene":"tower"},{"id":"n_17au","kind":"special","title":"旧书店的艾琳","text":"街角的旧书店，老板是个年轻的女子，戴着圆框眼镜，正站在梯子上整理书架。\n“要找什么？”她头也不回，“先说好，今天只有最后一本魔法入门，别抢。”","options":[{"label":"买下那本魔法入门（20 金币）","text":"她笑了：“看来你比我想得识货。”","fx":["gold-20","int_exp+5","count:arcana+1","flag+:met_elin"],"cond":"gold>=20","reason":"金币不足"},{"label":"帮她整理书架（1 体力）","text":"你一本一本地递，她一本一本地排。她忽然说：“你是东区的格雷蒙特？”你愣了一下。","fx":["rel:elin+1","int_exp+2","flag+:met_elin"],"cost":1},{"label":"请教她怎么查阅王家档案","text":"她推了推眼镜，意味深长地看了你一眼：“你想查什么？”","fx":["rel:elin+1","cha_exp+1","flag+:met_elin"]}],"when":{"age":17,"season":"autumn"},"priority":40,"portrait":"elin","scene":"library"},{"id":"n_18sp","kind":"special","title":"无人赴约的生日宴","text":"十八岁生日，阿尔弗按规矩准备了家宴，发出去的请帖，只来了三位客人。\n餐桌很长，空位很多，烛光摇摇晃晃。\n母亲强撑着坐在主位，一直笑。","options":[{"label":"向仅有的客人敬酒，认真地致谢","text":"那三位客人对视了一眼，都站了起来。其中一位老先生说：“令尊在世时，对我有恩。”","fx":["cha_exp+3","hometown+2","rel:vera+1"]},{"label":"提议把宴席改成慈善晚宴（40 金币）","text":"你把一半的菜送给了东区的穷人。第二天，有人在街上对你点了点头。","fx":["gold-40","hometown+4","rep:church+2"],"cond":"gold>=40","reason":"金币不足"},{"label":"独自走到书房","text":"你在黑暗里坐了很久，直到阿尔弗在门外轻轻敲了三下。","fx":["wil_exp+3","int_exp+1"]}],"when":{"age":18,"season":"spring"},"priority":40,"portrait":"vera","scene":"manor_spring"},{"id":"n_19sp","kind":"special","title":"路过的老法师","text":"高塔的石阶上，一位白胡子老法师拄着手杖慢慢地往上走，走到一半，停下来喘气。\n你正好路过，下意识地扶了他一把。\n他侧过头，眯着眼打量你，说：“你的手，不太像拿笔的人。”","options":[{"label":"扶他走完剩下的台阶","text":"他一路没有说话，到了塔门口，才忽然问：“你姓什么？”","fx":["rep:tower+3","rel:metis+2","flag+:met_metis"]},{"label":"向他请教几个魔法上的疑问（1 体力）","text":"老法师耐心地回答了你三个问题，每一个，都比课上讲得深。","fx":["int_exp+5","rep:tower+3","rel:metis+1","flag+:met_metis"],"cost":1}],"when":{"age":19,"season":"spring"},"priority":40,"portrait":"metis","scene":"tower"},{"id":"n_22au","kind":"special","title":"宰相府的请柬","text":"一封烫金的请柬被送到了旧宅，落款：宰相洛克伍德。\n“邀格雷蒙特伯爵之子，赴秋季宫廷宴。”\n阿尔弗盯着那张纸，一个字也没说。","options":[{"label":"出席，直视他的眼睛（30 金币）","text":"宴会上，洛克伍德亲自走过来，举杯：“令尊的事，我始终很遗憾。”他的眼里一片平静。","fx":["gold-30","hometown+4","cha_exp+3","wil_exp+3"],"cond":"gold>=30","reason":"金币不足"},{"label":"婉拒，称病缺席","text":"请柬被放在了壁炉的架子上，一直没有收起来。","fx":["wil_exp+2","hometown-2"]}],"when":{"age":22,"season":"autumn"},"priority":40,"portrait":"lockwood","scene":"street"},{"id":"n_27sp","kind":"special","title":"倒计时","text":"旧宅的墙上，挂着一本手撕的日历，每天撕掉一页。今天这一页上写着：“距复议日，一年半。”\n阿尔弗站在你的书桌旁，轻轻放下一杯茶。","options":[{"label":"把证据和笔记再整理一遍（1 体力）","text":"每一张纸，你都读到了能背下来。","fx":["wil_exp+3","int_exp+3","exp+30"],"cost":1},{"label":"去看看母亲","text":"母亲靠在窗边，阳光落在她的白发上。她看着你，轻声说：“你很像他。”","fx":["rel:vera+2","wil_exp+2"],"cond":"flag:vera_alive","reason":"母亲已不在"},{"label":"去高塔散步，让脑子冷静一下","text":"夜色里的高塔，像一盏巨大的灯。","fx":["rep:tower+2","wil_exp+2"]}],"when":{"age":27,"season":"spring"},"priority":40,"scene":"tower"},{"id":"n_market_vip","kind":"chain","title":"集市内间","scene":"street","text":"内间的货架上摆着一排排蒙着绒布的东西。店员语气恭敬而克制：“先生，这些货只给‘有分量’的客人看。分量，不只是钱。”\n（魅力 ≥ 10 / 14 / 18，可以买到越来越好的装备。同一栏位只取最强的一件，饰品取最强的两件。）","options":[{"label":"水晶法杖（武器，战力 +9，260 金币，魅力 ≥ 10）","cond":"gold>=260&&attr.cha>=10&&!flag:own_crystal_staff","reason":"需要 260 金币和魅力 ≥ 10，或已经拥有","fx":["gold-260","item:crystal_staff","flag+:own_crystal_staff"],"text":"店员小心地把杖放进你手里，杖头的魔晶忽然亮了一下。"},{"label":"丝绸法袍（护甲，战力 +8，260 金币，魅力 ≥ 10）","cond":"gold>=260&&attr.cha>=10&&!flag:own_silk_robe","reason":"需要 260 金币和魅力 ≥ 10，或已经拥有","fx":["gold-260","item:silk_robe","flag+:own_silk_robe"],"text":"丝绸的触感像水，袖口的符文轻轻发热。"},{"label":"银戒指（饰品，战力 +5，200 金币，魅力 ≥ 10）","cond":"gold>=200&&attr.cha>=10&&!flag:own_silver_ring","reason":"需要 200 金币和魅力 ≥ 10，或已经拥有","fx":["gold-200","item:silver_ring","flag+:own_silver_ring"],"text":"戒指内圈刻着一句祝福。"},{"label":"大魔导师之杖（武器，战力 +14，700 金币，魅力 ≥ 14）","cond":"gold>=700&&attr.cha>=14&&!flag:own_archmage_staff","reason":"需要 700 金币和魅力 ≥ 14，或已经拥有","fx":["gold-700","item:archmage_staff","flag+:own_archmage_staff"],"text":"杖身上的符文在你的掌心缓缓流转，像是在认人。"},{"label":"星纹法袍（护甲，战力 +13，650 金币，魅力 ≥ 14）","cond":"gold>=650&&attr.cha>=14&&!flag:own_star_robe","reason":"需要 650 金币和魅力 ≥ 14，或已经拥有","fx":["gold-650","item:star_robe","flag+:own_star_robe"],"text":"袖口的星纹在暗处微微发光。"},{"label":"狮心吊坠（饰品，战力 +9，550 金币，魅力 ≥ 14）","cond":"gold>=550&&attr.cha>=14&&!flag:own_lion_pendant","reason":"需要 550 金币和魅力 ≥ 14，或已经拥有","fx":["gold-550","item:lion_pendant","flag+:own_lion_pendant"],"text":"吊坠贴在胸口，沉甸甸的。"},{"label":"龙鳞护符（饰品，战力 +12，1400 金币，魅力 ≥ 18）","cond":"gold>=1400&&attr.cha>=18&&!flag:own_dragon_charm","reason":"需要 1400 金币和魅力 ≥ 18，或已经拥有","fx":["gold-1400","item:dragon_charm","flag+:own_dragon_charm"],"text":"鳞片温温的，握在手里，像握着一颗很远的心跳。"},{"label":"回外间","text":"店员点点头：“下次再来，货会有新的。”","fx":[]}]},{"id":"n_valen_duel","kind":"chain","title":"试炼场的约定","text":"高塔的试炼场里，魔法阵一层一层地亮起。瓦伦抱着双臂靠在石柱上，看着你，像是已经等了很久。\n“输的人，请吃一个月的午餐。”他说，“别拿别的东西赌，你的东西，我不稀罕。”","options":[{"label":"接受挑战","text":"你握紧了法杖，试炼场的魔法阵缓缓亮起。","fx":[{"type":"combat","enemy":"valen_duel","noFlee":true,"win":["flag+:valen_duel_won","rel:valen+2","exp+40","cha_exp+3"],"lose":["rel:valen+1","wil_exp+3","hp-6","log:瓦伦把法杖插回腰间，别过脸：“下次，再来。”"]}]},{"label":"改天再来","text":"瓦伦哼了一声：“随你。试炼场，我随时在。”","fx":[]}],"scene":"tower","portrait":"valen"},{"id":"n_alfred_chat","kind":"chain","title":"厨房里的闲聊","text":"厨房里弥漫着茶叶和旧木头的味道。阿尔弗在擦那几只已经亮得不能再亮的银杯，没有抬头。\n“少爷今天想聊什么？”","options":[{"label":"问起十二年前的那一夜","check":{"attr":"cha","diff":11},"ok":{"text":"阿尔弗擦杯的手停了很久。“老爷那晚，让我守在书房门外，不许任何人进去。”他的声音很低，“我守了一夜，没有人来，也没有人出去。”","fx":["flag+:alfred_t1","count:alfred_tale+1","rel:alfred+1","exp+10"]},"fail":{"text":"阿尔弗摇了摇头：“少爷，那一夜的事，我真的记不清了。”他转过身去，继续擦杯子。","fx":["rel:alfred+0","cha_exp+1"]},"cond":"rel.alfred>=3&&!flag:alfred_t1","reason":"阿尔弗还不愿意提那一夜（好感 ≥ 3）"},{"label":"问起书房里的暗格","check":{"attr":"wil","diff":12},"ok":{"text":"你耐着性子，一句一句地问。阿尔弗终于说了：“老爷走的时候，把钥匙交给了我。他说，等少爷能自己守住秘密的时候，再打开。”","fx":["flag+:alfred_t2","count:alfred_tale+1","rel:alfred+1","exp+10"]},"fail":{"text":"阿尔弗把银杯放在桌上，看了你一会儿：“少爷，您还不到时候。”","fx":["wil_exp+1"]},"cond":"flag:alfred_t1&&!flag:alfred_t2","reason":"要先问清那一夜的事"},{"label":"把父亲的密信给他看","text":"阿尔弗读到“洛克伍德”那三个字的时候，手抖了一下。他沉默了很久，说：“……我早该告诉您的。”","fx":["flag+:alfred_t3","count:alfred_tale+1","rel:alfred+2","exp+10"],"cond":"flag:letters_decoded&&!flag:alfred_t3","reason":"需要先破译父亲的密信"},{"label":"什么也不提，陪他喝杯茶","text":"你们坐在厨房里，什么都聊，就是不聊那件事。","fx":["rel:alfred+1","hometown+1","int_exp+1"]},{"label":"离开","text":"","fx":[]}],"scene":"manor_spring","portrait":"alfred"},{"id":"n_pledge","kind":"chain","title":"请求支持","text":"你把整理好的证据摊在桌上，一页一页地讲。\n你要请求的，不是帮忙，而是一个愿意在公开场合，站到你这边的人。这件事，不能强求。","options":[{"label":"去请墨提斯导师","check":{"attr":"cha","diff":12},"ok":{"text":"墨提斯听完，把怀表合上：“复议日那天，我会穿上塔里的长袍，坐在你后面。”","fx":["flag+:pledge_metis","count:allies+1","rel:metis+1","rep:tower+3"]},"fail":{"text":"墨提斯沉默了很久：“……再让我想想。”你知道，这不是拒绝。","fx":["rel:metis+0","cha_exp+1"]},"cond":"flag:metis_gift&&!flag:pledge_metis","reason":"需要得到墨提斯的赠礼，且尚未请求"},{"label":"去请艾琳","check":{"attr":"cha","diff":11},"ok":{"text":"艾琳把一本抄满了笔记的册子交给你：“复议日，我会作为档案馆的证人。”","fx":["flag+:pledge_elin","count:allies+1","rel:elin+1"]},"fail":{"text":"艾琳红着眼睛：“我怕自己，会在法庭上，说不出话。”","fx":["cha_exp+1"]},"cond":"flag:ally_elin&&!flag:pledge_elin","reason":"需要艾琳站在你这一边，且尚未请求"},{"label":"去请瓦伦","check":{"attr":"cha","diff":13,"memDiff":{"id":"m_n_valen","diff":-3}},"ok":{"text":"瓦伦双手插在袖子里，别过脸：“我会坐在旁听席上。别误会，只是去看戏。”","fx":["flag+:pledge_valen","count:allies+1","rel:valen+1"]},"fail":{"text":"瓦伦没有回答，只是看了你很久：“……别逼我。”","fx":["cha_exp+1"]},"cond":"flag:ally_valen&&!flag:pledge_valen","reason":"需要和瓦伦有过了断，且尚未请求"},{"label":"去请阿尔弗","text":"阿尔弗听完，把围裙解了下来，叠好放在桌上：“少爷，老仆，陪您去。”","fx":["flag+:pledge_alfred","count:allies+1","rel:alfred+1","wil_exp+2"],"cond":"flag:safe_opened&&rel.alfred>=6&&!flag:pledge_alfred","reason":"需要打开过暗格，且阿尔弗好感 ≥ 6"},{"label":"先回去，再做准备","text":"","fx":[]}],"scene":"library"},{"id":"n_odette","kind":"chain","title":"奥黛特夫人的信","text":"出席了几次宴会之后，一位气质端庄的夫人，把你叫到了花园的僻静处。\n“你母亲是我最好的朋友，”她说，“这封信，是她二十年前，托我保管的。”\n信里，是一个数目，和一个愿望。","options":[{"label":"收下她的帮助","text":"奥黛特夫人把一个小小的丝绒袋放在你手心里：“别急着谢我。有一天，你让格雷蒙特这个姓氏，再体面起来，就算还了。”","fx":["flag+:odette_helped","count:debt-150","gold+80","hometown+6","rel:vera+1"]},{"label":"谢绝，只收下那封信","text":"奥黛特夫人把信交到你手里，很久没有说话。“你和她一样倔。”","fx":["flag+:odette_helped","hometown+4","wil_exp+3","rel:vera+2"]}],"scene":"manor_spring","portrait":"vera"},{"id":"n_theft_verdict","kind":"chain","title":"书页后的真相","text":"线索一条条地拼在了一起。偷书的人，不是外面的人。\n你在塔顶的露台上，把证据摊开，对面站着三个人：失窃案的管理员，一个满脸涨红的学徒助手，和不知什么时候出现的瓦伦。","options":[{"label":"当众揭穿真正的偷书人","text":"学徒助手“扑通”一声跪了下来，说出了他把书卖给黑市的全过程。管理员看着你，轻轻点了点头。","fx":["flag+:theft_solved","rep:tower+8","rel:valen+2","cha_exp+3","exp+40"]},{"label":"把嫌疑推给瓦伦","text":"你的话没有说完，瓦伦的脸已经白了。管理员叹了口气，没有说话。","fx":["flag+:theft_framed","rep:tower+3","rel:valen-4","hometown-3"],"avoid":true},{"label":"私下里劝助手自首，不让事情闹大","check":{"attr":"cha","diff":13},"ok":{"text":"助手哭着把书交了出来，没有人被当众难堪。管理员默默地欠了你一个人情。","fx":["flag+:theft_solved","rep:tower+5","cha_exp+4","exp+30"]},"fail":{"text":"助手一听，慌了神，夺门而逃。案子，成了悬案。","fx":["rep:tower+1"]}}],"scene":"tower"},{"id":"n_cellar_notes","kind":"chain","title":"父亲的实验室","text":"地窖的角落里，立着一支蒙尘的旧法杖，杖头的魔晶里还残留着一点微光。\n桌上，是父亲最后一份手稿，只写了一半。最后一句，墨迹还没有干透似的：“若有人读到此页，请替我，守住洛克伍德的那份……”","options":[{"label":"带走法杖和手稿","text":"杖身的重量刚刚好。你把手稿一页页抄进自己的本子里，又悄悄地放回原处。","fx":["flag+:cellar_done","item:father_staff","count:evidence+1","int_exp+5","exp+40"]},{"label":"只带走手稿，把法杖留在原处","text":"有些东西，你想等自己配得上了，再来取。","fx":["flag+:cellar_done","count:evidence+2","wil_exp+3","exp+30"]}],"scene":"manor_winter","portrait":"noble"},{"id":"n_spy_unmask","kind":"chain","title":"宅子里的眼睛","text":"你把几天来的记录，在桌上排成一行。每一次，你家的消息，都会在当天夜里，出现在宰相府的侧门。\n泄露消息的人，只可能是一个：新来的那个小厮，托马斯。","options":[{"label":"当面拆穿他","text":"托马斯脸色惨白，一句话也说不出来。他的母亲，被宰相府“照顾”着。他哭着说，他什么也没有说出去，只说了“家里很穷”。","fx":["flag+:spy_found","rel:alfred+1","count:evidence+1","wil_exp+3","exp+30"]},{"label":"假装不知道，反过来喂他假消息","check":{"attr":"cha","diff":13},"ok":{"text":"你让阿尔弗配合着，每天“无意”地漏一点假话。三个星期后，宰相府的人，来了一次“偶然的拜访”，被你们一一记在了本子上。","fx":["flag+:spy_turned","flag+:spy_found","count:evidence+2","cha_exp+4","exp+40"]},"fail":{"text":"托马斯很快察觉了异样，一夜之间消失了。","fx":["flag+:spy_found","wil_exp+1"]}},{"label":"把他开除，不再追究","text":"托马斯鞠了一躬，在门口停了一下，没有回头。","fx":["flag+:spy_found","hometown+1"]}],"scene":"manor_autumn"},{"id":"n_metis_seal","kind":"chain","title":"墨提斯的沉默","text":"塔顶的露台上，墨提斯把你递来的那几页抄录，翻来覆去地读。\n风吹动了他的白袍。他很久没有开口，只是用手指，摩挲着那一行“魔晶，是封印的燃料”。\n“……你从哪里知道的？”他终于抬起头。","options":[{"label":"如实说出：在另一个人生里，一个农夫之子读到了这个答案","text":"墨提斯愣了一下，随即笑了，笑得很淡：“有些真相，换了谁来读，都是一样的。”他把那几页还给你，“收好。这东西，不该在塔里被人知道。”","fx":["flag+:seal_lore","rep:tower+6","int_exp+8","wil_exp+4","exp+80"]},{"label":"说是在禁书库里偶然读到的","text":"墨提斯看了你一会儿，什么也没有追问。“记住，”他说，“知道得越多，越要少说。”","fx":["flag+:seal_lore","rep:tower+3","int_exp+6","exp+60"]}],"scene":"tower","portrait":"metis"}],"content/noble_heir/events_derived.json":[{"id":"n_dv_arcana_spark","kind":"derived","parent":"study_arcana","weight":10,"title":"指尖的火星","text":"你照着图解默念咒文，指尖忽然亮起一点橙红色的火星，随即熄灭。","options":[{"label":"再试一次","text":"这一次，火星停留了半个呼吸。","fx":["int_exp+4","wil_exp+2"]}]},{"id":"n_dv_arcana_backfire","kind":"derived","parent":"study_arcana","weight":8,"title":"失控的咒文","text":"你念错了一个音节，面前的蜡烛突然窜起半人高的火苗，把桌上的稿纸烧着了。","options":[{"label":"赶紧扑灭","check":{"attr":"agi","diff":9},"ok":{"text":"你一把按住火苗，只烧焦了一角。","fx":["agi_exp+2","int_exp+2"]},"fail":{"text":"火苗燎到了你的袖子，疼得你直叫。","fx":["hp-6","int_exp+1"]}}]},{"id":"n_dv_arcana_flow","kind":"derived","parent":"study_arcana","weight":9,"title":"魔力的流动","text":"读到某一页时，你忽然感觉到一股细细的暖流顺着指尖流进了书页，咒文的笔画微微发亮。","options":[{"label":"屏息凝神，顺着它引导","check":{"attr":"int","diff":11},"ok":{"text":"那股暖流听从了你的引导，在掌心转了一圈又回到身体里。","fx":["int_exp+5","count:arcana+1","mpheal:0.5"]},"fail":{"text":"你一分神，暖流就散了。","fx":["int_exp+2"]}}]},{"id":"n_dv_father_note","kind":"derived","parent":"study_arcana","weight":8,"title":"父亲的批注","text":"你翻到书页的空白处，那里有一行极小的字，是父亲的笔迹：“这一段，我年轻时也没读懂。”","options":[{"label":"盯着那行字看了很久","text":"你把那一页折了一个小角，继续往下读。","fx":["wil_exp+2","int_exp+3"]}],"once":false},{"id":"n_dv_lecture_question","kind":"derived","parent":"tower_lecture","weight":9,"title":"课上的提问","text":"讲师讲完一个咒文，忽然环视全场：“谁能说说，这个结构的弱点在哪儿？”教室里一片安静。","options":[{"label":"举手回答","check":{"attr":"int","diff":12},"ok":{"text":"你说出了一个讲师没想过的角度。他看了你一眼，眼里有一点赞许。","fx":["int_exp+5","rep:tower+3","cha_exp+1"]},"fail":{"text":"你的答案不太对，讲师摇了摇头：“坐下，再想想。”","fx":["int_exp+2"]}},{"label":"低头装作在记笔记","text":"没有人注意到你。","fx":["int_exp+1"]}]},{"id":"n_dv_lecture_valen","kind":"derived","parent":"tower_lecture","weight":8,"title":"金发的同学","text":"下课后，瓦伦故意从你的桌边走过，用肩膀撞了你一下：“东区的，别在这儿丢人。”","options":[{"label":"反唇相讥","check":{"attr":"cha","diff":11},"ok":{"text":"你不紧不慢地回了一句，周围的几个人没忍住，笑出了声。瓦伦的脸红了。","fx":["cha_exp+3","rel:valen+1","count:valen_clash+1"]},"fail":{"text":"你想说些什么，却一时语塞。","fx":["cha_exp+1","count:valen_clash+1"]}},{"label":"默默收拾书本","text":"你把书本理好，从他身边走了过去。","fx":["wil_exp+2","count:valen_clash+1"]}],"cond":"flag:met_valen"},{"id":"n_dv_tutor_gossip","kind":"derived","parent":"tutoring","weight":8,"title":"学生家长的闲话","text":"学生的母亲给你倒了杯茶，忽然压低声音：“少爷，您知道吗，宰相最近在府里藏了一批东西。”","options":[{"label":"追问","text":"她说不清楚，但提到了几个人名，你都记了下来。","fx":["cha_exp+2","exp+10","int_exp+1"]},{"label":"不接话，微笑着喝茶","text":"她意味深长地笑了笑。","fx":["cha_exp+1"]}]},{"id":"n_dv_tutor_bonus","kind":"derived","parent":"tutoring","weight":8,"title":"额外的酬金","text":"学生的父亲很满意孩子最近的成绩，另外塞给了你一个红封：“少爷，辛苦了。”","options":[{"label":"收下，道谢","text":"红封里是平时的两倍。","fx":["gold+30","cha_exp+1"]}]},{"id":"n_dv_copy_secret","kind":"derived","parent":"copywork","weight":6,"title":"抄到的旧判决书","text":"抄书铺今天接了一批旧卷宗的誊抄活。你抄着抄着，笔停了：这是十二年前的会审记录，页脚被撕掉了一半。","options":[{"label":"悄悄多抄一份","check":{"attr":"int","diff":11},"ok":{"text":"你趁着老板转身，把那页字一笔一画地抄在了另一张纸上。","fx":["count:evidence+1","int_exp+3","wil_exp+2"]},"fail":{"text":"老板回头，你只来得及把手压在纸上。","fx":["cha_exp+1"]}}],"cond":"age>=18","once":true},{"id":"n_dv_copy_ink","kind":"derived","parent":"copywork","weight":8,"title":"打翻的墨水","text":"你正抄到关键处，一抖手，墨水泼了半页。","options":[{"label":"重新抄一遍（1 体力）","text":"这一次你抄得格外认真。","fx":["int_exp+4","wil_exp+1"],"cost":1},{"label":"拿袖子擦掉，继续","text":"这一页算是废了。","fx":["int_exp+1","gold-5"]}]},{"id":"n_dv_banquet_insult","kind":"derived","parent":"banquet","weight":9,"title":"有人嘲讽你的姓","text":"宴席上，有人举着酒杯，笑盈盈地问：“听说格雷蒙特家，最近连管家都快请不起了？”","options":[{"label":"体面地回击","check":{"attr":"cha","diff":12},"ok":{"text":"你端起酒杯，微笑着说：“比不上您，请得起一屋子的人，却请不起一句实话。”满座哄笑。","fx":["cha_exp+4","hometown+3"]},"fail":{"text":"你涨红了脸，找不到合适的话。","fx":["cha_exp+1","hometown-2"]}},{"label":"沉默，端起酒杯一饮而尽","text":"你的手稳得出奇，只有杯沿微微一颤。","fx":["wil_exp+3"]}]},{"id":"n_dv_banquet_ally","kind":"derived","parent":"banquet","weight":7,"title":"父亲的旧部","text":"宴会的角落里，一位身材魁梧的老将军朝你点了点头，把酒杯举到你面前：“你和你父亲，长得真像。”","options":[{"label":"敬他一杯","text":"他一饮而尽，低声说：“有需要，来找我。”","fx":["hometown+3","rep:kingdom+3","cha_exp+2"]},{"label":"礼貌致谢","text":"他点点头，转身融进了人群。","fx":["rep:kingdom+1"]}],"cond":"age>=19","once":true},{"id":"n_dv_banquet_spy","kind":"derived","parent":"banquet","weight":7,"title":"可疑的侍者","text":"你注意到，一名侍者总是在你附近转悠，眼睛时不时往你的衣兜瞟。","options":[{"label":"暗中盯住他","check":{"attr":"agi","diff":11},"ok":{"text":"你发现他和宰相府的管家悄悄交换了一个眼神。你记下了他的脸。","fx":["agi_exp+3","exp+15"]},"fail":{"text":"他很快消失在了人群里。","fx":["agi_exp+1"]}}],"cond":"age>=21"},{"id":"n_dv_archive_guard","kind":"derived","parent":"investigate_archive","weight":9,"title":"巡夜的守卫","text":"你在书架的阴影里翻卷宗时，走廊尽头传来了守卫的脚步声，越来越近。","options":[{"label":"屏住呼吸，藏进书架背后","check":{"attr":"agi","diff":11},"ok":{"text":"守卫打着哈欠走了过去，你把冷汗擦在袖子上。","fx":["agi_exp+3"]},"fail":{"text":"守卫一把掀开了书架，你被拖了出去，关了一晚上。","fx":["hp-4","hometown-2"]}}]},{"id":"n_dv_archive_page","kind":"derived","parent":"investigate_archive","weight":7,"title":"被撕掉的一页","text":"你翻到十二年前那一卷时，发现关键的一页被人整齐地撕掉了，只剩下边缘一道极细的毛边。","options":[{"label":"顺着毛边，推测被撕的位置","check":{"attr":"int","diff":12},"ok":{"text":"你发现这一页，是被人从别的卷宗里挪走的。你又花了半夜，把它找了回来。","fx":["count:evidence+1","int_exp+4"]},"fail":{"text":"你对着那道毛边，苦思冥想了一夜。","fx":["int_exp+2"]}}]},{"id":"n_dv_vera_memory","kind":"derived","parent":"visit_vera","weight":10,"title":"母亲的故事","text":"母亲靠在躺椅上，忽然笑了：“你小时候最爱爬树，有一次摔下来，脸朝下，满头是泥，却一声没哭。”","options":[{"label":"笑着听完","text":"她笑得咳了起来，你替她拍着背。","fx":["rel:vera+1","hometown+1"]}],"cond":"flag:vera_alive"},{"id":"n_dv_vera_cough","kind":"derived","parent":"visit_vera","weight":9,"title":"夜里的咳嗽","text":"夜里，你听见母亲的房间传来一阵很重的咳嗽。你推门进去，她的手帕上有一点淡淡的红。","options":[{"label":"守在床边（1 体力）","text":"她握着你的手，慢慢睡着了。","fx":["rel:vera+2","wil_exp+2"],"cost":1,"cond":"flag:vera_alive"},{"label":"去叫阿尔弗","text":"阿尔弗披着衣服跑进来，熟练地拧毛巾、倒水。","fx":["rel:alfred+1","rel:vera+1"]}],"cond":"flag:vera_alive"},{"id":"n_dv_alfred_tea","kind":"derived","parent":"chat_alfred","weight":9,"title":"阿尔弗的茶","text":"阿尔弗递给你一杯红茶，杯沿有一道细细的裂缝：“这是老爷最后一次喝茶用的杯子。”","options":[{"label":"双手接过，慢慢喝完","text":"茶有点苦，也有点暖。","fx":["rel:alfred+1","wil_exp+2"]}]},{"id":"n_dv_salon_poem","kind":"derived","parent":"salon","weight":8,"title":"一首诗","text":"沙龙上，有人朗诵了一首关于“被遗忘的玫瑰”的诗。你听着，指尖在椅背上收紧了一下。","options":[{"label":"私下去请教作者","text":"作者是一位年长的女诗人，她轻声说：“有些事，要用一辈子去写。”","fx":["cha_exp+3","wil_exp+2"]},{"label":"坐着没动","text":"你把这首诗，抄在了本子的最后一页。","fx":["int_exp+2"]}]},{"id":"n_dv_alfred_garden","kind":"derived","parent":"chat_alfred","weight":8,"title":"花园里的旧事","text":"阿尔弗领你去后院，指着那丛疯长的野草：“这里原先是夫人的玫瑰园。老爷每年冬天都会亲自为它们裹草席。”","options":[{"label":"蹲下来拔几根草","text":"你们俩在傍晚的光里，慢慢地清出了一小块空地。","fx":["rel:alfred+1","wil_exp+1","hometown+1"],"cost":0}]},{"id":"n_dv_alfred_chess","kind":"derived","parent":"chat_alfred","weight":8,"title":"棋盘","text":"阿尔弗摆开一副旧棋盘：“老爷教我的。我下得不好，但少爷肯陪我下，我就高兴。”","options":[{"label":"认真下一局","check":{"attr":"int","diff":11},"ok":{"text":"你布了一个长局，阿尔弗摸着下巴想了很久，最后笑着推倒了自己的王：“老爷也这么赢过我。”","fx":["int_exp+3","rel:alfred+1"]},"fail":{"text":"你下得太冒进，被他一步步围了起来。","fx":["int_exp+1","rel:alfred+1"]}}]},{"id":"n_dv_salon_witty","kind":"derived","parent":"salon","weight":8,"title":"一句妙语","text":"沙龙里，有人刻意提起：“听说格雷蒙特家的玫瑰，已经谢了？”满座目光落在你身上。","options":[{"label":"笑着接话","check":{"attr":"cha","diff":12},"ok":{"text":"你说：“玫瑰在冬天也许看起来像枯枝，但根还在。”满座一静，随即有人鼓起了掌。","fx":["cha_exp+4","hometown+3"]},"fail":{"text":"你想了一圈，说了句不痛不痒的话。","fx":["cha_exp+1"]}}]},{"id":"n_dv_salon_stranger","kind":"derived","parent":"salon","weight":6,"title":"陌生的听众","text":"沙龙散场后，一位陌生的老先生拦住你：“我听过你在台上说的话。你是格雷蒙特的孩子吧？”","options":[{"label":"点头","text":"老先生沉默了一会儿：“我是令尊的旧同事。有些事，也许我能帮你一点。”","fx":["exp+25","hometown+2","count:evidence+0"]},{"label":"摇头，说他认错了","text":"老先生看了你很久，叹了口气：“好吧。”","fx":["wil_exp+1"]}],"once":true,"cond":"age>=21"},{"id":"n_dv_lecture_blank","kind":"derived","parent":"tower_lecture","weight":8,"title":"空白的黑板","text":"讲师写完最后一行公式，忽然把粉笔扔了：“今天没有标准答案。谁能说服我，谁就能下课。”","options":[{"label":"站起来发言","check":{"attr":"int","diff":12},"ok":{"text":"你花了十分钟，一步步把自己的推导讲了出来。讲师沉默了很久：“……可以。”","fx":["int_exp+5","rep:tower+3"]},"fail":{"text":"你卡在了最后一步，讲师摇摇头：“再想想。”","fx":["int_exp+2"]}},{"label":"等别人先说","text":"一个同学先站了起来，你认真听完，把他的思路记了下来。","fx":["int_exp+2"]}]},{"id":"n_dv_lecture_note","kind":"derived","parent":"tower_lecture","weight":7,"title":"陌生的笔记","text":"散场后，你在座位下发现一份别人落下的笔记，字迹熟悉，竟和你在父亲书里看到的批注很像。","options":[{"label":"留着，慢慢研究","text":"那份笔记里有一个你一直没想通的结构，被人用三行字讲清了。","fx":["int_exp+5","exp+15","flag+:found_note"],"cost":0}],"once":true,"cond":"age>=18"},{"id":"n_dv_tutor_gift","kind":"derived","parent":"tutoring","weight":7,"title":"送给老师的礼物","text":"学生的母亲送了你一盒点心：“少爷教得好，孩子最近乖多了。”盒底压着一小串钥匙。","options":[{"label":"问她是什么","text":"她红了脸：“是我家在西城的小仓库钥匙，有些旧书，少爷用得上。”","fx":["gold+20","int_exp+3","count:arcana+1"]},{"label":"道谢，收下点心","text":"你把点心带给了母亲。","fx":["rel:vera+1","hometown+1"],"cond":"flag:vera_alive"}]},{"id":"n_dv_banquet_dance","kind":"derived","parent":"banquet","weight":8,"title":"一支舞","text":"宴会上，一位陌生的贵族小姐冲你招招手：“少爷，能请你跳支舞吗？我实在不想再被人拉去聊政治。”","options":[{"label":"欣然答应","check":{"attr":"cha","diff":10},"ok":{"text":"你们在大厅里旋转，聊的是天气和魔法。散场时，她眨眨眼：“你的朋友会越来越多的。”","fx":["cha_exp+4","hometown+2"]},"fail":{"text":"你踩了她的裙子，两人都没忍住笑。","fx":["cha_exp+2","hometown+1"]}},{"label":"婉拒","text":"她耸耸肩，转身找别人了。","fx":["wil_exp+1"]}]},{"id":"n_dv_arcana_candle","kind":"derived","parent":"study_arcana","weight":8,"title":"蜡烛的灰","text":"你读到半夜，蜡烛烧到了根。你把最后一点光凑近书页，才发现边缘有一行极小的字，是别人批注的。","options":[{"label":"读完它","text":"那行字只有七个字：“记住，魔法也会累。”","fx":["int_exp+3","wil_exp+1","heal:0.1"]}]},{"id":"n_dv_arcana_vision","kind":"derived","parent":"study_arcana","weight":6,"title":"一瞬的幻象","text":"你正在默念咒文，眼前忽然闪过一个画面：一座黑色的法庭，一个穿红袍的人，背对着你。画面只有一瞬。","options":[{"label":"睁开眼，记下来","text":"你在纸上草草勾了几笔，不知道它是预兆，还是你自己的焦虑。","fx":["wil_exp+3","int_exp+2"]},{"label":"试着再看一次","check":{"attr":"wil","diff":12},"ok":{"text":"画面又浮现了，这次你看清了红袍人手里捏着的东西，是一枚家徽。","fx":["wil_exp+4","exp+20"]},"fail":{"text":"画面消失了，你的头隐隐作痛。","fx":["hp-4","wil_exp+1"]}}],"once":true,"cond":"count.arcana>=8"},{"id":"n_dv_metis_note","kind":"derived","parent":"metis_trial","weight":9,"title":"墨提斯的批语","text":"你交上去的答案被退回来，页边上多了一行红字：“方向对，路径丑。”你盯着那四个字，竟然笑了。","options":[{"label":"回去重新推一遍","text":"第二遍，路径果然顺多了。","fx":["int_exp+4","wil_exp+1"]}]}],"content/noble_heir/events_dungeon.json":[{"id":"n_de_corridor","kind":"dungeon","weight":8,"title":"魔法回廊","text":"走廊两侧的石壁上，浮动着一串串缓缓旋转的符文，你每走一步，它们就换一个形状。","options":[{"label":"读出符文的规律，顺着走","check":{"attr":"int","diff":12},"ok":{"text":"符文逐一熄灭，前方的石门缓缓打开。你没有受伤，反而对魔法的结构多了一点理解。","fx":["int_exp+4","count:arcana+1"]},"fail":{"text":"符文突然全亮了，一道光鞭甩在你的背上。","fx":["hp-9","int_exp+1"]}}],"dungeons":["cave","mine"]},{"id":"n_de_golem","kind":"dungeon","weight":8,"title":"沉睡的傀儡","text":"通道中央蹲着一尊石傀儡，它的双眼是两粒暗淡的魔晶。你屏住呼吸，从旁边绕过。","options":[{"label":"悄悄绕过","check":{"attr":"agi","diff":11},"ok":{"text":"傀儡没有动，你从它的影子里擦了过去。","fx":["agi_exp+3"]},"fail":{"text":"你的靴子踩碎了一块小石子，傀儡的眼睛骤然亮起。你被迫狼狈逃出。","fx":["hp-10","agi_exp+1"]}},{"label":"尝试用魔法唤醒它，看看会发生什么","text":"你向它注入了一点魔力，傀儡缓缓站起，朝你鞠了一躬，然后退回了墙边。","fx":["int_exp+4","exp+20"],"cond":"count.arcana>=5","reason":"魔法知识不足"}],"dungeons":["cave","mine","grave"]},{"id":"n_de_rune_stone","kind":"dungeon","weight":8,"title":"失落的符文石","text":"墙缝里嵌着半块发光的石头，上面刻着看不懂的纹路。你认出了其中一个符号，在父亲的书里见过。","options":[{"label":"用魔力小心地取下它","text":"石头在掌心发热，一段残缺的咒文顺着你的魔力流进了意识里。","fx":["int_exp+5","count:arcana+2","mpheal:0.3"],"cond":"count.arcana>=3","reason":"魔法知识不足"},{"label":"只拓下纹路，把石头留下","text":"你用一张纸，把纹路一笔一画地描了下来。","fx":["int_exp+3","count:arcana+1"]}],"dungeons":["mine","grave","fortress"],"once":true},{"id":"n_de_apprentice_bones","kind":"dungeon","weight":8,"title":"学徒的遗骨","text":"石室角落，一具穿着旧学徒袍的骸骨倚墙而坐，手里还攥着一枚褪色的星纹徽章。","options":[{"label":"取下徽章，替他保管","text":"徽章背面刻着三个字：“对不起。”你不知道它是写给谁的。","fx":["wil_exp+2","rep:tower+3","exp+15"]},{"label":"默默行礼，离开","text":"你在他面前站了一会儿，轻声说了声“打扰了”。","fx":["wil_exp+3"]}],"dungeons":["cave","grave"],"once":true},{"id":"n_de_resonance","kind":"dungeon","weight":8,"title":"魔晶共鸣","text":"你体内的魔力忽然和墙上的魔晶共振起来，一阵眩晕涌上来，又一阵温暖随即覆盖。","options":[{"label":"稳住意识，引导共鸣","check":{"attr":"wil","diff":12},"ok":{"text":"共鸣平息时，你觉得自己的魔力池比刚才宽了一圈。","fx":["mpheal:0.8","wil_exp+4"]},"fail":{"text":"你被冲得跪倒在地，魔力一时紊乱。","fx":["mp-6","hp-5","wil_exp+1"]}}],"dungeons":["mine","fortress"]},{"id":"n_de_forbidden_page","kind":"dungeon","weight":8,"title":"禁书残页","text":"一堆腐烂的书页里，夹着一张边缘焦黑的残页，上面用红墨水写着一段关于“契约魔法”的警告。","options":[{"label":"读完它","check":{"attr":"int","diff":13},"ok":{"text":"你读懂了最后一句：“凡以意志为代价者，必以意志偿还。”你把这句话记在心里。","fx":["int_exp+6","wil_exp+2","exp+30"]},"fail":{"text":"字迹太淡，你只读出了开头的两行。","fx":["int_exp+2"]}}],"dungeons":["grave","fortress"],"once":true},{"id":"n_de_murals","kind":"dungeon","weight":8,"title":"王陵壁画","text":"墓道两侧的壁画描绘着一位王与他的御用法师。你认出了其中一幅，法师的手势和你在书里学到的一模一样。","options":[{"label":"仔细比对，照着做一遍","text":"你尝试着做出那个手势，指尖凝出一粒微弱的光点。","fx":["int_exp+4","count:arcana+1","wil_exp+1"],"cond":"count.arcana>=4","reason":"魔法知识不足"},{"label":"拓下壁画","text":"你用炭笔拓了半个时辰。","fx":["int_exp+2","exp+10"]}],"dungeons":["grave"]},{"id":"n_de_oath_wall","kind":"dungeon","weight":8,"title":"要塞的誓言墙","text":"要塞的走廊里，一整面墙刻满了名字。每一个名字后面都带着一行小字：“愿以此身，换后来者的一个明天。”","options":[{"label":"找到你认识的名字","text":"第三排的一个名字，是你在高塔的旧同学。你把手按在上面，很久没动。","fx":["wil_exp+4","exp+30"]},{"label":"在墙上刻下自己的名字","text":"你没有留下全名，只留了两个字：“再来”。","fx":["wil_exp+3","hometown+1"]}],"dungeons":["fortress"],"once":true}],"content/noble_heir/events_random.json":[{"id":"n_patron","kind":"random","pool":"opportunity","weight":9,"title":"匿名的资助人","text":"你在高塔的公告栏上看到一则启事：某位匿名贵族愿资助“有才华的家道中落者”，条件只有一个，得通过一次小小的面试。","options":[{"label":"参加面试","check":{"attr":"cha","diff":11},"ok":{"text":"面试官只问了三个问题，你都答得滴水不漏。一周后，一袋金币被送到了旧宅门口，没有署名。","fx":["gold+70","cha_exp+3","hometown+2"]},"fail":{"text":"你的回答太防备，面试官皱了皱眉：“年轻人，你在紧张什么？”","fx":["cha_exp+2"]}},{"label":"不去，不想欠人情","text":"你把公告撕下来，叠好，放进抽屉。","fx":["wil_exp+1"]}],"cond":"age>=18","scene":"tower"},{"id":"n_guest_lecture","kind":"random","pool":"opportunity","weight":9,"title":"名师客座讲座","text":"高塔请来了一位远道而来的名师，讲题是“符文与意志”。座位早被抢光，只有门口还能站人。","options":[{"label":"站在门口，全神贯注地听","check":{"attr":"int","diff":12},"ok":{"text":"他讲到最后一个例子时，你脑子里忽然有一根线接上了。散场时，你的笔记密得看不清字。","fx":["int_exp+7","rep:tower+3","count:arcana+1"]},"fail":{"text":"你只听懂了开头，后面像在听外语。","fx":["int_exp+2"]}},{"label":"早点回去，看书比听讲更有效","text":"你抱着书，一个人在安静的书房里读到了半夜。","fx":["int_exp+3"]}],"cond":"age>=17","scene":"tower"},{"id":"n_old_book","kind":"random","pool":"opportunity","weight":8,"title":"旧书商的降价","text":"旧书摊的老板抱着一摞蒙尘的魔导书，正在大声吆喝：“清仓大甩卖！”","options":[{"label":"买下最厚的那本（40 金币）","text":"你翻开扉页，上面写着一个熟悉的名字：格雷蒙特。","fx":["gold-40","int_exp+8","count:arcana+1"],"cond":"gold>=40","reason":"金币不足"},{"label":"翻看几页，记下几条咒文","text":"老板瞪了你一眼：“看够了就买！”","fx":["int_exp+3"]}],"scene":"street"},{"id":"n_hidden_coins","kind":"random","pool":"opportunity","weight":7,"title":"夹层里的古币","text":"整理旧宅的壁橱时，你发现墙板后面藏着一个小布袋，里面是几枚前朝的金币。","options":[{"label":"留着，补贴家用","text":"你把布袋压在了账本的最底下。","fx":["gold+60"]},{"label":"拿去给阿尔弗，让他入账","text":"阿尔弗翻看了一会儿，没说话，眼眶红了：“老爷当年，真是个周到的人。”","fx":["rel:alfred+1","hometown+1","gold+30"]}],"once":true,"scene":"manor_autumn"},{"id":"n_scholarship","kind":"random","pool":"opportunity","weight":10,"title":"高塔奖学金","text":"高塔每年都会评选几位成绩出色的学徒，授予奖学金。名单贴出来的那天，你的名字在第三行。","options":[{"label":"领取奖学金","text":"金额不多，但够你交一学期的讲义费。","fx":["gold+80","rep:tower+3","int_exp+2"]}],"cond":"rank>=2","once":true,"scene":"tower"},{"id":"n_old_friend","kind":"random","pool":"opportunity","weight":9,"title":"父亲的旧友","text":"一位白发的老先生敲开旧宅的门，自称是令尊在军队里的旧部。“当年没能帮上忙，我一直很愧疚。”","options":[{"label":"请他进来喝杯茶","text":"老先生坐了很久，把父亲当年的几件事讲给你听。临走前，他留下一小袋金币和一个地址。","fx":["gold+60","hometown+3","rel:alfred+1","exp+20"]},{"label":"婉拒，称家中不便","text":"老先生默默点了点头，把地址留在了门口的信箱里。","fx":["wil_exp+1"]}],"cond":"age>=18","once":true,"scene":"manor_autumn"},{"id":"n_charity_ball","kind":"random","pool":"opportunity","weight":8,"title":"慈善舞会","text":"教会主办的慈善舞会发来了一份请柬，要求出席者至少捐一份善款。","options":[{"label":"出席并捐 40 金币","text":"你在舞会上被几位熟面孔点头致意，有人悄悄说：“格雷蒙特家的孩子，没有变。”","fx":["gold-40","hometown+4","cha_exp+3","rep:church+3"],"cond":"gold>=40","reason":"金币不足"},{"label":"推辞，称有课","text":"你在高塔的教室里度过了一个安静的夜晚。","fx":["int_exp+2"]}],"cond":"age>=19","scene":"street"},{"id":"n_debt_collectors","kind":"random","pool":"calamity","weight":10,"title":"债主的打手","text":"半夜，旧宅的大门被撞得砰砰响。几个壮汉站在门外，其中一人晃着棍子：“少爷，您的账，今天得有个说法。”","options":[{"label":"迎出去，动手","text":"你握紧了法杖。","fx":[{"type":"combat","enemy":"thug","win":["hometown+2","cha_exp+2"],"lose":["gold-30","hometown-2"],"flee":["gold-15"]}]},{"label":"付 80 金币了事","text":"他们数完钱，嘟囔着走了。","fx":["gold-80","count:debt-80"],"cond":"gold>=80","reason":"金币不足"}],"cond":"count.debt>=600&&age>=17","scene":"manor_winter"},{"id":"n_theft","kind":"random","pool":"calamity","weight":7,"title":"手脚不干净的人","text":"早上起来，阿尔弗气喘吁吁地告诉你：库房里少了一只银烛台。","options":[{"label":"追查线索","check":{"attr":"int","diff":11},"ok":{"text":"你顺着蛛丝马迹，在当铺里找到了烛台，把它赎了回来。","fx":["int_exp+3","hometown+1"]},"fail":{"text":"线索断了，银烛台没了踪影。","fx":["hometown-2","gold-20"]}},{"label":"算了，认栽","text":"阿尔弗低着头：“是老仆没看好……”","fx":["hometown-1"]}],"cond":"age>=17","scene":"manor_autumn"},{"id":"n_cold_snap","kind":"random","pool":"calamity","weight":8,"title":"断了柴火","text":"寒潮提前来了，旧宅的炉子里烧完了最后一块木头。母亲咳得更厉害，阿尔弗在客厅里转来转去，手搓得通红。","options":[{"label":"去市场买柴（30 金币）","text":"你背着一捆湿柴回家，路上滑倒了一次。","fx":["gold-30","rel:vera+1"],"cond":"gold>=30","reason":"金币不足"},{"label":"拆掉一件旧家具当柴烧","text":"那是父亲年轻时坐过的椅子。你一斧子下去，没有说话。","fx":["hometown-2","wil_exp+2","rel:vera+1"]}],"cond":"season==winter","scene":"manor_winter"},{"id":"n_slander","kind":"random","pool":"calamity","weight":8,"title":"流言","text":"街头巷尾开始流传一个说法：格雷蒙特家的少爷其实早就在暗中联络魔族，高塔学徒的身份，是掩护。","options":[{"label":"当众澄清","check":{"attr":"cha","diff":12},"ok":{"text":"你在高塔食堂里，当着所有人的面，把每一件事讲清楚。有人开始点头。","fx":["cha_exp+4","hometown+1"]},"fail":{"text":"你说得越多，别人看你的眼神越奇怪。","fx":["hometown-4","cha_exp+1"]}},{"label":"不理，继续做自己的事","text":"一个月后，另一桩新的流言，把这一桩盖了过去。","fx":["wil_exp+3","hometown-1"]}],"cond":"age>=19","scene":"street"},{"id":"n_spell_accident","kind":"random","pool":"calamity","weight":9,"title":"失控的实验","text":"你在书房里试一个新咒文，魔力忽然失控，书桌被炸出了一个黑洞。阿尔弗拎着水桶冲进来。","options":[{"label":"稳住魔力","check":{"attr":"wil","diff":11},"ok":{"text":"你咬牙把魔力压回掌心，手背上被灼出一条红印。","fx":["wil_exp+3","hp-4","int_exp+2"]},"fail":{"text":"魔力反噬，你被掀翻在地。","fx":["hp-12","status+:fatigue:2"]}},{"label":"立刻切断咒语","text":"烟散了，书桌少了一个角。","fx":["int_exp+1","hp-3"]}],"cond":"flag:library_open&&count.arcana>=3","scene":"library"},{"id":"n_assassin","kind":"random","pool":"calamity","weight":8,"title":"黑衣人","text":"夜里，你察觉到有人在跟踪你。回头时，巷口的暗处立着一个黑衣人，一动不动。","options":[{"label":"转身迎战","text":"黑衣人拔出了短刃。","fx":[{"type":"combat","enemy":"assassin","win":["exp+30","wil_exp+3","flag+:assassin_survived"],"lose":["wil_exp+1"],"flee":[]}]},{"label":"甩掉他","check":{"attr":"agi","diff":12},"ok":{"text":"你绕过三条街，翻进了阿尔弗留的后门。身后的脚步声，在巷尾消失了。","fx":["agi_exp+3"]},"fail":{"text":"他一直跟到旧宅门口，才转身消失。你一夜没睡。","fx":["wil_exp+1","status+:fatigue:1"]}}],"cond":"age>=22&&flag:father_letter","scene":"street"},{"id":"n_vera_memory","kind":"random","pool":"social","weight":10,"title":"母亲的回忆","text":"母亲今天精神特别好，非要你推她去花园。她指着一丛干枯的玫瑰：“这是我和你父亲一起种的。”","options":[{"label":"陪她坐一会儿，听她讲","text":"她讲了半个下午，讲到最后，轻轻握了握你的手：“不管发生什么，别让自己变成他们。”","fx":["rel:vera+2","wil_exp+3","hometown+1"],"cond":"flag:vera_alive"},{"label":"替她剪下一枝，放在窗前","text":"她看着那枝花，没有说话，眼里有光。","fx":["rel:vera+1","hometown+1"],"cond":"flag:vera_alive"}],"cond":"flag:vera_alive&&age>=18","once":true,"scene":"manor_spring","portrait":"vera"},{"id":"n_alfred_story","kind":"random","pool":"social","weight":9,"title":"阿尔弗的往事","text":"夜里，阿尔弗坐在厨房里擦着那几只仅剩的银杯，忽然开口：“少爷，您知道老爷最爱吃什么吗？”","options":[{"label":"洗耳恭听","text":"他讲了一个半小时，从老爷小时候讲到老爷第一次骑马摔进泥里，笑着笑着，眼眶红了。","fx":["rel:alfred+2","hometown+1","wil_exp+1"]},{"label":"请他讲讲当年的案子","text":"阿尔弗沉默了很久，只说了一句：“那天，老爷没有挣扎。”","fx":["rel:alfred+1","wil_exp+2","exp+10"]}],"scene":"manor_winter","portrait":"alfred"},{"id":"n_salon_invite","kind":"random","pool":"social","weight":8,"title":"沙龙的邀请","text":"一位自称“爱好者”的贵妇人递来一张请柬，说是要办一场魔法与诗歌的沙龙，缺一位“有故事的年轻人”。","options":[{"label":"出席并发表一段见解","check":{"attr":"cha","diff":11},"ok":{"text":"你谈到了魔法与记忆之间的关系，满座的人沉默了一阵，然后热烈地鼓起了掌。","fx":["cha_exp+4","hometown+3","rep:tower+2"]},"fail":{"text":"你说得太谨慎，没留下什么印象。","fx":["cha_exp+2"]}},{"label":"婉拒","text":"贵妇人遗憾地点了点头。","fx":[]}],"cond":"age>=18","scene":"street"},{"id":"n_elin_gift","kind":"random","pool":"social","weight":14,"title":"艾琳送来的书","text":"艾琳敲开了旧宅的门，把一个油纸包塞进你怀里：“我在店里翻到的，感觉你会喜欢。”说完，转身就走。","options":[{"label":"拆开看看","text":"是一本边角磨破的魔法理论，扉页上写着一行小字：“送给想不明白的人。”","fx":["int_exp+6","count:arcana+1","rel:elin+1"]}],"cond":"rel.elin>=2","once":true,"scene":"manor_spring","portrait":"elin"},{"id":"n_study_group","kind":"random","pool":"social","weight":8,"title":"同学的读书会","text":"几位高塔的同学约你组一个读书会，每周在图书馆集合一次，讨论上周的疑难。","options":[{"label":"积极参与","check":{"attr":"int","diff":12},"ok":{"text":"你提出的一个观点引起了一场激烈的讨论，散会后有人追着你问细节。","fx":["int_exp+6","rep:tower+3","cha_exp+2"]},"fail":{"text":"你听得多，说得少，倒是收获了几页满满当当的笔记。","fx":["int_exp+3"]}},{"label":"只当旁听生","text":"你坐在最后一排，一晚上只翻了三次笔记。","fx":["int_exp+2"]}],"cond":"rank>=2","scene":"library"},{"id":"n_royal_review","kind":"random","pool":"world","weight":8,"title":"王室的巡视","text":"王室的巡视官员来到东区，挨家挨户地检查登记。旧宅的大门前，官员停了很久。","options":[{"label":"从容应对","check":{"attr":"cha","diff":11},"ok":{"text":"你把登记簿、税单、地契一一奉上，滴水不漏。官员记下几笔，转身走了。","fx":["hometown+3","cha_exp+3"]},"fail":{"text":"你有一张税单找不到了，官员的眉头皱成了一条线。","fx":["hometown-3","gold-30"]}},{"label":"让阿尔弗出面","text":"阿尔弗毕恭毕敬，几乎是把旧宅里每一件东西都解释了一遍。","fx":["hometown+1","rel:alfred+1"]}],"cond":"age>=18","scene":"manor_spring"},{"id":"n_plague_rumor","kind":"random","pool":"world","weight":7,"title":"瘟疫的传闻","text":"王都的西区爆发了一种怪病，街上到处是戴着药草面具的人。高塔宣布暂停公开讲座。","options":[{"label":"留在家里，读书（2 体力）","text":"你一个人把书房里没读完的那几本啃完了。","fx":["int_exp+5","wil_exp+2"],"cost":2},{"label":"去教会的救济所帮忙（2 体力）","text":"你戴着面罩，帮忙分发药草和粥，直到手指被冻僵。","fx":["rep:church+4","hometown+2","wil_exp+3"],"cost":2}],"cond":"age>=18","scene":"street"},{"id":"n_war_news","kind":"random","pool":"world","weight":10,"title":"前线的战报","text":"茶馆里，有人拍着桌子读报纸：魔物攻陷了两座边境据点，王国正在紧急调兵。","options":[{"label":"听完，默默记下","text":"你把这个消息和计划里的时间对了一遍。时间，并不宽裕。","fx":["wil_exp+2","int_exp+2"]},{"label":"加紧练习（2 体力）","text":"你在书房里一遍遍练着那几个咒语，直到手指发麻。","fx":["int_exp+4","wil_exp+3","exp+20"],"cost":2}],"cond":"age>=24","once":true,"scene":"street"},{"id":"n_comet","kind":"random","pool":"world","weight":9,"title":"拖着尾巴的星","text":"夜里，一颗拖着长长尾巴的红色彗星划过北方的天空，持续了整整三个晚上。高塔的天文学家说，这是上一次魔王苏醒前也出现过的征兆。","options":[{"label":"爬上旧宅的屋顶看","text":"你和阿尔弗并肩坐在屋脊上，谁也没说话。","fx":["wil_exp+3","rel:alfred+1"]},{"label":"记下它的方位和日期","text":"你在本子上画下星图，打算去问墨提斯。","fx":["int_exp+3","exp+10"]}],"cond":"age>=24","once":true,"scene":"manor_autumn"},{"id":"n_carriage","kind":"random","pool":"opportunity","weight":9,"title":"翻倒的马车","text":"街角，一辆华丽的马车翻倒在路中央，车夫满头是血，车里隐约有人在喊救命。","options":[{"label":"冲上去把车厢抬正","check":{"attr":"str","diff":9},"ok":{"text":"你和几个路人一起，把车厢抬起来。车里走出一位惊魂未定的老太太，一定要留下你的名字。","fx":["hometown+4","gold+30","cha_exp+2"]},"fail":{"text":"车厢太沉，你只拉出了受伤的车夫。","fx":["hometown+1","hp-4"]}},{"label":"去叫巡逻的卫兵","text":"你跑了两条街，带回了卫兵。事情总算有人接手。","fx":["hometown+1","agi_exp+2"]}],"cond":"age>=17","scene":"street"},{"id":"n_poem_rose","kind":"random","pool":"social","weight":9,"title":"一首关于白玫瑰的诗","text":"茶馆里，有位卖诗的年轻人把一首新作念给每个客人听，开头一句是：“荆棘里的白玫瑰，不肯凋谢。”","options":[{"label":"买一张诗笺（5 金币）","text":"你把诗笺折好，放进口袋，没有对任何人说为什么。","fx":["gold-5","hometown+2","wil_exp+2"],"cond":"gold>=5","reason":"金币不足"},{"label":"听完，什么也不说","text":"他念完最后一句，抬头看了你一眼，像是认出了什么。","fx":["wil_exp+1","hometown+1"]}],"cond":"age>=18","once":true,"scene":"street"},{"id":"n_tower_prank","kind":"random","pool":"social","weight":8,"title":"学徒的恶作剧","text":"你回到座位时，发现自己的讲义被人泼了一整瓶墨水。后排传来压低的窃笑。","options":[{"label":"不动声色，当场重新誊一份","check":{"attr":"wil","diff":11},"ok":{"text":"你把污掉的讲义放在一边，从包里抽出一份昨晚备份的，平静地翻开。后排的笑声慢慢安静了。","fx":["wil_exp+4","rep:tower+2"]},"fail":{"text":"你的手有点抖，笔在纸上划出了一道歪线。","fx":["wil_exp+1"]}},{"label":"当众询问是谁干的","text":"没有人承认。但教室里的气氛，明显变了。","fx":["cha_exp+2","rep:tower-1"]}],"cond":"rank>=2","scene":"tower"},{"id":"n_locked_library","kind":"random","pool":"opportunity","weight":8,"title":"被锁在图书馆里","text":"你读书读得太入神，等回过神，图书馆已经闭馆，大门被从外面锁上了。烛光下，一整面墙的藏书在向你招手。","options":[{"label":"干脆读通宵（1 体力）","text":"天亮时，守门的老头发现了你，满脸诧异，却什么也没说。","fx":["int_exp+8","count:arcana+1","status+:fatigue:1"],"cost":1},{"label":"找出口，趁天黑溜走","check":{"attr":"agi","diff":10},"ok":{"text":"你从通风窗里爬了出去，掸了掸身上的灰。","fx":["agi_exp+3"]},"fail":{"text":"窗户太小，你卡在了中间，被早起的清洁工发现了。","fx":["hometown-1","cha_exp+1"]}}],"cond":"flag:library_open","scene":"library"},{"id":"n_church_alms","kind":"random","pool":"world","weight":8,"title":"教会的施粥","text":"冬天，教会在街口支起了大锅，施粥给穷人。队伍从街头排到了街尾，神父的眼圈发黑。","options":[{"label":"帮忙分粥（1 体力）","text":"你站在锅边，一勺一勺地分，直到手腕发酸。","fx":["rep:church+4","hometown+1","wil_exp+2"],"cost":1},{"label":"捐一些钱（15 金币）","text":"神父向你点头致意，在簿子上写了几笔。","fx":["gold-15","rep:church+3","hometown+1"],"cond":"gold>=15","reason":"金币不足"}],"cond":"season==winter","scene":"street"},{"id":"n_merchant_loan","kind":"random","pool":"opportunity","weight":8,"title":"商人的借款","text":"一位衣着光鲜的商人找到你：“听说少爷最近缺钱？我这儿正好有一笔低息的借款，一年内还清就行。”","options":[{"label":"仔细看借据，再决定","check":{"attr":"int","diff":12},"ok":{"text":"你在最后一页发现了一条隐蔽的附加条款：逾期按双倍计息。你把借据推了回去。商人脸上的笑，僵住了。","fx":["int_exp+4","cha_exp+2"]},"fail":{"text":"你没注意到那条小字。借据签下去，你才发现数字不太对。","fx":["gold+150","count:debt+260","hometown-2"]}},{"label":"直接签字","text":"钱很快就到了账。但账本上，多了一行不太好看的数字。","fx":["gold+150","count:debt+240"]},{"label":"拒绝","text":"商人耸耸肩，把借据收了回去。","fx":["wil_exp+1"]}],"cond":"age>=18&&count.debt>=300","scene":"street"},{"id":"n_lights_festival","kind":"random","pool":"social","weight":14,"title":"灯节","text":"王都一年一度的灯节。街上挂满了纸灯，人们提着灯笼三三两两地走过石桥。艾琳站在桥头，朝你挥手。","options":[{"label":"陪她放一盏灯（1 体力）","text":"她在灯上写了一行字，没让你看。灯顺着河水慢慢漂远了。","fx":["rel:elin+2","hometown+1","wil_exp+1"],"cost":1},{"label":"隔着桥，点点头就走","text":"桥上的人潮挤过去，你们的视线很快被淹没了。","fx":["rel:elin+1"]}],"cond":"flag:met_elin&&season==autumn","once":true,"scene":"street","portrait":"elin"},{"id":"n_tower_ranking","kind":"random","pool":"opportunity","weight":8,"title":"塔中排名考","text":"高塔每半年一次排名考，前十名可以得到进入内塔藏书室的资格。","options":[{"label":"参加排名考","check":{"attr":"int","diff":13},"ok":{"text":"考卷最后一题你写得极其流畅，贴榜那天，你的名字在第五行。","fx":["rep:tower+5","int_exp+5","exp+30"]},"fail":{"text":"你卡在倒数第二题，最后只排在了中游。","fx":["rep:tower+1","int_exp+2"]}},{"label":"放弃，专心准备别的事","text":"你把精力全放在了另一件事上。","fx":["wil_exp+1"]}],"cond":"rank>=2","scene":"tower"},{"id":"n_dream_father","kind":"random","pool":"social","weight":9,"title":"梦里的父亲","text":"你梦见父亲坐在书房的窗边，侧着脸，手里捧着那本旧册子。你想喊他，可怎么也发不出声音。","options":[{"label":"醒来后，把梦写在本子上","text":"你写了很久，写到天亮。","fx":["wil_exp+3","int_exp+1"]},{"label":"翻个身，继续睡","text":"梦里的那扇窗，慢慢地暗了下去。","fx":["wil_exp+1"]}],"cond":"age>=20","once":true,"scene":"manor_winter"},{"id":"n_old_witness","kind":"random","pool":"opportunity","weight":10,"title":"认出你的人","text":"旁听席上，有人一直盯着你看。散场后，一位头发花白的老书记官追上来，压低声音：“你是格雷蒙特伯爵的儿子吧？有些话，我憋了很多年。”","options":[{"label":"请他到僻静处详谈","check":{"attr":"cha","diff":12},"ok":{"text":"他犹豫了很久，终于说出了当年会审那晚，自己亲眼看到的一件事。你把每一句话，都牢牢记下。","fx":["count:evidence+1","cha_exp+3","flag+:old_witness"]},"fail":{"text":"他看了看四周，摇头：“不行，我不能说。”转身消失在人群里。","fx":["cha_exp+1","wil_exp+1"]}},{"label":"先留个地址，让他想好了再来","text":"他接过纸条，攥得很紧。","fx":["rel:alfred+0","wil_exp+1"]}],"cond":"age>=22","once":true,"scene":"street"},{"id":"n_street_music","kind":"random","pool":"opportunity","weight":8,"title":"街头的乐师","text":"街角的老乐师拉着一支你熟悉的曲子，是母亲从前在花园里哼过的调子。","options":[{"label":"站着听完，放一枚铜币","text":"琴声停下时，你的眼眶有点发热。","fx":["gold-2","wil_exp+2","hometown+1"]},{"label":"上前问他从哪里学的","text":"老乐师想了想：“很多年前，有位伯爵夫人教我的。”","fx":["exp+15","cha_exp+2"]}],"cond":"flag:vera_alive","once":true,"scene":"street"},{"id":"n_alchemist","kind":"random","pool":"opportunity","weight":7,"title":"深夜的炼金师","text":"夜里，你被一阵怪味吵醒。隔壁新搬来的炼金师在试验一种新药剂，黄烟从窗缝里一股股地冒出来。","options":[{"label":"敲门，请教他的配方","check":{"attr":"int","diff":12},"ok":{"text":"炼金师正愁没人交流，拉着你聊了整个晚上，还送你两瓶试验品。","fx":["int_exp+5","mpheal:1","exp+20"]},"fail":{"text":"他把你关在了门外：“商业机密！”","fx":["cha_exp+1"]}},{"label":"捂着鼻子，翻个身继续睡","text":"第二天，屋里的蜡烛都发黄了。","fx":["status+:fatigue:1"]}],"cond":"age>=18","scene":"street"},{"id":"n_apprentice_ball","kind":"random","pool":"social","weight":8,"title":"学徒舞会","text":"高塔一年一度的学徒舞会，你在请柬上看到了自己的名字。管家把你压箱底的礼服熨得笔挺，眼神里带着点骄傲。","options":[{"label":"放松地去跳舞","check":{"attr":"cha","diff":11},"ok":{"text":"你牵着一位同学转了一圈又一圈，笑声在大厅里回荡。散场时，有人说：“你和传闻中的不太一样。”","fx":["cha_exp+4","hometown+3","rep:tower+2"]},"fail":{"text":"你踩了舞伴三次脚，红着脸跑到阳台去透气。","fx":["cha_exp+2"]}},{"label":"婉拒，留在书房读书","text":"你把窗子推开一条缝，远处的音乐隐隐约约地飘进来。","fx":["int_exp+3"]}],"cond":"rank>=2","scene":"tower"},{"id":"n_stolen_notes","kind":"random","pool":"calamity","weight":7,"title":"被偷的笔记","text":"你从高塔回来，发现旧宅的书房被翻过，别的东西都没动，只少了你最近三个月的研究笔记。","options":[{"label":"凭记忆重新整理","check":{"attr":"int","diff":12},"ok":{"text":"你熬了两个夜，把核心的内容全默了出来，比原来的更凝练。","fx":["int_exp+5","wil_exp+2"]},"fail":{"text":"漏了几处关键的推导，你对着空白的纸页发了很久的呆。","fx":["int_exp+2","hometown-1"]}},{"label":"去高塔举报","text":"管事人记了笔录，但谁也不太当真。","fx":["rep:tower+1","wil_exp+1"]}],"cond":"rank>=2&&count.arcana>=6","once":true,"scene":"library"},{"id":"n_old_tutor","kind":"random","pool":"social","weight":9,"title":"旧日的家庭教师","text":"一位白发的老先生敲开了旧宅的门，自称是你童年的家庭教师：“少爷小时候，最爱问‘为什么’。”","options":[{"label":"请他进来，听他讲小时候的事","text":"他讲了你三岁时拆了一台座钟的事，笑得连连咳嗽。","fx":["rel:alfred+1","wil_exp+1","cha_exp+2","hometown+1"]},{"label":"请教他一个至今没解开的问题","text":"老先生想了想，在纸上写下一个只有三行的推导，递给了你。","fx":["int_exp+6","exp+20"]}],"cond":"age>=19","once":true,"scene":"manor_autumn"},{"id":"n_bank_notice","kind":"random","pool":"calamity","weight":8,"title":"银行的通知","text":"信封上盖着王都商业银行的钢印。里面是一份措辞客气的通知：您的债务利率，将于下季度上调一成。","options":[{"label":"上门谈判","check":{"attr":"cha","diff":12},"ok":{"text":"你在经理室里坐了一个下午，把过去几年的每一次按时还款记录摊在桌上。最后，经理同意延后一个季度调整。","fx":["cha_exp+4","hometown+1"]},"fail":{"text":"经理礼貌而冷淡：“规定就是规定。”","fx":["count:debt+60","cha_exp+1"]}},{"label":"认下，加紧还款","text":"你合上信，在日历上画了一个圈。","fx":["wil_exp+2"]}],"cond":"count.debt>=500&&age>=18","scene":"street"},{"id":"n_anon_letter","kind":"random","pool":"opportunity","weight":10,"title":"匿名的来信","text":"信箱里多了一封没有署名的信，信纸上只有一行字：“十二年前的会审名单，在西城区第三条巷的第五户。”","options":[{"label":"按图索骥","check":{"attr":"int","diff":12},"ok":{"text":"你找到了那间破败的小屋，老妇人看了你很久，递给你一个布包。里面是一份被反复翻阅的名单。","fx":["count:evidence+1","int_exp+3","exp+20"]},"fail":{"text":"那间屋子早就空了，窗上落满了灰。","fx":["int_exp+1"]}},{"label":"记下地址，暂不行动","text":"你把这行字抄进了日记的最后一页。","fx":["wil_exp+1"]}],"cond":"age>=21","once":true,"scene":"street"},{"id":"n_manor_leak","kind":"random","pool":"calamity","weight":7,"title":"旧宅漏雨","text":"暴雨夜，旧宅三楼的天花板开始渗水，一滴滴落在父亲的书架上。阿尔弗拎着水桶满屋子跑。","options":[{"label":"亲自爬上屋顶修补（1 体力）","text":"你和阿尔弗一人扶梯，一人递瓦片，在雨里忙了一整夜。","fx":["rel:alfred+1","wil_exp+2","hometown+1"],"cost":1},{"label":"请工匠来修（40 金币）","text":"工匠冒雨赶来，天亮时，屋顶总算不漏了。","fx":["gold-40"],"cond":"gold>=40","reason":"金币不足"}],"scene":"manor_winter"},{"id":"n_rival_gossip","kind":"random","pool":"social","weight":8,"title":"同学的闲话","text":"午餐时，隔壁桌的几个学徒压低声音说：“听说格雷蒙特家的人，今年又在偷偷联络谁。”","options":[{"label":"冷静地走过去，反问","check":{"attr":"cha","diff":12},"ok":{"text":"你把手里的杯子放在他们桌上：“谁说的？请把名字也写在账上。”几个人面面相觑。","fx":["cha_exp+4","hometown+2","rep:tower+1"]},"fail":{"text":"你说得太急，反而显得心虚。","fx":["cha_exp+1","hometown-2"]}},{"label":"装作没听见，吃完走人","text":"你把盘子洗得格外干净。","fx":["wil_exp+2"]}],"cond":"rank>=2","scene":"tower"},{"id":"n_street_beggar","kind":"random","pool":"social","weight":7,"title":"街角的乞丐","text":"你在桥头遇见一个蜷缩的乞丐，他抬头看你的那一眼，让你想起了狱里传出的那些消息。","options":[{"label":"给他一枚金币和一块面包（5 金币）","text":"他愣了愣，低声说了一句：“好人有好报。”","fx":["gold-5","hometown+1","rep:church+1"],"cond":"gold>=5","reason":"金币不足"},{"label":"和他聊聊，问他见过什么","text":"他认识你家的旧管家，絮絮叨叨讲了很多零碎的事。","fx":["exp+15","cha_exp+2"]}],"once":true,"scene":"street"},{"id":"n_valen_taunt","kind":"random","title":"走廊里的挑衅","text":"高塔的回廊里，瓦伦带着两个跟班，把你堵在了拐角：“听说你在抄书铺打工？洛克伍德家的藏书室，倒是缺个擦书架的。”\n他的声音不大，周围却一下子安静了下来。","options":[{"label":"不卑不亢地回应","check":{"attr":"cha","diff":12},"ok":{"text":"你一字一句地回了他：“我父亲当年，就是在那间藏书室里给人讲课的。”几个路过的学徒，没忍住，笑了出来。瓦伦的脸，一阵红一阵白。","fx":["cha_exp+3","rel:valen+1","count:valen_clash+1"]},"fail":{"text":"你憋出一句话，却被他轻轻一笑带了过去。跟班们哄笑起来。","fx":["cha_exp+1","count:valen_clash+1"]}},{"label":"一言不发，绕过去","text":"你从他身边走了过去。身后传来一声不屑的鼻音。","fx":["wil_exp+2","count:valen_clash+1"]}],"pool":"social","weight":12,"cond":"flag:met_valen&&rank>=2","once":true,"scene":"tower","portrait":"valen"},{"id":"n_valen_library","kind":"random","title":"同一本书","text":"藏书室里，你要借的那本《元素共鸣》，只剩最后一册。你伸手去拿的时候，另一只手，同时按在了书脊上。\n是瓦伦。","options":[{"label":"让给他，改天再借","text":"他愣了一下，接过书，没说话。你转身离开时，听见他在背后很轻地说了一句：“……谢谢。”","fx":["rel:valen+1","wil_exp+2","count:valen_clash+1"]},{"label":"提议轮流看：你先看三天","check":{"attr":"cha","diff":12},"ok":{"text":"你们各看三天，互相不说话，也互相不让对方多拿一天。有一晚，你在书页里发现了一张他留下的字条：“第四章有一处错的。”","fx":["rel:valen+1","int_exp+3","count:valen_clash+1"]},"fail":{"text":"他冷哼一声，把书夺了过去。你空手而归。","fx":["count:valen_clash+1"]}},{"label":"争到底","text":"你们在藏书室里僵持了很久，直到管理员咳嗽了一声。书最后被你们一起放回了架子上。","fx":["wil_exp+2","cha_exp+1","count:valen_clash+1"]}],"pool":"social","weight":12,"cond":"flag:met_valen&&rank>=2","once":true,"scene":"library","portrait":"valen"},{"id":"n_sell_cup","kind":"random","title":"债主的催款","text":"债主的管家站在门口，不卑不亢地递来一张催款单：“伯爵夫人（他还是习惯这么叫），这个月，该有个说法了。”\n你翻了翻抽屉，里面只剩一只被擦得发亮的银杯，是父亲当年的获奖纪念。","options":[{"label":"把银杯送去典当铺","text":"典当铺老板掂了掂，报了一个价。你没有还价，只把杯底的刻字，用拇指摩挲了很久。","fx":["gold+110","count:sold+1","hometown-3"]},{"label":"跟管家好好谈谈，请他宽限","check":{"attr":"cha","diff":12},"ok":{"text":"你一句一句地讲，讲到最后，管家叹了口气：“……下个月，我再来。”","fx":["cha_exp+3","hometown+1"]},"fail":{"text":"管家依旧客气，却一寸不让：“这是规矩。”","fx":["count:debt+30","hometown-2","cha_exp+1"]}},{"label":"什么也不做，任由他在账本上添一笔","text":"管家鞠了一躬，走了。账本上，又多了一行数字。","fx":["count:debt+40","hometown-2"]}],"pool":"calamity","weight":9,"cond":"count.debt>0&&gold\u003c150&&count.sold\u003c2&&age>=17","once":true,"scene":"manor_spring"},{"id":"n_sell_books","kind":"random","title":"书商的出价","text":"旧书商站在书房门口，手里拿着一本从你的书架上抽出的古籍：“伯爵少爷，这本《符文大全》，我出一个好价钱。”\n你知道这是父亲当年最喜欢的一本，扉页上还有他的批注。","options":[{"label":"卖给他","text":"书商满意地把书夹在腋下。扉页上，父亲的批注，你抄了一份，才放他走。","fx":["gold+120","count:sold+1","hometown-3","int_exp+1"]},{"label":"婉拒，再另想办法","text":"书商耸耸肩：“你会回来的。”","fx":["wil_exp+2"]},{"label":"请他把批注抄一份给你，再成交","check":{"attr":"cha","diff":13},"ok":{"text":"书商叹了口气，用一个下午抄完了批注，又多给了你一点钱。","fx":["gold+135","count:sold+1","hometown-3","int_exp+3"]},"fail":{"text":"他不耐烦地摇头：“要卖就卖，不卖我走了。”","fx":["wil_exp+1"]}}],"pool":"calamity","weight":9,"cond":"count.debt>0&&gold\u003c200&&count.sold\u003c3&&age>=18&&flag:library_open","once":true,"scene":"library"},{"id":"n_sell_clock","kind":"random","title":"落灰的座钟","text":"客厅里，有一座父亲从东方带回来的座钟。你一直没舍得卖，但这个月，煤和面包的钱，都没了着落。\n钟摆还在走，咔哒、咔哒。","options":[{"label":"卖掉座钟","text":"座钟被搬走的时候，整座旧宅都安静了一下。你忽然发现，家里，原来这么空。","fx":["gold+130","count:sold+1","hometown-4"]},{"label":"留着，宁愿饿一顿","text":"你把钟上了弦。夜里，咔哒声，陪着你睡。","fx":["wil_exp+2","hp-4"]},{"label":"把座钟送去修，请钟表匠看看它值多少","check":{"attr":"int","diff":12},"ok":{"text":"钟表匠看了一眼，说这钟的机芯是失传的东方工艺，出价比你想的高得多。你把它换成了一笔钱，还换到了一个愿意长期来往的老师傅。","fx":["gold+170","count:sold+1","hometown-3","int_exp+3"]},"fail":{"text":"钟表匠摇头：“只是个旧钟。”","fx":["gold-10"]}}],"pool":"calamity","weight":9,"cond":"count.debt>0&&gold\u003c150&&count.sold\u003c4&&age>=19","once":true,"scene":"manor_autumn"}],"content/noble_heir/events_story.json":[{"id":"n_20sp","kind":"special","when":{"age":20,"season":"spring"},"priority":40,"title":"二十岁的信","text":"生日那天，旧宅的信箱里多了一封没有署名的信，信纸上只有一句话：“王家档案馆的第七排，从下数第三层，有些东西被人搬过。”","options":[{"label":"记下这句话，暂时不声张","text":"你把信折成极小的一块，塞进了怀表后面。","fx":["flag+:archive_hint","int_exp+2","wil_exp+1"]},{"label":"拿给阿尔弗看","text":"阿尔弗看完，沉默了很久：“少爷，这件事，您自己拿主意。”","fx":["flag+:archive_hint","rel:alfred+1","wil_exp+1"]}],"scene":"manor_spring","portrait":"alfred"},{"id":"n_24au","kind":"special","when":{"age":24,"season":"autumn"},"priority":40,"title":"宰相的演讲","text":"秋季庆典上，宰相洛克伍德站在高台上演讲，台下掌声雷动。他说到“忠诚”这个词时，目光恰好落在人群里的你身上，停留了一瞬。","options":[{"label":"直视他，不躲","text":"他的眼神像水面一样平静。但你注意到，他握着稿纸的手指，稍微紧了一下。","fx":["wil_exp+3","cha_exp+2"]},{"label":"在人群里悄悄后退","text":"你退到了灯光照不到的地方，看着他讲完每一个字。","fx":["wil_exp+2","int_exp+2"]}],"scene":"street","portrait":"lockwood"},{"id":"n_18wi","kind":"special","priority":40,"title":"雪夜的访客","text":"大雪封了半座城。深夜，门铃响了，阿尔弗披着衣服去开门，回来时手里捧着一只湿透的油纸包：“少爷，有人把它放在了门口，没留名字。”\n你拆开，里面是一小袋金币，和一张纸条：“令尊从前帮过我。”","options":[{"label":"把金币记在账上，纸条收好","text":"你把纸条夹进了日记，一整夜都没睡着。","fx":["gold+60","hometown+1","wil_exp+1"]},{"label":"把一半分给最近冻得最厉害的邻居","text":"第二天，隔壁的老太太悄悄给你家门口放了一篮炖菜。","fx":["gold+30","hometown+3","rep:church+1"]}],"when":{"age":18,"season":"winter"},"scene":"manor_winter","portrait":"alfred"},{"id":"n_19au","kind":"special","priority":40,"title":"高塔的入学礼","text":"秋季入学礼上，新生们按成绩依次上台。第一个被叫到名字的，是瓦伦·洛克伍德。\n掌声很响。你站在人群的边缘，看着那个金发少年面无表情地接过徽章，忽然觉得，他的背挺得有点太直了。","options":[{"label":"鼓掌，礼貌而克制","text":"你不想给任何人留下把柄。","fx":["cha_exp+2","wil_exp+1"]},{"label":"低头记下他身后站着的几位大人物","text":"你把名字和站位一个个记在了脑子里。","fx":["int_exp+2","exp+10"]}],"when":{"age":19,"season":"autumn"},"scene":"tower","portrait":"valen"},{"id":"n_20au","kind":"special","priority":40,"title":"母亲的生日","text":"母亲的生日快到了。往年这一天，旧宅里都会摆上一桌清淡的素菜，请几个老仆一起吃。\n今年，阿尔弗悄悄把你拉到一边：“少爷，夫人问您，能不能带她出去走走。”","options":[{"label":"买一束花，推她去公园（30 金币）","text":"她在长椅上坐了很久，手里捏着那束花，一句话也没说，笑得很满足。","fx":["gold-30","rel:vera+3","hometown+1"],"cond":"flag:vera_alive&&gold>=30","reason":"金币不足或母亲不在了"},{"label":"在家为她读一整天的诗","text":"她闭着眼听着，偶尔跟着轻轻念两句。","fx":["rel:vera+2","cha_exp+2","wil_exp+1"],"cond":"flag:vera_alive","reason":"母亲不在了"},{"label":"在父亲的画像前独自站一会儿","text":"画像里的人笑着，眉眼和你一模一样。","fx":["wil_exp+3"],"cond":"!flag:vera_alive","reason":"母亲还在世"}],"when":{"age":20,"season":"autumn"},"scene":"manor_autumn","portrait":"vera"},{"id":"n_21sp","kind":"special","priority":40,"title":"瓦伦的邀约","text":"瓦伦把你拦在高塔的回廊里，语气生硬：“我父亲想请你喝茶。别误会，是正式邀请。”\n他停顿了一下，补了一句：“你可以不去。”","options":[{"label":"答应去，暗中观察","check":{"attr":"cha","diff":12},"ok":{"text":"你在宰相府的会客厅里坐了一个钟头，把每一个路过的仆人、每一幅挂画都记了下来。离开时，瓦伦在门口低声说：“……你比我想的镇定。”","fx":["count:evidence+1","cha_exp+3","exp+30"]},"fail":{"text":"宰相没有出现，管家把茶端了上来，你什么也没问到，倒是被客客气气地送了出来。","fx":["cha_exp+2","hometown+1"]},"cond":"flag:met_valen","reason":"还没有见过瓦伦"},{"label":"婉拒","text":"瓦伦轻轻舒了一口气：“好。”他转身走了，像是松了口气，又像是失望。","fx":["wil_exp+2","rel:valen+1"],"cond":"flag:met_valen"}],"when":{"age":21,"season":"spring"},"scene":"tower","portrait":"valen"},{"id":"n_21au","kind":"special","priority":40,"title":"墨提斯缺席的一个月","text":"墨提斯连续一个月没有出现在塔里。助教们说他出了远门，神色躲闪。\n你在他的办公室门口站了一会儿，门缝里压着一张纸条：“若有急事，找艾琳。”","options":[{"label":"去找艾琳","text":"艾琳盯着你看了很久：“……他去了王家档案馆，被扣了三天。”","fx":["rel:elin+1","exp+20","wil_exp+1"],"cond":"flag:met_elin","reason":"还不认识艾琳"},{"label":"在门口留下一封信","text":"你把自己这些年的疑问都写了进去，没有署名。","fx":["int_exp+3","rel:metis+1"],"cond":"flag:met_metis","reason":"还没有见过墨提斯"}],"when":{"age":21,"season":"autumn"},"scene":"tower","portrait":"metis"},{"id":"n_22wi","kind":"special","priority":40,"title":"阿尔弗病倒了","text":"阿尔弗在厨房里晕倒了。你把他背到床上，才发现他的手腕细得像一根枯枝。\n大夫摇头：“年纪大了，又长期劳累，需要静养。”","options":[{"label":"请最好的医生，让他好好休息（80 金币）","text":"你把他的活都揽了下来，一个月后，他的脸色才终于好看了一些。","fx":["gold-80","rel:alfred+3","hometown+1"],"cond":"gold>=80","reason":"金币不足"},{"label":"亲自照顾他（2 体力）","text":"你熬了几个夜，学会了煮粥和熬药。","fx":["rel:alfred+3","wil_exp+3"],"cost":2},{"label":"让他自己撑着","text":"他睡了三天，起来之后，什么也没提。","fx":["rel:alfred-1"]}],"when":{"age":22,"season":"winter"},"scene":"manor_winter","portrait":"alfred"},{"id":"n_23sp","kind":"special","priority":40,"title":"艾琳的店被砸了","text":"清晨，艾琳气喘吁吁地冲到旧宅门口：“书店被人砸了，什么都没偷，只把关于十二年前的几本旧志全撕了。”","options":[{"label":"立刻赶去帮忙（1 体力）","text":"满地碎纸。你们蹲在地上，一页一页地拼，拼到天黑。","fx":["rel:elin+2","wil_exp+2","count:evidence+0"],"cost":1,"cond":"flag:met_elin","reason":"还不认识艾琳"},{"label":"安慰她，但不去","text":"艾琳点点头，什么也没说，转身走了。","fx":["rel:elin-1"],"cond":"flag:met_elin","reason":"还不认识艾琳"}],"when":{"age":23,"season":"spring"},"scene":"street","portrait":"elin"},{"id":"n_25au","kind":"special","priority":40,"title":"耳目","text":"这几个月，你总觉得有人在盯着你。昨晚，你确认了：街角有个戴灰帽的男人，已经连续三天出现在同一个位置。","options":[{"label":"绕道，甩掉他","check":{"attr":"agi","diff":12},"ok":{"text":"你穿过两条小巷，在拐角处躲进一家面包店。那人走过去的时候，皱着眉头，一脸疑惑。","fx":["agi_exp+3","wil_exp+1"]},"fail":{"text":"你被他一路跟到了旧宅门口。他摘了摘帽子，微微一笑，转身离开。","fx":["hometown-2","wil_exp+2"]}},{"label":"直接走过去，当面问他","text":"那人愣了一下，丢下一句“我只是路过”，快步消失在人群里。","fx":["cha_exp+3","wil_exp+2"]}],"when":{"age":25,"season":"autumn"},"scene":"street","portrait":"lockwood"},{"id":"n_26au","kind":"special","priority":90,"title":"宰相的交易","text":"秋天，洛克伍德亲自来到旧宅。他没有带随从，只带了一只黑檀木匣。\n“请原谅我的唐突。”他在客厅里坐下，“我是来做一笔交易的。”\n匣子里，是一纸文书：撤诉，恢复爵位名义，清偿全部债务。条件只有一个：复议日那天，别出现。","options":[{"label":"接受他的条件","text":"你的手在文书上悬了很久，最后落了下去。\n他起身，把文书收好：“令尊如果知道，也许会理解。”","fx":["flag+:bought_off","count:debt-9999","hometown+10","wil_exp-0"],"cond":"true","avoid":true},{"label":"拒绝，请他离开","text":"洛克伍德站起身，没有愤怒，也没有意外：“我就知道。”\n他在门口停了停：“那就复议日见。”","fx":["flag+:refused_offer","wil_exp+5","hometown+2","exp+40"]},{"label":"假装考虑，套他的话","check":{"attr":"cha","diff":14,"memDiff":{"id":"m_n_lockwood","diff":-3}},"ok":{"text":"你一边犹豫，一边引他多说了几句。他离开时，你把刚才的每一个字，都在心里默了一遍。其中有一句话，足以让你在复议日上多一份底气。","fx":["flag+:refused_offer","count:evidence+1","cha_exp+4","exp+30"]},"fail":{"text":"他看出了你的试探，微微一笑：“聪明。但还不够。”他合上木匣，转身离开。","fx":["flag+:refused_offer","cha_exp+2","wil_exp+2"]}}],"when":{"age":26,"season":"autumn"},"scene":"manor_autumn","portrait":"lockwood"},{"id":"n_26wi","kind":"special","priority":40,"title":"最后一个冬天","text":"旧宅的炉火在冬夜里噼啪作响。窗外的雪下得很慢，一片一片，像是在数着日子。\n距离复议日，只剩不到两年。","options":[{"label":"和母亲坐在炉边，读她最喜欢的诗","text":"母亲 bel":"调查成功 2 次","cond":"count.archive>=2"}]},{"desc":"接受艾琳的帮助","done":"flag:ally_elin"}],"snag":{"p":0.25,"text":"艾琳的家人把她接回了乡下，书店的门，再没有开过。"}},{"id":"valen_rivalry","type":"side","name":"宿敌瓦伦","start":"flag:met_valen&&rank>=2","deadlineAge":27,"score":25,"stages":[{"desc":"和瓦伦在塔里交锋几次，然后向他下战书（行动：向瓦伦下战书，输了可以再来）","done":"flag:valen_duel_won","checks":[{"label":"与瓦伦的交锋 ≥ 2 次（或 24 岁后）","cond":["count.valen_clash>=2","age>=24"],"cur":"count.valen_clash"}],"fx":["goto:n_valen_truth"]},{"desc":"弄清瓦伦的真实想法","done":"flag:ally_valen"}],"intro":{"portrait":"valen","title":"金鹰徽章","text":"你已经是塔里的初级魔法师了。每次在回廊遇见瓦伦，他都会停一停，用那种打量猎物的眼神看你一眼，再把目光移开。\n他是宰相的独子。你们谁也没有先开口，但谁都知道，迟早，要有一次了断。"},"snag":{"p":0.25,"text":"瓦伦被他父亲送去了外地游学，你们的账，只能暂时算不成了。"}},{"id":"debt_free","type":"side","name":"清偿债务","start":"age>=17","deadlineAge":27,"score":25,"doneStory":{"portrait":"alfred","scene":"manor_spring","title":"账本上的最后一笔","text":"阿尔弗把最后一张借据在炉火上点燃，纸边一点一点卷曲，变黑，化成灰。\n“少爷，”他说，“从今天起，我们不欠任何人了。”\n你看着那团火，忽然觉得，这个冬天好像没有以前那么冷。"},"reward":["hometown+8"],"stages":[{"desc":"还清所有债务（行动：偿还债务）","done":"count.debt\u003c=0","checks":[{"label":"债务清零","cond":"count.debt\u003c=0"}]}],"snag":{"p":0.2,"text":"债主换了新的管事，所有的旧账，被重新算了一遍，数目对不上了。"}},{"id":"vera_friend","type":"side","name":"母亲的旧友","start":"flag:vera_alive&&rel.vera>=5&&age>=18","deadlineAge":25,"score":20,"intro":{"portrait":"vera","title":"旧友","text":"母亲在窗边，把一张泛黄的请柬递给你：“奥黛特是我年轻时最好的朋友。你该去她的宴会上露个面。别提钱，别提债，只是去露个面。”"},"reward":["log:奥黛特夫人的名字，在母亲的嘴里，又被提起了很多次。"],"stages":[{"desc":"替母亲去赴两场贵族宴会，让奥黛特夫人认出你（行动：出席贵族宴会，共 2 次）","done":"count.odette>=2","fx":["goto:n_odette"],"checks":[{"label":"出席宴会 ≥ 2 次（任务开启后）","cond":"count.odette>=2","cur":"count.odette"}]},{"desc":"接受（或谢绝）奥黛特夫人的帮助","done":"flag:odette_helped"}],"snag":{"p":0.3,"text":"奥黛特夫人随丈夫外放，去了很远的地方，没来得及告别。"}},{"id":"tower_theft","type":"side","name":"塔中失窃案","start":"rank>=2&&flag:tower_admitted&&age>=20","deadlineAge":26,"score":25,"intro":{"portrait":"metis","title":"失踪的书","text":"墨提斯把你叫住：“藏书室丢了一卷《魔晶共鸣论》。所有人都在互相怀疑。我不能亲自查，
