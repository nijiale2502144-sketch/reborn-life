"帮着村里人把牲口迁到南坡（2 体力）","cost":2,"fx":["hometown+3","str_exp+2"],"text":"一场看不见的灾难正在逼近，你们都在悄悄准备。"},{"label":"整理自己的装备","fx":["exp+20","wil_exp+2"],"text":"你把武器磨了三遍。"}]},{"id":"ev_omen_2","kind":"special","when":{"age":28,"season":"autumn"},"priority":70,"title":"第二个征兆","scene":"village_autumn","text":"月亮变成了暗红色，连续三个晚上都没有星。教会的钟楼夜夜敲响，神父让大家都躲进屋里。","options":[{"label":"通宵祈祷（1 体力）","cost":1,"fx":["wil_exp+4","rep:church+3","hometown+1"],"text":"天亮时，每个人的眼睛里都带着血丝。"},{"label":"挨家挨户检查门窗","fx":["hometown+3","cha_exp+2"],"text":"你敲开了每一扇门，给每一家都送去了一盏灯。"}]},{"id":"ev_omen_3","kind":"special","when":{"age":29,"season":"summer"},"priority":70,"title":"第三个征兆","scene":"mountain","text":"夏天，整整一个月没有下雨，北边的山脊上常常传来闷雷般的声音，可天上一朵云也没有。有人说，那是魔王在翻身。","options":[{"label":"趁着最后的时间，闭关修炼（2 体力）","cost":2,"fx":["str_exp+4","wil_exp+4","exp+40"],"text":"你知道，剩下的日子已经不多了。"},{"label":"去探望家人，多陪陪他们","fx":["hometown+3","rel:mina+2","wil_exp+2"],"text":"母亲给你做了最爱吃的面。你吃了两碗。"}]},{"id":"ev_efna_herb_clue","kind":"special","priority":60,"cond":"quest.efna_wish==active&&qstage.efna_wish==1","portrait":"efna","title":"夹在书里的一页","scene":"village_autumn","text":"艾芙娜把一张折起来的纸塞给你：“这是我妈留下的药书，我只找到这一页。上面说月华草喜阴，只在夏秋的月夜里开花，要找背阴的崖缝。”","options":[{"label":"把这一页小心收好","fx":["int_exp+3","rel:efna+1"],"text":"纸页边缘有淡淡的药香。"}]},{"id":"ev_efna_farewell","kind":"special","priority":60,"cond":"flag:efna_lost&&!flag:efna_resolved","title":"艾芙娜的窗","scene":"village_winter","text":"冬天，艾芙娜家的窗一直没有亮灯。邻居说，她在昨夜走了，走得很安静。窗台上，那束干花还在。","options":[{"label":"在她的窗前站了很久","fx":["wil_exp+4","rel:efna-10"],"text":"你站到雪落满了肩膀。从那以后，你再也没有轻易说过“下次”。"},{"label":"替她把窗关好","fx":["wil_exp+3","rep:church+1"],"text":"屋里还留着她煮的草药的味道。"}]},{"id":"ev_efna_star_end","kind":"special","priority":60,"cond":"flag:efna_lost&&flag:efna_resolved","portrait":"efna","title":"最亮的一夜","scene":"village_winter","text":"几个月后，神殿的信使带来一封信，只有短短一行：“她走得很安详，嘴角带着笑。她说，那是她一生里最亮的一晚。”","options":[{"label":"把信贴身收好","fx":["wil_exp+4","exp+30"],"text":"你抬起头，天上的星星一颗一颗亮了起来。"}]},{"id":"ev_efna_letter","kind":"special","priority":40,"cond":"flag:efna_priest&&age>=26","portrait":"efna","title":"神殿来信","scene":"village_autumn","text":"艾芙娜托圣城来的信使给你带了一只小布袋，里面是一枚磨得发亮的圣徽，附着一张纸条：“在神殿的日子很忙，但每天晚上我都会想起麦田。愿圣光保佑你。”","options":[{"label":"把圣徽挂在胸前","fx":["status+:blessed:4","rel:efna+1","wil_exp+3"],"text":"圣徽贴着胸口，很暖。"}]},{"id":"ev_efna_visit","kind":"special","priority":40,"cond":"flag:efna_cured&&age>=26","portrait":"efna","title":"她回来了","scene":"village_spring","text":"有一天，村口有个熟悉的身影走来，脸色红润，脚步轻快。“我回来看看。”艾芙娜笑着说，“顺便给你带了圣城的点心。”","options":[{"label":"陪她在村里走一圈（1 体力）","cost":1,"fx":["rel:efna+2","hometown+3","wil_exp+2"],"text":"她摸了摸每一棵老树，像是在认亲。"},{"label":"请她给教堂的孩子们讲讲圣城","fx":["hometown+2","rep:church+3","cha_exp+2"],"text":"孩子们听得入了神，再也不吵着要走了。"}]},{"id":"ev_glen_shield","kind":"special","priority":50,"cond":"flag:glen_cleared","portrait":"glen","title":"格伦的盾","scene":"village_autumn","text":"格伦换上了一身干净的旧军装，手里拎着一面磨得发亮的圆盾。“当年的兄弟们都不在了，”他说，“这面盾，该有个新主人。”","options":[{"label":"双手接过","fx":["item:old_shield","rel:glen+2","wil_exp+3"],"text":"盾面上刻着一圈小字，是十二个名字。"}]},{"id":"ev_glen_empty","kind":"special","priority":40,"cond":"flag:glen_left","title":"空窝棚","scene":"village_winter","text":"榆树下的窝棚空了，地上留着一圈烧尽的篝火灰，和一只擦得很干净的旧水壶。","options":[{"label":"把水壶带走","fx":["wil_exp+2"],"text":"水壶里还剩半壶凉透的酒。你没有喝，也没有倒。"}]},{"id":"ev_after_raid_party","kind":"special","priority":45,"cond":"flag:village_saved","title":"篝火晚会","scene":"village_winter","text":"兽人退去后的第三天，村里人在广场上点起篝火，把珍藏的腊肉和麦酒都拿了出来。有人高喊你的名字，有人把孩子举过头顶让你看。","options":[{"label":"举杯，向牺牲的人致意","fx":["hometown+4","rep:church+2","wil_exp+2"],"text":"村长眼眶红了，一口干了杯。"},{"label":"悄悄退到人群后面","fx":["wil_exp+3"],"text":"你不习惯被注视，但今晚没人觉得这有什么不对。"}]},{"id":"ev_village_rebuild","kind":"special","priority":45,"cond":"flag:village_hurt","title":"重建家园","scene":"village_winter","text":"兽人走后，村里一半的房子烧成了黑炭，田里的雪都带着焦味。父亲站在废墟里，一言不发。","options":[{"label":"留下来帮忙重建（2 体力）","cost":2,"fx":["hometown+6","str_exp+4","wil_exp+2"],"text":"半个月后，十几户人家重新有了屋顶。"},{"label":"拿出积蓄接济灾民（40 金币）","cond":"gold>=40","reason":"金币不足","fx":["gold-40","hometown+8","rep:church+3"],"text":"有人哭着给你磕头，你赶紧把他扶了起来。"},{"label":"相信他们能撑过去","fx":["wil_exp+1"],"text":"你转身离开，把行李背得很紧。"}]},{"id":"ev_famine","kind":"special","priority":45,"cond":"hometown\u003c=25&&age>=19","title":"饥荒的冬天","scene":"village_winter","text":"仓房空了。邻居一户一户地搬走，村口的石板路上，每天都有拖着行李的背影。","options":[{"label":"拿出所有积蓄买粮（60 金币）","cond":"gold>=60","reason":"金币不足","fx":["gold-60","hometown+10","rep:church+2"],"text":"你背着粮袋走过每一户的门，没有人说话，只有眼泪。"},{"label":"组织剩下的人去山里狩猎（2 体力）","cost":2,"fx":["hometown+5","agi_exp+3","str_exp+2"],"text":"一个冬天，你们靠着山里的野味撑了过来。"},{"label":"沉默","fx":["hometown-4"],"text":"村口又空了两户人家。"}]},{"id":"ev_great_festival","kind":"special","priority":35,"cond":"hometown>=75&&season==autumn","title":"丰年盛典","scene":"village_autumn","text":"今年的收成好得出奇，全村人在打谷场上摆了三十张长桌。教会的神父、过路的商人、邻村的亲戚都来了，笑声传出去老远。","options":[{"label":"站上木台，说几句话","check":{"attr":"cha","diff":10},"ok":{"text":"你说的话很朴素，却让所有人都安静了下来。掌声持续了很久。","fx":["cha_exp+5","hometown+3","rep:church+3"]},"fail":{"text":"你紧张得说不出话，台下善意地笑了。","fx":["cha_exp+2","hometown+2"]}},{"label":"和乡亲们一起吃喝","fx":["hometown+3","heal:0.3","rel:mina+1"],"text":"桌上的酒一杯接着一杯，没人记得是谁先喝醉的。"}]},{"id":"ev_guild_promotion","kind":"special","priority":35,"cond":"rep.guild>=30","title":"公会的认可","scene":"village_spring","text":"公会会长把你叫去，递来一枚银色的徽章：“你完成的委托，我们都记着。从今天起，你是银牌冒险者。”","options":[{"label":"接过徽章","fx":["gold+40","rep:guild+5","cha_exp+2","exp+30"],"text":"徽章不重，但你把它擦了又擦。"}]},{"id":"ev_guild_rivals","kind":"random","pool":"social","weight":8,"once":true,"cond":"flag:guild&&level>=10","title":"对手小队","scene":"village_spring","text":"一支同样在刷矿坑的冒险小队在公会堵住了你：“听说你最近风头很盛，要不要组队？我们缺一个能扛的。”","options":[{"label":"同意，临时组队（2 体力）","cost":2,"fx":["rep:guild+4","gold+40","exp+30"],"text":"配合默契得出乎意料，战利品也分得公平。"},{"label":"拒绝，独来独往","fx":["wil_exp+2","rep:guild+1"],"text":"对方笑了笑：“有骨气。”"}]},{"id":"ev_church_shadow_1","kind":"random","pool":"world","weight":16,"once":true,"cond":"rep.church>=30&&age>=22","portrait":"priest","title":"神父欲言又止","scene":"village_spring","text":"神父安布罗斯在擦拭圣像时，忽然问你：“如果有一天，教会做了一件不那么光彩的事，你会怎么想？”","options":[{"label":"“我会先问清楚。”","fx":["wil_exp+3","rel:ambrose+1","flag+:church_shadow_1"],"text":"神父点了点头，没有再说下去。"},{"label":"“教会不会做这种事。”","fx":["rep:church+2","flag+:church_shadow_1"],"text":"神父苦笑了一下：“……希望如此。”"}]},{"id":"ev_church_shadow_2","kind":"random","pool":"world","weight":20,"cond":"rep.church>=45&&age>=25&&flag:church_shadow_1&&!flag:church_clue_2&&!flag:shadow_ignored","portrait":"priest","title":"被封存的档案","scene":"village_autumn","text":"你在教会的档案室里整理文件，发现一本被封了蜡的旧册，封面上写着：“北境圣骑士团·百年前封印记录”。","options":[{"label":"拆开封蜡","check":{"attr":"int","diff":12},"ok":{"text":"册子里记载：百年前的圣骑士团并未杀死魔王，而是把它封印在了北境的某处。负责封印的圣剑，早已失落。","fx":["int_exp+6","exp+40","flag+:church_clue_2"]},"fail":{"text":"你刚想打开，值班的执事走了过来，你赶紧放回原处。","fx":["rep:church-1"]}},{"label":"放回原处，装作没看见","fx":["wil_exp+2","rep:church+1","flag+:shadow_ignored"],"text":"不属于你的秘密，最好留给时间。"}],"cooldown":4},{"id":"ev_mina_apprentice","kind":"special","when":{"age":20,"season":"spring"},"priority":55,"title":"妹妹的心事","scene":"village_spring","text":"妹妹米娜把你叫到屋后，红着脸说：“哥，镇上的裁缝铺要收学徒，我想去。可是，爹娘……”","options":[{"label":"替她说服爹娘（1 体力）","cost":1,"check":{"attr":"cha","diff":10},"ok":{"text":"你把话讲得有理有据，爹娘终于松了口。米娜抱着你，蹦了三下。","fx":["rel:mina+3","cha_exp+3","hometown-1","flag+:mina_tailor"]},"fail":{"text":"爹娘没松口，米娜红着眼眶回屋了。你们都很沮丧。","fx":["rel:mina-1","cha_exp+2"]}},{"label":"“你自己去和爹娘说。”","fx":["wil_exp+1"],"text":"她咬咬牙，点了点头。"}]},{"id":"ev_mina_letter","kind":"random","pool":"social","weight":10,"once":true,"cond":"flag:mina_tailor&&age>=24","title":"妹妹的信","scene":"village_autumn","text":"镇上的邮差给你带来一封信，是米娜寄的：“哥，我出师了！铺子老板说我手艺好，要给我涨钱。我给你缝了一件披风，下次回家记得穿。”信封里掉出一小块碎布。","options":[{"label":"把碎布夹进随身的小本子里","fx":["rel:mina+2","hometown+2","wil_exp+2"],"text":"你笑着，眼睛却有一点酸。"}]},{"id":"ev_ambrose_gift","kind":"special","priority":35,"cond":"rel.ambrose>=3","portrait":"priest","title":"神父的赠礼","scene":"village_spring","text":"神父把你叫到祭坛后，从一只旧木匣里取出一枚磨损的护符：“年轻时我佩戴过它，后来再也没有用得上的地方。现在，它该给你。”","options":[{"label":"郑重收下","fx":["item:holy_amulet","rep:church+3","rel:ambrose+1","wil_exp+3"],"text":"护符背面刻着一行小字：“愿你的光，足够照亮自己。”"}]},{"id":"ev_rex_friend","kind":"special","priority":35,"cond":"rel.rex>=3&&age>=21","title":"雷克斯的变化","scene":"village_spring","text":"曾经爱找茬的雷克斯，如今成了你最信得过的帮手。他拍拍你的肩：“村口那块地我帮你守着，你尽管去闯。”","options":[{"label":"“有你在，我放心。”","fx":["hometown+4","rel:rex+2","flag+:rex_ally"],"text":"他挺起胸，像是接到了什么了不得的任务。"},{"label":"拉他一起去地下城（2 体力）","cost":2,"fx":["rel:rex+2","exp+30","gold+30","str_exp+2"],"text":"他嘴上说着不怕，腿却抖了一路。但那天，他挡在了你前面。"}]},{"id":"ev_lorn_trust","kind":"special","priority":35,"cond":"rel.lorn>=4","title":"洛恩的谢礼","scene":"village_autumn","text":"洛恩特意绕了半个大陆来见你，推着车上的一只长木盒：“这是给你的谢礼。别问多少钱，问就是友情价。”","options":[{"label":"打开木盒","fx":["item:hunter_bow","rel:lorn+1","agi_exp+3"],"text":"里面是一把保养得极好的猎弓。弓梢刻着一枚小小的车轮。"}]},{"id":"ev_market","kind":"chain","title":"镇上的集市","scene":"village_autumn","text":"集市里人声鼎沸。铁匠铺的炉火烧得通红，药剂摊飘出苦涩的香气，旧书摊前围着几个学徒模样的年轻人。你摸了摸腰间的钱袋。","options":[{"label":"买一把铁剑（80 金币）","cond":"gold>=80&&!flag:has_iron_sword","reason":"金币不足或已拥有","fx":["gold-80","item:iron_sword","flag+:has_iron_sword"],"text":"铁匠把剑往你手里一塞：“试试分量。”剑身有点歪，却很趁手。"},{"label":"买一面圆盾（100 金币）","cond":"gold>=100&&!flag:has_round_shield","reason":"金币不足或已拥有","fx":["gold-100","item:round_shield","flag+:has_round_shield"],"text":"盾面很朴素，边缘磕过几次，但够结实。"},{"label":"买一件皮甲（120 金币）","cond":"gold>=120&&!flag:has_leather_buy","reason":"金币不足或已拥有","fx":["gold-120","item:leather_armor","flag+:has_leather_buy"],"text":"皮甲穿在身上有点紧，活动几下就合身了。"},{"label":"买一瓶伤药（30 金币）","cond":"gold>=30","reason":"金币不足","fx":["gold-30","heal:0.6"],"text":"药汁苦得你直皱眉，伤口很快不疼了。"},{"label":"买一瓶魔力药剂（40 金币）","cond":"gold>=40","reason":"金币不足","fx":["gold-40","mpheal:0.8"],"text":"药剂带着薄荷的清凉，胸口的空虚被慢慢填满。"},{"label":"买一本学者的笔记（40 金币）","cond":"gold>=40","reason":"金币不足","fx":["gold-40","int_exp+8"],"text":"旧书摊的老板推荐你这本：“前人踩过的坑，都写在里头了。”"},{"label":"请剑术师傅指点一番（60 金币）","cond":"gold>=60","reason":"金币不足","fx":["gold-60","str_exp+5","agi_exp+5","exp+10"],"text":"师傅看了你三招，就开始骂。骂完，又指出了三个你一直没发觉的毛病。"},{"label":"向教堂捐一些钱（20 金币）","cond":"gold>=20","reason":"金币不足","fx":["gold-20","rep:church+3","hometown+1"],"text":"神父收下钱，在捐赠簿上记下你的名字，对你点点头。"},{"label":"走进内间看看贵重货（只对有魅力的人开放）","fx":["goto:ev_market_vip"],"text":"老掌柜打量了你一眼，掀开了内间的帘子。"},{"label":"什么也不买，转一圈就走","fx":["cha_exp+1"],"text":"光看看也不要钱。你顺便听了一耳朵各地的新闻。"}]},{"id":"ev_tavern","kind":"chain","title":"酒馆","scene":"village_autumn","text":"酒馆里弥漫着麦酒和烤肉的香气，角落里几个冒险者正压低声音争论着什么。老板擦着杯子，朝你抬了抬下巴：“坐。”","options":[{"label":"喝一杯热酒，吃顿好的（8 金币）","cond":"gold>=8","reason":"金币不足","fx":["gold-8","heal:0.4","mpheal:0.4","status-:fatigue"],"text":"热汤下肚，一整天的疲惫都被烫散了。"},{"label":"请人喝一杯，打听消息（5 金币）","cond":"gold>=5","reason":"金币不足","fx":["gold-5","cha_exp+2",{"if":"count.rumor==0","then":["log:听说老兵格伦年轻时被人冤枉过，一直憋着一口气没说出口。","flag+:rumor_glen","rel:glen+1"],"else":[{"if":"count.rumor==1","then":["log:听说月华草只在夏、秋两季的月夜里开，长在背阴的崖缝里。","flag+:herb_hint"],"else":[{"if":"count.rumor==2","then":["log:听说教会最近缺人手，愿意帮忙的年轻人，会被记在心里。","rep:church+3"],"else":[{"if":"count.rumor==3","then":["log:听说行商洛恩最近到处找靠得住的护卫，开的价不低。","gold+20","flag+:rumor_lorn"],"else":["exp+8"]}]}]}]},"count:rumor+1"],"text":"几杯酒下肚，邻座的人开始絮絮叨叨。"},{"label":"赌一把骰子（20 金币）","cond":"gold>=20","reason":"金币不足","check":{"attr":"luk","diff":10},"ok":{"text":"骰子在碗里转了三圈，停在了最大的点数上。你赢得盆满钵满。","fx":["gold+34"]},"fail":{"text":"你一把输了个精光，庄家笑着收走了你的钱。","fx":["gold-20","wil_exp+1"]}},{"label":"坐一会儿就走","fx":["wil_exp+1"],"text":"你听了会儿角落里的争吵，没插话。"}]},{"id":"ev_lorn_offer","kind":"chain","title":"洛恩的邀请","scene":"village_autumn","text":"商队第二次平安回到村里。洛恩把你拉到一边，神神秘秘地从怀里掏出一份契书：“我想把北线的生意做大，还差一个信得过的合伙人。你出 60 金币，每年按份分红，怎么样？”","options":[{"label":"入股（60 金币）","cond":"gold>=60","reason":"金币不足","fx":["gold-60","flag+:lorn_partner","rel:lorn+2","cha_exp+2"],"text":"你在契书上按下手印。洛恩笑得合不拢嘴：“放心，亏不了你。”"},{"label":"婉拒，只做朋友","fx":["flag+:lorn_decline","rel:lorn+1"],"text":"洛恩没勉强，把契书收了回去：“有需要，随时找我。”"}]},{"id":"ev_orphan_future","kind":"chain","title":"孩子的去处","scene":"village_spring","text":"孩子已经能和邻居家的小孩一起玩耍了。夜里，他忽然拉住你的衣角，小声问：“我……可以一直留在这里吗？”","options":[{"label":"“当然可以，你以后就是这个家里的人。”","fx":["flag+:orphan_home","hometown+4","rel:mina+1","wil_exp+2"],"text":"他把脸埋在你的袖子里，半天没抬起头。母亲在门口，悄悄擦了擦眼睛。"},{"label":"托付给神父，让他在教堂学一门手艺","fx":["flag+:orphan_home","rep:church+4","rel:ambrose+1"],"text":"神父把孩子领到身边，轻轻摸了摸他的头：“好孩子，你不会再饿着了。”"},{"label":"托洛恩带到南方，找一户好人家","fx":["flag+:orphan_home","rel:lorn+1","cha_exp+1"],"text":"洛恩拍着胸脯保证。孩子回头朝你挥了很久的手，才被车厢的帆布挡住。"}]},{"id":"ev_ruins_vault","kind":"chain","title":"石室里的发现","scene":"mountain","text":"石台升起，上面放着一只落满灰尘的铜匣。匣子里是一卷用兽皮写成的卷轴，字迹已经淡去大半。你勉强认出几行：“……封印……圣剑……北境……”\n角落里还堆着一小袋早已无人认领的金币。","options":[{"label":"带去教堂，交给神父研究","fx":["flag+:ruins_told","rep:church+6","rel:ambrose+2","int_exp+4","flag+:church_clue_1"],"text":"神父读了很久，把卷轴小心翼翼地收进了教堂的密室。“你做了一件重要的事。”"},{"label":"留给自己，慢慢研究","fx":["flag+:ruins_told","flag+:magic_tome","int_exp+8","count:arcana+2"],"text":"夜里，你就着一盏油灯，一点一点地把残卷抄在自己的本子上。"},{"label":"只拿走金币，把卷轴放回原处","fx":["flag+:ruins_told","gold+80","rep:church-1"],"text":"你把铜匣盖好，把石台推回原位。有些东西，不是你的。"}]},{"id":"ev_main_failed","kind":"special","priority":95,"cond":"flag:main_failed","title":"断掉的路","scene":"village_autumn","text":"你把那封一直没送出的推荐信，在手里折了又折。\n通往圣骑士的路，到这里断了。教会的名册上，不会再有你的名字。\n但你知道，魔王不会因为你的失败而晚来一天。\n镇上公会的告示栏上，有一行褪色的大字：“不问出身，只看战绩。”","options":[{"label":"去公会看看，还有没有别的路","fx":["rep:guild+3","exp+20","wil_exp+2"],"text":"公会长看着你，只问了一句：“你想打赢，还是想被人记住？”\n你说：“我想打赢。”\n他把一张登记表推到了你面前。"},{"label":"不甘心，埋头苦练","fx":["str_exp+4","wil_exp+4"],"text":"你把所有的火气，都撒在了训练场的木桩上。"},{"label":"回到田里去","fx":["hometown+4","wil_exp+1"],"text":"麦子不问你为什么回来，它们只管长。"}]},{"id":"ev_16_summer","kind":"special","when":{"age":16,"season":"summer"},"priority":40,"title":"第一次独自割麦","text":"夏天的麦浪在风里一层一层地翻。父亲这一年腰疼，把最东边那块地交给了你。\n太阳毒得发白，镰刀把手被汗水浸得滑腻。你割了一整个上午，直起腰时，发现身后留下了长长的一条空地。","options":[{"label":"一鼓作气，割完整块地","fx":["str_exp+4","hometown+2","hp-3"],"text":"傍晚，你把最后一捆麦子扛上车，父亲站在田埂上，什么也没说，只把一壶水递给了你。"},{"label":"歇口气，叫上艾芙娜一起","fx":["rel:efna+1","hometown+1","cha_exp+1"],"text":"艾芙娜顶着草帽，提着一篮凉饼跑过来。你们坐在麦垛的阴影里，谁也没提累。"}],"scene":"village_spring"},{"id":"ev_16_autumn","kind":"special","when":{"age":16,"season":"autumn"},"priority":40,"title":"打谷场的夜","text":"秋收结束的夜里，全村人聚在打谷场上，堆起了一座小山似的篝火。有人拉起了手风琴，有人在跳舞。\n艾芙娜坐在火堆边，望着跳动的火苗发呆，你走过去，她抬头笑了笑。","options":[{"label":"在她身边坐下","fx":["rel:efna+1","hometown+1"],"text":"她小声说：“明年的这个时候，你大概已经不在村里了吧？”你没有回答。"},{"label":"加入舞圈，笑闹一阵","fx":["cha_exp+3","hometown+2"],"text":"你被拉进了舞圈，脚下的泥巴溅了一身。你笑着，一晚上都没停。"}],"portrait":"efna","scene":"village_autumn"},{"id":"ev_16_winter","kind":"special","when":{"age":16,"season":"winter"},"priority":40,"title":"第一场雪","text":"第一场雪是半夜里落下来的。早上你推开门，院子里一片白，只有鸡窝门口留着几行小爪印。\n母亲在灶前熬着热粥，妹妹米娜光着脚丫跑出来，兴奋地大叫。","options":[{"label":"陪米娜堆雪人","fx":["rel:mina+2","hometown+1"],"text":"你们堆了一个歪歪扭扭的雪人，米娜非要给它戴上你的旧帽子。"},{"label":"先把院子里的雪扫开，给父亲清出路","fx":["str_exp+2","hometown+2","wil_exp+1"],"text":"父亲踩着你扫开的小路出了门，背影很稳。"}],"scene":"village_winter"},{"id":"ev_17_spring","kind":"special","when":{"age":17,"season":"spring"},"priority":40,"title":"春季庙会","text":"镇上一年一度的庙会开张了，彩旗从街头挂到街尾，卖糖人的、耍杂技的、算命的挤在一起。\n父亲给了你几个铜板：“去逛逛吧，别总惦记着地里的活。”","options":[{"label":"去逛逛，长长见识（1 体力）","cost":1,"fx":["cha_exp+3","gold+8","int_exp+1"],"text":"你在算命摊前站了很久。算命的老头看了你一眼：“小子，你的路，在北边。”"},{"label":"帮父亲在庙会上卖粮食","fx":["gold+18","hometown+1","cha_exp+1"],"text":"价钱谈得不错，父亲回家路上哼起了小调。"}],"scene":"village_spring"},{"id":"ev_17_autumn","kind":"special","when":{"age":17,"season":"autumn"},"priority":40,"title":"圣剧排演","text":"教堂在为冬至圣剧排练。神父缺一个演“勇者”的人，他看了一圈，目光落在你身上。\n“这个角色不难，只要站得直，声音稳就行。”他说。","options":[{"label":"答应扮演勇者","fx":["cha_exp+3","rep:church+3","wil_exp+1"],"text":"台词只有三句，你背了一个星期。演出那天，你的腿一直在抖，但没有忘词。"},{"label":"帮着搬道具、挂布景","fx":["str_exp+2","rep:church+2","hometown+1"],"text":"神父说，台下的人看不见搬布景的人，可没有他们，戏就演不成。"}],"portrait":"priest","scene":"village_autumn"},{"id":"ev_17_winter","kind":"special","when":{"age":17,"season":"winter"},"priority":40,"title":"暴风雪","text":"一场暴风雪连下了三天，村东头格伦的窝棚被积雪压塌了半边。你听见邻居们说起这事的时候，雪还没停。","options":[{"label":"顶着风雪过去帮忙（1 体力）","cost":1,"fx":["rel:glen+2","str_exp+2","wil_exp+2"],"text":"你们把塌掉的木梁一根一根抬开，格伦一边骂天气，一边把他最后半壶酒塞给了你。"},{"label":"让父亲送去一些干柴","fx":["rel:glen+1","hometown+1"],"text":"格伦托人带话：“替我谢谢你家人。”"}],"cond":"flag:met_glen","portrait":"glen","scene":"village_winter"},{"id":"ev_18_spring","kind":"special","when":{"age":18,"season":"spring"},"priority":40,"title":"十八岁的岔路口","text":"十八岁的春天，神父把你叫到教堂后院：“你已经成年了，该想想往后的路。”\n他给你讲了几件事：\n镇上的冒险者公会从十八岁起收新人；教会的巡游使者每隔几年会路过北境，他们看重体格和意志，等级和属性要有些底子；而不管走哪条路，北边的那个日子，都在等着你。","options":[{"label":"去镇上公会看看","fx":["rep:guild+1","exp+10","int_exp+1"],"text":"公会大厅里挂满了委托单。接待员打量你一眼：“有想法就来登记，别死在半路上。”"},{"label":"留在教堂，多听神父讲讲","fx":["rep:church+3","wil_exp+3","rel:ambrose+1"],"text":"神父说了很多，大部分你都没听懂，但有一句你记住了：“光，是被人一点一点点亮的。”"},{"label":"回家，继续守着这片地","fx":["hometown+3","wil_exp+1"],"text":"晚饭时，母亲多给你夹了一块肉，什么也没问。"}],"portrait":"priest","scene":"village_spring"},{"id":"ev_market_vip","kind":"chain","title":"集市内间","scene":"village_autumn","text":"内间很安静，墙上挂着一排用布盖着的货。老掌柜擦着一把剑，头也不抬：“这里的货，只卖给‘说得上话’的人。你有多体面，我就让你看多少。”\n（魅力 ≥ 10 / 14 / 18，可以买到越来越好的装备。同一栏位只取最强的一件，饰品取最强的两件。）","options":[{"label":"精钢长剑（武器，战力 +8，260 金币，魅力 ≥ 10）","cond":"gold>=260&&attr.cha>=10&&!flag:own_steel_sword","reason":"需要 260 金币和魅力 ≥ 10，或已经拥有","fx":["gold-260","item:steel_sword","flag+:own_steel_sword"],"text":"老匠人把剑从布里一层层剥出来：“试试，别砍坏了我的铁砧。”"},{"label":"锁子甲（护甲，战力 +8，300 金币，魅力 ≥ 10）","cond":"gold>=300&&attr.cha>=10&&!flag:own_chain_mail","reason":"需要 300 金币和魅力 ≥ 10，或已经拥有","fx":["gold-300","item:chain_mail","flag+:own_chain_mail"],"text":"锁甲披上身，像披着一件会响的衣服。"},{"label":"塔盾（盾牌，战力 +8，280 金币，魅力 ≥ 10）","cond":"gold>=280&&attr.cha>=10&&!flag:own_tower_shield","reason":"需要 280 金币和魅力 ≥ 10，或已经拥有","fx":["gold-280","item:tower_shield","flag+:own_tower_shield"],"text":"盾沿的铁边在灯下闪着冷光。"},{"label":"银戒指（饰品，战力 +5，200 金币，魅力 ≥ 10）","cond":"gold>=200&&attr.cha>=10&&!flag:own_silver_ring","reason":"需要 200 金币和魅力 ≥ 10，或已经拥有","fx":["gold-200","item:silver_ring","flag+:own_silver_ring"],"text":"戒指内圈刻着一句不太押韵的祝福，你挺喜欢。"},{"label":"银纹长剑（武器，战力 +12，600 金币，魅力 ≥ 14）","cond":"gold>=600&&attr.cha>=14&&!flag:own_silver_blade","reason":"需要 600 金币和魅力 ≥ 14，或已经拥有","fx":["gold-600","item:silver_blade","flag+:own_silver_blade"],"text":"剑身映着窗外的光，像一道静止的闪电。"},{"label":"板甲（护甲，战力 +12，650 金币，魅力 ≥ 14）","cond":"gold>=650&&attr.cha>=14&&!flag:own_plate_armor","reason":"需要 650 金币和魅力 ≥ 14，或已经拥有","fx":["gold-650","item:plate_armor","flag+:own_plate_armor"],"text":"工匠绕着你转了三圈，说：“嗯，合身。”"},{"label":"狮心吊坠（饰品，战力 +9，550 金币，魅力 ≥ 14）","cond":"gold>=550&&attr.cha>=14&&!flag:own_lion_pendant","reason":"需要 550 金币和魅力 ≥ 14，或已经拥有","fx":["gold-550","item:lion_pendant","flag+:own_lion_pendant"],"text":"吊坠贴在胸口，沉甸甸的，像一个承诺。"},{"label":"秘银细剑（武器，战力 +16，1200 金币，魅力 ≥ 18）","cond":"gold>=1200&&attr.cha>=18&&!flag:own_mithril_edge","reason":"需要 1200 金币和魅力 ≥ 18，或已经拥有","fx":["gold-1200","item:mithril_edge","flag+:own_mithril_edge"],"text":"掌柜亲自把剑递到你手里，什么也没说，只是点了点头。"},{"label":"秘银锁甲（护甲，战力 +16，1300 金币，魅力 ≥ 18）","cond":"gold>=1300&&attr.cha>=18&&!flag:own_mithril_mail","reason":"需要 1300 金币和魅力 ≥ 18，或已经拥有","fx":["gold-1300","item:mithril_mail","flag+:own_mithril_mail"],"text":"锁甲轻得让你怀疑是不是被骗了，直到匠人拿刀在上面划了一下。"},{"label":"神盾（盾牌，战力 +12，1100 金币，魅力 ≥ 18）","cond":"gold>=1100&&attr.cha>=18&&!flag:own_holy_aegis","reason":"需要 1100 金币和魅力 ≥ 18，或已经拥有","fx":["gold-1100","item:holy_aegis","flag+:own_holy_aegis"],"text":"盾心的圣徽微微发亮，像是认出了你。"},{"label":"龙鳞护符（饰品，战力 +12，1400 金币，魅力 ≥ 18）","cond":"gold>=1400&&attr.cha>=18&&!flag:own_dragon_charm","reason":"需要 1400 金币和魅力 ≥ 18，或已经拥有","fx":["gold-1400","item:dragon_charm","flag+:own_dragon_charm"],"text":"鳞片温温的，握在手心，像握着一颗很远很远的心跳。"},{"label":"回外间","text":"掌柜点点头：“下次再来，货会有新的。”","fx":[]}]},{"id":"ev_shadow_ambrose","kind":"chain","title":"神父的沉默","portrait":"priest","scene":"village_autumn","text":"傍晚的教堂里只剩下烛光。你把那本蜡封的册子上的字，一句一句复述给安布罗斯听。\n神父擦圣像的手一直没有停，直到你说到“圣剑”两个字。\n“你比我想的走得更远。”他终于开口，声音很轻。","options":[{"label":"“神父，我想知道全部。”","cond":["rel.ambrose>=3","memory:m_truth"],"reason":"神父还不够信任你（好感 ≥ 3）","fx":["flag+:shadow_ambrose","rel:ambrose+1","int_exp+4"],"text":"“百年前，圣骑士团没有杀死魔王。他们杀不了。他们用圣剑做了一把锁，把它锁在了北境。”\n安布罗斯从衣袖里取出一把磨得发亮的铜钥匙，放在你手心：“王都圣库第三层，有一本没有标题的册子。看完以后，再决定要不要恨我。”"},{"label":"“我在档案室看到了封印记录，请别瞒我。”","check":{"attr":"cha","diff":12},"ok":{"text":"你的声音很稳，没有逼问，只是在等。\n安布罗斯终于叹了口气：“教会管它叫‘必要的沉默’。圣剑不是用来杀魔王的，它是锁。”\n他把一把旧钥匙推到你面前：“王都圣库第三层。看完以后，再决定要不要恨我。”","fx":["flag+:shadow_ambrose","int_exp+4"]},"fail":{"text":"“你还不明白自己在问什么，孩子。”神父别过脸，不再说话。\n你在门口站了很久，直到烛火熄了一支。","fx":["rep:church-1","wil_exp+2"]}},{"label":"“对不起，是我不该问。”","fx":["wil_exp+1","rel:ambrose+1"],"text":"神父点了点头，没有挽留。过一阵子，也许他会改变主意。"}]},{"id":"ev_shadow_vault","kind":"chain","title":"圣库第三层","portrait":"priest","scene":"mountain","text":"那本册子没有标题，纸页已经发脆。你借着灯光，一页一页地读下去。\n初代圣骑士团长在封印之夜写道：魔王并非来自深渊，而是被圣剑之光侵蚀的人。要让封印存续，每一代圣骑士宣誓时，圣剑都会取走他们心里的一小块“抗拒”，作为锁的燃料。\n最后一页的末尾，只有一行字：“当锁磨尽，被锁住的会醒来，而持剑的人会成为下一个。”","options":[{"label":"把封印记录抄下来，带走","fx":["flag+:shadow_known","flag+:shadow_copy","int_exp+6","log:你把真相抄在了贴身的册子里。"],"text":"笔尖划过纸面的声音在圣库里格外清楚。你知道，这一笔下去，就再也回不去了。"},{"label":"只记在心里，把册子放回原处","fx":["flag+:shadow_known","wil_exp+6","rep:church+1"],"text":"你把册子放回石架，抹去了灰尘上的指印。有些事，你一个人知道，就够沉的了。"}]}],"content/farmer_son/quests.json":[{"id":"main_oath","type":"main","name":"圣剑与誓言","start":"age>=16","score":100,"onFail":["flag+:main_failed","log:通往圣骑士的路断了。魔王苏醒时，你只能面对现实。"],"stages":[{"desc":"第一章·麦田之誓：达到等级 3，且体魄或意志达到 15（教会使者会来找你）","done":"flag:recommend_letter","score":20,"deadlineAge":22,"checks":[{"label":"等级 ≥ 3","cond":"level>=3"},{"label":"体魄或意志 ≥ 15","cond":["attr.str>=15","attr.wil>=15"]}],"story":{"title":"第一章 完 · 麦田之誓","portrait":"hero","text":"信纸很轻，却像一块烙铁。你站在麦田边上，第一次认真地想：如果我走了，这片田谁来种？\n可你也知道，有些路，不走，就永远不知道通到哪里。\n——第二章：王都见习"}},{"desc":"第二章·王都见习：取得推荐信或公会声望 20，教会声望 20，等级 6，加入见习骑士团","done":"flag:order_member","score":20,"deadlineAge":26,"checks":[{"label":"等级 ≥ 6","cond":"level>=6"},{"label":"教会声望 ≥ 20","cond":"rep.church>=20"},{"label":"持有推荐信，或公会声望 ≥ 20","cond":["flag:recommend_letter","rep.guild>=20"]}],"story":{"title":"第二章 完 · 王都见习","text":"银甲冰凉，誓词还在耳边。你第一次觉得，自己不再只是田里的一个人。\n王都的夜很吵，你却反而睡得安稳。教官说，真正的考验在北边，在每一场你想逃的仗里。\n——第三章：魔潮前夜"}},{"desc":"第三章·魔潮前夜：等级 15、教会声望 60，通过圣剑试炼成为圣骑士","done":"flag:paladin","score":20,"deadlineAge":29,"checks":[{"label":"等级 ≥ 15","cond":"level>=15"},{"label":"教会声望 ≥ 60","cond":"rep.church>=60"},{"label":"已加入见习骑士团","cond":"flag:order_member"}],"story":{"title":"第三章 完 · 圣剑的回应","portrait":"priest","text":"圣剑落在肩上的那一刻，你什么也没想，只想起那个春天，田埂上，艾芙娜问你的那句话：“你想成为什么？”\n现在，你有了一个答案。\n——第四章：苏醒前的集结"}},{"desc":"第四章·苏醒前的集结：继续变强，魔王将在 30 岁的秋天苏醒","done":"flag:demon_awake","score":20,"story":{"title":"第四章 完 · 红色的天空","text":"时间到了。\n北方的天空像被撕开一道口子，所有人都停下了手里的活。你站在村口，手握着剑柄，心里出奇地平静。\n该去了。\n——终章：魔王"}},{"desc":"第五章·终战：魔王苏醒后，前往讨伐魔王（行动：讨伐魔王）","done":"flag:demon_slain","score":20}],"doneStory":{"title":"终章 · 誓言","text":"魔王的身体化作灰烬散去的时候，你听见远方的钟声一下一下响起，像是整个世界都在呼吸。\n你活了下来。\n而属于你的故事，才刚刚被写成。"}},{"id":"doom","type":"main","name":"魔潮将至","start":"flag:demon_awake","score":0,"stages":[{"desc":"魔王已经苏醒，必须在限期内讨伐，否则魔潮会吞没北境","done":"flag:demon_slain","deadlineTurns":3,"onMiss":["flag+:overrun","log:魔潮越过了北境的山脊。","end:auto"]}]},{"id":"efna_wish","type":"side","name":"艾芙娜的心愿","deadlineAge":23,"score":30,"onFail":["flag+:efna_lost","log:艾芙娜没有等到那一天。她的家空了，窗台上还放着一小束干花。"],"reward":["log:艾芙娜的故事，暂时告一段落。"],"stages":[{"desc":"多陪陪艾芙娜，让她愿意说出心里的事（好感 ≥ 4）","done":"rel.efna>=4","fx":["goto:ev_efna_illness"],"checks":[{"label":"艾芙娜好感 ≥ 4（多去陪她）","cond":"rel.efna>=4"}]},{"desc":"找到月华草（行动：寻找月华草）","done":"flag:has_moon_herb","checks":[{"label":"夏、秋两季使用「寻找月华草」","cond":["season==summer","season==autumn"]}]},{"desc":"带艾芙娜前往圣城（行动：带艾芙娜前往圣城）","done":"flag:efna_resolved"}]},{"id":"glen_regret","type":"side","name":"老兵格伦的遗憾","start":"flag:met_glen","deadlineAge":22,"score":25,"onFail":["flag+:glen_left","log:格伦在一个清晨不辞而别，只留下一把空了的剑鞘。"],"reward":["flag+:glen_secret","rep:church+5","exp+80","log:格伦把压箱底的剑技全教给了你。","log:格伦把压箱底的剑技全教给了你。"],"stages":[{"desc":"和格伦熟络起来（好感 ≥ 3，行动：向老兵学艺）","done":"rel.glen>=3","fx":["goto:ev_glen_past"],"checks":[{"label":"格伦好感 ≥ 3（向老兵学艺）","cond":"rel.glen>=3"}]},{"desc":"为格伦洗清冤屈（行动：为格伦翻案）","done":"flag:glen_cleared"}],"snag":{"p":0.3,"text":"格伦的旧伤在一个雨夜复发，他躺了半个月，醒来时，不愿再提那些往事。"}},{"id":"village_defense","type":"side","name":"守卫麦穗村","score":20,"stages":[{"desc":"击退来犯的兽人","done":"flag:village_saved","deadlineTurns":2}],"snag":{"p":0.25,"text":"村长去了镇上开会，一去就是一个月。守卫的事，被搁置得没了下文。"}},{"id":"guild_novice","type":"side","name":"公会新人试炼","start":"flag:guild","score":15,"reward":["exp+40"],"stages":[{"desc":"首次通关后山洞穴","done":"flag:clear_cave"}],"snag":{"p":0.3,"text":"公会换了新的登记规矩，原来的新人试炼被取消了。"}},{"id":"guild_star","type":"main","name":"冒险者之路","start":"flag:main_failed","score":40,"intro":{"title":"另一条路","text":"没有教会的推荐，成不了圣骑士，但魔王不会因此少来一天。\n公会布告栏上有一行褪色的大字：“不问出身，只看战绩。”\n也许有些人，生来就是要用自己的剑，在世上挣一个名字。"},"doneStory":{"title":"冒险者之星","text":"你的名字被刻进了公会大厅的石碑，旁边是许多你没见过、也不会再见到的前辈。\n会长拍了拍你的肩：“没有教会的授勋，你也有资格站到魔王面前。”\n你点点头。刀锋上的光，就是你的凭证。"},"reward":["log:你已经有资格站在魔王面前了。"],"stages":[{"desc":"到镇上的冒险者公会登记（18 岁后）","done":"flag:guild","score":10,"checks":[{"label":"年满 18 岁并登记","cond":"flag:guild"}]},{"desc":"公会声望 ≥ 30，并通关废弃矿坑","done":"rep.guild>=30&&flag:clear_mine","score":15,"checks":[{"label":"公会声望 ≥ 30","cond":"rep.guild>=30"},{"label":"通关废弃矿坑","cond":"flag:clear_mine"}]},{"desc":"通关亡灵墓地，且等级 ≥ 16，成为公会认可的“冒险者之星”","done":"flag:clear_grave&&level>=16","score":15,"deadlineAge":31,"checks":[{"label":"通关亡灵墓地","cond":"flag:clear_grave"},{"label":"等级 ≥ 16","cond":"level>=16"}],"fx":["flag+:adventurer_star"]}]},{"id":"lorn_caravan","type":"side","name":"洛恩的商队","start":"rel.lorn>=2&&age>=19","deadlineAge":27,"score":15,"intro":{"title":"洛恩的请求","text":"洛恩搓着手，难得没说笑：“有两趟货要送往王都，路上不太平。你信得过的话，替我押一趟？”\n他的车轮上，刻着一朵小小的麦穗。"},"reward":["log:洛恩的商队，从此有了你这个朋友。"],"stages":[{"desc":"护送商队往返王都两次（行动：护送商队）","done":"count.escort>=2","fx":["goto:ev_lorn_offer"],"checks":[{"label":"护送成功 2 次","cond":"count.escort>=2"}]},{"desc":"回应洛恩的邀请","done":["flag:lorn_partner","flag:lorn_decline"]}],"snag":{"p":0.3,"text":"洛恩的商队临时改了路线，等你赶到，已经走远了。"}},{"id":"orphan_care","type":"side","name":"草垛里的孩子","start":"flag:took_orphan","deadlineAge":27,"score":10,"reward":["hometown+3","log:那个孩子偶尔还会在村口，朝北边望很久。"],"stages":[{"desc":"照看孩子，让他适应村子的生活（行动：照看孩子 3 次）","done":"count.orphan>=3","fx":["goto:ev_orphan_future"],"checks":[{"label":"照看孩子 3 次","cond":"count.orphan>=3"}]},{"desc":"为他找一个归处","done":"flag:orphan_home"}],"snag":{"p":0.3,"text":"孩子的远房亲戚从镇上赶来，把他接走了。"}},{"id":"ruins_secret","type":"side","name":"石门后的遗迹","start":"flag:found_ruins","deadlineAge":28,"score":30,"intro":{"title":"藤蔓下的石门","text":"你一直没忘记那扇半掩的石门，门楣上褪色的神徽，像在对你眨眼。\n山里的路你已经熟了。也许，该再去一趟了。"},"reward":["count:arcana+3","log:遗迹里的知识，你一辈子都会记得。"],"stages":[{"desc":"再次进入石门，解读石室里的符文（行动：探索遗迹）","done":"flag:ruins_open","fx":["goto:ev_ruins_vault"],"checks":[{"label":"用智力检定解开符文","cond":"flag:ruins_open"}]},{"desc":"决定如何处置遗迹里的发现","done":"flag:ruins_told"}],"snag":{"p":0.3,"text":"一场山体滑坡，把石门前的小路埋了个严实。"}},{"id":"mill_repair","type":"side","name":"村磨坊的水车","start":"age>=19&&hometown>=30","deadlineAge":25,"score":10,"intro":{"title":"村长的委托","text":"村长拄着拐杖来你家，指了指河边那座歪斜的水车：“它转不动了，冬天碾不了粮，家家都得跑去镇上。能凑钱修一修吗？”\n他没有说“拜托”，只是看着你。\n村长补了一句：“水车修好了，村里的日子能稳当不少。”"},"doneStory":{"title":"水车转起来了","text":"水车吱吱呀呀地转起来的那天，全村人都聚到了河边。孩子们追着水花跑，老人们坐在石头上抽烟。\n村长把拐杖往地上一磕：“这个冬天，不愁了。”"},"reward":["hometown+5","rep:church+2","flag+:mill_fixed","log:水车修好以后，村里每年的故乡值衰减从 5 点降到了 3 点。"],"stages":[{"desc":"凑钱出力，修缮水车（行动：修缮水车，两次；完成后每年的故乡值衰减 -5 → -3）","done":"count.mill>=2","checks":[{"label":"修缮水车 2 次（每次 60 金币，完成后年年少掉 2 点故乡值）","cond":"count.mill>=2"}]}],"snag":{"p":0.4,"text":"一场山洪冲垮了水车的基座，工匠们收拾东西，回镇上去了。"}},{"id":"church_shadow","type":"hidden","name":"教会的阴影","start":["flag:church_clue_2","flag:church_clue_1&&memory:m_seal","age>=22&&memory:m_truth"],"deadlineAge":30,"score":40,"reward":["int_exp+8","wil_exp+8","exp+120","rep:church-3","flag+:church_truth","log:你知道了一些本不该知道的事。从今以后，圣光在你眼里不再只是光。"],"stages":[{"desc":"封印的记录不该只是一本旧册。去找神父安布罗斯，问问他知道多少（行动：向神父求证）","done":"flag:shadow_ambrose","checks":[{"label":"神父好感 ≥ 3，或用口才说服他","cond":"flag:shadow_ambrose"}]},{"desc":"神父给了你一把旧钥匙。潜入王都圣库，核对圣剑的真正来历（行动：潜入圣库，需要见习骑士团成员）","done":"flag:shadow_known","checks":[{"label":"已加入见习骑士团","cond":"flag:order_member"},{"label":"用智力检定读懂封印记录","cond":"flag:shadow_known"}],"story":{"title":"教会的阴影","portrait":"priest","text":"你合上那本册子的时候，圣库里的烛火晃了一下。\n圣剑不是杀死魔王的剑，它是锁。每一代圣骑士在宣誓的夜里，都被取走了一点“不肯低头的东西”，用来给这把锁续命。\n魔王的苏醒，只是锁已经磨到了尽头。\n你想起了试炼那天，圣剑落在肩上的光。那光很暖。\n暖得让人不愿意去想，它是从哪里来的。"}}]}],"content/farmer_son/script.json":{"name":"麦田上的誓言","subtitle":"农夫之子 → 圣骑士","desc":"北境麦穗村的农夫长子（长女），16 岁。魔王将在你 30 岁的秋天苏醒，在那之前，你能成为什么样的人？","intro":"麦穗村，北境最边缘的小村子。你是农夫的长子，今年十六岁。魔王每隔百年苏醒一次，算算日子，就在你三十岁的秋天。","start":{"age":16,"attrs":{"str":13,"agi":10,"int":7,"wil":12,"cha":7,"luk":10},"gold":50,"hometown":50,"rep":{"church":5,"guild":0,"kingdom":0,"tower":0},"rel":{"efna":1,"glen":0,"mina":3},"gear":["sickle"],"flags":{}},"livingCost":8,"ranks":["见习","修士","圣骑士","圣骑士长","圣征者"],"npcs":{"efna":{"name":"艾芙娜"},"glen":{"name":"格伦"},"ambrose":{"name":"神父安布罗斯"},"rex":{"name":"雷克斯"},"lorn":{"name":"行商洛恩"},"mina":{"name":"妹妹米娜"}},"staminaMods":[{"cond":"hometown>=60","add":1,"label":"故乡值 ≥ 60：家人的支持"},{"cond":"hometown\u003c=20","add":-1,"label":"故乡值 ≤ 20：家里要你帮工"}],"powerBonus":[{"cond":"flag:glen_secret","add":4,"label":"老兵绝技的心得"},{"cond":"status:blessed","add":3,"label":"祝福状态"}],"yearEnd":[{"cond":"!flag:mill_fixed","text":"一年又过去了，赋税和岁月不会放过任何一个村子。","fx":["hometown-5"]},{"cond":"flag:mill_fixed","text":"水车一年到头转着，村里的日子过得比往年稳当些。","fx":["hometown-3"]},{"cond":"age>=24","text":"魔物的威胁一年比一年近了。","fx":["hometown-3"]},{"cond":["!flag:y_farm_spring","!flag:y_farm_autumn"],"text":"今年的农事没有做完，家里的日子紧了些。","fx":["hometown-8"]},{"cond":"hometown>=60","text":"家里收成不错，母亲塞给你一小袋钱。","fx":["gold+15"]},{"cond":"hometown\u003c=20","text":"村子几乎荒了，邻居们陆续搬走了。","fx":[]},{"cond":"flag:lorn_partner","text":"洛恩的商队今年又分了一笔红利，他托人送来一张字条：“生意兴隆，勿念。”","fx":["gold+30"]},{"cond":"age==16","text":"十六岁的一年过去了。你第一次觉得，自己的肩膀能扛起一些东西。","fx":[]},{"cond":"age==17","text":"十七岁，你开始分得清：哪些事是自己想做的，哪些只是该做的。","fx":[]},{"cond":"age==18","text":"十八岁了。村里的同龄人，有的在谈婚事，有的已经离开。你站在路口，看着他们的背影。","fx":[]},{"cond":"age==19","text":"十九岁这一年很长，也很短。你有了几个想要守护的名字。","fx":[]},{"cond":"age==20","text":"二十岁。母亲鬓边的白发多了几根，你把它们一根一根记在心里。","fx":[]},{"cond":"age>=21&&age\u003c=25","text":"又一年。你比去年更强，也更清楚自己还差多少。","fx":[]},{"cond":"age>=26&&age\u003c=29","text":"北边的天空一年比一年红。你知道，剩下的时间不多了。","fx":[]},{"cond":"true","fx":["count:hires-99"]},{"cond":"true","fx":["flagclear:y_"]}],"aspirations":[{"id":"paladin","name":"圣光誓言","desc":"成为圣骑士","cond":"flag:paladin","score":30},{"id":"rich","name":"富足一生","desc":"结束时持有 1200 金币","cond":"gold>=1200","score":30},{"id":"strong","name":"力拔山河","desc":"体魄达到 30","cond":"attr.str>=30","score":30}],"endings":[{"id":"fallen_throne","name":"堕落王座","kind":"hidden","mult":1.6,"cond":"flag:throne","text":"你接过了那顶冰冷的王冠。\n圣剑在你手里碎成了光屑，北境的魔潮在你抬手的那一瞬间停了下来，像一群终于等到主人的狗。\n麦穗村的钟声还在响，可你已经听不太清了。\n人们说魔王又醒了，也有人说，魔王终于有了新的主人。\n你坐在王座上，看着大殿尽头的门，第一次觉得，这样也很安静。\n只是偶尔，你会想起田埂上，那个问你“想成为什么”的人。你已经想不起她的脸了。","hint":"集齐足够多的前世记忆，魔王也许会向你伸出另一只手。"},{"id":"resealed","name":"百年之约","kind":"normal","mult":1.3,"cond":"flag:resealed","text":"你把圣剑插回剑座，守在了封印旁边。\n魔王闭上眼睛的时候，像是卸下了一件很重的东西。它没有说谢谢，你也没有说再见。\n后来，教会的钟声里多了一句没有人再敢删去的话。你成了封印的守护者，也是唯一一个知道它为什么会醒的人。\n一百年后，会有另一个人走到这里。\n你给他留了一本没有标题的册子，和一把磨得发亮的铜钥匙。","hint":"魔王也许并不想被杀死。"},{"id":"true_legend","name":"圣剑传说","kind":"true","mult":1.5,"cond":["flag:demon_slain&&flag:efna_cured&&hometown>=60","flag:demon_slain&&flag:efna_priest&&hometown>=60"],"text":"魔王倒下的那一天，麦田里的风吹得很轻。\n你回到麦穗村时，艾芙娜站在村口等你，身后是炊烟、钟声，和一片没有被烧过的田。孩子们远远地认出了你，喊着你的名字一路跑过来。\n后来，人们把你用过的那把剑挂在教堂的正厅，旁边刻着一行字：“誓言，已经兑现。”\n你站在那行字下面，想起了十六岁的那个春天，田埂上，有人问你：你想成为什么？\n你终于可以说：我成为了我想成为的人。","hint":"讨伐魔王，并让故乡和重要的人都还在。"},{"id":"lone_hero","name":"孤胆英雄","kind":"normal","mult":1,"cond":"flag:demon_slain","text":"魔王死了，世界得救了。\n人们敲着钟，在街上跳舞，把花环套在你的脖子上。可你环顾四周，有些人和有些地方，终究没有等到这一天。\n夜里，你一个人坐在空空的院子里，把剑擦了一遍又一遍。\n你想起很多句来不及说的话，和很多个来不及去的地方。\n也许英雄就是这样：赢了所有的仗，却在一场安静的夜里，输给了时间。","hint":"讨伐魔王，但有些人没能等到这一天。"},{"id":"martyr","name":"悲壮殉道","kind":"normal","mult":1,"cond":"flag:final_lost&&flag:demon_wounded","text":"你倒在了魔王的脚下，但最后那一剑，已经斩断了它的力量。\n黑暗里，你听见远处传来钟声，一声接着一声。你想，那应该是麦穗村的钟吧。\n后来，另一群人踏着你的血迹走进了魔王城，完成了你没能完成的事。他们在大殿的地板上，发现了一枚刻着麦穗的旧徽记。\n没有人知道它的主人是谁。但每一个走进来的人，都在它面前停了一会儿。","hint":"倒在魔王面前，却留下了决定性的一击。"},{"id":"return_home","name":"平凡归乡","kind":"normal","mult":1,"cond":"flag:stay_home&&hometown>=80","text":"你选择留在麦穗村，守着你的田地和家人。\n魔潮最终没有越过北境的山。也许是别人替你挡住了，也许只是一场幸运的风。你没有再追问。\n后来，你成了村里最受人尊敬的人：谁家的墙塌了、谁家的牛丢了，都先来找你。你教孩子们认字、握剑，也教他们认出真正重要的东西。\n夕阳落在麦田上的时候，你偶尔会想起那个没走成的远方，但并不后悔。","hint":"放弃远行，把故乡守到魔潮退去。"},{"id":"overrun","name":"魔潮吞没","kind":"fail","mult":0.6,"cond":["flag:overrun","flag:final_lost"],"text":"魔王醒了，而你没能做好准备。\n北境的麦田一夜之间变成了焦土，教堂的钟声被魔物的咆哮盖过。你站在废墟里，听见身后有人在喊你的名字，却再也回不了头。\n黑暗吞没一切之前，你想：如果再来一次……\n如果再来一次，我一定要走得更早，更快，更远。","hint":"没有在魔王醒来之前做好准备。"},{"id":"early_death","name":"天不假年","kind":"fail","mult":0.6,"cond":"flag:dead","text":"你的故事停在了半路。\n田里的麦子还在长，远处的钟声又响了一遍。村里人为你办了一场很小的葬礼，神父说了几句话，大家低着头。\n母亲把你的那把镰刀洗得发亮，挂在了门后。有时路过的孩子问：这是谁的？\n她说：这是一个很想走很远的人的。","hint":"人生在半路中断。"},{"id":"endless","name":"平淡一生","kind":"fail","mult":0.6,"cond":"true","text":"时间到了。\n你没有成为英雄，也没有被世界遗忘。你只是走完了这一段人生，看过了每一个季节，爱过、悔过、坚持过。\n很多年后，有人问起你的名字，没有人说得出一件惊天动地的事。但每个提起你的人，都会露出一点笑。\n这样，也算一种圆满。","hint":"没有走到任何一个终点。","safety":true}],"autoLearn":[{"skill":"slash","cond":"count.sword>=2&&rel.glen>=2","story":{"title":"破绽斩","portrait":"glen","text":"格伦把木棍收回去，难得没骂人：“你小子，终于有点样子了。”\n他把你叫到榆树下，教了你一招他自己也没名字的剑式：不找花哨，只找对方呼吸里的空当。\n“战场上的人都有这么一刻，”他说，“看见，然后出剑。”"},"checks":[{"label":"向格伦学艺 ≥ 2 次","cond":"count.sword>=2","cur":"count.sword"},{"label":"格伦好感 ≥ 2","cond":"rel.glen>=2","cur":"rel.glen"}]},{"skill":"parry","cond":"count.sword>=5&&rel.glen>=4","story":{"title":"格挡反击","portrait":"glen","text":"“剑不只是用来杀的。”格伦说，“更多时候，是用来活下来的。”\n他一招一式地教你怎么卸力，怎么在对手最得意的那一下，把对方的劲借过来。你的手腕红了三天，却第一次觉得，自己不再只会硬扛。"},"checks":[{"label":"向格伦学艺 ≥ 5 次","cond":"count.sword>=5","cur":"count.sword"},{"label":"格伦好感 ≥ 4","cond":"rel.glen>=4","cur":"rel.glen"}]},{"skill":"sword_master","cond":"flag:glen_secret","story":{"title":"老兵绝技","portrait":"glen","text":"格伦把剑鞘里最后一寸剑身抽出来，放在你的膝盖上：“这是我这辈子，唯一没有教过别人的一招。”\n没有花哨，没有多余的动作，只有一次起手、一次落刀。\n“剑这种东西，”他说，“越到最后，越简单。”"},"checks":[{"label":"为格伦洗清冤屈（支线）","cond":"flag:glen_secret"}]},{"skill":"heal_light","cond":"count.prayer>=3&&rep.church>=15","story":{"title":"治愈之光","portrait":"priest","text":"擦完圣像，神父把你叫到祭坛前，看了你很久。\n“你天天来，也不求什么。”他说，“那我问你一句：你有没有想要得到的东西？”\n你想了想，说：“……我想能在别人受伤的时候，帮上忙。”\n神父笑了，把手覆在你的手背上，低声念出一段短短的祷词。你的掌心泛起一点柔和的光，像春天的第一缕阳光。"},"checks":[{"label":"帮神父打杂 ≥ 3 次","cond":"count.prayer>=3","cur":"count.prayer"},{"label":"教会声望 ≥ 15","cond":"rep.church>=15","cur":"rep.church"}]},{"skill":"smite","cond":"count.prayer>=10&&rep.church>=40","story":{"title":"圣光斩","portrait":"priest","text":"神父把你领到教堂地下的藏书室，从最底层抽出一本发黄的册子：“光不只有温暖的一面。”\n他教你把圣光凝在剑锋上。“对付活人，它几乎没用。对付那些本不该存在于世上的东西，它会烧穿一切。”\n你握剑的手，第一次感到了灼热。"},"checks":[{"label":"帮神父打杂 ≥ 10 次","cond":"count.prayer>=10","cur":"count.prayer"},{"label":"教会声望 ≥ 40","cond":"rep.church>=40","cur":"rep.church"}]},{"skill":"holy_shield","cond":"rep.church>=60&&flag:order_member","story":{"title":"圣盾","portrait":"priest","text":"成为修士后的某个傍晚，神父把一枚小小的圣徽按在你的胸口：“光可以是剑，也可以是墙。”\n他教你在身前展开一面看不见的光盾。“不是为了让你不受伤，”他说，“是为了让你身后的人，有时间跑。”"},"checks":[{"label":"教会声望 ≥ 60","cond":"rep.church>=60","cur":"rep.church"},{"label":"已加入见习骑士团","cond":"flag:order_member"}]},{"skill":"spark","cond":"count.arcana>=3","story":{"title":"魔法飞弹","text":"那本旧册子你已经翻得卷了边。这一天夜里，你照着图解念出最后一个音节，指尖忽然亮起一颗橙红色的小火星，在黑暗里跳了一下。\n你屏住呼吸，把它向前一推：火星擦过窗棂，在院子里的稻草堆上点出了一个小黑洞。\n你笑了，笑得比谁都大声。"},"checks":[{"label":"研读奥术 ≥ 3 次","cond":"count.arcana>=3","cur":"count.arcana"}]},{"skill":"fireball","cond":"count.arcana>=8&&attr.int>=12","story":{"title":"火球术","text":"你合上书的那一刻，空气里的热度忽然变了。\n你知道自己该念哪一句，该在哪个音节上收气。掌心浮起一团越来越亮的火焰，照亮了整间屋子。\n它不再是小火星了。它有重量。"},"checks":[{"label":"研读奥术 ≥ 8 次","cond":"count.arcana>=8","cur":"count.arcana"},{"label":"智力 ≥ 12","cond":"attr.int>=12","cur":"attr.int"}]},{"skill":"mana_shield","cond":"count.arcana>=14&&attr.wil>=14","story":{"title":"魔力护盾","text":"意志是魔法最后的门槛。\n你闭着眼，一遍遍把魔力从胸口引到指尖，再从指尖织成一层透明的壳。\n某个瞬间，周围的声音全都远了。你睁开眼，发现一圈微光静静地漂在身周，像一口刚温好的水。"},"checks":[{"label":"研读奥术 ≥ 14 次","cond":"count.arcana>=14","cur":"count.arcana"},{"label":"意志 ≥ 14","cond":"attr.wil>=14","cur":"attr.wil"}]}],"introPages":[{"title":"麦穗村","scene":"village_spring","text":"北境的春天来得晚，也去得早。\n你生在麦穗村，一座被山和麦田围起来的小村子。往北走三天，就是王国的边境，再往北，就没有人愿意提了。\n父亲种了一辈子地，母亲会在每个傍晚站在门口喊你回家。你从小的世界，就是这一片金黄。"},{"title":"百年一醒","scene":"village_autumn","portrait":"priest","text":"村里的老人都知道一个传说：每隔一百年，北方的黑色城堡就会醒来，魔王会带着魔潮南下。上一次，是祖父的祖父那辈人的事，教堂的石墙上还留着当年的刻痕。\n老神父说，下一次，就在你三十岁的那个秋天。\n你从小听着这个故事长大，却从没把它当真过。"},{"title":"十六岁","scene":"village_spring","portrait":"hero","text":"今天你满十六岁了。\n村里的规矩，十六岁就算成年：要下地，要自己挣口粮，也可以决定要不要离开。\n你有一双还算结实的手，一把家传的旧镰刀，和一点点还没有名字的不甘心。\n接下来的十几年，你想把它们变成什么？"},{"title":"玩法提示","scene":"village_spring","text":"时间以「季」为单位。每一季你有几点体力，每个行动都要花体力：种地赚钱、锻炼变强、读书学艺、陪伴重要的人，或者走进地下城冒险。\n没用完的体力不会保留，所以每一点都是取舍。\n顶栏的「故乡值」是村子的状况。种好地、守好村，它会回报你；放着不管，它会在你背后悄悄变坏。\n把鼠标移到（手机上点一下）各项数值上，可以看到它们的说明。\n不是所有事都能做完。想清楚，你想成为什么样的人。"}],"clearCond":["flag:demon_slain","flag:resealed","flag:throne"]},"content/items.json":{"sickle":{"name":"带锯齿的旧镰刀","power":1,"desc":"家里传下来的旧镰刀，割麦用，勉强也能当武器。","slot":"weapon"},"iron_sword":{"name":"铁剑","power":4,"desc":"行商卖的铁剑，剑身有点歪，但磨得很利。","slot":"weapon"},"leather_armor":{"name":"皮甲","power":3,"desc":"洞穴里捡到的皮甲，缝线有些松，但很结实。","slot":"armor"},"holy_amulet":{"name":"圣徽护符","power":4,"desc":"神父年轻时戴过的护符，背面刻着一行小字。","slot":"trinket"},"miner_pick":{"name":"矿工战镐","power":5,"desc":"矿工们留下的战镐，又重又趁手。","slot":"weapon"},"knight_armor":{"name":"骑士铠甲","power":7,"desc":"前线要塞里找到的骑士铠甲，肩甲上还有王国的纹章。","slot":"armor"},"hunter_bow":{"name":"猎弓","power":3,"desc":"洛恩送的猎弓，弓梢刻着一枚小小的车轮。","slot":"weapon"},"wolf_cloak":{"name":"狼皮斗篷","power":3,"desc":"棕熊或行商给的狼皮斗篷，裹上就不冷了。","slot":"trinket"},"old_shield":{"name":"格伦的旧盾","power":4,"desc":"格伦的旧圆盾，盾面刻着十二个名字。","slot":"shield"},"round_shield":{"name":"圆盾","power":3,"desc":"集市上买的普通圆盾，边缘有点掉漆，但够结实。","slot":"shield"},"oak_staff":{"name":"橡木法杖","power":4,"desc":"高塔学徒人手一根的橡木法杖，杖头嵌着一粒不值钱的蓝晶。","slot":"weapon"},"mage_robe":{"name":"学徒法袍","power":3,"desc":"深蓝色的学徒法袍，袖口绣着高塔的星纹。","slot":"armor"},"signet_ring":{"name":"格雷蒙特家徽戒指","power":2,"desc":"父亲留下的家徽戒指，指环内侧刻着一行小字。","slot":"trinket"},"tower_cloak":{"name":"高塔斗篷","power":2,"desc":"高塔的旧斗篷，边缘磨得发白，但很暖和。","slot":"trinket"},"ancestral_sickle":{"name":"先祖的镰刀","power":3,"desc":"麦穗村格伦家传的老镰刀，刃口磨得薄如纸，据说它割过百年前的第一茬麦。","slot":"trinket"},"steel_sword":{"name":"精钢长剑","slot":"weapon","power":8,"desc":"集市内间的老匠人用精钢锻的长剑，剑脊上有一行细小的铭文。"},"silver_blade":{"name":"银纹长剑","slot":"weapon","power":12,"desc":"剑身镶着银丝的纹路，据说对邪物格外有效。"},"mithril_edge":{"name":"秘银细剑","slot":"weapon","power":16,"desc":"轻得像一片叶子，却能斩开铁甲。只有真正懂行的人，才拿得到。"},"crystal_staff":{"name":"水晶法杖","slot":"weapon","power":9,"desc":"杖头是一整块未经打磨的魔晶，握着它，魔力像水一样顺着手臂走。"},"archmage_staff":{"name":"大魔导师之杖","slot":"weapon","power":14,"desc":"传说是某位已故大魔导师用过的杖，杖身上布满了细密的符文。"},"chain_mail":{"name":"锁子甲","slot":"armor","power":8,"desc":"一环扣一环的铁甲，沉，但足够可靠。"},"plate_armor":{"name":"板甲","slot":"armor","power":12,"desc":"王都工坊打造的全身板甲，抛光得能照出人影。"},"mithril_mail":{"name":"秘银锁甲","slot":"armor","power":16,"desc":"贴身穿着几乎感觉不到重量，却能挡住大部分的刀剑。"},"silk_robe":{"name":"丝绸法袍","slot":"armor","power":8,"desc":"南方丝绸织就的法袍，导魔的纹路细腻得像水波。"},"star_robe":{"name":"星纹法袍","slot":"armor","power":13,"desc":"袖口和下摆缀着细小的星纹，在暗处会微微发光。"},"tower_shield":{"name":"塔盾","slot":"shield","power":8,"desc":"几乎有半个人那么高的方盾，躲在后面，什么都不用怕。"},"holy_aegis":{"name":"神盾","slot":"shield","power":12,"desc":"教会工匠为圣骑士打造的盾，盾心镶着一枚发光的圣徽。"},"silver_ring":{"name":"银戒指","slot":"trinket","power":5,"desc":"素净的银戒指，内圈刻着一句祝福。"},"lion_pendant":{"name":"狮心吊坠","slot":"trinket","power":9,"desc":"狮头形的金吊坠，据说戴着它的人，不会在关键的时候犹豫。"},"dragon_charm":{"name":"龙鳞护符","slot":"trinket","power":12,"desc":"一片比手掌还大的暗红色鳞片，边缘磨得圆润，握在手里是温的。"},"thief_knife":{"name":"旧匕首","slot":"weapon","power":2,"desc":"刃口卷了边，但握柄被磨得很顺手。"},"stiletto":{"name":"细长匕首","slot":"weapon","power":6,"desc":"黑市上最常见的好东西，薄得能从门缝里插进去。"},"shadow_dagger":{"name":"影刃","slot":"weapon","power":10,"desc":"刀身涂了一层吸光的黑漆，在夜里几乎看不见。"},"venom_fang":{"name":"毒牙短剑","slot":"weapon","power":14,"desc":"剑脊上有一道细细的凹槽，据说原本是用来存毒的。"},"night_edge":{"name":"夜行者之刃","slot":"weapon","power":17,"desc":"传说中某位大盗的佩刃，轻得像一片影子。"},"patched_vest":{"name":"打补丁的皮背心","slot":"armor","power":2,"desc":"补丁摞补丁，但足够挡住夜风。"},"shadow_leathers":{"name":"暗纹软甲","slot":"armor","power":8,"desc":"贴身，无声，针脚里缝着细细的软钢丝。"},"phantom_cloak":{"name":"幻影斗篷","slot":"armor","power":13,"desc":"披上之后，巡逻的人总会多看你两眼，却不知道自己在看什么。"},"lockpicks":{"name":"撬锁工具","slot":"trinket","power":2,"desc":"一套磨得发亮的细钩，是灰鼠留给你的。"},"black_pearl":{"name":"黑珍珠","slot":"trinket","power":6,"desc":"黑市掮客压箱底的小玩意，据说能带来好运。"},"fortune_coin":{"name":"幸运金币","slot":"trinket","power":9,"desc":"两面都是同一个头像的旧金币，抛出去总是你想要的那面。"},"mask_charm":{"name":"面具符咒","slot":"trinket","power":12,"desc":"刻着一张没有五官的脸，戴着它，别人更容易忘记你。"},"rusty_cutlass":{"name":"生锈的短弯刀","slot":"weapon","power":2,"desc":"老船长送你的第一把刀，刃口全是盐渍。"},"cutlass":{"name":"海军弯刀","slot":"weapon","power":6,"desc":"军港旧货摊上淘来的，护手上还留着号码。"},"boarding_axe":{"name":"登船斧","slot":"weapon","power":10,"desc":"一斧劈断缆绳，一斧劈开舱门，跳帮战的老伙计。"},"tidal_trident":{"name":"潮汐三叉戟","slot":"weapon","power":14,"desc":"人鱼族打造的短叉，握着它，脚下的甲板仿佛也有了潮汐。"},"storm_blade":{"name":"风暴之刃","slot":"weapon","power":17,"desc":"据说是从风暴里捞出来的，剑身上永远带着一层水汽。"},"sailor_vest":{"name":"水手帆布衫","slot":"armor","power":2,"desc":"被海风吹得发硬，但很耐磨。"},"sealskin_coat":{"name":"海豹皮大衣","slot":"armor","power":8,"desc":"港口老裁缝缝的，下雨天也不透水。"},"coral_mail":{"name":"珊瑚鳞甲","slot":"armor","power":13,"desc":"人鱼的赠礼，一片片珊瑚薄得像鱼鳞，却比钢硬。"},"brass_compass":{"name":"黄铜罗盘","slot":"trinket","power":3,"desc":"老船长的旧罗盘，指针总是微微向北偏。"},"sea_charm":{"name":"海女神护符","slot":"trinket","power":6,"desc":"港口的老妇人说，戴着它，海浪会客气一点。"},"pearl_amulet":{"name":"珍珠护身符","slot":"trinket","power":9,"desc":"一颗大得不像话的珍珠，在黑暗里微微发光。"},"kraken_tooth":{"name":"海妖之牙","slot":"trinket","power":12,"desc":"从海妖巢穴里带出来的，一直有点凉。"},"ship_shield":{"name":"船板盾","slot":"shield","power":5,"desc":"用旧船板钉成，挡箭挡浪都行。"},"turtle_shield":{"name":"海龟盾","slot":"shield","power":11,"desc":"巨龟的甲壳打磨而成，沉得像一块礁石。"},"father_staff":{"name":"父亲的旧法杖","slot":"weapon","powe
